<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面積計算機 - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .calculator {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 500px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .shape-selector {
            margin-bottom: 20px;
        }

        .shape-selector label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .shape-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .shape-btn {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px 10px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .shape-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .shape-btn:hover:not(.active) {
            background: #e9ecef;
            border-color: #dee2e6;
        }

        .shape-content {
            display: none;
        }

        .shape-content.active {
            display: block;
        }

        .formula-info {
            background: #e7f3ff;
            border: 1px solid #b3d7ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #0066cc;
        }

        .formula {
            font-weight: bold;
            font-family: monospace;
            background: rgba(255, 255, 255, 0.7);
            padding: 5px 8px;
            border-radius: 5px;
            margin: 5px 0;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-group input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .unit {
            color: #666;
            font-weight: 600;
            min-width: 30px;
        }

        .calculate-btn {
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .calculate-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .result {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result-value {
            font-size: 2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .result-unit {
            color: #666;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .conversion-results {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }

        .conversion-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .conversion-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #f8f9fa;
        }

        .conversion-row:last-child {
            border-bottom: none;
        }

        .conversion-label {
            color: #666;
        }

        .conversion-value {
            font-weight: 600;
            color: #667eea;
        }

        .shape-preview {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shape-icon {
            font-size: 3rem;
            color: #667eea;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .error {
            color: #dc3545;
            font-size: 0.9rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="header">
            <h1>面積計算機</h1>
            <p>円、三角形、四角形の面積を計算</p>
        </div>

        <div class="shape-selector">
            <label>計算したい図形を選択:</label>
            <div class="shape-buttons">
                <button class="shape-btn active" onclick="selectShape('circle')">円</button>
                <button class="shape-btn" onclick="selectShape('rectangle')">長方形</button>
                <button class="shape-btn" onclick="selectShape('square')">正方形</button>
                <button class="shape-btn" onclick="selectShape('triangle')">三角形</button>
            </div>
        </div>

        <!-- 円 -->
        <div class="shape-content active" id="circle">
            <div class="shape-preview">
                <div class="shape-icon">⭕</div>
            </div>
            <div class="formula-info">
                <strong>円の面積公式:</strong>
                <div class="formula">面積 = π × 半径²</div>
            </div>
            <div class="input-group">
                <label for="circleRadius">半径</label>
                <div class="input-row">
                    <input type="number" id="circleRadius" placeholder="例: 5" min="0" step="0.01">
                    <span class="unit">cm</span>
                </div>
                <div class="error" id="circleRadiusError"></div>
            </div>
        </div>

        <!-- 長方形 -->
        <div class="shape-content" id="rectangle">
            <div class="shape-preview">
                <div class="shape-icon">⬜</div>
            </div>
            <div class="formula-info">
                <strong>長方形の面積公式:</strong>
                <div class="formula">面積 = 長さ × 幅</div>
            </div>
            <div class="input-group">
                <label for="rectangleLength">長さ</label>
                <div class="input-row">
                    <input type="number" id="rectangleLength" placeholder="例: 10" min="0" step="0.01">
                    <span class="unit">cm</span>
                </div>
                <div class="error" id="rectangleLengthError"></div>
            </div>
            <div class="input-group">
                <label for="rectangleWidth">幅</label>
                <div class="input-row">
                    <input type="number" id="rectangleWidth" placeholder="例: 8" min="0" step="0.01">
                    <span class="unit">cm</span>
                </div>
                <div class="error" id="rectangleWidthError"></div>
            </div>
        </div>

        <!-- 正方形 -->
        <div class="shape-content" id="square">
            <div class="shape-preview">
                <div class="shape-icon">🔲</div>
            </div>
            <div class="formula-info">
                <strong>正方形の面積公式:</strong>
                <div class="formula">面積 = 一辺²</div>
            </div>
            <div class="input-group">
                <label for="squareSide">一辺の長さ</label>
                <div class="input-row">
                    <input type="number" id="squareSide" placeholder="例: 6" min="0" step="0.01">
                    <span class="unit">cm</span>
                </div>
                <div class="error" id="squareSideError"></div>
            </div>
        </div>

        <!-- 三角形 -->
        <div class="shape-content" id="triangle">
            <div class="shape-preview">
                <div class="shape-icon">🔺</div>
            </div>
            <div class="formula-info">
                <strong>三角形の面積公式:</strong>
                <div class="formula">面積 = 底辺 × 高さ ÷ 2</div>
            </div>
            <div class="input-group">
                <label for="triangleBase">底辺</label>
                <div class="input-row">
                    <input type="number" id="triangleBase" placeholder="例: 8" min="0" step="0.01">
                    <span class="unit">cm</span>
                </div>
                <div class="error" id="triangleBaseError"></div>
            </div>
            <div class="input-group">
                <label for="triangleHeight">高さ</label>
                <div class="input-row">
                    <input type="number" id="triangleHeight" placeholder="例: 6" min="0" step="0.01">
                    <span class="unit">cm</span>
                </div>
                <div class="error" id="triangleHeightError"></div>
            </div>
        </div>

        <button class="calculate-btn" onclick="calculateArea()">面積を計算</button>

        <div class="result" id="result">
            <div class="result-value" id="resultValue">0</div>
            <div class="result-unit">cm²</div>
            
            <div class="conversion-results">
                <div class="conversion-title">単位変換</div>
                <div class="conversion-row">
                    <span class="conversion-label">平方ミリメートル</span>
                    <span class="conversion-value" id="resultMm2">0 mm²</span>
                </div>
                <div class="conversion-row">
                    <span class="conversion-label">平方メートル</span>
                    <span class="conversion-value" id="resultM2">0 m²</span>
                </div>
                <div class="conversion-row">
                    <span class="conversion-label">平方インチ</span>
                    <span class="conversion-value" id="resultIn2">0 in²</span>
                </div>
                <div class="conversion-row">
                    <span class="conversion-label">平方フィート</span>
                    <span class="conversion-value" id="resultFt2">0 ft²</span>
                </div>
            </div>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <script>
        let currentShape = 'circle';

        function selectShape(shape) {
            // ボタンの状態更新
            document.querySelectorAll('.shape-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // コンテンツの表示切り替え
            document.querySelectorAll('.shape-content').forEach(content => content.classList.remove('active'));
            document.getElementById(shape).classList.add('active');

            currentShape = shape;
            clearErrors();
            hideResult();
        }

        function calculateArea() {
            clearErrors();
            let area = 0;
            let hasError = false;

            switch (currentShape) {
                case 'circle':
                    area = calculateCircleArea();
                    break;
                case 'rectangle':
                    area = calculateRectangleArea();
                    break;
                case 'square':
                    area = calculateSquareArea();
                    break;
                case 'triangle':
                    area = calculateTriangleArea();
                    break;
            }

            if (area !== null) {
                displayResult(area);
            }
        }

        function calculateCircleArea() {
            const radius = parseFloat(document.getElementById('circleRadius').value);

            if (!radius || radius <= 0) {
                showError('circleRadiusError', '正しい半径を入力してください');
                return null;
            }

            return Math.PI * radius * radius;
        }

        function calculateRectangleArea() {
            const length = parseFloat(document.getElementById('rectangleLength').value);
            const width = parseFloat(document.getElementById('rectangleWidth').value);

            let hasError = false;

            if (!length || length <= 0) {
                showError('rectangleLengthError', '正しい長さを入力してください');
                hasError = true;
            }

            if (!width || width <= 0) {
                showError('rectangleWidthError', '正しい幅を入力してください');
                hasError = true;
            }

            if (hasError) return null;

            return length * width;
        }

        function calculateSquareArea() {
            const side = parseFloat(document.getElementById('squareSide').value);

            if (!side || side <= 0) {
                showError('squareSideError', '正しい一辺の長さを入力してください');
                return null;
            }

            return side * side;
        }

        function calculateTriangleArea() {
            const base = parseFloat(document.getElementById('triangleBase').value);
            const height = parseFloat(document.getElementById('triangleHeight').value);

            let hasError = false;

            if (!base || base <= 0) {
                showError('triangleBaseError', '正しい底辺を入力してください');
                hasError = true;
            }

            if (!height || height <= 0) {
                showError('triangleHeightError', '正しい高さを入力してください');
                hasError = true;
            }

            if (hasError) return null;

            return (base * height) / 2;
        }

        function displayResult(area) {
            // 主要結果表示
            document.getElementById('resultValue').textContent = area.toFixed(2);

            // 単位変換
            const mm2 = area * 100;           // 1 cm² = 100 mm²
            const m2 = area / 10000;          // 1 m² = 10000 cm²
            const in2 = area / 6.4516;        // 1 in² = 6.4516 cm²
            const ft2 = area / 929.0304;      // 1 ft² = 929.0304 cm²

            document.getElementById('resultMm2').textContent = `${mm2.toFixed(2)} mm²`;
            document.getElementById('resultM2').textContent = `${m2.toFixed(6)} m²`;
            document.getElementById('resultIn2').textContent = `${in2.toFixed(4)} in²`;
            document.getElementById('resultFt2').textContent = `${ft2.toFixed(6)} ft²`;

            document.getElementById('result').classList.add('show');
        }

        function showError(elementId, message) {
            document.getElementById(elementId).textContent = message;
        }

        function clearErrors() {
            const errorElements = document.querySelectorAll('.error');
            errorElements.forEach(element => element.textContent = '');
        }

        function hideResult() {
            document.getElementById('result').classList.remove('show');
        }

        // Enterキーで計算
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                calculateArea();
            }
        });

        // リアルタイム計算
        function setupRealtimeCalculation() {
            const inputs = [
                'circleRadius', 'rectangleLength', 'rectangleWidth', 
                'squareSide', 'triangleBase', 'triangleHeight'
            ];

            inputs.forEach(id => {
                const element = document.getElementById(id);
                if (element) {
                    element.addEventListener('input', function() {
                        if (this.value) {
                            setTimeout(calculateArea, 300); // 少し遅延させて連続入力に対応
                        }
                    });
                }
            });
        }

        // 初期化
        setupRealtimeCalculation();
    </script>
</body>
</html>
