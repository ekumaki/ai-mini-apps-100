<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>複利計算機 - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .calculator {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .formula-info {
            background: #e7f3ff;
            border: 1px solid #b3d7ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #0066cc;
        }

        .formula {
            font-weight: bold;
            font-family: monospace;
            background: rgba(255, 255, 255, 0.7);
            padding: 5px 8px;
            border-radius: 5px;
            margin: 5px 0;
        }

        .input-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-group input,
        .input-group select {
            flex: 1;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
        }

        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .unit {
            color: #666;
            font-weight: 600;
            min-width: 40px;
        }

        .additional-options {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .options-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .option-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 10px;
        }

        .calculate-btn {
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .calculate-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .result {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result-main {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
        }

        .result-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .result-label {
            font-size: 1rem;
            opacity: 0.9;
        }

        .result-breakdown {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .breakdown-card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .breakdown-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .breakdown-label {
            font-size: 0.9rem;
            color: #666;
        }

        .growth-chart {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .chart-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }

        .chart-bar {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .chart-year {
            width: 60px;
            font-size: 0.9rem;
            color: #666;
            text-align: right;
            margin-right: 10px;
        }

        .chart-progress {
            flex: 1;
            height: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            margin-right: 10px;
        }

        .chart-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.8rem;
            transition: width 0.3s ease;
        }

        .chart-amount {
            width: 100px;
            font-size: 0.9rem;
            color: #333;
            font-weight: 600;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .error {
            color: #dc3545;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .input-section {
                grid-template-columns: 1fr;
            }
            
            .option-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="header">
            <h1>複利計算機</h1>
            <p>複利での投資収益を計算</p>
        </div>

        <div class="formula-info">
            <strong>複利計算式:</strong>
            <div class="formula">A = P(1 + r/n)^(nt)</div>
            <div style="margin-top: 10px;">
                A = 最終金額, P = 元本, r = 年利率, n = 年間複利回数, t = 期間
            </div>
        </div>

        <div class="input-section">
            <div class="input-group">
                <label for="principal">元本（初期投資額）</label>
                <div class="input-row">
                    <input type="number" id="principal" placeholder="例: 1000000" min="1" step="1000">
                    <span class="unit">円</span>
                </div>
                <div class="error" id="principalError"></div>
            </div>

            <div class="input-group">
                <label for="annualRate">年利率</label>
                <div class="input-row">
                    <input type="number" id="annualRate" placeholder="例: 5" min="0" max="100" step="0.1">
                    <span class="unit">%</span>
                </div>
                <div class="error" id="annualRateError"></div>
            </div>

            <div class="input-group">
                <label for="years">投資期間</label>
                <div class="input-row">
                    <input type="number" id="years" placeholder="例: 10" min="1" max="100" step="1">
                    <span class="unit">年</span>
                </div>
                <div class="error" id="yearsError"></div>
            </div>

            <div class="input-group">
                <label for="compoundFrequency">複利の頻度</label>
                <select id="compoundFrequency">
                    <option value="1">年1回</option>
                    <option value="2">年2回（半年毎）</option>
                    <option value="4">年4回（四半期毎）</option>
                    <option value="12" selected>年12回（毎月）</option>
                    <option value="365">年365回（毎日）</option>
                </select>
            </div>
        </div>

        <div class="additional-options">
            <div class="options-title">追加オプション</div>
            <div class="option-row">
                <div class="input-group">
                    <label for="monthlyContribution">月々の積立額</label>
                    <div class="input-row">
                        <input type="number" id="monthlyContribution" placeholder="例: 50000" min="0" step="1000">
                        <span class="unit">円</span>
                    </div>
                </div>
                <div class="input-group">
                    <label for="inflationRate">インフレ率</label>
                    <div class="input-row">
                        <input type="number" id="inflationRate" placeholder="例: 2" min="0" max="20" step="0.1">
                        <span class="unit">%</span>
                    </div>
                </div>
            </div>
        </div>

        <button class="calculate-btn" onclick="calculate()">複利を計算</button>

        <div class="result" id="result">
            <div class="result-main">
                <div class="result-value" id="finalAmount">0円</div>
                <div class="result-label">最終金額</div>
            </div>

            <div class="result-breakdown">
                <div class="breakdown-card">
                    <div class="breakdown-value" id="totalInvested">0円</div>
                    <div class="breakdown-label">総投資額</div>
                </div>
                <div class="breakdown-card">
                    <div class="breakdown-value" id="totalEarnings">0円</div>
                    <div class="breakdown-label">利益</div>
                </div>
                <div class="breakdown-card">
                    <div class="breakdown-value" id="effectiveRate">0%</div>
                    <div class="breakdown-label">実効年利率</div>
                </div>
                <div class="breakdown-card">
                    <div class="breakdown-value" id="realValue">0円</div>
                    <div class="breakdown-label">実質価値</div>
                </div>
            </div>

            <div class="growth-chart">
                <div class="chart-title">年別成長推移</div>
                <div id="chartContainer"></div>
            </div>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <script>
        function calculate() {
            clearErrors();

            const principal = parseFloat(document.getElementById('principal').value);
            const annualRate = parseFloat(document.getElementById('annualRate').value) / 100;
            const years = parseInt(document.getElementById('years').value);
            const compoundFrequency = parseInt(document.getElementById('compoundFrequency').value);
            const monthlyContribution = parseFloat(document.getElementById('monthlyContribution').value) || 0;
            const inflationRate = parseFloat(document.getElementById('inflationRate').value) / 100 || 0;

            let hasError = false;

            // バリデーション
            if (!principal || principal <= 0) {
                showError('principalError', '正しい元本を入力してください');
                hasError = true;
            }

            if (isNaN(annualRate) || annualRate < 0 || annualRate > 1) {
                showError('annualRateError', '正しい年利率を入力してください (0-100%)');
                hasError = true;
            }

            if (!years || years <= 0) {
                showError('yearsError', '正しい投資期間を入力してください');
                hasError = true;
            }

            if (hasError) {
                hideResult();
                return;
            }

            // 複利計算
            const results = calculateCompoundInterest(principal, annualRate, years, compoundFrequency, monthlyContribution, inflationRate);
            displayResult(results);
        }

        function calculateCompoundInterest(principal, annualRate, years, frequency, monthlyContribution, inflationRate) {
            let amount = principal;
            let totalInvested = principal;
            const yearlyData = [];
            const monthlyRate = annualRate / 12;

            for (let year = 1; year <= years; year++) {
                const yearStartAmount = amount;
                const yearStartInvested = totalInvested;

                // 月毎の計算
                for (let month = 1; month <= 12; month++) {
                    // 複利計算
                    const periodsPerMonth = frequency / 12;
                    const periodRate = annualRate / frequency;
                    
                    for (let period = 1; period <= periodsPerMonth; period++) {
                        amount = amount * (1 + periodRate);
                    }

                    // 月々の積立
                    if (monthlyContribution > 0) {
                        amount += monthlyContribution;
                        totalInvested += monthlyContribution;
                    }
                }

                // 年末の実質価値（インフレ調整）
                const realValue = amount / Math.pow(1 + inflationRate, year);

                yearlyData.push({
                    year: year,
                    amount: amount,
                    invested: totalInvested,
                    earnings: amount - totalInvested,
                    realValue: realValue
                });
            }

            const finalAmount = amount;
            const totalEarnings = finalAmount - totalInvested;
            const effectiveRate = Math.pow(finalAmount / principal, 1 / years) - 1;
            const finalRealValue = finalAmount / Math.pow(1 + inflationRate, years);

            return {
                finalAmount,
                totalInvested,
                totalEarnings,
                effectiveRate,
                finalRealValue,
                yearlyData
            };
        }

        function displayResult(results) {
            // メイン結果
            document.getElementById('finalAmount').textContent = formatCurrency(results.finalAmount);
            document.getElementById('totalInvested').textContent = formatCurrency(results.totalInvested);
            document.getElementById('totalEarnings').textContent = formatCurrency(results.totalEarnings);
            document.getElementById('effectiveRate').textContent = `${(results.effectiveRate * 100).toFixed(2)}%`;
            document.getElementById('realValue').textContent = formatCurrency(results.finalRealValue);

            // チャート表示
            displayChart(results.yearlyData);

            document.getElementById('result').classList.add('show');
        }

        function displayChart(yearlyData) {
            const container = document.getElementById('chartContainer');
            container.innerHTML = '';

            const maxAmount = Math.max(...yearlyData.map(d => d.amount));
            const showYears = yearlyData.length <= 10 ? yearlyData : 
                             yearlyData.filter((_, i) => i % Math.ceil(yearlyData.length / 10) === 0 || i === yearlyData.length - 1);

            showYears.forEach(data => {
                const bar = document.createElement('div');
                bar.className = 'chart-bar';
                
                const percentage = (data.amount / maxAmount) * 100;
                
                bar.innerHTML = `
                    <div class="chart-year">${data.year}年</div>
                    <div class="chart-progress">
                        <div class="chart-fill" style="width: ${percentage}%"></div>
                    </div>
                    <div class="chart-amount">${formatCurrency(data.amount)}</div>
                `;
                
                container.appendChild(bar);
            });
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('ja-JP', {
                style: 'currency',
                currency: 'JPY',
                maximumFractionDigits: 0
            }).format(Math.round(amount));
        }

        function showError(elementId, message) {
            document.getElementById(elementId).textContent = message;
        }

        function clearErrors() {
            document.querySelectorAll('.error').forEach(error => error.textContent = '');
        }

        function hideResult() {
            document.getElementById('result').classList.remove('show');
        }

        // Enterキーで計算
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                calculate();
            }
        });

        // リアルタイム計算
        ['principal', 'annualRate', 'years'].forEach(id => {
            document.getElementById(id).addEventListener('input', function() {
                const principal = document.getElementById('principal').value;
                const annualRate = document.getElementById('annualRate').value;
                const years = document.getElementById('years').value;
                
                if (principal && annualRate && years) {
                    setTimeout(calculate, 500);
                }
            });
        });

        document.getElementById('compoundFrequency').addEventListener('change', function() {
            const principal = document.getElementById('principal').value;
            const annualRate = document.getElementById('annualRate').value;
            const years = document.getElementById('years').value;
            
            if (principal && annualRate && years) {
                calculate();
            }
        });
    </script>
</body>
</html>
