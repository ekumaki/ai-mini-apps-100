<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>税金計算機 - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .calculator {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 450px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .tab-buttons {
            display: flex;
            margin-bottom: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 5px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: #667eea;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-group input,
        .input-group select {
            flex: 1;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
        }

        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .unit {
            color: #666;
            font-weight: 600;
            min-width: 30px;
        }

        .calculate-btn {
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .calculate-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .result {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .result-row:last-child {
            border-bottom: none;
            font-size: 1.2rem;
            font-weight: bold;
            background: #667eea;
            color: white;
            margin: 10px -20px -20px;
            padding: 15px 20px;
            border-radius: 0 0 8px 8px;
        }

        .result-label {
            font-weight: 600;
            color: #333;
        }

        .result-value {
            font-weight: bold;
            color: #667eea;
        }

        .result-row:last-child .result-label,
        .result-row:last-child .result-value {
            color: white;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .error {
            color: #dc3545;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .info {
            background: #e7f3ff;
            border: 1px solid #b3d7ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #0066cc;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="header">
            <h1>税金計算機</h1>
            <p>消費税込み・税抜き価格を計算</p>
        </div>

        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('taxIncluded')">税込み計算</button>
            <button class="tab-btn" onclick="switchTab('taxExcluded')">税抜き計算</button>
        </div>

        <!-- 税込み計算 -->
        <div class="tab-content active" id="taxIncluded">
            <div class="info">
                税抜き価格から税込み価格を計算します
            </div>

            <div class="input-group">
                <label for="priceExcludingTax">税抜き価格</label>
                <div class="input-row">
                    <input type="number" id="priceExcludingTax" placeholder="例: 1000" min="0" step="0.01">
                    <span class="unit">円</span>
                </div>
                <div class="error" id="priceExcludingTaxError"></div>
            </div>

            <div class="input-group">
                <label for="taxRateIncluded">消費税率</label>
                <div class="input-row">
                    <select id="taxRateIncluded">
                        <option value="10">10% (標準税率)</option>
                        <option value="8">8% (軽減税率)</option>
                        <option value="5">5% (旧税率)</option>
                        <option value="3">3% (旧税率)</option>
                        <option value="custom">カスタム</option>
                    </select>
                </div>
                <input type="number" id="customTaxRateIncluded" placeholder="税率を入力" min="0" max="100" step="0.01" style="display: none; margin-top: 10px; padding: 12px; border: 2px solid #e9ecef; border-radius: 10px; font-size: 16px;">
            </div>

            <button class="calculate-btn" onclick="calculateTaxIncluded()">税込み価格を計算</button>

            <div class="result" id="resultIncluded">
                <div class="result-row">
                    <span class="result-label">税抜き価格</span>
                    <span class="result-value" id="basePrice1">0円</span>
                </div>
                <div class="result-row">
                    <span class="result-label">消費税額</span>
                    <span class="result-value" id="taxAmount1">0円</span>
                </div>
                <div class="result-row">
                    <span class="result-label">税込み価格</span>
                    <span class="result-value" id="totalPrice1">0円</span>
                </div>
            </div>
        </div>

        <!-- 税抜き計算 -->
        <div class="tab-content" id="taxExcluded">
            <div class="info">
                税込み価格から税抜き価格を計算します
            </div>

            <div class="input-group">
                <label for="priceIncludingTax">税込み価格</label>
                <div class="input-row">
                    <input type="number" id="priceIncludingTax" placeholder="例: 1100" min="0" step="0.01">
                    <span class="unit">円</span>
                </div>
                <div class="error" id="priceIncludingTaxError"></div>
            </div>

            <div class="input-group">
                <label for="taxRateExcluded">消費税率</label>
                <div class="input-row">
                    <select id="taxRateExcluded">
                        <option value="10">10% (標準税率)</option>
                        <option value="8">8% (軽減税率)</option>
                        <option value="5">5% (旧税率)</option>
                        <option value="3">3% (旧税率)</option>
                        <option value="custom">カスタム</option>
                    </select>
                </div>
                <input type="number" id="customTaxRateExcluded" placeholder="税率を入力" min="0" max="100" step="0.01" style="display: none; margin-top: 10px; padding: 12px; border: 2px solid #e9ecef; border-radius: 10px; font-size: 16px;">
            </div>

            <button class="calculate-btn" onclick="calculateTaxExcluded()">税抜き価格を計算</button>

            <div class="result" id="resultExcluded">
                <div class="result-row">
                    <span class="result-label">税込み価格</span>
                    <span class="result-value" id="totalPrice2">0円</span>
                </div>
                <div class="result-row">
                    <span class="result-label">消費税額</span>
                    <span class="result-value" id="taxAmount2">0円</span>
                </div>
                <div class="result-row">
                    <span class="result-label">税抜き価格</span>
                    <span class="result-value" id="basePrice2">0円</span>
                </div>
            </div>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <script>
        let currentTab = 'taxIncluded';

        function switchTab(tabName) {
            // タブボタンの状態更新
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // タブコンテンツの表示切り替え
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');

            currentTab = tabName;
            clearErrors();
        }

        function calculateTaxIncluded() {
            clearErrors();

            const price = parseFloat(document.getElementById('priceExcludingTax').value);
            const taxRateSelect = document.getElementById('taxRateIncluded');
            let taxRate;

            if (taxRateSelect.value === 'custom') {
                taxRate = parseFloat(document.getElementById('customTaxRateIncluded').value);
                if (!taxRate || taxRate < 0 || taxRate > 100) {
                    showError('priceExcludingTaxError', '正しい税率を入力してください (0-100%)');
                    return;
                }
            } else {
                taxRate = parseFloat(taxRateSelect.value);
            }

            if (!price || price < 0) {
                showError('priceExcludingTaxError', '正しい価格を入力してください');
                return;
            }

            const taxAmount = Math.round(price * (taxRate / 100));
            const totalPrice = price + taxAmount;

            document.getElementById('basePrice1').textContent = formatPrice(price);
            document.getElementById('taxAmount1').textContent = formatPrice(taxAmount);
            document.getElementById('totalPrice1').textContent = formatPrice(totalPrice);

            document.getElementById('resultIncluded').classList.add('show');
        }

        function calculateTaxExcluded() {
            clearErrors();

            const totalPrice = parseFloat(document.getElementById('priceIncludingTax').value);
            const taxRateSelect = document.getElementById('taxRateExcluded');
            let taxRate;

            if (taxRateSelect.value === 'custom') {
                taxRate = parseFloat(document.getElementById('customTaxRateExcluded').value);
                if (!taxRate || taxRate < 0 || taxRate > 100) {
                    showError('priceIncludingTaxError', '正しい税率を入力してください (0-100%)');
                    return;
                }
            } else {
                taxRate = parseFloat(taxRateSelect.value);
            }

            if (!totalPrice || totalPrice < 0) {
                showError('priceIncludingTaxError', '正しい価格を入力してください');
                return;
            }

            const basePrice = Math.round(totalPrice / (1 + taxRate / 100));
            const taxAmount = totalPrice - basePrice;

            document.getElementById('totalPrice2').textContent = formatPrice(totalPrice);
            document.getElementById('taxAmount2').textContent = formatPrice(taxAmount);
            document.getElementById('basePrice2').textContent = formatPrice(basePrice);

            document.getElementById('resultExcluded').classList.add('show');
        }

        function formatPrice(price) {
            return new Intl.NumberFormat('ja-JP').format(price) + '円';
        }

        function showError(elementId, message) {
            document.getElementById(elementId).textContent = message;
        }

        function clearErrors() {
            document.getElementById('priceExcludingTaxError').textContent = '';
            document.getElementById('priceIncludingTaxError').textContent = '';
        }

        // カスタム税率の表示制御
        document.getElementById('taxRateIncluded').addEventListener('change', function() {
            const customInput = document.getElementById('customTaxRateIncluded');
            if (this.value === 'custom') {
                customInput.style.display = 'block';
                customInput.focus();
            } else {
                customInput.style.display = 'none';
            }
        });

        document.getElementById('taxRateExcluded').addEventListener('change', function() {
            const customInput = document.getElementById('customTaxRateExcluded');
            if (this.value === 'custom') {
                customInput.style.display = 'block';
                customInput.focus();
            } else {
                customInput.style.display = 'none';
            }
        });

        // Enterキーで計算
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                if (currentTab === 'taxIncluded') {
                    calculateTaxIncluded();
                } else {
                    calculateTaxExcluded();
                }
            }
        });
    </script>
</body>
</html>
