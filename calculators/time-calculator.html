<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時間計算機 - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .calculator {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 500px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .tab-buttons {
            display: flex;
            margin-bottom: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 5px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .tab-btn.active {
            background: #667eea;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .input-section {
            margin-bottom: 20px;
        }

        .section-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .time-input-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .time-input {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-input label {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 5px;
        }

        .time-input input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
        }

        .time-input input:focus {
            outline: none;
            border-color: #667eea;
        }

        .operation-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .operation-select {
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            background: white;
            cursor: pointer;
        }

        .operation-select:focus {
            outline: none;
            border-color: #667eea;
        }

        .calculate-btn {
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .calculate-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .result {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result-value {
            font-size: 2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .result-details {
            color: #666;
            font-size: 1rem;
        }

        .conversion-result {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .conversion-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f8f9fa;
        }

        .conversion-row:last-child {
            border-bottom: none;
        }

        .conversion-label {
            font-weight: 600;
            color: #333;
        }

        .conversion-value {
            color: #667eea;
            font-weight: bold;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .error {
            color: #dc3545;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .info {
            background: #e7f3ff;
            border: 1px solid #b3d7ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #0066cc;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="header">
            <h1>時間計算機</h1>
            <p>時間の加算・減算計算</p>
        </div>

        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('arithmetic')">時間計算</button>
            <button class="tab-btn" onclick="switchTab('conversion')">時間変換</button>
        </div>

        <!-- 時間計算タブ -->
        <div class="tab-content active" id="arithmetic">
            <div class="info">
                2つの時間の加算・減算を行います
            </div>

            <div class="input-section">
                <div class="section-title">時間1</div>
                <div class="time-input-group">
                    <div class="time-input">
                        <label>時</label>
                        <input type="number" id="time1Hours" value="0" min="0" max="999">
                    </div>
                    <div class="time-input">
                        <label>分</label>
                        <input type="number" id="time1Minutes" value="0" min="0" max="59">
                    </div>
                    <div class="time-input">
                        <label>秒</label>
                        <input type="number" id="time1Seconds" value="0" min="0" max="59">
                    </div>
                </div>
            </div>

            <div class="operation-row">
                <select class="operation-select" id="operation">
                    <option value="add">加算 (+)</option>
                    <option value="subtract">減算 (-)</option>
                </select>
            </div>

            <div class="input-section">
                <div class="section-title">時間2</div>
                <div class="time-input-group">
                    <div class="time-input">
                        <label>時</label>
                        <input type="number" id="time2Hours" value="0" min="0" max="999">
                    </div>
                    <div class="time-input">
                        <label>分</label>
                        <input type="number" id="time2Minutes" value="0" min="0" max="59">
                    </div>
                    <div class="time-input">
                        <label>秒</label>
                        <input type="number" id="time2Seconds" value="0" min="0" max="59">
                    </div>
                </div>
            </div>

            <button class="calculate-btn" onclick="calculateTime()">計算する</button>

            <div class="result" id="arithmeticResult">
                <div class="result-value" id="arithmeticValue">0時間 0分 0秒</div>
                <div class="result-details" id="arithmeticDetails">合計: 0秒</div>
            </div>
        </div>

        <!-- 時間変換タブ -->
        <div class="tab-content" id="conversion">
            <div class="info">
                時間を秒、分、時間、日に変換します
            </div>

            <div class="input-section">
                <div class="section-title">変換したい時間を入力</div>
                <div class="time-input-group">
                    <div class="time-input">
                        <label>時</label>
                        <input type="number" id="convertHours" value="1" min="0" max="999" oninput="convertTime()">
                    </div>
                    <div class="time-input">
                        <label>分</label>
                        <input type="number" id="convertMinutes" value="0" min="0" max="59" oninput="convertTime()">
                    </div>
                    <div class="time-input">
                        <label>秒</label>
                        <input type="number" id="convertSeconds" value="0" min="0" max="59" oninput="convertTime()">
                    </div>
                </div>
            </div>

            <div class="conversion-result" id="conversionResult">
                <div class="conversion-row">
                    <span class="conversion-label">総秒数</span>
                    <span class="conversion-value" id="totalSeconds">3600秒</span>
                </div>
                <div class="conversion-row">
                    <span class="conversion-label">総分数</span>
                    <span class="conversion-value" id="totalMinutes">60分</span>
                </div>
                <div class="conversion-row">
                    <span class="conversion-label">総時間数</span>
                    <span class="conversion-value" id="totalHours">1時間</span>
                </div>
                <div class="conversion-row">
                    <span class="conversion-label">日数換算</span>
                    <span class="conversion-value" id="totalDays">0.042日</span>
                </div>
                <div class="conversion-row">
                    <span class="conversion-label">週数換算</span>
                    <span class="conversion-value" id="totalWeeks">0.006週</span>
                </div>
            </div>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <script>
        let currentTab = 'arithmetic';

        function switchTab(tabName) {
            // タブボタンの状態更新
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // タブコンテンツの表示切り替え
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');

            currentTab = tabName;
            
            if (tabName === 'conversion') {
                convertTime();
            }
        }

        function calculateTime() {
            const time1Hours = parseInt(document.getElementById('time1Hours').value) || 0;
            const time1Minutes = parseInt(document.getElementById('time1Minutes').value) || 0;
            const time1Seconds = parseInt(document.getElementById('time1Seconds').value) || 0;

            const time2Hours = parseInt(document.getElementById('time2Hours').value) || 0;
            const time2Minutes = parseInt(document.getElementById('time2Minutes').value) || 0;
            const time2Seconds = parseInt(document.getElementById('time2Seconds').value) || 0;

            const operation = document.getElementById('operation').value;

            // 秒に変換
            const time1Total = time1Hours * 3600 + time1Minutes * 60 + time1Seconds;
            const time2Total = time2Hours * 3600 + time2Minutes * 60 + time2Seconds;

            let resultTotal;
            if (operation === 'add') {
                resultTotal = time1Total + time2Total;
            } else {
                resultTotal = time1Total - time2Total;
            }

            // 負の値の場合
            if (resultTotal < 0) {
                resultTotal = Math.abs(resultTotal);
                displayArithmeticResult(resultTotal, true);
            } else {
                displayArithmeticResult(resultTotal, false);
            }
        }

        function displayArithmeticResult(totalSeconds, isNegative) {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            const sign = isNegative ? '-' : '';
            
            document.getElementById('arithmeticValue').textContent = 
                `${sign}${hours}時間 ${minutes}分 ${seconds}秒`;
            
            document.getElementById('arithmeticDetails').textContent = 
                `合計: ${sign}${totalSeconds.toLocaleString()}秒`;

            document.getElementById('arithmeticResult').classList.add('show');
        }

        function convertTime() {
            const hours = parseInt(document.getElementById('convertHours').value) || 0;
            const minutes = parseInt(document.getElementById('convertMinutes').value) || 0;
            const seconds = parseInt(document.getElementById('convertSeconds').value) || 0;

            const totalSeconds = hours * 3600 + minutes * 60 + seconds;
            const totalMinutes = totalSeconds / 60;
            const totalHours = totalSeconds / 3600;
            const totalDays = totalSeconds / (24 * 3600);
            const totalWeeks = totalSeconds / (7 * 24 * 3600);

            document.getElementById('totalSeconds').textContent = `${totalSeconds.toLocaleString()}秒`;
            document.getElementById('totalMinutes').textContent = `${totalMinutes.toFixed(2)}分`;
            document.getElementById('totalHours').textContent = `${totalHours.toFixed(4)}時間`;
            document.getElementById('totalDays').textContent = `${totalDays.toFixed(6)}日`;
            document.getElementById('totalWeeks').textContent = `${totalWeeks.toFixed(6)}週`;
        }

        // 入力値の自動修正
        function setupInputValidation() {
            const minuteInputs = ['time1Minutes', 'time2Minutes', 'convertMinutes'];
            const secondInputs = ['time1Seconds', 'time2Seconds', 'convertSeconds'];

            minuteInputs.forEach(id => {
                document.getElementById(id).addEventListener('input', function() {
                    if (parseInt(this.value) > 59) this.value = 59;
                    if (parseInt(this.value) < 0) this.value = 0;
                });
            });

            secondInputs.forEach(id => {
                document.getElementById(id).addEventListener('input', function() {
                    if (parseInt(this.value) > 59) this.value = 59;
                    if (parseInt(this.value) < 0) this.value = 0;
                });
            });
        }

        // Enterキーで計算
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                if (currentTab === 'arithmetic') {
                    calculateTime();
                }
            }
        });

        // 初期化
        setupInputValidation();
        convertTime();
    </script>
</body>
</html>
