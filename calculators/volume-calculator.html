<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体積計算機 - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .calculator {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 500px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .shape-selector {
            margin-bottom: 20px;
        }

        .shape-selector label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .shape-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .shape-btn {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px 10px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .shape-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .shape-btn:hover:not(.active) {
            background: #e9ecef;
            border-color: #dee2e6;
        }

        .shape-content {
            display: none;
        }

        .shape-content.active {
            display: block;
        }

        .formula-info {
            background: #e7f3ff;
            border: 1px solid #b3d7ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #0066cc;
        }

        .formula {
            font-weight: bold;
            font-family: monospace;
            background: rgba(255, 255, 255, 0.7);
            padding: 5px 8px;
            border-radius: 5px;
            margin: 5px 0;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-group input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .unit {
            color: #666;
            font-weight: 600;
            min-width: 30px;
        }

        .calculate-btn {
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .calculate-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .result {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result-value {
            font-size: 2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .result-unit {
            color: #666;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .conversion-results {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }

        .conversion-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .conversion-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #f8f9fa;
        }

        .conversion-row:last-child {
            border-bottom: none;
        }

        .conversion-label {
            color: #666;
        }

        .conversion-value {
            font-weight: 600;
            color: #667eea;
        }

        .shape-preview {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shape-icon {
            font-size: 3rem;
            color: #667eea;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .error {
            color: #dc3545;
            font-size: 0.9rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="header">
            <h1>体積計算機</h1>
            <p>球、円柱、立方体の体積を計算</p>
        </div>

        <div class="shape-selector">
            <label>計算したい立体を選択:</label>
            <div class="shape-buttons">
                <button class="shape-btn active" onclick="selectShape('sphere')">球</button>
                <button class="shape-btn" onclick="selectShape('cylinder')">円柱</button>
                <button class="shape-btn" onclick="selectShape('cube')">立方体</button>
                <button class="shape-btn" onclick="selectShape('box')">直方体</button>
            </div>
        </div>

        <!-- 球 -->
        <div class="shape-content active" id="sphere">
            <div class="shape-preview">
                <div class="shape-icon">⚪</div>
            </div>
            <div class="formula-info">
                <strong>球の体積公式:</strong>
                <div class="formula">体積 = (4/3) × π × 半径³</div>
            </div>
            <div class="input-group">
                <label for="sphereRadius">半径</label>
                <div class="input-row">
                    <input type="number" id="sphereRadius" placeholder="例: 5" min="0" step="0.01">
                    <span class="unit">cm</span>
                </div>
                <div class="error" id="sphereRadiusError"></div>
            </div>
        </div>

        <!-- 円柱 -->
        <div class="shape-content" id="cylinder">
            <div class="shape-preview">
                <div class="shape-icon">🥫</div>
            </div>
            <div class="formula-info">
                <strong>円柱の体積公式:</strong>
                <div class="formula">体積 = π × 半径² × 高さ</div>
            </div>
            <div class="input-group">
                <label for="cylinderRadius">半径</label>
                <div class="input-row">
                    <input type="number" id="cylinderRadius" placeholder="例: 3" min="0" step="0.01">
                    <span class="unit">cm</span>
                </div>
                <div class="error" id="cylinderRadiusError"></div>
            </div>
            <div class="input-group">
                <label for="cylinderHeight">高さ</label>
                <div class="input-row">
                    <input type="number" id="cylinderHeight" placeholder="例: 8" min="0" step="0.01">
                    <span class="unit">cm</span>
                </div>
                <div class="error" id="cylinderHeightError"></div>
            </div>
        </div>

        <!-- 立方体 -->
        <div class="shape-content" id="cube">
            <div class="shape-preview">
                <div class="shape-icon">📦</div>
            </div>
            <div class="formula-info">
                <strong>立方体の体積公式:</strong>
                <div class="formula">体積 = 一辺³</div>
            </div>
            <div class="input-group">
                <label for="cubeSide">一辺の長さ</label>
                <div class="input-row">
                    <input type="number" id="cubeSide" placeholder="例: 6" min="0" step="0.01">
                    <span class="unit">cm</span>
                </div>
                <div class="error" id="cubeSideError"></div>
            </div>
        </div>

        <!-- 直方体 -->
        <div class="shape-content" id="box">
            <div class="shape-preview">
                <div class="shape-icon">📐</div>
            </div>
            <div class="formula-info">
                <strong>直方体の体積公式:</strong>
                <div class="formula">体積 = 長さ × 幅 × 高さ</div>
            </div>
            <div class="input-group">
                <label for="boxLength">長さ</label>
                <div class="input-row">
                    <input type="number" id="boxLength" placeholder="例: 10" min="0" step="0.01">
                    <span class="unit">cm</span>
                </div>
                <div class="error" id="boxLengthError"></div>
            </div>
            <div class="input-group">
                <label for="boxWidth">幅</label>
                <div class="input-row">
                    <input type="number" id="boxWidth" placeholder="例: 8" min="0" step="0.01">
                    <span class="unit">cm</span>
                </div>
                <div class="error" id="boxWidthError"></div>
            </div>
            <div class="input-group">
                <label for="boxHeight">高さ</label>
                <div class="input-row">
                    <input type="number" id="boxHeight" placeholder="例: 6" min="0" step="0.01">
                    <span class="unit">cm</span>
                </div>
                <div class="error" id="boxHeightError"></div>
            </div>
        </div>

        <button class="calculate-btn" onclick="calculateVolume()">体積を計算</button>

        <div class="result" id="result">
            <div class="result-value" id="resultValue">0</div>
            <div class="result-unit">cm³</div>
            
            <div class="conversion-results">
                <div class="conversion-title">単位変換</div>
                <div class="conversion-row">
                    <span class="conversion-label">立方ミリメートル</span>
                    <span class="conversion-value" id="resultMm3">0 mm³</span>
                </div>
                <div class="conversion-row">
                    <span class="conversion-label">立方メートル</span>
                    <span class="conversion-value" id="resultM3">0 m³</span>
                </div>
                <div class="conversion-row">
                    <span class="conversion-label">リットル</span>
                    <span class="conversion-value" id="resultL">0 L</span>
                </div>
                <div class="conversion-row">
                    <span class="conversion-label">立方インチ</span>
                    <span class="conversion-value" id="resultIn3">0 in³</span>
                </div>
                <div class="conversion-row">
                    <span class="conversion-label">立方フィート</span>
                    <span class="conversion-value" id="resultFt3">0 ft³</span>
                </div>
                <div class="conversion-row">
                    <span class="conversion-label">ガロン (US)</span>
                    <span class="conversion-value" id="resultGal">0 gal</span>
                </div>
            </div>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <script>
        let currentShape = 'sphere';

        function selectShape(shape) {
            // ボタンの状態更新
            document.querySelectorAll('.shape-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // コンテンツの表示切り替え
            document.querySelectorAll('.shape-content').forEach(content => content.classList.remove('active'));
            document.getElementById(shape).classList.add('active');

            currentShape = shape;
            clearErrors();
            hideResult();
        }

        function calculateVolume() {
            clearErrors();
            let volume = 0;

            switch (currentShape) {
                case 'sphere':
                    volume = calculateSphereVolume();
                    break;
                case 'cylinder':
                    volume = calculateCylinderVolume();
                    break;
                case 'cube':
                    volume = calculateCubeVolume();
                    break;
                case 'box':
                    volume = calculateBoxVolume();
                    break;
            }

            if (volume !== null) {
                displayResult(volume);
            }
        }

        function calculateSphereVolume() {
            const radius = parseFloat(document.getElementById('sphereRadius').value);

            if (!radius || radius <= 0) {
                showError('sphereRadiusError', '正しい半径を入力してください');
                return null;
            }

            return (4/3) * Math.PI * Math.pow(radius, 3);
        }

        function calculateCylinderVolume() {
            const radius = parseFloat(document.getElementById('cylinderRadius').value);
            const height = parseFloat(document.getElementById('cylinderHeight').value);

            let hasError = false;

            if (!radius || radius <= 0) {
                showError('cylinderRadiusError', '正しい半径を入力してください');
                hasError = true;
            }

            if (!height || height <= 0) {
                showError('cylinderHeightError', '正しい高さを入力してください');
                hasError = true;
            }

            if (hasError) return null;

            return Math.PI * Math.pow(radius, 2) * height;
        }

        function calculateCubeVolume() {
            const side = parseFloat(document.getElementById('cubeSide').value);

            if (!side || side <= 0) {
                showError('cubeSideError', '正しい一辺の長さを入力してください');
                return null;
            }

            return Math.pow(side, 3);
        }

        function calculateBoxVolume() {
            const length = parseFloat(document.getElementById('boxLength').value);
            const width = parseFloat(document.getElementById('boxWidth').value);
            const height = parseFloat(document.getElementById('boxHeight').value);

            let hasError = false;

            if (!length || length <= 0) {
                showError('boxLengthError', '正しい長さを入力してください');
                hasError = true;
            }

            if (!width || width <= 0) {
                showError('boxWidthError', '正しい幅を入力してください');
                hasError = true;
            }

            if (!height || height <= 0) {
                showError('boxHeightError', '正しい高さを入力してください');
                hasError = true;
            }

            if (hasError) return null;

            return length * width * height;
        }

        function displayResult(volume) {
            // 主要結果表示
            document.getElementById('resultValue').textContent = volume.toFixed(2);

            // 単位変換
            const mm3 = volume * 1000;              // 1 cm³ = 1000 mm³
            const m3 = volume / 1000000;            // 1 m³ = 1,000,000 cm³
            const L = volume / 1000;                // 1 L = 1000 cm³
            const in3 = volume / 16.387064;         // 1 in³ = 16.387064 cm³
            const ft3 = volume / 28316.8466;        // 1 ft³ = 28316.8466 cm³
            const gal = volume / 3785.411784;       // 1 gallon (US) = 3785.411784 cm³

            document.getElementById('resultMm3').textContent = `${mm3.toFixed(2)} mm³`;
            document.getElementById('resultM3').textContent = `${m3.toFixed(9)} m³`;
            document.getElementById('resultL').textContent = `${L.toFixed(6)} L`;
            document.getElementById('resultIn3').textContent = `${in3.toFixed(4)} in³`;
            document.getElementById('resultFt3').textContent = `${ft3.toFixed(6)} ft³`;
            document.getElementById('resultGal').textContent = `${gal.toFixed(6)} gal`;

            document.getElementById('result').classList.add('show');
        }

        function showError(elementId, message) {
            document.getElementById(elementId).textContent = message;
        }

        function clearErrors() {
            const errorElements = document.querySelectorAll('.error');
            errorElements.forEach(element => element.textContent = '');
        }

        function hideResult() {
            document.getElementById('result').classList.remove('show');
        }

        // Enterキーで計算
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                calculateVolume();
            }
        });

        // リアルタイム計算
        function setupRealtimeCalculation() {
            const inputs = [
                'sphereRadius', 'cylinderRadius', 'cylinderHeight', 
                'cubeSide', 'boxLength', 'boxWidth', 'boxHeight'
            ];

            inputs.forEach(id => {
                const element = document.getElementById(id);
                if (element) {
                    element.addEventListener('input', function() {
                        if (this.value) {
                            setTimeout(calculateVolume, 300); // 少し遅延させて連続入力に対応
                        }
                    });
                }
            });
        }

        // 初期化
        setupRealtimeCalculation();
    </script>
</body>
</html>
