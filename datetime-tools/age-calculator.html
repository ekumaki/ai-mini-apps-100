<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年齢計算 - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .age-calculator {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .input-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .input-title {
            color: #333;
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .input-control {
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .input-control:focus {
            outline: none;
            border-color: #667eea;
        }

        .calculate-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-right: 10px;
        }

        .calculate-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .preset-btn {
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .preset-btn:hover {
            background: #218838;
        }

        .result-section {
            background: #e8f5e8;
            border: 1px solid #c3e6cb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .result-title {
            color: #155724;
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .age-display {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            border: 2px solid #c3e6cb;
        }

        .main-age {
            font-size: 3rem;
            font-weight: bold;
            color: #155724;
            margin-bottom: 10px;
        }

        .age-label {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .detailed-age {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            background: white;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #155724;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        .milestones {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .milestones-title {
            color: #856404;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .milestone-item {
            background: white;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .milestone-item.achieved {
            background: #d4edda;
            border-color: #c3e6cb;
        }

        .milestone-item.upcoming {
            background: #f8d7da;
            border-color: #f5c6cb;
        }

        .milestone-age {
            font-weight: 600;
            color: #856404;
        }

        .milestone-description {
            color: #333;
            flex: 1;
            margin-left: 15px;
        }

        .milestone-status {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-achieved {
            background: #d4edda;
            color: #155724;
        }

        .status-upcoming {
            background: #f8d7da;
            color: #721c24;
        }

        .zodiac-section {
            background: #e1ecf4;
            border: 1px solid #b3d4fc;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .zodiac-title {
            color: #0c5460;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .zodiac-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .zodiac-item {
            background: white;
            border: 1px solid #b3d4fc;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .zodiac-symbol {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .zodiac-name {
            font-weight: 600;
            color: #0c5460;
            margin-bottom: 5px;
        }

        .zodiac-description {
            color: #666;
            font-size: 0.9rem;
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: #5a6fd8;
        }

        .action-btn.secondary {
            background: #6c757d;
        }

        .action-btn.secondary:hover {
            background: #5a6268;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            background: #dc3545;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .age-calculator {
                padding: 20px;
            }
            
            .input-grid {
                grid-template-columns: 1fr;
            }
            
            .main-age {
                font-size: 2rem;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .milestone-item {
                flex-direction: column;
                text-align: center;
            }
            
            .milestone-description {
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>
    <div class="age-calculator">
        <div class="header">
            <h1>年齢計算</h1>
            <p>生年月日から正確な年齢を計算</p>
        </div>

        <div class="input-section">
            <div class="input-title">生年月日を入力してください</div>
            <div class="input-grid">
                <div class="input-group">
                    <label for="birthDate">生年月日</label>
                    <input type="date" id="birthDate" class="input-control" required>
                </div>
                <div class="input-group">
                    <label for="currentDate">計算基準日</label>
                    <input type="date" id="currentDate" class="input-control" required>
                </div>
            </div>
            <button class="calculate-btn" onclick="calculateAge()">年齢を計算</button>
            <button class="preset-btn" onclick="setToday()">今日を基準にする</button>
        </div>

        <div class="result-section" id="resultSection">
            <div class="result-title">年齢計算結果</div>
            
            <div class="age-display">
                <div class="main-age" id="mainAge">--</div>
                <div class="age-label">歳</div>
                <div class="detailed-age" id="detailedAge">--年--ヶ月--日</div>
            </div>

            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="totalDays">--</div>
                    <div class="stat-label">総日数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalWeeks">--</div>
                    <div class="stat-label">総週数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalMonths">--</div>
                    <div class="stat-label">総月数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalHours">--</div>
                    <div class="stat-label">総時間</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalMinutes">--</div>
                    <div class="stat-label">総分数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="nextBirthday">--</div>
                    <div class="stat-label">次の誕生日まで</div>
                </div>
            </div>
        </div>

        <div class="milestones">
            <div class="milestones-title">人生のマイルストーン</div>
            <div id="milestonesList">
                <!-- マイルストーンがここに表示されます -->
            </div>
        </div>

        <div class="zodiac-section">
            <div class="zodiac-title">生まれた年の干支・星座</div>
            <div class="zodiac-grid">
                <div class="zodiac-item">
                    <div class="zodiac-symbol" id="chineseZodiacSymbol">--</div>
                    <div class="zodiac-name" id="chineseZodiacName">--</div>
                    <div class="zodiac-description">中国の干支</div>
                </div>
                <div class="zodiac-item">
                    <div class="zodiac-symbol" id="westernZodiacSymbol">--</div>
                    <div class="zodiac-name" id="westernZodiacName">--</div>
                    <div class="zodiac-description">西洋の星座</div>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="action-btn" onclick="exportResult()">結果出力</button>
            <button class="action-btn secondary" onclick="clearAll()">クリア</button>
            <button class="action-btn secondary" onclick="loadExampleDates()">サンプル日付</button>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <div class="notification" id="notification">
        <div id="notificationMessage"></div>
    </div>

    <script>
        let calculationResult = null;

        const milestones = [
            { age: 0, description: '誕生' },
            { age: 1, description: '1歳の誕生日' },
            { age: 3, description: '幼稚園入園' },
            { age: 6, description: '小学校入学' },
            { age: 12, description: '中学校入学' },
            { age: 15, description: '高校入学' },
            { age: 18, description: '成人年齢（民法改正後）' },
            { age: 20, description: '成人式' },
            { age: 22, description: '大学卒業（一般的）' },
            { age: 25, description: '四半世紀' },
            { age: 30, description: '30代突入' },
            { age: 40, description: '不惑の年' },
            { age: 50, description: '知命の年' },
            { age: 60, description: '還暦' },
            { age: 70, description: '古希' },
            { age: 77, description: '喜寿' },
            { age: 80, description: '傘寿' },
            { age: 88, description: '米寿' },
            { age: 90, description: '卒寿' },
            { age: 99, description: '白寿' },
            { age: 100, description: '百寿' }
        ];

        const chineseZodiac = [
            { name: '子（ねずみ）', symbol: '🐭' },
            { name: '丑（うし）', symbol: '🐮' },
            { name: '寅（とら）', symbol: '🐯' },
            { name: '卯（うさぎ）', symbol: '🐰' },
            { name: '辰（たつ）', symbol: '🐲' },
            { name: '巳（へび）', symbol: '🐍' },
            { name: '午（うま）', symbol: '🐴' },
            { name: '未（ひつじ）', symbol: '🐑' },
            { name: '申（さる）', symbol: '🐵' },
            { name: '酉（とり）', symbol: '🐓' },
            { name: '戌（いぬ）', symbol: '🐕' },
            { name: '亥（いのしし）', symbol: '🐗' }
        ];

        const westernZodiac = [
            { name: '山羊座', symbol: '♑', start: [12, 22], end: [1, 19] },
            { name: '水瓶座', symbol: '♒', start: [1, 20], end: [2, 18] },
            { name: '魚座', symbol: '♓', start: [2, 19], end: [3, 20] },
            { name: '牡羊座', symbol: '♈', start: [3, 21], end: [4, 19] },
            { name: '牡牛座', symbol: '♉', start: [4, 20], end: [5, 20] },
            { name: '双子座', symbol: '♊', start: [5, 21], end: [6, 21] },
            { name: '蟹座', symbol: '♋', start: [6, 22], end: [7, 22] },
            { name: '獅子座', symbol: '♌', start: [7, 23], end: [8, 22] },
            { name: '乙女座', symbol: '♍', start: [8, 23], end: [9, 22] },
            { name: '天秤座', symbol: '♎', start: [9, 23], end: [10, 23] },
            { name: '蠍座', symbol: '♏', start: [10, 24], end: [11, 22] },
            { name: '射手座', symbol: '♐', start: [11, 23], end: [12, 21] }
        ];

        function calculateAge() {
            const birthDateInput = document.getElementById('birthDate').value;
            const currentDateInput = document.getElementById('currentDate').value;
            
            if (!birthDateInput || !currentDateInput) {
                showNotification('生年月日と計算基準日を入力してください', 'error');
                return;
            }
            
            const birthDate = new Date(birthDateInput);
            const currentDate = new Date(currentDateInput);
            
            if (birthDate > currentDate) {
                showNotification('生年月日は計算基準日より前の日付である必要があります', 'error');
                return;
            }
            
            // 年齢計算
            let years = currentDate.getFullYear() - birthDate.getFullYear();
            let months = currentDate.getMonth() - birthDate.getMonth();
            let days = currentDate.getDate() - birthDate.getDate();
            
            if (days < 0) {
                months--;
                const lastMonth = new Date(currentDate.getFullYear(), currentDate.getMonth(), 0);
                days += lastMonth.getDate();
            }
            
            if (months < 0) {
                years--;
                months += 12;
            }
            
            // 各種統計の計算
            const totalDays = Math.floor((currentDate - birthDate) / (1000 * 60 * 60 * 24));
            const totalWeeks = Math.floor(totalDays / 7);
            const totalMonths = years * 12 + months;
            const totalHours = totalDays * 24;
            const totalMinutes = totalHours * 60;
            
            // 次の誕生日までの日数
            const nextBirthday = new Date(currentDate.getFullYear(), birthDate.getMonth(), birthDate.getDate());
            if (nextBirthday <= currentDate) {
                nextBirthday.setFullYear(currentDate.getFullYear() + 1);
            }
            const daysToNextBirthday = Math.floor((nextBirthday - currentDate) / (1000 * 60 * 60 * 24));
            
            calculationResult = {
                birthDate: birthDate,
                currentDate: currentDate,
                years: years,
                months: months,
                days: days,
                totalDays: totalDays,
                totalWeeks: totalWeeks,
                totalMonths: totalMonths,
                totalHours: totalHours,
                totalMinutes: totalMinutes,
                daysToNextBirthday: daysToNextBirthday
            };
            
            displayResult();
            displayMilestones();
            displayZodiac();
            
            document.getElementById('resultSection').classList.add('show');
            showNotification('年齢を計算しました');
        }

        function displayResult() {
            const result = calculationResult;
            
            document.getElementById('mainAge').textContent = result.years;
            document.getElementById('detailedAge').textContent = `${result.years}年${result.months}ヶ月${result.days}日`;
            
            document.getElementById('totalDays').textContent = result.totalDays.toLocaleString();
            document.getElementById('totalWeeks').textContent = result.totalWeeks.toLocaleString();
            document.getElementById('totalMonths').textContent = result.totalMonths.toLocaleString();
            document.getElementById('totalHours').textContent = result.totalHours.toLocaleString();
            document.getElementById('totalMinutes').textContent = result.totalMinutes.toLocaleString();
            document.getElementById('nextBirthday').textContent = `${result.daysToNextBirthday}日`;
        }

        function displayMilestones() {
            const milestonesList = document.getElementById('milestonesList');
            milestonesList.innerHTML = '';
            
            const currentAge = calculationResult.years;
            
            milestones.forEach(milestone => {
                const milestoneItem = document.createElement('div');
                milestoneItem.className = 'milestone-item';
                
                if (milestone.age <= currentAge) {
                    milestoneItem.classList.add('achieved');
                } else {
                    milestoneItem.classList.add('upcoming');
                }
                
                const yearsToMilestone = milestone.age - currentAge;
                const status = milestone.age <= currentAge ? 'achieved' : 'upcoming';
                const statusText = milestone.age <= currentAge ? '達成済み' : `あと${yearsToMilestone}年`;
                
                milestoneItem.innerHTML = `
                    <div class="milestone-age">${milestone.age}歳</div>
                    <div class="milestone-description">${milestone.description}</div>
                    <div class="milestone-status status-${status}">${statusText}</div>
                `;
                
                milestonesList.appendChild(milestoneItem);
            });
        }

        function displayZodiac() {
            const birthDate = calculationResult.birthDate;
            const birthYear = birthDate.getFullYear();
            const birthMonth = birthDate.getMonth() + 1;
            const birthDay = birthDate.getDate();
            
            // 中国の干支
            const chineseZodiacIndex = (birthYear - 4) % 12;
            const chineseZodiacData = chineseZodiac[chineseZodiacIndex];
            document.getElementById('chineseZodiacSymbol').textContent = chineseZodiacData.symbol;
            document.getElementById('chineseZodiacName').textContent = chineseZodiacData.name;
            
            // 西洋の星座
            let westernZodiacData = null;
            for (const zodiac of westernZodiac) {
                const [startMonth, startDay] = zodiac.start;
                const [endMonth, endDay] = zodiac.end;
                
                if (startMonth === endMonth) {
                    if (birthMonth === startMonth && birthDay >= startDay && birthDay <= endDay) {
                        westernZodiacData = zodiac;
                        break;
                    }
                } else {
                    if ((birthMonth === startMonth && birthDay >= startDay) || 
                        (birthMonth === endMonth && birthDay <= endDay)) {
                        westernZodiacData = zodiac;
                        break;
                    }
                }
            }
            
            if (westernZodiacData) {
                document.getElementById('westernZodiacSymbol').textContent = westernZodiacData.symbol;
                document.getElementById('westernZodiacName').textContent = westernZodiacData.name;
            }
        }

        function setToday() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('currentDate').value = today;
            showNotification('今日を基準日に設定しました');
        }

        function exportResult() {
            if (!calculationResult) {
                showNotification('計算結果がありません', 'error');
                return;
            }
            
            const result = calculationResult;
            let exportText = '年齢計算結果\n';
            exportText += `計算日時: ${new Date().toLocaleString('ja-JP')}\n\n`;
            exportText += `生年月日: ${result.birthDate.toLocaleDateString('ja-JP')}\n`;
            exportText += `計算基準日: ${result.currentDate.toLocaleDateString('ja-JP')}\n\n`;
            exportText += `年齢: ${result.years}歳\n`;
            exportText += `詳細: ${result.years}年${result.months}ヶ月${result.days}日\n\n`;
            exportText += `総日数: ${result.totalDays.toLocaleString()}日\n`;
            exportText += `総週数: ${result.totalWeeks.toLocaleString()}週\n`;
            exportText += `総月数: ${result.totalMonths.toLocaleString()}ヶ月\n`;
            exportText += `総時間: ${result.totalHours.toLocaleString()}時間\n`;
            exportText += `総分数: ${result.totalMinutes.toLocaleString()}分\n`;
            exportText += `次の誕生日まで: ${result.daysToNextBirthday}日\n\n`;
            
            // 干支・星座情報
            const chineseZodiacIndex = (result.birthDate.getFullYear() - 4) % 12;
            const chineseZodiacData = chineseZodiac[chineseZodiacIndex];
            exportText += `干支: ${chineseZodiacData.name}\n`;
            
            const blob = new Blob([exportText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `age_calculation_${Date.now()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            
            showNotification('結果を出力しました');
        }

        function clearAll() {
            document.getElementById('birthDate').value = '';
            document.getElementById('currentDate').value = '';
            document.getElementById('resultSection').classList.remove('show');
            calculationResult = null;
            showNotification('全てクリアしました');
        }

        function loadExampleDates() {
            const examples = [
                { birth: '1990-01-01', label: '1990年生まれ' },
                { birth: '1985-05-15', label: '1985年生まれ' },
                { birth: '2000-12-25', label: '2000年生まれ' },
                { birth: '1995-07-10', label: '1995年生まれ' }
            ];
            
            const randomExample = examples[Math.floor(Math.random() * examples.length)];
            document.getElementById('birthDate').value = randomExample.birth;
            setToday();
            showNotification(`サンプル日付を設定しました: ${randomExample.label}`);
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            const notificationMessage = document.getElementById('notificationMessage');
            
            notificationMessage.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // 初期化
        function init() {
            setToday();
        }

        // ページ読み込み時の初期化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
