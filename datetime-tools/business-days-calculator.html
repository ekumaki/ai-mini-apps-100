<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>営業日計算 - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .business-days-calculator {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .calculator-modes {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .mode-btn {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .mode-btn:hover:not(.active) {
            background: #e9ecef;
        }

        .calculator-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
            display: none;
        }

        .calculator-section.active {
            display: block;
        }

        .section-title {
            color: #333;
            font-size: 1.3rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .input-control {
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .input-control:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .checkbox-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
        }

        .checkbox-item label {
            font-size: 0.9rem;
            margin-bottom: 0;
        }

        .calculate-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }

        .calculate-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .result-section {
            background: #e8f5e8;
            border: 1px solid #c3e6cb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .result-title {
            color: #155724;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .result-item {
            background: white;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .result-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #155724;
            margin-bottom: 5px;
        }

        .result-label {
            color: #666;
            font-size: 0.9rem;
        }

        .calendar-preview {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            display: none;
        }

        .calendar-preview.show {
            display: block;
        }

        .calendar-title {
            color: #333;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            background: #e9ecef;
            border-radius: 8px;
            overflow: hidden;
        }

        .calendar-day-header {
            background: #667eea;
            color: white;
            padding: 8px;
            text-align: center;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .calendar-day {
            background: white;
            min-height: 40px;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            position: relative;
        }

        .calendar-day.other-month {
            background: #f8f9fa;
            color: #999;
        }

        .calendar-day.weekend {
            background: #ffeaa7;
        }

        .calendar-day.holiday {
            background: #f8d7da;
            color: #721c24;
        }

        .calendar-day.business-day {
            background: #d4edda;
            color: #155724;
        }

        .calendar-day.selected {
            background: #667eea;
            color: white;
            font-weight: bold;
        }

        .settings-section {
            background: #e1ecf4;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .settings-title {
            color: #0c5460;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .setting-group {
            background: white;
            border: 1px solid #b3d4fc;
            border-radius: 8px;
            padding: 15px;
        }

        .setting-group h4 {
            color: #0c5460;
            margin-bottom: 10px;
        }

        .preset-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .preset-btn {
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .preset-btn:hover {
            background: #218838;
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: #5a6fd8;
        }

        .action-btn.secondary {
            background: #6c757d;
        }

        .action-btn.secondary:hover {
            background: #5a6268;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            background: #dc3545;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .business-days-calculator {
                padding: 20px;
            }
            
            .calculator-modes {
                flex-direction: column;
                align-items: center;
            }
            
            .input-grid {
                grid-template-columns: 1fr;
            }
            
            .calendar-grid {
                grid-template-columns: repeat(7, 1fr);
            }
            
            .calendar-day {
                min-height: 35px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="business-days-calculator">
        <div class="header">
            <h1>営業日計算</h1>
            <p>営業日・稼働日を計算するツール</p>
        </div>

        <div class="calculator-modes">
            <button class="mode-btn active" onclick="setMode('count')">営業日数計算</button>
            <button class="mode-btn" onclick="setMode('add')">営業日追加</button>
            <button class="mode-btn" onclick="setMode('subtract')">営業日減算</button>
        </div>

        <div class="calculator-section active" id="count">
            <div class="section-title">期間内の営業日数を計算</div>
            <div class="input-grid">
                <div class="input-group">
                    <label for="countStartDate">開始日</label>
                    <input type="date" id="countStartDate" class="input-control" required>
                </div>
                <div class="input-group">
                    <label for="countEndDate">終了日</label>
                    <input type="date" id="countEndDate" class="input-control" required>
                </div>
                <div class="input-group">
                    <label for="countIncludeEnd">終了日を含む</label>
                    <select id="countIncludeEnd" class="input-control">
                        <option value="true">含む</option>
                        <option value="false">含まない</option>
                    </select>
                </div>
            </div>
            <button class="calculate-btn" onclick="calculateBusinessDays()">計算</button>
        </div>

        <div class="calculator-section" id="add">
            <div class="section-title">指定日から営業日を追加</div>
            <div class="input-grid">
                <div class="input-group">
                    <label for="addBaseDate">基準日</label>
                    <input type="date" id="addBaseDate" class="input-control" required>
                </div>
                <div class="input-group">
                    <label for="addDays">追加する営業日数</label>
                    <input type="number" id="addDays" class="input-control" min="0" value="1" required>
                </div>
            </div>
            <button class="calculate-btn" onclick="addBusinessDays()">計算</button>
        </div>

        <div class="calculator-section" id="subtract">
            <div class="section-title">指定日から営業日を減算</div>
            <div class="input-grid">
                <div class="input-group">
                    <label for="subtractBaseDate">基準日</label>
                    <input type="date" id="subtractBaseDate" class="input-control" required>
                </div>
                <div class="input-group">
                    <label for="subtractDays">減算する営業日数</label>
                    <input type="number" id="subtractDays" class="input-control" min="0" value="1" required>
                </div>
            </div>
            <button class="calculate-btn" onclick="subtractBusinessDays()">計算</button>
        </div>

        <div class="result-section" id="resultSection">
            <div class="result-title">計算結果</div>
            <div class="result-grid" id="resultGrid">
                <!-- 結果がここに表示されます -->
            </div>
        </div>

        <div class="calendar-preview" id="calendarPreview">
            <div class="calendar-title">営業日カレンダー</div>
            <div class="calendar-grid" id="calendarGrid">
                <!-- カレンダーがここに表示されます -->
            </div>
        </div>

        <div class="settings-section">
            <div class="settings-title">営業日設定</div>
            <div class="settings-grid">
                <div class="setting-group">
                    <h4>休日設定</h4>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="excludeSaturday" checked>
                            <label for="excludeSaturday">土曜日</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="excludeSunday" checked>
                            <label for="excludeSunday">日曜日</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="excludeHolidays" checked>
                            <label for="excludeHolidays">祝日</label>
                        </div>
                    </div>
                </div>
                <div class="setting-group">
                    <h4>プリセット</h4>
                    <div class="preset-buttons">
                        <button class="preset-btn" onclick="setPreset('standard')">標準（土日祝除外）</button>
                        <button class="preset-btn" onclick="setPreset('saturday')">土曜営業</button>
                        <button class="preset-btn" onclick="setPreset('full')">年中無休</button>
                    </div>
                </div>
                <div class="setting-group">
                    <h4>カスタム休日</h4>
                    <input type="date" id="customHoliday" class="input-control" placeholder="カスタム休日を追加">
                    <button class="preset-btn" onclick="addCustomHoliday()" style="margin-top: 10px;">追加</button>
                    <div id="customHolidayList" style="margin-top: 10px;">
                        <!-- カスタム休日リストがここに表示されます -->
                    </div>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="action-btn" onclick="exportResult()">結果出力</button>
            <button class="action-btn" onclick="generateCalendar()">カレンダー生成</button>
            <button class="action-btn secondary" onclick="resetAll()">リセット</button>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <div class="notification" id="notification">
        <div id="notificationMessage"></div>
    </div>

    <script>
        let currentMode = 'count';
        let lastResult = null;
        let customHolidays = [];

        // 日本の祝日データ（簡略版）
        const holidays = {
            2024: [
                '2024-01-01', '2024-01-08', '2024-02-11', '2024-02-12', '2024-02-23',
                '2024-03-20', '2024-04-29', '2024-05-03', '2024-05-04', '2024-05-05',
                '2024-05-06', '2024-07-15', '2024-08-11', '2024-08-12', '2024-09-16',
                '2024-09-22', '2024-09-23', '2024-10-14', '2024-11-03', '2024-11-04',
                '2024-11-23'
            ],
            2025: [
                '2025-01-01', '2025-01-13', '2025-02-11', '2025-02-23', '2025-02-24',
                '2025-03-20', '2025-04-29', '2025-05-03', '2025-05-04', '2025-05-05',
                '2025-05-06', '2025-07-21', '2025-08-11', '2025-09-15', '2025-09-23',
                '2025-10-13', '2025-11-03', '2025-11-23', '2025-11-24'
            ]
        };

        function setMode(mode) {
            currentMode = mode;
            
            // ボタンの状態を更新
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // セクションの表示を切り替え
            document.querySelectorAll('.calculator-section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(mode).classList.add('active');
            
            // 結果セクションを非表示
            document.getElementById('resultSection').classList.remove('show');
            document.getElementById('calendarPreview').classList.remove('show');
        }

        function isBusinessDay(date) {
            const day = date.getDay();
            const dateString = date.toISOString().split('T')[0];
            
            // 設定に基づいて判定
            const excludeSaturday = document.getElementById('excludeSaturday').checked;
            const excludeSunday = document.getElementById('excludeSunday').checked;
            const excludeHolidays = document.getElementById('excludeHolidays').checked;
            
            // 土曜日のチェック
            if (excludeSaturday && day === 6) return false;
            
            // 日曜日のチェック
            if (excludeSunday && day === 0) return false;
            
            // 祝日のチェック
            if (excludeHolidays) {
                const year = date.getFullYear();
                const yearHolidays = holidays[year] || [];
                if (yearHolidays.includes(dateString)) return false;
            }
            
            // カスタム休日のチェック
            if (customHolidays.includes(dateString)) return false;
            
            return true;
        }

        function calculateBusinessDays() {
            const startDate = new Date(document.getElementById('countStartDate').value);
            const endDate = new Date(document.getElementById('countEndDate').value);
            const includeEnd = document.getElementById('countIncludeEnd').value === 'true';
            
            if (!document.getElementById('countStartDate').value || !document.getElementById('countEndDate').value) {
                showNotification('開始日と終了日を入力してください', 'error');
                return;
            }
            
            if (startDate > endDate) {
                showNotification('開始日は終了日より前の日付にしてください', 'error');
                return;
            }
            
            let businessDays = 0;
            let totalDays = 0;
            let weekends = 0;
            let holidayCount = 0;
            
            const current = new Date(startDate);
            const end = new Date(endDate);
            
            if (includeEnd) {
                end.setDate(end.getDate() + 1);
            }
            
            while (current < end) {
                totalDays++;
                
                if (isBusinessDay(current)) {
                    businessDays++;
                } else {
                    const day = current.getDay();
                    if (day === 0 || day === 6) {
                        weekends++;
                    } else {
                        holidayCount++;
                    }
                }
                
                current.setDate(current.getDate() + 1);
            }
            
            const businessDayRate = ((businessDays / totalDays) * 100).toFixed(1);
            
            lastResult = {
                type: 'count',
                startDate: startDate.toLocaleDateString('ja-JP'),
                endDate: endDate.toLocaleDateString('ja-JP'),
                businessDays: businessDays,
                totalDays: totalDays,
                weekends: weekends,
                holidays: holidayCount,
                businessDayRate: businessDayRate
            };
            
            displayResult([
                { label: '営業日数', value: `${businessDays}日` },
                { label: '総日数', value: `${totalDays}日` },
                { label: '土日祝日', value: `${weekends + holidayCount}日` },
                { label: '営業日率', value: `${businessDayRate}%` },
                { label: '週末日数', value: `${weekends}日` },
                { label: '祝日数', value: `${holidayCount}日` }
            ]);
            
            generateCalendarPreview(startDate, endDate);
            showNotification('営業日数を計算しました');
        }

        function addBusinessDays() {
            const baseDate = new Date(document.getElementById('addBaseDate').value);
            const daysToAdd = parseInt(document.getElementById('addDays').value);
            
            if (!document.getElementById('addBaseDate').value) {
                showNotification('基準日を入力してください', 'error');
                return;
            }
            
            if (daysToAdd < 0) {
                showNotification('追加する日数は0以上にしてください', 'error');
                return;
            }
            
            const resultDate = new Date(baseDate);
            let addedDays = 0;
            let totalDaysAdvanced = 0;
            
            while (addedDays < daysToAdd) {
                resultDate.setDate(resultDate.getDate() + 1);
                totalDaysAdvanced++;
                
                if (isBusinessDay(resultDate)) {
                    addedDays++;
                }
            }
            
            lastResult = {
                type: 'add',
                baseDate: baseDate.toLocaleDateString('ja-JP'),
                daysToAdd: daysToAdd,
                resultDate: resultDate.toLocaleDateString('ja-JP'),
                totalDaysAdvanced: totalDaysAdvanced
            };
            
            displayResult([
                { label: '結果の日付', value: resultDate.toLocaleDateString('ja-JP') },
                { label: '曜日', value: resultDate.toLocaleDateString('ja-JP', { weekday: 'long' }) },
                { label: '追加営業日数', value: `${daysToAdd}日` },
                { label: '実際の日数', value: `${totalDaysAdvanced}日` },
                { label: '基準日', value: baseDate.toLocaleDateString('ja-JP') }
            ]);
            
            generateCalendarPreview(baseDate, resultDate);
            showNotification('営業日を追加しました');
        }

        function subtractBusinessDays() {
            const baseDate = new Date(document.getElementById('subtractBaseDate').value);
            const daysToSubtract = parseInt(document.getElementById('subtractDays').value);
            
            if (!document.getElementById('subtractBaseDate').value) {
                showNotification('基準日を入力してください', 'error');
                return;
            }
            
            if (daysToSubtract < 0) {
                showNotification('減算する日数は0以上にしてください', 'error');
                return;
            }
            
            const resultDate = new Date(baseDate);
            let subtractedDays = 0;
            let totalDaysBackward = 0;
            
            while (subtractedDays < daysToSubtract) {
                resultDate.setDate(resultDate.getDate() - 1);
                totalDaysBackward++;
                
                if (isBusinessDay(resultDate)) {
                    subtractedDays++;
                }
            }
            
            lastResult = {
                type: 'subtract',
                baseDate: baseDate.toLocaleDateString('ja-JP'),
                daysToSubtract: daysToSubtract,
                resultDate: resultDate.toLocaleDateString('ja-JP'),
                totalDaysBackward: totalDaysBackward
            };
            
            displayResult([
                { label: '結果の日付', value: resultDate.toLocaleDateString('ja-JP') },
                { label: '曜日', value: resultDate.toLocaleDateString('ja-JP', { weekday: 'long' }) },
                { label: '減算営業日数', value: `${daysToSubtract}日` },
                { label: '実際の日数', value: `${totalDaysBackward}日` },
                { label: '基準日', value: baseDate.toLocaleDateString('ja-JP') }
            ]);
            
            generateCalendarPreview(resultDate, baseDate);
            showNotification('営業日を減算しました');
        }

        function displayResult(results) {
            const resultSection = document.getElementById('resultSection');
            const resultGrid = document.getElementById('resultGrid');
            
            resultGrid.innerHTML = '';
            
            results.forEach(result => {
                const resultItem = document.createElement('div');
                resultItem.className = 'result-item';
                resultItem.innerHTML = `
                    <div class="result-value">${result.value}</div>
                    <div class="result-label">${result.label}</div>
                `;
                resultGrid.appendChild(resultItem);
            });
            
            resultSection.classList.add('show');
        }

        function generateCalendarPreview(startDate, endDate) {
            const calendarPreview = document.getElementById('calendarPreview');
            const calendarGrid = document.getElementById('calendarGrid');
            
            // 表示する月を決定（開始日の月）
            const displayDate = new Date(startDate);
            displayDate.setDate(1);
            
            // カレンダーグリッドをクリア
            calendarGrid.innerHTML = '';
            
            // 曜日ヘッダーを追加
            const daysOfWeek = ['日', '月', '火', '水', '木', '金', '土'];
            daysOfWeek.forEach(day => {
                const dayHeader = document.createElement('div');
                dayHeader.className = 'calendar-day-header';
                dayHeader.textContent = day;
                calendarGrid.appendChild(dayHeader);
            });
            
            // 月の最初の日と最後の日を取得
            const firstDay = new Date(displayDate);
            const lastDay = new Date(displayDate.getFullYear(), displayDate.getMonth() + 1, 0);
            const startCalendar = new Date(firstDay);
            startCalendar.setDate(startCalendar.getDate() - firstDay.getDay());
            
            // カレンダーの日付を生成
            for (let i = 0; i < 42; i++) {
                const date = new Date(startCalendar);
                date.setDate(startCalendar.getDate() + i);
                
                const dayElement = document.createElement('div');
                dayElement.className = 'calendar-day';
                dayElement.textContent = date.getDate();
                
                // 他の月の日付をグレーアウト
                if (date.getMonth() !== displayDate.getMonth()) {
                    dayElement.classList.add('other-month');
                }
                
                // 選択された期間内の日付をハイライト
                if (date >= startDate && date <= endDate) {
                    dayElement.classList.add('selected');
                }
                
                // 営業日・休日の判定
                if (isBusinessDay(date)) {
                    dayElement.classList.add('business-day');
                } else {
                    const day = date.getDay();
                    if (day === 0 || day === 6) {
                        dayElement.classList.add('weekend');
                    } else {
                        dayElement.classList.add('holiday');
                    }
                }
                
                calendarGrid.appendChild(dayElement);
            }
            
            calendarPreview.classList.add('show');
        }

        function setPreset(preset) {
            const excludeSaturday = document.getElementById('excludeSaturday');
            const excludeSunday = document.getElementById('excludeSunday');
            const excludeHolidays = document.getElementById('excludeHolidays');
            
            switch (preset) {
                case 'standard':
                    excludeSaturday.checked = true;
                    excludeSunday.checked = true;
                    excludeHolidays.checked = true;
                    break;
                case 'saturday':
                    excludeSaturday.checked = false;
                    excludeSunday.checked = true;
                    excludeHolidays.checked = true;
                    break;
                case 'full':
                    excludeSaturday.checked = false;
                    excludeSunday.checked = false;
                    excludeHolidays.checked = false;
                    break;
            }
            
            showNotification(`${preset}プリセットを適用しました`);
        }

        function addCustomHoliday() {
            const holidayDate = document.getElementById('customHoliday').value;
            if (!holidayDate) {
                showNotification('カスタム休日の日付を入力してください', 'error');
                return;
            }
            
            if (customHolidays.includes(holidayDate)) {
                showNotification('この日付は既に追加されています', 'error');
                return;
            }
            
            customHolidays.push(holidayDate);
            updateCustomHolidayList();
            document.getElementById('customHoliday').value = '';
            showNotification('カスタム休日を追加しました');
        }

        function removeCustomHoliday(date) {
            customHolidays = customHolidays.filter(holiday => holiday !== date);
            updateCustomHolidayList();
            showNotification('カスタム休日を削除しました');
        }

        function updateCustomHolidayList() {
            const list = document.getElementById('customHolidayList');
            list.innerHTML = '';
            
            customHolidays.forEach(holiday => {
                const item = document.createElement('div');
                item.style.cssText = 'display: flex; justify-content: space-between; align-items: center; padding: 5px; background: #f8f9fa; border-radius: 4px; margin-bottom: 5px;';
                item.innerHTML = `
                    <span>${new Date(holiday).toLocaleDateString('ja-JP')}</span>
                    <button onclick="removeCustomHoliday('${holiday}')" style="background: #dc3545; color: white; border: none; border-radius: 3px; padding: 2px 6px; cursor: pointer;">削除</button>
                `;
                list.appendChild(item);
            });
        }

        function exportResult() {
            if (!lastResult) {
                showNotification('計算結果がありません', 'error');
                return;
            }
            
            let exportText = '営業日計算結果\n';
            exportText += `計算日時: ${new Date().toLocaleString('ja-JP')}\n\n`;
            
            if (lastResult.type === 'count') {
                exportText += `期間: ${lastResult.startDate} ～ ${lastResult.endDate}\n`;
                exportText += `営業日数: ${lastResult.businessDays}日\n`;
                exportText += `総日数: ${lastResult.totalDays}日\n`;
                exportText += `週末日数: ${lastResult.weekends}日\n`;
                exportText += `祝日数: ${lastResult.holidays}日\n`;
                exportText += `営業日率: ${lastResult.businessDayRate}%\n`;
            } else if (lastResult.type === 'add') {
                exportText += `基準日: ${lastResult.baseDate}\n`;
                exportText += `追加営業日数: ${lastResult.daysToAdd}日\n`;
                exportText += `結果の日付: ${lastResult.resultDate}\n`;
                exportText += `実際の日数: ${lastResult.totalDaysAdvanced}日\n`;
            } else if (lastResult.type === 'subtract') {
                exportText += `基準日: ${lastResult.baseDate}\n`;
                exportText += `減算営業日数: ${lastResult.daysToSubtract}日\n`;
                exportText += `結果の日付: ${lastResult.resultDate}\n`;
                exportText += `実際の日数: ${lastResult.totalDaysBackward}日\n`;
            }
            
            const blob = new Blob([exportText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `business_days_${Date.now()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            
            showNotification('結果を出力しました');
        }

        function generateCalendar() {
            if (!lastResult) {
                showNotification('計算結果がありません', 'error');
                return;
            }
            
            showNotification('カレンダーを生成しました');
        }

        function resetAll() {
            document.getElementById('countStartDate').value = '';
            document.getElementById('countEndDate').value = '';
            document.getElementById('addBaseDate').value = '';
            document.getElementById('addDays').value = '1';
            document.getElementById('subtractBaseDate').value = '';
            document.getElementById('subtractDays').value = '1';
            document.getElementById('customHoliday').value = '';
            
            customHolidays = [];
            updateCustomHolidayList();
            
            document.getElementById('resultSection').classList.remove('show');
            document.getElementById('calendarPreview').classList.remove('show');
            
            lastResult = null;
            showNotification('リセットしました');
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            const notificationMessage = document.getElementById('notificationMessage');
            
            notificationMessage.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // 初期化
        function init() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('countStartDate').value = today;
            document.getElementById('addBaseDate').value = today;
            document.getElementById('subtractBaseDate').value = today;
            
            const nextWeek = new Date();
            nextWeek.setDate(nextWeek.getDate() + 7);
            document.getElementById('countEndDate').value = nextWeek.toISOString().split('T')[0];
        }

        // ページ読み込み時の初期化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
