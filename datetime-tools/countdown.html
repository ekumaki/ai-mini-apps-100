<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カウントダウン - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .countdown-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .countdown-form {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .form-title {
            color: #333;
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .form-control {
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .form-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .form-btn.primary {
            background: #667eea;
            color: white;
        }

        .form-btn.primary:hover {
            background: #5a6fd8;
        }

        .form-btn.secondary {
            background: #6c757d;
            color: white;
        }

        .form-btn.secondary:hover {
            background: #5a6268;
        }

        .active-countdowns {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .section-title {
            color: #333;
            font-size: 1.3rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .countdown-list {
            display: grid;
            gap: 20px;
        }

        .countdown-item {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            padding: 25px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .countdown-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .countdown-item.expired {
            background: #f8d7da;
            border: 2px solid #f5c6cb;
        }

        .countdown-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .countdown-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .countdown-date {
            color: #666;
            font-size: 0.9rem;
        }

        .countdown-actions {
            display: flex;
            gap: 5px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: #e9ecef;
        }

        .action-btn.delete {
            color: #dc3545;
        }

        .action-btn.edit {
            color: #28a745;
        }

        .countdown-display {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .time-unit {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .time-unit:hover {
            transform: scale(1.05);
        }

        .time-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
            font-family: 'Courier New', monospace;
        }

        .time-label {
            color: #666;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .countdown-progress {
            margin-bottom: 20px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #666;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e9ecef;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
        }

        .countdown-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #666;
            font-size: 0.9rem;
        }

        .expired-message {
            background: #dc3545;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        .preset-events {
            background: #e1ecf4;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .preset-title {
            color: #0c5460;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }

        .preset-btn {
            background: white;
            border: 2px solid #b3d4fc;
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            text-align: left;
        }

        .preset-btn:hover {
            background: #b3d4fc;
        }

        .preset-name {
            font-weight: 600;
            color: #0c5460;
            margin-bottom: 3px;
        }

        .preset-date {
            font-size: 0.8rem;
            color: #666;
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .action-btn-main {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .action-btn-main:hover {
            background: #5a6fd8;
        }

        .action-btn-main.secondary {
            background: #6c757d;
        }

        .action-btn-main.secondary:hover {
            background: #5a6268;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            background: #dc3545;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .countdown-container {
                padding: 20px;
            }
            
            .countdown-display {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .time-value {
                font-size: 2rem;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .preset-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="countdown-container">
        <div class="header">
            <h1>カウントダウン</h1>
            <p>イベントまでの残り時間を表示</p>
        </div>

        <div class="countdown-form">
            <div class="form-title">新しいカウントダウンを作成</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="eventName">イベント名</label>
                    <input type="text" id="eventName" class="form-control" placeholder="例: 誕生日" required>
                </div>
                <div class="form-group">
                    <label for="eventDate">日付</label>
                    <input type="date" id="eventDate" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="eventTime">時刻</label>
                    <input type="time" id="eventTime" class="form-control" value="00:00">
                </div>
                <div class="form-group">
                    <label for="eventCategory">カテゴリ</label>
                    <select id="eventCategory" class="form-control">
                        <option value="personal">個人</option>
                        <option value="work">仕事</option>
                        <option value="holiday">祝日</option>
                        <option value="event">イベント</option>
                        <option value="other">その他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="eventDescription">説明（オプション）</label>
                    <textarea id="eventDescription" class="form-control" placeholder="イベントの詳細" rows="2"></textarea>
                </div>
            </div>
            <div class="form-actions">
                <button class="form-btn primary" onclick="addCountdown()">カウントダウンを追加</button>
                <button class="form-btn secondary" onclick="clearForm()">クリア</button>
            </div>
        </div>

        <div class="preset-events">
            <div class="preset-title">プリセットイベント</div>
            <div class="preset-grid" id="presetGrid">
                <!-- プリセットイベントがここに表示されます -->
            </div>
        </div>

        <div class="active-countdowns">
            <div class="section-title">アクティブなカウントダウン</div>
            <div class="countdown-list" id="countdownList">
                <!-- カウントダウンリストがここに表示されます -->
            </div>
        </div>

        <div class="actions">
            <button class="action-btn-main" onclick="exportCountdowns()">データ出力</button>
            <button class="action-btn-main" onclick="importCountdowns()">データ読込</button>
            <button class="action-btn-main secondary" onclick="clearAllCountdowns()">全削除</button>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <div class="notification" id="notification">
        <div id="notificationMessage"></div>
    </div>

    <script>
        let countdowns = [];
        let updateInterval;
        let editingCountdownId = null;

        const presetEvents = [
            { name: '元日', date: '2025-01-01', time: '00:00', category: 'holiday' },
            { name: 'バレンタインデー', date: '2025-02-14', time: '00:00', category: 'event' },
            { name: 'ホワイトデー', date: '2025-03-14', time: '00:00', category: 'event' },
            { name: 'ゴールデンウィーク', date: '2025-04-29', time: '00:00', category: 'holiday' },
            { name: '夏休み', date: '2025-07-20', time: '00:00', category: 'holiday' },
            { name: 'ハロウィン', date: '2025-10-31', time: '18:00', category: 'event' },
            { name: 'クリスマス', date: '2025-12-25', time: '00:00', category: 'holiday' },
            { name: '大晦日', date: '2025-12-31', time: '23:59', category: 'holiday' }
        ];

        function addCountdown() {
            const name = document.getElementById('eventName').value;
            const date = document.getElementById('eventDate').value;
            const time = document.getElementById('eventTime').value;
            const category = document.getElementById('eventCategory').value;
            const description = document.getElementById('eventDescription').value;

            if (!name || !date) {
                showNotification('イベント名と日付を入力してください', 'error');
                return;
            }

            const countdown = {
                id: editingCountdownId || Date.now().toString(),
                name: name,
                date: date,
                time: time,
                category: category,
                description: description,
                createdAt: new Date().toISOString()
            };

            if (editingCountdownId) {
                const index = countdowns.findIndex(c => c.id === editingCountdownId);
                countdowns[index] = countdown;
                editingCountdownId = null;
                showNotification('カウントダウンを更新しました');
            } else {
                countdowns.push(countdown);
                showNotification('カウントダウンを追加しました');
            }

            clearForm();
            saveCountdowns();
            renderCountdowns();
        }

        function editCountdown(countdownId) {
            const countdown = countdowns.find(c => c.id === countdownId);
            if (countdown) {
                editingCountdownId = countdownId;
                document.getElementById('eventName').value = countdown.name;
                document.getElementById('eventDate').value = countdown.date;
                document.getElementById('eventTime').value = countdown.time;
                document.getElementById('eventCategory').value = countdown.category;
                document.getElementById('eventDescription').value = countdown.description || '';
                
                document.querySelector('.countdown-form').scrollIntoView({ behavior: 'smooth' });
            }
        }

        function deleteCountdown(countdownId) {
            if (confirm('このカウントダウンを削除しますか？')) {
                countdowns = countdowns.filter(c => c.id !== countdownId);
                saveCountdowns();
                renderCountdowns();
                showNotification('カウントダウンを削除しました');
            }
        }

        function clearForm() {
            document.getElementById('eventName').value = '';
            document.getElementById('eventDate').value = '';
            document.getElementById('eventTime').value = '00:00';
            document.getElementById('eventCategory').value = 'personal';
            document.getElementById('eventDescription').value = '';
            editingCountdownId = null;
        }

        function renderCountdowns() {
            const countdownList = document.getElementById('countdownList');
            countdownList.innerHTML = '';

            if (countdowns.length === 0) {
                countdownList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⏰</div>
                        <p>カウントダウンがありません</p>
                        <p>上のフォームから新しいカウントダウンを作成してください</p>
                    </div>
                `;
                return;
            }

            // 日付順でソート
            const sortedCountdowns = [...countdowns].sort((a, b) => {
                const dateA = new Date(a.date + 'T' + a.time);
                const dateB = new Date(b.date + 'T' + b.time);
                return dateA - dateB;
            });

            sortedCountdowns.forEach(countdown => {
                const countdownItem = createCountdownElement(countdown);
                countdownList.appendChild(countdownItem);
            });
        }

        function createCountdownElement(countdown) {
            const targetDate = new Date(countdown.date + 'T' + countdown.time);
            const now = new Date();
            const diff = targetDate - now;
            const isExpired = diff <= 0;

            const countdownItem = document.createElement('div');
            countdownItem.className = `countdown-item ${isExpired ? 'expired' : ''}`;
            countdownItem.dataset.id = countdown.id;

            const timeRemaining = calculateTimeRemaining(diff);
            const progress = calculateProgress(countdown.createdAt, targetDate);

            countdownItem.innerHTML = `
                <div class="countdown-header">
                    <div>
                        <div class="countdown-title">${countdown.name}</div>
                        <div class="countdown-date">${targetDate.toLocaleDateString('ja-JP')} ${countdown.time}</div>
                    </div>
                    <div class="countdown-actions">
                        <button class="action-btn edit" onclick="editCountdown('${countdown.id}')" title="編集">
                            ✏️
                        </button>
                        <button class="action-btn delete" onclick="deleteCountdown('${countdown.id}')" title="削除">
                            🗑️
                        </button>
                    </div>
                </div>
                
                ${isExpired ? 
                    '<div class="expired-message">🎉 イベントが終了しました！</div>' :
                    `
                    <div class="countdown-display">
                        <div class="time-unit">
                            <div class="time-value">${timeRemaining.days}</div>
                            <div class="time-label">日</div>
                        </div>
                        <div class="time-unit">
                            <div class="time-value">${timeRemaining.hours}</div>
                            <div class="time-label">時間</div>
                        </div>
                        <div class="time-unit">
                            <div class="time-value">${timeRemaining.minutes}</div>
                            <div class="time-label">分</div>
                        </div>
                        <div class="time-unit">
                            <div class="time-value">${timeRemaining.seconds}</div>
                            <div class="time-label">秒</div>
                        </div>
                    </div>
                    
                    <div class="countdown-progress">
                        <div class="progress-label">
                            <span>進捗</span>
                            <span>${progress.toFixed(1)}%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progress}%"></div>
                        </div>
                    </div>
                    `
                }
                
                <div class="countdown-details">
                    <div class="detail-item">
                        <span>📂</span>
                        ${getCategoryText(countdown.category)}
                    </div>
                    <div class="detail-item">
                        <span>📊</span>
                        ${isExpired ? '終了' : `残り ${timeRemaining.totalDays} 日`}
                    </div>
                    ${countdown.description ? 
                        `<div class="detail-item">
                            <span>📝</span>
                            ${countdown.description}
                        </div>` : ''
                    }
                </div>
            `;

            return countdownItem;
        }

        function calculateTimeRemaining(diff) {
            if (diff <= 0) {
                return { days: 0, hours: 0, minutes: 0, seconds: 0, totalDays: 0 };
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            const totalDays = Math.ceil(diff / (1000 * 60 * 60 * 24));

            return {
                days: String(days).padStart(2, '0'),
                hours: String(hours).padStart(2, '0'),
                minutes: String(minutes).padStart(2, '0'),
                seconds: String(seconds).padStart(2, '0'),
                totalDays: totalDays
            };
        }

        function calculateProgress(createdAt, targetDate) {
            const created = new Date(createdAt);
            const now = new Date();
            const total = targetDate - created;
            const elapsed = now - created;
            
            if (elapsed >= total) return 100;
            if (elapsed <= 0) return 0;
            
            return (elapsed / total) * 100;
        }

        function getCategoryText(category) {
            const categoryMap = {
                personal: '個人',
                work: '仕事',
                holiday: '祝日',
                event: 'イベント',
                other: 'その他'
            };
            return categoryMap[category] || category;
        }

        function renderPresetEvents() {
            const presetGrid = document.getElementById('presetGrid');
            presetGrid.innerHTML = '';

            const now = new Date();
            const futurePresets = presetEvents.filter(preset => {
                const presetDate = new Date(preset.date + 'T' + preset.time);
                return presetDate > now;
            });

            futurePresets.forEach(preset => {
                const presetBtn = document.createElement('button');
                presetBtn.className = 'preset-btn';
                presetBtn.onclick = () => addPresetCountdown(preset);
                
                const presetDate = new Date(preset.date + 'T' + preset.time);
                const daysUntil = Math.ceil((presetDate - now) / (1000 * 60 * 60 * 24));
                
                presetBtn.innerHTML = `
                    <div class="preset-name">${preset.name}</div>
                    <div class="preset-date">${presetDate.toLocaleDateString('ja-JP')} (あと${daysUntil}日)</div>
                `;
                
                presetGrid.appendChild(presetBtn);
            });
        }

        function addPresetCountdown(preset) {
            document.getElementById('eventName').value = preset.name;
            document.getElementById('eventDate').value = preset.date;
            document.getElementById('eventTime').value = preset.time;
            document.getElementById('eventCategory').value = preset.category;
            document.getElementById('eventDescription').value = '';
            
            document.querySelector('.countdown-form').scrollIntoView({ behavior: 'smooth' });
        }

        function startUpdateInterval() {
            updateInterval = setInterval(() => {
                renderCountdowns();
            }, 1000);
        }

        function stopUpdateInterval() {
            if (updateInterval) {
                clearInterval(updateInterval);
            }
        }

        function exportCountdowns() {
            const exportData = {
                countdowns: countdowns,
                exportedAt: new Date().toISOString()
            };
            
            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `countdowns_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            
            showNotification('データを出力しました');
        }

        function importCountdowns() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const importData = JSON.parse(e.target.result);
                            if (importData.countdowns && Array.isArray(importData.countdowns)) {
                                countdowns = [...countdowns, ...importData.countdowns];
                                saveCountdowns();
                                renderCountdowns();
                                showNotification(`${importData.countdowns.length}件のカウントダウンを読み込みました`);
                            } else {
                                showNotification('無効なファイル形式です', 'error');
                            }
                        } catch (error) {
                            showNotification('ファイルの読み込みに失敗しました', 'error');
                        }
                    };
                    reader.readAsText(file);
                }
            };
            input.click();
        }

        function clearAllCountdowns() {
            if (confirm('すべてのカウントダウンを削除しますか？')) {
                countdowns = [];
                saveCountdowns();
                renderCountdowns();
                showNotification('すべてのカウントダウンを削除しました');
            }
        }

        function saveCountdowns() {
            localStorage.setItem('countdowns', JSON.stringify(countdowns));
        }

        function loadCountdowns() {
            const saved = localStorage.getItem('countdowns');
            if (saved) {
                countdowns = JSON.parse(saved);
            }
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            const notificationMessage = document.getElementById('notificationMessage');
            
            notificationMessage.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // 初期化
        function init() {
            loadCountdowns();
            renderCountdowns();
            renderPresetEvents();
            startUpdateInterval();
            
            // 今日の日付を初期値として設定
            const today = new Date();
            document.getElementById('eventDate').value = today.toISOString().split('T')[0];
        }

        // ページ読み込み時の初期化
        document.addEventListener('DOMContentLoaded', init);
        
        // ページを離れる時にインターバルをクリア
        window.addEventListener('beforeunload', stopUpdateInterval);
    </script>
</body>
</html>
