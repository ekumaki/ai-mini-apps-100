<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日数計算 - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .date-calculator {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 800px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .calculator-modes {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .mode-btn {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .mode-btn:hover:not(.active) {
            background: #e9ecef;
        }

        .calculator-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
            display: none;
        }

        .calculator-section.active {
            display: block;
        }

        .section-title {
            color: #333;
            font-size: 1.3rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .input-control {
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .input-control:focus {
            outline: none;
            border-color: #667eea;
        }

        .calculate-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }

        .calculate-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .result-section {
            background: #e8f5e8;
            border: 1px solid #c3e6cb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .result-title {
            color: #155724;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .result-item {
            background: white;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .result-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #155724;
            margin-bottom: 5px;
        }

        .result-label {
            color: #666;
            font-size: 0.9rem;
        }

        .examples {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .examples-title {
            color: #856404;
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .examples-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .example-item {
            background: white;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .example-item:hover {
            background: #ffeaa7;
        }

        .example-title {
            font-weight: 600;
            color: #856404;
            margin-bottom: 8px;
        }

        .example-description {
            color: #666;
            font-size: 0.9rem;
        }

        .quick-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: #5a6fd8;
        }

        .action-btn.secondary {
            background: #6c757d;
        }

        .action-btn.secondary:hover {
            background: #5a6268;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            background: #dc3545;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .date-calculator {
                padding: 20px;
            }
            
            .calculator-modes {
                flex-direction: column;
                align-items: center;
            }
            
            .input-grid {
                grid-template-columns: 1fr;
            }
            
            .examples-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="date-calculator">
        <div class="header">
            <h1>日数計算</h1>
            <p>2つの日付間の日数を計算</p>
        </div>

        <div class="calculator-modes">
            <button class="mode-btn active" onclick="setMode('difference')">日数の差を計算</button>
            <button class="mode-btn" onclick="setMode('add')">日付に日数を加算</button>
            <button class="mode-btn" onclick="setMode('subtract')">日付から日数を減算</button>
        </div>

        <div class="calculator-section active" id="difference">
            <div class="section-title">日数の差を計算</div>
            <div class="input-grid">
                <div class="input-group">
                    <label for="startDate">開始日</label>
                    <input type="date" id="startDate" class="input-control" required>
                </div>
                <div class="input-group">
                    <label for="endDate">終了日</label>
                    <input type="date" id="endDate" class="input-control" required>
                </div>
                <div class="input-group">
                    <label for="includeEndDate">終了日を含む</label>
                    <select id="includeEndDate" class="input-control">
                        <option value="false">含まない</option>
                        <option value="true">含む</option>
                    </select>
                </div>
            </div>
            <button class="calculate-btn" onclick="calculateDifference()">計算</button>
        </div>

        <div class="calculator-section" id="add">
            <div class="section-title">日付に日数を加算</div>
            <div class="input-grid">
                <div class="input-group">
                    <label for="baseDate">基準日</label>
                    <input type="date" id="baseDate" class="input-control" required>
                </div>
                <div class="input-group">
                    <label for="addDays">加算する日数</label>
                    <input type="number" id="addDays" class="input-control" min="0" value="0">
                </div>
                <div class="input-group">
                    <label for="addWeeks">加算する週数</label>
                    <input type="number" id="addWeeks" class="input-control" min="0" value="0">
                </div>
                <div class="input-group">
                    <label for="addMonths">加算する月数</label>
                    <input type="number" id="addMonths" class="input-control" min="0" value="0">
                </div>
                <div class="input-group">
                    <label for="addYears">加算する年数</label>
                    <input type="number" id="addYears" class="input-control" min="0" value="0">
                </div>
            </div>
            <button class="calculate-btn" onclick="calculateAdd()">計算</button>
        </div>

        <div class="calculator-section" id="subtract">
            <div class="section-title">日付から日数を減算</div>
            <div class="input-grid">
                <div class="input-group">
                    <label for="baseDate2">基準日</label>
                    <input type="date" id="baseDate2" class="input-control" required>
                </div>
                <div class="input-group">
                    <label for="subtractDays">減算する日数</label>
                    <input type="number" id="subtractDays" class="input-control" min="0" value="0">
                </div>
                <div class="input-group">
                    <label for="subtractWeeks">減算する週数</label>
                    <input type="number" id="subtractWeeks" class="input-control" min="0" value="0">
                </div>
                <div class="input-group">
                    <label for="subtractMonths">減算する月数</label>
                    <input type="number" id="subtractMonths" class="input-control" min="0" value="0">
                </div>
                <div class="input-group">
                    <label for="subtractYears">減算する年数</label>
                    <input type="number" id="subtractYears" class="input-control" min="0" value="0">
                </div>
            </div>
            <button class="calculate-btn" onclick="calculateSubtract()">計算</button>
        </div>

        <div class="result-section" id="resultSection" style="display: none;">
            <div class="result-title">計算結果</div>
            <div class="result-grid" id="resultGrid">
                <!-- 結果がここに表示されます -->
            </div>
        </div>

        <div class="examples">
            <div class="examples-title">よく使われる計算例</div>
            <div class="examples-grid">
                <div class="example-item" onclick="loadExample('birthday')">
                    <div class="example-title">誕生日まで</div>
                    <div class="example-description">次の誕生日までの日数を計算</div>
                </div>
                <div class="example-item" onclick="loadExample('vacation')">
                    <div class="example-title">休暇期間</div>
                    <div class="example-description">休暇の期間を計算</div>
                </div>
                <div class="example-item" onclick="loadExample('project')">
                    <div class="example-title">プロジェクト期間</div>
                    <div class="example-description">プロジェクトの所要日数を計算</div>
                </div>
                <div class="example-item" onclick="loadExample('age')">
                    <div class="example-title">年齢計算</div>
                    <div class="example-description">生年月日から年齢を計算</div>
                </div>
            </div>
        </div>

        <div class="quick-actions">
            <button class="action-btn" onclick="setToday()">今日を設定</button>
            <button class="action-btn" onclick="clearAll()">クリア</button>
            <button class="action-btn secondary" onclick="exportResult()">結果出力</button>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <div class="notification" id="notification">
        <div id="notificationMessage"></div>
    </div>

    <script>
        let currentMode = 'difference';
        let lastResult = null;

        function setMode(mode) {
            currentMode = mode;
            
            // ボタンの状態を更新
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // セクションの表示を切り替え
            document.querySelectorAll('.calculator-section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(mode).classList.add('active');
            
            // 結果セクションを非表示
            document.getElementById('resultSection').style.display = 'none';
        }

        function calculateDifference() {
            const startDate = new Date(document.getElementById('startDate').value);
            const endDate = new Date(document.getElementById('endDate').value);
            const includeEndDate = document.getElementById('includeEndDate').value === 'true';
            
            if (!document.getElementById('startDate').value || !document.getElementById('endDate').value) {
                showNotification('開始日と終了日を入力してください', 'error');
                return;
            }
            
            // 日数の差を計算
            const timeDiff = endDate - startDate;
            let daysDiff = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
            
            if (includeEndDate) {
                daysDiff += 1;
            }
            
            // 詳細な計算
            const years = Math.floor(daysDiff / 365);
            const months = Math.floor((daysDiff % 365) / 30);
            const days = daysDiff % 30;
            
            const weeks = Math.floor(daysDiff / 7);
            const remainingDays = daysDiff % 7;
            
            const hours = daysDiff * 24;
            const minutes = hours * 60;
            const seconds = minutes * 60;
            
            lastResult = {
                type: 'difference',
                startDate: startDate.toLocaleDateString('ja-JP'),
                endDate: endDate.toLocaleDateString('ja-JP'),
                totalDays: daysDiff,
                years: years,
                months: months,
                days: days,
                weeks: weeks,
                remainingDays: remainingDays,
                hours: hours,
                minutes: minutes,
                seconds: seconds
            };
            
            displayResult([
                { label: '総日数', value: `${daysDiff}日` },
                { label: '年月日', value: `${years}年${months}ヶ月${days}日` },
                { label: '週と日', value: `${weeks}週間${remainingDays}日` },
                { label: '時間', value: `${hours.toLocaleString()}時間` },
                { label: '分', value: `${minutes.toLocaleString()}分` },
                { label: '秒', value: `${seconds.toLocaleString()}秒` }
            ]);
            
            showNotification('日数の差を計算しました');
        }

        function calculateAdd() {
            const baseDate = new Date(document.getElementById('baseDate').value);
            const addDays = parseInt(document.getElementById('addDays').value) || 0;
            const addWeeks = parseInt(document.getElementById('addWeeks').value) || 0;
            const addMonths = parseInt(document.getElementById('addMonths').value) || 0;
            const addYears = parseInt(document.getElementById('addYears').value) || 0;
            
            if (!document.getElementById('baseDate').value) {
                showNotification('基準日を入力してください', 'error');
                return;
            }
            
            const resultDate = new Date(baseDate);
            resultDate.setDate(resultDate.getDate() + addDays + (addWeeks * 7));
            resultDate.setMonth(resultDate.getMonth() + addMonths);
            resultDate.setFullYear(resultDate.getFullYear() + addYears);
            
            const totalDaysAdded = addDays + (addWeeks * 7) + (addMonths * 30) + (addYears * 365);
            
            lastResult = {
                type: 'add',
                baseDate: baseDate.toLocaleDateString('ja-JP'),
                resultDate: resultDate.toLocaleDateString('ja-JP'),
                addDays: addDays,
                addWeeks: addWeeks,
                addMonths: addMonths,
                addYears: addYears,
                totalDaysAdded: totalDaysAdded
            };
            
            displayResult([
                { label: '結果の日付', value: resultDate.toLocaleDateString('ja-JP') },
                { label: '曜日', value: resultDate.toLocaleDateString('ja-JP', { weekday: 'long' }) },
                { label: '加算した日数', value: `${addDays}日` },
                { label: '加算した週数', value: `${addWeeks}週間` },
                { label: '加算した月数', value: `${addMonths}ヶ月` },
                { label: '加算した年数', value: `${addYears}年` }
            ]);
            
            showNotification('日付に日数を加算しました');
        }

        function calculateSubtract() {
            const baseDate = new Date(document.getElementById('baseDate2').value);
            const subtractDays = parseInt(document.getElementById('subtractDays').value) || 0;
            const subtractWeeks = parseInt(document.getElementById('subtractWeeks').value) || 0;
            const subtractMonths = parseInt(document.getElementById('subtractMonths').value) || 0;
            const subtractYears = parseInt(document.getElementById('subtractYears').value) || 0;
            
            if (!document.getElementById('baseDate2').value) {
                showNotification('基準日を入力してください', 'error');
                return;
            }
            
            const resultDate = new Date(baseDate);
            resultDate.setDate(resultDate.getDate() - subtractDays - (subtractWeeks * 7));
            resultDate.setMonth(resultDate.getMonth() - subtractMonths);
            resultDate.setFullYear(resultDate.getFullYear() - subtractYears);
            
            const totalDaysSubtracted = subtractDays + (subtractWeeks * 7) + (subtractMonths * 30) + (subtractYears * 365);
            
            lastResult = {
                type: 'subtract',
                baseDate: baseDate.toLocaleDateString('ja-JP'),
                resultDate: resultDate.toLocaleDateString('ja-JP'),
                subtractDays: subtractDays,
                subtractWeeks: subtractWeeks,
                subtractMonths: subtractMonths,
                subtractYears: subtractYears,
                totalDaysSubtracted: totalDaysSubtracted
            };
            
            displayResult([
                { label: '結果の日付', value: resultDate.toLocaleDateString('ja-JP') },
                { label: '曜日', value: resultDate.toLocaleDateString('ja-JP', { weekday: 'long' }) },
                { label: '減算した日数', value: `${subtractDays}日` },
                { label: '減算した週数', value: `${subtractWeeks}週間` },
                { label: '減算した月数', value: `${subtractMonths}ヶ月` },
                { label: '減算した年数', value: `${subtractYears}年` }
            ]);
            
            showNotification('日付から日数を減算しました');
        }

        function displayResult(results) {
            const resultSection = document.getElementById('resultSection');
            const resultGrid = document.getElementById('resultGrid');
            
            resultGrid.innerHTML = '';
            
            results.forEach(result => {
                const resultItem = document.createElement('div');
                resultItem.className = 'result-item';
                resultItem.innerHTML = `
                    <div class="result-value">${result.value}</div>
                    <div class="result-label">${result.label}</div>
                `;
                resultGrid.appendChild(resultItem);
            });
            
            resultSection.style.display = 'block';
        }

        function loadExample(type) {
            const today = new Date();
            const examples = {
                birthday: () => {
                    setMode('difference');
                    document.getElementById('startDate').value = today.toISOString().split('T')[0];
                    // 次の誕生日（例：6月15日）
                    const nextBirthday = new Date(today.getFullYear(), 5, 15);
                    if (nextBirthday < today) {
                        nextBirthday.setFullYear(today.getFullYear() + 1);
                    }
                    document.getElementById('endDate').value = nextBirthday.toISOString().split('T')[0];
                    calculateDifference();
                },
                vacation: () => {
                    setMode('difference');
                    // 来月の初日から10日間
                    const vacationStart = new Date(today.getFullYear(), today.getMonth() + 1, 1);
                    const vacationEnd = new Date(vacationStart);
                    vacationEnd.setDate(vacationStart.getDate() + 9);
                    document.getElementById('startDate').value = vacationStart.toISOString().split('T')[0];
                    document.getElementById('endDate').value = vacationEnd.toISOString().split('T')[0];
                    calculateDifference();
                },
                project: () => {
                    setMode('add');
                    document.getElementById('baseDate').value = today.toISOString().split('T')[0];
                    document.getElementById('addDays').value = '30';
                    document.getElementById('addWeeks').value = '0';
                    document.getElementById('addMonths').value = '2';
                    document.getElementById('addYears').value = '0';
                    calculateAdd();
                },
                age: () => {
                    setMode('difference');
                    // 1990年1月1日生まれの例
                    document.getElementById('startDate').value = '1990-01-01';
                    document.getElementById('endDate').value = today.toISOString().split('T')[0];
                    calculateDifference();
                }
            };
            
            if (examples[type]) {
                examples[type]();
            }
        }

        function setToday() {
            const today = new Date().toISOString().split('T')[0];
            
            if (currentMode === 'difference') {
                document.getElementById('startDate').value = today;
                document.getElementById('endDate').value = today;
            } else if (currentMode === 'add') {
                document.getElementById('baseDate').value = today;
            } else if (currentMode === 'subtract') {
                document.getElementById('baseDate2').value = today;
            }
            
            showNotification('今日の日付を設定しました');
        }

        function clearAll() {
            document.querySelectorAll('input[type="date"], input[type="number"]').forEach(input => {
                input.value = '';
            });
            
            document.querySelectorAll('select').forEach(select => {
                select.selectedIndex = 0;
            });
            
            document.getElementById('resultSection').style.display = 'none';
            lastResult = null;
            
            showNotification('全てクリアしました');
        }

        function exportResult() {
            if (!lastResult) {
                showNotification('計算結果がありません', 'error');
                return;
            }
            
            let exportText = '日数計算結果\n';
            exportText += `計算日時: ${new Date().toLocaleString('ja-JP')}\n\n`;
            
            if (lastResult.type === 'difference') {
                exportText += `開始日: ${lastResult.startDate}\n`;
                exportText += `終了日: ${lastResult.endDate}\n`;
                exportText += `総日数: ${lastResult.totalDays}日\n`;
                exportText += `年月日: ${lastResult.years}年${lastResult.months}ヶ月${lastResult.days}日\n`;
                exportText += `週と日: ${lastResult.weeks}週間${lastResult.remainingDays}日\n`;
                exportText += `時間: ${lastResult.hours.toLocaleString()}時間\n`;
                exportText += `分: ${lastResult.minutes.toLocaleString()}分\n`;
                exportText += `秒: ${lastResult.seconds.toLocaleString()}秒\n`;
            } else if (lastResult.type === 'add') {
                exportText += `基準日: ${lastResult.baseDate}\n`;
                exportText += `結果の日付: ${lastResult.resultDate}\n`;
                exportText += `加算した日数: ${lastResult.addDays}日\n`;
                exportText += `加算した週数: ${lastResult.addWeeks}週間\n`;
                exportText += `加算した月数: ${lastResult.addMonths}ヶ月\n`;
                exportText += `加算した年数: ${lastResult.addYears}年\n`;
            } else if (lastResult.type === 'subtract') {
                exportText += `基準日: ${lastResult.baseDate}\n`;
                exportText += `結果の日付: ${lastResult.resultDate}\n`;
                exportText += `減算した日数: ${lastResult.subtractDays}日\n`;
                exportText += `減算した週数: ${lastResult.subtractWeeks}週間\n`;
                exportText += `減算した月数: ${lastResult.subtractMonths}ヶ月\n`;
                exportText += `減算した年数: ${lastResult.subtractYears}年\n`;
            }
            
            const blob = new Blob([exportText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `date_calculation_${Date.now()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            
            showNotification('結果を出力しました');
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            const notificationMessage = document.getElementById('notificationMessage');
            
            notificationMessage.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // 初期化
        function init() {
            // 今日の日付を初期値として設定
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('startDate').value = today;
            document.getElementById('endDate').value = today;
            document.getElementById('baseDate').value = today;
            document.getElementById('baseDate2').value = today;
        }

        // ページ読み込み時の初期化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
