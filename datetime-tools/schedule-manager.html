<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スケジュール管理 - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .schedule-manager {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 1400px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .view-modes {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .view-btn {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .view-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .view-btn:hover:not(.active) {
            background: #e9ecef;
        }

        .calendar-container {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            display: none;
        }

        .calendar-container.active {
            display: block;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
        }

        .calendar-nav {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: #5a6fd8;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: #e9ecef;
            border-radius: 8px;
            overflow: hidden;
        }

        .calendar-day-header {
            background: #667eea;
            color: white;
            padding: 10px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .calendar-day {
            background: white;
            min-height: 80px;
            padding: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .calendar-day:hover {
            background: #f8f9fa;
        }

        .calendar-day.today {
            background: #e8f5e8;
        }

        .calendar-day.other-month {
            background: #f8f9fa;
            color: #999;
        }

        .day-number {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .day-events {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .event-item {
            background: #667eea;
            color: white;
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .event-item:hover {
            background: #5a6fd8;
        }

        .event-item.priority-high {
            background: #dc3545;
        }

        .event-item.priority-medium {
            background: #ffc107;
            color: #212529;
        }

        .event-item.priority-low {
            background: #28a745;
        }

        .list-container {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            display: none;
        }

        .list-container.active {
            display: block;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .list-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
        }

        .filter-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filter-select {
            padding: 6px 12px;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .event-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .event-card {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .event-card:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .event-card.priority-high {
            border-left: 4px solid #dc3545;
        }

        .event-card.priority-medium {
            border-left: 4px solid #ffc107;
        }

        .event-card.priority-low {
            border-left: 4px solid #28a745;
        }

        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .event-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
        }

        .event-priority {
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .priority-high {
            background: #dc3545;
            color: white;
        }

        .priority-medium {
            background: #ffc107;
            color: #212529;
        }

        .priority-low {
            background: #28a745;
            color: white;
        }

        .event-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }

        .event-detail {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #666;
            font-size: 0.9rem;
        }

        .event-description {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .event-actions {
            display: flex;
            gap: 5px;
        }

        .event-action-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .event-action-btn:hover {
            background: #5a6fd8;
        }

        .event-action-btn.edit {
            background: #28a745;
        }

        .event-action-btn.edit:hover {
            background: #218838;
        }

        .event-action-btn.delete {
            background: #dc3545;
        }

        .event-action-btn.delete:hover {
            background: #c82333;
        }

        .event-form {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .form-title {
            color: #333;
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .form-control {
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .form-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .form-btn.primary {
            background: #667eea;
            color: white;
        }

        .form-btn.primary:hover {
            background: #5a6fd8;
        }

        .form-btn.secondary {
            background: #6c757d;
            color: white;
        }

        .form-btn.secondary:hover {
            background: #5a6268;
        }

        .quick-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .quick-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .quick-btn:hover {
            background: #5a6fd8;
        }

        .quick-btn.secondary {
            background: #6c757d;
        }

        .quick-btn.secondary:hover {
            background: #5a6268;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: white;
            border-radius: 10px;
            padding: 20px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            background: #dc3545;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .schedule-manager {
                padding: 20px;
            }
            
            .calendar-grid {
                grid-template-columns: repeat(7, 1fr);
            }
            
            .calendar-day {
                min-height: 60px;
                padding: 4px;
            }
            
            .event-details {
                grid-template-columns: 1fr;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="schedule-manager">
        <div class="header">
            <h1>スケジュール管理</h1>
            <p>予定を管理・表示するツール</p>
        </div>

        <div class="view-modes">
            <button class="view-btn active" onclick="setView('calendar')">カレンダー表示</button>
            <button class="view-btn" onclick="setView('list')">リスト表示</button>
        </div>

        <div class="calendar-container active" id="calendarContainer">
            <div class="calendar-header">
                <div class="calendar-title" id="calendarTitle">2024年1月</div>
                <div class="calendar-nav">
                    <button class="nav-btn" onclick="navigateMonth(-1)">前月</button>
                    <button class="nav-btn" onclick="navigateMonth(1)">次月</button>
                    <button class="nav-btn" onclick="goToToday()">今日</button>
                </div>
            </div>
            <div class="calendar-grid" id="calendarGrid">
                <!-- カレンダーがここに表示されます -->
            </div>
        </div>

        <div class="list-container" id="listContainer">
            <div class="list-header">
                <div class="list-title">予定一覧</div>
                <div class="filter-controls">
                    <select id="priorityFilter" class="filter-select" onchange="filterEvents()">
                        <option value="">すべて</option>
                        <option value="high">高</option>
                        <option value="medium">中</option>
                        <option value="low">低</option>
                    </select>
                    <select id="statusFilter" class="filter-select" onchange="filterEvents()">
                        <option value="">すべて</option>
                        <option value="upcoming">予定</option>
                        <option value="completed">完了</option>
                        <option value="cancelled">キャンセル</option>
                    </select>
                </div>
            </div>
            <div class="event-list" id="eventList">
                <!-- 予定リストがここに表示されます -->
            </div>
        </div>

        <div class="event-form">
            <div class="form-title">予定を追加</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="eventTitle">タイトル</label>
                    <input type="text" id="eventTitle" class="form-control" placeholder="予定のタイトル" required>
                </div>
                <div class="form-group">
                    <label for="eventDate">日付</label>
                    <input type="date" id="eventDate" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="eventTime">時刻</label>
                    <input type="time" id="eventTime" class="form-control">
                </div>
                <div class="form-group">
                    <label for="eventPriority">優先度</label>
                    <select id="eventPriority" class="form-control">
                        <option value="medium">中</option>
                        <option value="high">高</option>
                        <option value="low">低</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="eventCategory">カテゴリ</label>
                    <select id="eventCategory" class="form-control">
                        <option value="work">仕事</option>
                        <option value="personal">個人</option>
                        <option value="meeting">会議</option>
                        <option value="event">イベント</option>
                        <option value="other">その他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="eventDescription">詳細</label>
                    <textarea id="eventDescription" class="form-control" placeholder="予定の詳細" rows="3"></textarea>
                </div>
            </div>
            <div class="form-actions">
                <button class="form-btn primary" onclick="addEvent()">予定を追加</button>
                <button class="form-btn secondary" onclick="clearForm()">クリア</button>
            </div>
        </div>

        <div class="quick-actions">
            <button class="quick-btn" onclick="exportSchedule()">予定出力</button>
            <button class="quick-btn" onclick="importSchedule()">予定読込</button>
            <button class="quick-btn secondary" onclick="clearAllEvents()">全削除</button>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <div class="modal" id="eventModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">予定詳細</div>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalContent">
                <!-- モーダルコンテンツがここに表示されます -->
            </div>
        </div>
    </div>

    <div class="notification" id="notification">
        <div id="notificationMessage"></div>
    </div>

    <script>
        let currentDate = new Date();
        let currentView = 'calendar';
        let events = [];
        let editingEventId = null;

        const daysOfWeek = ['日', '月', '火', '水', '木', '金', '土'];
        const months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];

        function setView(view) {
            currentView = view;
            
            // ボタンの状態を更新
            document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // コンテナの表示を切り替え
            document.getElementById('calendarContainer').classList.toggle('active', view === 'calendar');
            document.getElementById('listContainer').classList.toggle('active', view === 'list');
            
            if (view === 'calendar') {
                renderCalendar();
            } else {
                renderEventList();
            }
        }

        function navigateMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        function goToToday() {
            currentDate = new Date();
            renderCalendar();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const today = new Date();
            
            // カレンダータイトルを更新
            document.getElementById('calendarTitle').textContent = `${year}年${months[month]}`;
            
            // カレンダーグリッドをクリア
            const calendarGrid = document.getElementById('calendarGrid');
            calendarGrid.innerHTML = '';
            
            // 曜日ヘッダーを追加
            daysOfWeek.forEach(day => {
                const dayHeader = document.createElement('div');
                dayHeader.className = 'calendar-day-header';
                dayHeader.textContent = day;
                calendarGrid.appendChild(dayHeader);
            });
            
            // 月の最初の日と最後の日を取得
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDate = new Date(firstDay);
            startDate.setDate(startDate.getDate() - firstDay.getDay());
            
            // カレンダーの日付を生成
            for (let i = 0; i < 42; i++) {
                const date = new Date(startDate);
                date.setDate(startDate.getDate() + i);
                
                const dayElement = document.createElement('div');
                dayElement.className = 'calendar-day';
                
                // 今日の日付をハイライト
                if (date.toDateString() === today.toDateString()) {
                    dayElement.classList.add('today');
                }
                
                // 他の月の日付をグレーアウト
                if (date.getMonth() !== month) {
                    dayElement.classList.add('other-month');
                }
                
                dayElement.onclick = () => openDayModal(date);
                
                const dayNumber = document.createElement('div');
                dayNumber.className = 'day-number';
                dayNumber.textContent = date.getDate();
                dayElement.appendChild(dayNumber);
                
                const dayEvents = document.createElement('div');
                dayEvents.className = 'day-events';
                
                // その日の予定を表示
                const dayEventList = getEventsForDate(date);
                dayEventList.forEach(event => {
                    const eventElement = document.createElement('div');
                    eventElement.className = `event-item priority-${event.priority}`;
                    eventElement.textContent = event.title;
                    eventElement.onclick = (e) => {
                        e.stopPropagation();
                        openEventModal(event);
                    };
                    dayEvents.appendChild(eventElement);
                });
                
                dayElement.appendChild(dayEvents);
                calendarGrid.appendChild(dayElement);
            }
        }

        function renderEventList() {
            const eventList = document.getElementById('eventList');
            eventList.innerHTML = '';
            
            let filteredEvents = events;
            
            // フィルタリング
            const priorityFilter = document.getElementById('priorityFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;
            
            if (priorityFilter) {
                filteredEvents = filteredEvents.filter(event => event.priority === priorityFilter);
            }
            
            if (statusFilter) {
                filteredEvents = filteredEvents.filter(event => event.status === statusFilter);
            }
            
            // 日付順でソート
            filteredEvents.sort((a, b) => new Date(a.date) - new Date(b.date));
            
            if (filteredEvents.length === 0) {
                eventList.innerHTML = '<div style="text-align: center; color: #666; padding: 20px;">予定がありません</div>';
                return;
            }
            
            filteredEvents.forEach(event => {
                const eventCard = document.createElement('div');
                eventCard.className = `event-card priority-${event.priority}`;
                eventCard.onclick = () => openEventModal(event);
                
                const eventDate = new Date(event.date);
                const dateString = eventDate.toLocaleDateString('ja-JP');
                const timeString = event.time ? event.time : '';
                
                eventCard.innerHTML = `
                    <div class="event-header">
                        <div class="event-title">${event.title}</div>
                        <div class="event-priority priority-${event.priority}">${getPriorityText(event.priority)}</div>
                    </div>
                    <div class="event-details">
                        <div class="event-detail">📅 ${dateString}</div>
                        <div class="event-detail">🕒 ${timeString || '時刻未設定'}</div>
                        <div class="event-detail">📂 ${getCategoryText(event.category)}</div>
                    </div>
                    <div class="event-description">${event.description || '詳細なし'}</div>
                    <div class="event-actions">
                        <button class="event-action-btn edit" onclick="editEvent(event, '${event.id}')">編集</button>
                        <button class="event-action-btn delete" onclick="deleteEvent(event, '${event.id}')">削除</button>
                    </div>
                `;
                
                eventList.appendChild(eventCard);
            });
        }

        function getEventsForDate(date) {
            const dateString = date.toDateString();
            return events.filter(event => new Date(event.date).toDateString() === dateString);
        }

        function addEvent() {
            const title = document.getElementById('eventTitle').value;
            const date = document.getElementById('eventDate').value;
            const time = document.getElementById('eventTime').value;
            const priority = document.getElementById('eventPriority').value;
            const category = document.getElementById('eventCategory').value;
            const description = document.getElementById('eventDescription').value;
            
            if (!title || !date) {
                showNotification('タイトルと日付を入力してください', 'error');
                return;
            }
            
            const event = {
                id: editingEventId || Date.now().toString(),
                title: title,
                date: date,
                time: time,
                priority: priority,
                category: category,
                description: description,
                status: 'upcoming',
                createdAt: new Date().toISOString()
            };
            
            if (editingEventId) {
                const index = events.findIndex(e => e.id === editingEventId);
                events[index] = event;
                editingEventId = null;
                showNotification('予定を更新しました');
            } else {
                events.push(event);
                showNotification('予定を追加しました');
            }
            
            clearForm();
            saveEvents();
            
            if (currentView === 'calendar') {
                renderCalendar();
            } else {
                renderEventList();
            }
        }

        function editEvent(e, eventId) {
            e.stopPropagation();
            const event = events.find(e => e.id === eventId);
            if (event) {
                editingEventId = eventId;
                document.getElementById('eventTitle').value = event.title;
                document.getElementById('eventDate').value = event.date;
                document.getElementById('eventTime').value = event.time || '';
                document.getElementById('eventPriority').value = event.priority;
                document.getElementById('eventCategory').value = event.category;
                document.getElementById('eventDescription').value = event.description || '';
                
                // フォームまでスクロール
                document.querySelector('.event-form').scrollIntoView({ behavior: 'smooth' });
            }
        }

        function deleteEvent(e, eventId) {
            e.stopPropagation();
            if (confirm('この予定を削除しますか？')) {
                events = events.filter(event => event.id !== eventId);
                saveEvents();
                
                if (currentView === 'calendar') {
                    renderCalendar();
                } else {
                    renderEventList();
                }
                
                showNotification('予定を削除しました');
            }
        }

        function clearForm() {
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventDate').value = '';
            document.getElementById('eventTime').value = '';
            document.getElementById('eventPriority').value = 'medium';
            document.getElementById('eventCategory').value = 'work';
            document.getElementById('eventDescription').value = '';
            editingEventId = null;
        }

        function openDayModal(date) {
            const dateString = date.toLocaleDateString('ja-JP');
            const dayEvents = getEventsForDate(date);
            
            document.getElementById('eventDate').value = date.toISOString().split('T')[0];
            
            // フォームまでスクロール
            document.querySelector('.event-form').scrollIntoView({ behavior: 'smooth' });
            
            showNotification(`${dateString}の予定を作成します`);
        }

        function openEventModal(event) {
            const modal = document.getElementById('eventModal');
            const modalContent = document.getElementById('modalContent');
            
            const eventDate = new Date(event.date);
            const dateString = eventDate.toLocaleDateString('ja-JP');
            const timeString = event.time ? event.time : '時刻未設定';
            
            modalContent.innerHTML = `
                <div class="event-details">
                    <div class="event-detail"><strong>タイトル:</strong> ${event.title}</div>
                    <div class="event-detail"><strong>日付:</strong> ${dateString}</div>
                    <div class="event-detail"><strong>時刻:</strong> ${timeString}</div>
                    <div class="event-detail"><strong>優先度:</strong> ${getPriorityText(event.priority)}</div>
                    <div class="event-detail"><strong>カテゴリ:</strong> ${getCategoryText(event.category)}</div>
                    <div class="event-detail"><strong>詳細:</strong> ${event.description || '詳細なし'}</div>
                </div>
                <div class="form-actions">
                    <button class="form-btn primary" onclick="editEventFromModal('${event.id}')">編集</button>
                    <button class="form-btn secondary" onclick="deleteEventFromModal('${event.id}')">削除</button>
                </div>
            `;
            
            modal.classList.add('show');
        }

        function editEventFromModal(eventId) {
            closeModal();
            const event = events.find(e => e.id === eventId);
            if (event) {
                editingEventId = eventId;
                document.getElementById('eventTitle').value = event.title;
                document.getElementById('eventDate').value = event.date;
                document.getElementById('eventTime').value = event.time || '';
                document.getElementById('eventPriority').value = event.priority;
                document.getElementById('eventCategory').value = event.category;
                document.getElementById('eventDescription').value = event.description || '';
                
                // フォームまでスクロール
                document.querySelector('.event-form').scrollIntoView({ behavior: 'smooth' });
            }
        }

        function deleteEventFromModal(eventId) {
            if (confirm('この予定を削除しますか？')) {
                events = events.filter(event => event.id !== eventId);
                saveEvents();
                
                if (currentView === 'calendar') {
                    renderCalendar();
                } else {
                    renderEventList();
                }
                
                showNotification('予定を削除しました');
                closeModal();
            }
        }

        function closeModal() {
            document.getElementById('eventModal').classList.remove('show');
        }

        function filterEvents() {
            renderEventList();
        }

        function exportSchedule() {
            const exportData = {
                events: events,
                exportedAt: new Date().toISOString()
            };
            
            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `schedule_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            
            showNotification('予定を出力しました');
        }

        function importSchedule() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const importData = JSON.parse(e.target.result);
                            if (importData.events && Array.isArray(importData.events)) {
                                events = [...events, ...importData.events];
                                saveEvents();
                                
                                if (currentView === 'calendar') {
                                    renderCalendar();
                                } else {
                                    renderEventList();
                                }
                                
                                showNotification(`${importData.events.length}件の予定を読み込みました`);
                            } else {
                                showNotification('無効なファイル形式です', 'error');
                            }
                        } catch (error) {
                            showNotification('ファイルの読み込みに失敗しました', 'error');
                        }
                    };
                    reader.readAsText(file);
                }
            };
            input.click();
        }

        function clearAllEvents() {
            if (confirm('すべての予定を削除しますか？')) {
                events = [];
                saveEvents();
                
                if (currentView === 'calendar') {
                    renderCalendar();
                } else {
                    renderEventList();
                }
                
                showNotification('すべての予定を削除しました');
            }
        }

        function getPriorityText(priority) {
            const priorityMap = {
                high: '高',
                medium: '中',
                low: '低'
            };
            return priorityMap[priority] || priority;
        }

        function getCategoryText(category) {
            const categoryMap = {
                work: '仕事',
                personal: '個人',
                meeting: '会議',
                event: 'イベント',
                other: 'その他'
            };
            return categoryMap[category] || category;
        }

        function saveEvents() {
            localStorage.setItem('scheduleEvents', JSON.stringify(events));
        }

        function loadEvents() {
            const saved = localStorage.getItem('scheduleEvents');
            if (saved) {
                events = JSON.parse(saved);
            }
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            const notificationMessage = document.getElementById('notificationMessage');
            
            notificationMessage.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // 初期化
        function init() {
            loadEvents();
            renderCalendar();
            
            // 今日の日付を初期値として設定
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('eventDate').value = today;
            
            // モーダルの外側クリックで閉じる
            document.getElementById('eventModal').addEventListener('click', (e) => {
                if (e.target.id === 'eventModal') {
                    closeModal();
                }
            });
        }

        // ページ読み込み時の初期化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
