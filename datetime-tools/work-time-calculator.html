<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤務時間計算 - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .work-time-calculator {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .calculator-modes {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .mode-btn {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .mode-btn:hover:not(.active) {
            background: #e9ecef;
        }

        .calculator-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
            display: none;
        }

        .calculator-section.active {
            display: block;
        }

        .section-title {
            color: #333;
            font-size: 1.3rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .input-control {
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .input-control:focus {
            outline: none;
            border-color: #667eea;
        }

        .calculate-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }

        .calculate-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .result-section {
            background: #e8f5e8;
            border: 1px solid #c3e6cb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .result-title {
            color: #155724;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .result-item {
            background: white;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .result-value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #155724;
            margin-bottom: 5px;
        }

        .result-label {
            color: #666;
            font-size: 0.9rem;
        }

        .weekly-summary {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            display: none;
        }

        .weekly-summary.show {
            display: block;
        }

        .weekly-title {
            color: #856404;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .day-entry {
            display: grid;
            grid-template-columns: 1fr 2fr 2fr 2fr 2fr;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
            padding: 10px;
            background: white;
            border-radius: 8px;
            border: 1px solid #ffeaa7;
        }

        .day-entry:hover {
            background: #ffeaa7;
        }

        .day-label {
            font-weight: 600;
            color: #856404;
        }

        .day-input {
            padding: 6px;
            border: 1px solid #ffeaa7;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .day-input:focus {
            outline: none;
            border-color: #856404;
        }

        .day-result {
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
        }

        .add-entry-btn {
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-entry-btn:hover {
            background: #218838;
        }

        .remove-entry-btn {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .remove-entry-btn:hover {
            background: #c82333;
        }

        .preset-section {
            background: #e1ecf4;
            border: 1px solid #b3d4fc;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .preset-title {
            color: #0c5460;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .preset-item {
            background: white;
            border: 1px solid #b3d4fc;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .preset-item:hover {
            background: #b3d4fc;
        }

        .preset-name {
            font-weight: 600;
            color: #0c5460;
            margin-bottom: 5px;
        }

        .preset-description {
            color: #666;
            font-size: 0.9rem;
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: #5a6fd8;
        }

        .action-btn.secondary {
            background: #6c757d;
        }

        .action-btn.secondary:hover {
            background: #5a6268;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            background: #dc3545;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .work-time-calculator {
                padding: 20px;
            }
            
            .calculator-modes {
                flex-direction: column;
                align-items: center;
            }
            
            .input-grid {
                grid-template-columns: 1fr;
            }
            
            .day-entry {
                grid-template-columns: 1fr;
                gap: 5px;
            }
            
            .preset-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="work-time-calculator">
        <div class="header">
            <h1>勤務時間計算</h1>
            <p>勤務時間・残業時間を計算</p>
        </div>

        <div class="calculator-modes">
            <button class="mode-btn active" onclick="setMode('daily')">日次計算</button>
            <button class="mode-btn" onclick="setMode('weekly')">週次計算</button>
            <button class="mode-btn" onclick="setMode('monthly')">月次計算</button>
        </div>

        <div class="calculator-section active" id="daily">
            <div class="section-title">日次勤務時間計算</div>
            <div class="input-grid">
                <div class="input-group">
                    <label for="startTime">開始時刻</label>
                    <input type="time" id="startTime" class="input-control" value="09:00">
                </div>
                <div class="input-group">
                    <label for="endTime">終了時刻</label>
                    <input type="time" id="endTime" class="input-control" value="18:00">
                </div>
                <div class="input-group">
                    <label for="breakTime">休憩時間（分）</label>
                    <input type="number" id="breakTime" class="input-control" value="60" min="0">
                </div>
                <div class="input-group">
                    <label for="standardHours">標準労働時間（時間）</label>
                    <input type="number" id="standardHours" class="input-control" value="8" min="0" step="0.5">
                </div>
            </div>
            <button class="calculate-btn" onclick="calculateDaily()">計算</button>
        </div>

        <div class="calculator-section" id="weekly">
            <div class="section-title">週次勤務時間計算</div>
            <div id="weeklyEntries">
                <!-- 週次エントリーがここに表示されます -->
            </div>
            <button class="add-entry-btn" onclick="addWeeklyEntry()">+ 日を追加</button>
            <button class="calculate-btn" onclick="calculateWeekly()">計算</button>
        </div>

        <div class="calculator-section" id="monthly">
            <div class="section-title">月次勤務時間計算</div>
            <div class="input-grid">
                <div class="input-group">
                    <label for="workingDays">勤務日数</label>
                    <input type="number" id="workingDays" class="input-control" value="22" min="1">
                </div>
                <div class="input-group">
                    <label for="avgDailyHours">平均日次勤務時間</label>
                    <input type="number" id="avgDailyHours" class="input-control" value="8" min="0" step="0.5">
                </div>
                <div class="input-group">
                    <label for="monthlyStandardHours">月次標準労働時間</label>
                    <input type="number" id="monthlyStandardHours" class="input-control" value="176" min="0">
                </div>
                <div class="input-group">
                    <label for="overtimeRate">残業代率（%）</label>
                    <input type="number" id="overtimeRate" class="input-control" value="125" min="100">
                </div>
            </div>
            <button class="calculate-btn" onclick="calculateMonthly()">計算</button>
        </div>

        <div class="result-section" id="resultSection">
            <div class="result-title">計算結果</div>
            <div class="result-grid" id="resultGrid">
                <!-- 結果がここに表示されます -->
            </div>
        </div>

        <div class="weekly-summary" id="weeklySummary">
            <div class="weekly-title">週次サマリー</div>
            <div id="weeklySummaryContent">
                <!-- 週次サマリーがここに表示されます -->
            </div>
        </div>

        <div class="preset-section">
            <div class="preset-title">よく使われる設定</div>
            <div class="preset-grid">
                <div class="preset-item" onclick="loadPreset('standard')">
                    <div class="preset-name">標準勤務</div>
                    <div class="preset-description">9:00-18:00（休憩1時間）</div>
                </div>
                <div class="preset-item" onclick="loadPreset('earlybird')">
                    <div class="preset-name">早番</div>
                    <div class="preset-description">8:00-17:00（休憩1時間）</div>
                </div>
                <div class="preset-item" onclick="loadPreset('late')">
                    <div class="preset-name">遅番</div>
                    <div class="preset-description">10:00-19:00（休憩1時間）</div>
                </div>
                <div class="preset-item" onclick="loadPreset('parttime')">
                    <div class="preset-name">パートタイム</div>
                    <div class="preset-description">9:00-14:00（休憩なし）</div>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="action-btn" onclick="exportResult()">結果出力</button>
            <button class="action-btn secondary" onclick="clearAll()">クリア</button>
            <button class="action-btn secondary" onclick="saveSettings()">設定保存</button>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <div class="notification" id="notification">
        <div id="notificationMessage"></div>
    </div>

    <script>
        let currentMode = 'daily';
        let lastResult = null;
        let weeklyEntryCount = 0;

        function setMode(mode) {
            currentMode = mode;
            
            // ボタンの状態を更新
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // セクションの表示を切り替え
            document.querySelectorAll('.calculator-section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(mode).classList.add('active');
            
            // 結果セクションを非表示
            document.getElementById('resultSection').classList.remove('show');
            document.getElementById('weeklySummary').classList.remove('show');
            
            // 週次モードの場合は初期エントリーを追加
            if (mode === 'weekly' && weeklyEntryCount === 0) {
                addWeeklyEntry();
            }
        }

        function addWeeklyEntry() {
            const weeklyEntries = document.getElementById('weeklyEntries');
            const entryId = `entry-${weeklyEntryCount++}`;
            
            const entryDiv = document.createElement('div');
            entryDiv.className = 'day-entry';
            entryDiv.id = entryId;
            
            const days = ['月', '火', '水', '木', '金', '土', '日'];
            const dayLabel = days[weeklyEntryCount % 7] || `日${weeklyEntryCount}`;
            
            entryDiv.innerHTML = `
                <div class="day-label">${dayLabel}</div>
                <input type="time" class="day-input" value="09:00" placeholder="開始時刻">
                <input type="time" class="day-input" value="18:00" placeholder="終了時刻">
                <input type="number" class="day-input" value="60" min="0" placeholder="休憩（分）">
                <div class="day-result">
                    <span class="work-hours">8.0時間</span>
                    <button class="remove-entry-btn" onclick="removeWeeklyEntry('${entryId}')">削除</button>
                </div>
            `;
            
            weeklyEntries.appendChild(entryDiv);
            
            // 入力変更時の自動計算
            const inputs = entryDiv.querySelectorAll('.day-input');
            inputs.forEach(input => {
                input.addEventListener('change', () => updateWeeklyEntry(entryId));
            });
            
            updateWeeklyEntry(entryId);
        }

        function removeWeeklyEntry(entryId) {
            const entry = document.getElementById(entryId);
            if (entry) {
                entry.remove();
                weeklyEntryCount--;
            }
        }

        function updateWeeklyEntry(entryId) {
            const entry = document.getElementById(entryId);
            if (!entry) return;
            
            const inputs = entry.querySelectorAll('.day-input');
            const startTime = inputs[0].value;
            const endTime = inputs[1].value;
            const breakTime = parseInt(inputs[2].value) || 0;
            
            if (startTime && endTime) {
                const workMinutes = calculateWorkMinutes(startTime, endTime, breakTime);
                const workHours = workMinutes / 60;
                
                const resultSpan = entry.querySelector('.work-hours');
                resultSpan.textContent = `${workHours.toFixed(1)}時間`;
            }
        }

        function calculateWorkMinutes(startTime, endTime, breakTime) {
            const start = new Date(`2024-01-01T${startTime}`);
            const end = new Date(`2024-01-01T${endTime}`);
            
            if (end < start) {
                end.setDate(end.getDate() + 1);
            }
            
            const totalMinutes = (end - start) / (1000 * 60);
            return Math.max(0, totalMinutes - breakTime);
        }

        function calculateDaily() {
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            const breakTime = parseInt(document.getElementById('breakTime').value) || 0;
            const standardHours = parseFloat(document.getElementById('standardHours').value) || 8;
            
            if (!startTime || !endTime) {
                showNotification('開始時刻と終了時刻を入力してください', 'error');
                return;
            }
            
            const workMinutes = calculateWorkMinutes(startTime, endTime, breakTime);
            const workHours = workMinutes / 60;
            const overtimeHours = Math.max(0, workHours - standardHours);
            const regularHours = workHours - overtimeHours;
            
            lastResult = {
                type: 'daily',
                startTime: startTime,
                endTime: endTime,
                breakTime: breakTime,
                workHours: workHours,
                regularHours: regularHours,
                overtimeHours: overtimeHours,
                standardHours: standardHours
            };
            
            displayResult([
                { label: '総勤務時間', value: `${workHours.toFixed(1)}時間` },
                { label: '通常勤務時間', value: `${regularHours.toFixed(1)}時間` },
                { label: '残業時間', value: `${overtimeHours.toFixed(1)}時間` },
                { label: '実働時間', value: `${workMinutes}分` },
                { label: '休憩時間', value: `${breakTime}分` },
                { label: '標準労働時間', value: `${standardHours}時間` }
            ]);
            
            showNotification('日次勤務時間を計算しました');
        }

        function calculateWeekly() {
            const entries = document.querySelectorAll('.day-entry');
            if (entries.length === 0) {
                showNotification('週次エントリーを追加してください', 'error');
                return;
            }
            
            let totalWorkHours = 0;
            let totalRegularHours = 0;
            let totalOvertimeHours = 0;
            let workingDays = 0;
            
            const weeklyData = [];
            
            entries.forEach(entry => {
                const inputs = entry.querySelectorAll('.day-input');
                const startTime = inputs[0].value;
                const endTime = inputs[1].value;
                const breakTime = parseInt(inputs[2].value) || 0;
                
                if (startTime && endTime) {
                    const workMinutes = calculateWorkMinutes(startTime, endTime, breakTime);
                    const workHours = workMinutes / 60;
                    const overtimeHours = Math.max(0, workHours - 8);
                    const regularHours = workHours - overtimeHours;
                    
                    totalWorkHours += workHours;
                    totalRegularHours += regularHours;
                    totalOvertimeHours += overtimeHours;
                    workingDays++;
                    
                    weeklyData.push({
                        day: entry.querySelector('.day-label').textContent,
                        startTime: startTime,
                        endTime: endTime,
                        breakTime: breakTime,
                        workHours: workHours,
                        regularHours: regularHours,
                        overtimeHours: overtimeHours
                    });
                }
            });
            
            const avgWorkHours = totalWorkHours / workingDays;
            const weeklyOvertimeRate = (totalOvertimeHours / totalWorkHours) * 100;
            
            lastResult = {
                type: 'weekly',
                totalWorkHours: totalWorkHours,
                totalRegularHours: totalRegularHours,
                totalOvertimeHours: totalOvertimeHours,
                workingDays: workingDays,
                avgWorkHours: avgWorkHours,
                weeklyOvertimeRate: weeklyOvertimeRate,
                weeklyData: weeklyData
            };
            
            displayResult([
                { label: '総勤務時間', value: `${totalWorkHours.toFixed(1)}時間` },
                { label: '通常勤務時間', value: `${totalRegularHours.toFixed(1)}時間` },
                { label: '残業時間', value: `${totalOvertimeHours.toFixed(1)}時間` },
                { label: '勤務日数', value: `${workingDays}日` },
                { label: '平均勤務時間', value: `${avgWorkHours.toFixed(1)}時間/日` },
                { label: '残業率', value: `${weeklyOvertimeRate.toFixed(1)}%` }
            ]);
            
            displayWeeklySummary(weeklyData);
            
            showNotification('週次勤務時間を計算しました');
        }

        function calculateMonthly() {
            const workingDays = parseInt(document.getElementById('workingDays').value) || 22;
            const avgDailyHours = parseFloat(document.getElementById('avgDailyHours').value) || 8;
            const monthlyStandardHours = parseInt(document.getElementById('monthlyStandardHours').value) || 176;
            const overtimeRate = parseInt(document.getElementById('overtimeRate').value) || 125;
            
            const totalWorkHours = workingDays * avgDailyHours;
            const monthlyOvertimeHours = Math.max(0, totalWorkHours - monthlyStandardHours);
            const monthlyRegularHours = totalWorkHours - monthlyOvertimeHours;
            
            const overtimeRateMultiplier = overtimeRate / 100;
            const effectiveOvertimeHours = monthlyOvertimeHours * overtimeRateMultiplier;
            const totalEffectiveHours = monthlyRegularHours + effectiveOvertimeHours;
            
            lastResult = {
                type: 'monthly',
                workingDays: workingDays,
                avgDailyHours: avgDailyHours,
                totalWorkHours: totalWorkHours,
                monthlyStandardHours: monthlyStandardHours,
                monthlyRegularHours: monthlyRegularHours,
                monthlyOvertimeHours: monthlyOvertimeHours,
                overtimeRate: overtimeRate,
                effectiveOvertimeHours: effectiveOvertimeHours,
                totalEffectiveHours: totalEffectiveHours
            };
            
            displayResult([
                { label: '総勤務時間', value: `${totalWorkHours.toFixed(1)}時間` },
                { label: '通常勤務時間', value: `${monthlyRegularHours.toFixed(1)}時間` },
                { label: '残業時間', value: `${monthlyOvertimeHours.toFixed(1)}時間` },
                { label: '勤務日数', value: `${workingDays}日` },
                { label: '平均日次勤務時間', value: `${avgDailyHours}時間/日` },
                { label: '実効残業時間', value: `${effectiveOvertimeHours.toFixed(1)}時間` },
                { label: '総実効時間', value: `${totalEffectiveHours.toFixed(1)}時間` },
                { label: '残業代率', value: `${overtimeRate}%` }
            ]);
            
            showNotification('月次勤務時間を計算しました');
        }

        function displayResult(results) {
            const resultSection = document.getElementById('resultSection');
            const resultGrid = document.getElementById('resultGrid');
            
            resultGrid.innerHTML = '';
            
            results.forEach(result => {
                const resultItem = document.createElement('div');
                resultItem.className = 'result-item';
                resultItem.innerHTML = `
                    <div class="result-value">${result.value}</div>
                    <div class="result-label">${result.label}</div>
                `;
                resultGrid.appendChild(resultItem);
            });
            
            resultSection.classList.add('show');
        }

        function displayWeeklySummary(weeklyData) {
            const weeklySummary = document.getElementById('weeklySummary');
            const weeklySummaryContent = document.getElementById('weeklySummaryContent');
            
            weeklySummaryContent.innerHTML = '';
            
            weeklyData.forEach(data => {
                const summaryItem = document.createElement('div');
                summaryItem.className = 'day-entry';
                summaryItem.innerHTML = `
                    <div class="day-label">${data.day}</div>
                    <div class="day-result">${data.startTime} - ${data.endTime}</div>
                    <div class="day-result">休憩: ${data.breakTime}分</div>
                    <div class="day-result">勤務: ${data.workHours.toFixed(1)}h</div>
                    <div class="day-result">残業: ${data.overtimeHours.toFixed(1)}h</div>
                `;
                weeklySummaryContent.appendChild(summaryItem);
            });
            
            weeklySummary.classList.add('show');
        }

        function loadPreset(presetType) {
            const presets = {
                standard: { start: '09:00', end: '18:00', break: 60 },
                earlybird: { start: '08:00', end: '17:00', break: 60 },
                late: { start: '10:00', end: '19:00', break: 60 },
                parttime: { start: '09:00', end: '14:00', break: 0 }
            };
            
            const preset = presets[presetType];
            if (preset) {
                document.getElementById('startTime').value = preset.start;
                document.getElementById('endTime').value = preset.end;
                document.getElementById('breakTime').value = preset.break;
                showNotification(`${presetType}設定を読み込みました`);
            }
        }

        function exportResult() {
            if (!lastResult) {
                showNotification('計算結果がありません', 'error');
                return;
            }
            
            let exportText = '勤務時間計算結果\n';
            exportText += `計算日時: ${new Date().toLocaleString('ja-JP')}\n\n`;
            
            if (lastResult.type === 'daily') {
                exportText += `勤務時間: ${lastResult.startTime} - ${lastResult.endTime}\n`;
                exportText += `休憩時間: ${lastResult.breakTime}分\n`;
                exportText += `総勤務時間: ${lastResult.workHours.toFixed(1)}時間\n`;
                exportText += `通常勤務時間: ${lastResult.regularHours.toFixed(1)}時間\n`;
                exportText += `残業時間: ${lastResult.overtimeHours.toFixed(1)}時間\n`;
                exportText += `標準労働時間: ${lastResult.standardHours}時間\n`;
            } else if (lastResult.type === 'weekly') {
                exportText += `勤務日数: ${lastResult.workingDays}日\n`;
                exportText += `総勤務時間: ${lastResult.totalWorkHours.toFixed(1)}時間\n`;
                exportText += `通常勤務時間: ${lastResult.totalRegularHours.toFixed(1)}時間\n`;
                exportText += `残業時間: ${lastResult.totalOvertimeHours.toFixed(1)}時間\n`;
                exportText += `平均勤務時間: ${lastResult.avgWorkHours.toFixed(1)}時間/日\n`;
                exportText += `残業率: ${lastResult.weeklyOvertimeRate.toFixed(1)}%\n\n`;
                exportText += '詳細:\n';
                lastResult.weeklyData.forEach(data => {
                    exportText += `${data.day}: ${data.startTime}-${data.endTime} (休憩${data.breakTime}分) = ${data.workHours.toFixed(1)}時間\n`;
                });
            } else if (lastResult.type === 'monthly') {
                exportText += `勤務日数: ${lastResult.workingDays}日\n`;
                exportText += `平均日次勤務時間: ${lastResult.avgDailyHours}時間/日\n`;
                exportText += `総勤務時間: ${lastResult.totalWorkHours.toFixed(1)}時間\n`;
                exportText += `月次標準労働時間: ${lastResult.monthlyStandardHours}時間\n`;
                exportText += `通常勤務時間: ${lastResult.monthlyRegularHours.toFixed(1)}時間\n`;
                exportText += `残業時間: ${lastResult.monthlyOvertimeHours.toFixed(1)}時間\n`;
                exportText += `残業代率: ${lastResult.overtimeRate}%\n`;
                exportText += `実効残業時間: ${lastResult.effectiveOvertimeHours.toFixed(1)}時間\n`;
                exportText += `総実効時間: ${lastResult.totalEffectiveHours.toFixed(1)}時間\n`;
            }
            
            const blob = new Blob([exportText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `work_time_calculation_${Date.now()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            
            showNotification('結果を出力しました');
        }

        function clearAll() {
            document.getElementById('startTime').value = '09:00';
            document.getElementById('endTime').value = '18:00';
            document.getElementById('breakTime').value = '60';
            document.getElementById('standardHours').value = '8';
            document.getElementById('workingDays').value = '22';
            document.getElementById('avgDailyHours').value = '8';
            document.getElementById('monthlyStandardHours').value = '176';
            document.getElementById('overtimeRate').value = '125';
            
            // 週次エントリーをクリア
            document.getElementById('weeklyEntries').innerHTML = '';
            weeklyEntryCount = 0;
            
            document.getElementById('resultSection').classList.remove('show');
            document.getElementById('weeklySummary').classList.remove('show');
            lastResult = null;
            
            showNotification('全てクリアしました');
        }

        function saveSettings() {
            const settings = {
                startTime: document.getElementById('startTime').value,
                endTime: document.getElementById('endTime').value,
                breakTime: document.getElementById('breakTime').value,
                standardHours: document.getElementById('standardHours').value,
                workingDays: document.getElementById('workingDays').value,
                avgDailyHours: document.getElementById('avgDailyHours').value,
                monthlyStandardHours: document.getElementById('monthlyStandardHours').value,
                overtimeRate: document.getElementById('overtimeRate').value
            };
            
            localStorage.setItem('workTimeSettings', JSON.stringify(settings));
            showNotification('設定を保存しました');
        }

        function loadSettings() {
            const settings = JSON.parse(localStorage.getItem('workTimeSettings'));
            if (settings) {
                document.getElementById('startTime').value = settings.startTime || '09:00';
                document.getElementById('endTime').value = settings.endTime || '18:00';
                document.getElementById('breakTime').value = settings.breakTime || '60';
                document.getElementById('standardHours').value = settings.standardHours || '8';
                document.getElementById('workingDays').value = settings.workingDays || '22';
                document.getElementById('avgDailyHours').value = settings.avgDailyHours || '8';
                document.getElementById('monthlyStandardHours').value = settings.monthlyStandardHours || '176';
                document.getElementById('overtimeRate').value = settings.overtimeRate || '125';
            }
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            const notificationMessage = document.getElementById('notificationMessage');
            
            notificationMessage.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // 初期化
        function init() {
            loadSettings();
        }

        // ページ読み込み時の初期化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
