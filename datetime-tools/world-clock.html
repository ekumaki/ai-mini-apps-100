<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世界時計 - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .world-clock {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 1400px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .view-modes {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .view-btn {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .view-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .view-btn:hover:not(.active) {
            background: #e9ecef;
        }

        .main-clock {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
            border: 2px solid #e9ecef;
        }

        .main-clock h2 {
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .main-time {
            font-size: 3rem;
            font-weight: bold;
            color: #667eea;
            font-family: 'Courier New', monospace;
            margin-bottom: 10px;
        }

        .main-date {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 10px;
        }

        .main-timezone {
            font-size: 1rem;
            color: #333;
            background: #e9ecef;
            padding: 5px 10px;
            border-radius: 15px;
            display: inline-block;
        }

        .clock-container {
            display: none;
        }

        .clock-container.active {
            display: block;
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .clock-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
        }

        .clock-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .clock-card.night {
            background: #2c3e50;
            color: white;
        }

        .clock-card.day {
            background: #3498db;
            color: white;
        }

        .clock-card.evening {
            background: #e67e22;
            color: white;
        }

        .clock-card.morning {
            background: #f39c12;
            color: white;
        }

        .clock-flag {
            width: 40px;
            height: 30px;
            margin: 0 auto 10px;
            border-radius: 4px;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .clock-city {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .clock-time {
            font-size: 2rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            margin-bottom: 5px;
        }

        .clock-date {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .clock-timezone {
            font-size: 0.8rem;
            opacity: 0.7;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            border-radius: 10px;
            display: inline-block;
        }

        .clock-card.night .clock-timezone {
            background: rgba(255, 255, 255, 0.1);
        }

        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(220, 53, 69, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .remove-btn:hover {
            background: #dc3545;
        }

        .add-clock-section {
            background: #e1ecf4;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .add-clock-title {
            color: #0c5460;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .add-clock-form {
            display: flex;
            gap: 15px;
            align-items: end;
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 200px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #0c5460;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #b3d4fc;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
        }

        .form-control:focus {
            outline: none;
            border-color: #0c5460;
        }

        .add-btn {
            background: #0c5460;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .add-btn:hover {
            background: #094349;
        }

        .quick-add-section {
            background: #fff3cd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .quick-add-title {
            color: #856404;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .quick-add-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .quick-btn {
            background: white;
            border: 2px solid #ffeaa7;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            color: #856404;
        }

        .quick-btn:hover {
            background: #ffeaa7;
        }

        .analog-clock {
            width: 150px;
            height: 150px;
            border: 8px solid #333;
            border-radius: 50%;
            position: relative;
            margin: 20px auto;
            background: white;
        }

        .clock-face {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .clock-hand {
            position: absolute;
            background: #333;
            transform-origin: bottom center;
            border-radius: 2px;
        }

        .hour-hand {
            width: 4px;
            height: 50px;
            top: 25px;
            left: 50%;
            margin-left: -2px;
        }

        .minute-hand {
            width: 2px;
            height: 65px;
            top: 10px;
            left: 50%;
            margin-left: -1px;
        }

        .second-hand {
            width: 1px;
            height: 70px;
            top: 5px;
            left: 50%;
            margin-left: -0.5px;
            background: #dc3545;
        }

        .clock-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: #333;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .clock-numbers {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .clock-number {
            position: absolute;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            color: #333;
        }

        .time-comparison {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .comparison-title {
            color: #333;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .comparison-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .comparison-item {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .comparison-city {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .comparison-time {
            font-size: 1.1rem;
            font-family: 'Courier New', monospace;
            color: #667eea;
            margin-bottom: 5px;
        }

        .comparison-diff {
            font-size: 0.8rem;
            color: #666;
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: #5a6fd8;
        }

        .action-btn.secondary {
            background: #6c757d;
        }

        .action-btn.secondary:hover {
            background: #5a6268;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            background: #dc3545;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .world-clock {
                padding: 20px;
            }
            
            .main-time {
                font-size: 2rem;
            }
            
            .clocks-grid {
                grid-template-columns: 1fr;
            }
            
            .add-clock-form {
                flex-direction: column;
            }
            
            .form-group {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="world-clock">
        <div class="header">
            <h1>世界時計</h1>
            <p>世界各地の時刻を表示・比較</p>
        </div>

        <div class="view-modes">
            <button class="view-btn active" onclick="setView('digital')">デジタル時計</button>
            <button class="view-btn" onclick="setView('analog')">アナログ時計</button>
            <button class="view-btn" onclick="setView('comparison')">時差比較</button>
        </div>

        <div class="main-clock">
            <h2>現在地の時刻</h2>
            <div class="main-time" id="mainTime">00:00:00</div>
            <div class="main-date" id="mainDate">2024年1月1日</div>
            <div class="main-timezone" id="mainTimezone">JST (UTC+9)</div>
        </div>

        <div class="clock-container active" id="digitalContainer">
            <div class="clocks-grid" id="digitalClocks">
                <!-- デジタル時計がここに表示されます -->
            </div>
        </div>

        <div class="clock-container" id="analogContainer">
            <div class="clocks-grid" id="analogClocks">
                <!-- アナログ時計がここに表示されます -->
            </div>
        </div>

        <div class="clock-container" id="comparisonContainer">
            <div class="time-comparison">
                <div class="comparison-title">時差比較</div>
                <div class="comparison-grid" id="comparisonGrid">
                    <!-- 時差比較がここに表示されます -->
                </div>
            </div>
        </div>

        <div class="add-clock-section">
            <div class="add-clock-title">時計を追加</div>
            <div class="add-clock-form">
                <div class="form-group">
                    <label for="timezone">タイムゾーン</label>
                    <select id="timezone" class="form-control">
                        <!-- タイムゾーンオプションがここに表示されます -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="displayName">表示名</label>
                    <input type="text" id="displayName" class="form-control" placeholder="例: 東京">
                </div>
                <button class="add-btn" onclick="addClock()">追加</button>
            </div>
        </div>

        <div class="quick-add-section">
            <div class="quick-add-title">よく使われる都市</div>
            <div class="quick-add-buttons">
                <button class="quick-btn" onclick="quickAddClock('America/New_York', 'ニューヨーク', '🇺🇸')">ニューヨーク</button>
                <button class="quick-btn" onclick="quickAddClock('Europe/London', 'ロンドン', '🇬🇧')">ロンドン</button>
                <button class="quick-btn" onclick="quickAddClock('Europe/Paris', 'パリ', '🇫🇷')">パリ</button>
                <button class="quick-btn" onclick="quickAddClock('Asia/Shanghai', '上海', '🇨🇳')">上海</button>
                <button class="quick-btn" onclick="quickAddClock('Asia/Seoul', 'ソウル', '🇰🇷')">ソウル</button>
                <button class="quick-btn" onclick="quickAddClock('Asia/Hong_Kong', '香港', '🇭🇰')">香港</button>
                <button class="quick-btn" onclick="quickAddClock('Asia/Singapore', 'シンガポール', '🇸🇬')">シンガポール</button>
                <button class="quick-btn" onclick="quickAddClock('Australia/Sydney', 'シドニー', '🇦🇺')">シドニー</button>
                <button class="quick-btn" onclick="quickAddClock('America/Los_Angeles', 'ロサンゼルス', '🇺🇸')">ロサンゼルス</button>
                <button class="quick-btn" onclick="quickAddClock('Europe/Berlin', 'ベルリン', '🇩🇪')">ベルリン</button>
                <button class="quick-btn" onclick="quickAddClock('Asia/Dubai', 'ドバイ', '🇦🇪')">ドバイ</button>
                <button class="quick-btn" onclick="quickAddClock('Pacific/Auckland', 'オークランド', '🇳🇿')">オークランド</button>
            </div>
        </div>

        <div class="actions">
            <button class="action-btn" onclick="saveClocks()">設定保存</button>
            <button class="action-btn" onclick="exportClocks()">データ出力</button>
            <button class="action-btn secondary" onclick="clearAllClocks()">全削除</button>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <div class="notification" id="notification">
        <div id="notificationMessage"></div>
    </div>

    <script>
        let currentView = 'digital';
        let worldClocks = [];
        let updateInterval;

        const timezones = [
            { value: 'Asia/Tokyo', label: '東京 (JST)' },
            { value: 'America/New_York', label: 'ニューヨーク (EST/EDT)' },
            { value: 'America/Los_Angeles', label: 'ロサンゼルス (PST/PDT)' },
            { value: 'Europe/London', label: 'ロンドン (GMT/BST)' },
            { value: 'Europe/Paris', label: 'パリ (CET/CEST)' },
            { value: 'Europe/Berlin', label: 'ベルリン (CET/CEST)' },
            { value: 'Asia/Shanghai', label: '上海 (CST)' },
            { value: 'Asia/Hong_Kong', label: '香港 (HKT)' },
            { value: 'Asia/Seoul', label: 'ソウル (KST)' },
            { value: 'Asia/Singapore', label: 'シンガポール (SGT)' },
            { value: 'Asia/Bangkok', label: 'バンコク (ICT)' },
            { value: 'Asia/Dubai', label: 'ドバイ (GST)' },
            { value: 'Europe/Moscow', label: 'モスクワ (MSK)' },
            { value: 'Africa/Cairo', label: 'カイロ (EET)' },
            { value: 'Australia/Sydney', label: 'シドニー (AEST/AEDT)' },
            { value: 'Pacific/Auckland', label: 'オークランド (NZST/NZDT)' },
            { value: 'America/Chicago', label: 'シカゴ (CST/CDT)' },
            { value: 'America/Denver', label: 'デンバー (MST/MDT)' },
            { value: 'America/Phoenix', label: 'フェニックス (MST)' },
            { value: 'America/Anchorage', label: 'アンカレッジ (AKST/AKDT)' },
            { value: 'Pacific/Honolulu', label: 'ホノルル (HST)' },
            { value: 'America/Sao_Paulo', label: 'サンパウロ (BRT)' },
            { value: 'America/Argentina/Buenos_Aires', label: 'ブエノスアイレス (ART)' },
            { value: 'UTC', label: 'UTC (協定世界時)' }
        ];

        function setView(view) {
            currentView = view;
            
            // ボタンの状態を更新
            document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // コンテナの表示を切り替え
            document.querySelectorAll('.clock-container').forEach(container => {
                container.classList.remove('active');
            });
            document.getElementById(view + 'Container').classList.add('active');
            
            updateClocks();
        }

        function initTimezoneSelect() {
            const select = document.getElementById('timezone');
            timezones.forEach(timezone => {
                const option = document.createElement('option');
                option.value = timezone.value;
                option.textContent = timezone.label;
                select.appendChild(option);
            });
        }

        function addClock() {
            const timezone = document.getElementById('timezone').value;
            const displayName = document.getElementById('displayName').value;
            
            if (!timezone) {
                showNotification('タイムゾーンを選択してください', 'error');
                return;
            }
            
            if (!displayName) {
                showNotification('表示名を入力してください', 'error');
                return;
            }
            
            // 重複チェック
            if (worldClocks.some(clock => clock.timezone === timezone)) {
                showNotification('このタイムゾーンは既に追加されています', 'error');
                return;
            }
            
            const clock = {
                id: Date.now(),
                timezone: timezone,
                displayName: displayName,
                flag: '🌍'
            };
            
            worldClocks.push(clock);
            document.getElementById('displayName').value = '';
            
            updateClocks();
            showNotification(`${displayName}を追加しました`);
        }

        function quickAddClock(timezone, displayName, flag) {
            // 重複チェック
            if (worldClocks.some(clock => clock.timezone === timezone)) {
                showNotification('このタイムゾーンは既に追加されています', 'error');
                return;
            }
            
            const clock = {
                id: Date.now(),
                timezone: timezone,
                displayName: displayName,
                flag: flag
            };
            
            worldClocks.push(clock);
            updateClocks();
            showNotification(`${displayName}を追加しました`);
        }

        function removeClock(id) {
            worldClocks = worldClocks.filter(clock => clock.id !== id);
            updateClocks();
            showNotification('時計を削除しました');
        }

        function updateMainClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('ja-JP', { hour12: false });
            const dateString = now.toLocaleDateString('ja-JP', { 
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                weekday: 'long'
            });
            
            document.getElementById('mainTime').textContent = timeString;
            document.getElementById('mainDate').textContent = dateString;
            
            // タイムゾーンオフセット
            const offset = -now.getTimezoneOffset() / 60;
            const offsetString = offset >= 0 ? `+${offset}` : `${offset}`;
            document.getElementById('mainTimezone').textContent = `JST (UTC${offsetString})`;
        }

        function updateClocks() {
            updateMainClock();
            
            if (currentView === 'digital') {
                updateDigitalClocks();
            } else if (currentView === 'analog') {
                updateAnalogClocks();
            } else if (currentView === 'comparison') {
                updateComparisonView();
            }
        }

        function updateDigitalClocks() {
            const container = document.getElementById('digitalClocks');
            container.innerHTML = '';
            
            if (worldClocks.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #666; padding: 20px; grid-column: 1 / -1;">時計を追加してください</div>';
                return;
            }
            
            worldClocks.forEach(clock => {
                const now = new Date();
                const clockTime = new Date(now.toLocaleString('en-US', { timeZone: clock.timezone }));
                const hour = clockTime.getHours();
                
                // 時間帯に応じたテーマ
                let theme = 'day';
                if (hour >= 22 || hour < 6) theme = 'night';
                else if (hour >= 6 && hour < 12) theme = 'morning';
                else if (hour >= 18 && hour < 22) theme = 'evening';
                
                const clockCard = document.createElement('div');
                clockCard.className = `clock-card ${theme}`;
                clockCard.innerHTML = `
                    <button class="remove-btn" onclick="removeClock(${clock.id})">×</button>
                    <div class="clock-flag">${clock.flag}</div>
                    <div class="clock-city">${clock.displayName}</div>
                    <div class="clock-time">${clockTime.toLocaleTimeString('ja-JP', { hour12: false })}</div>
                    <div class="clock-date">${clockTime.toLocaleDateString('ja-JP', { month: 'short', day: 'numeric', weekday: 'short' })}</div>
                    <div class="clock-timezone">${getTimezoneOffset(clock.timezone)}</div>
                `;
                
                container.appendChild(clockCard);
            });
        }

        function updateAnalogClocks() {
            const container = document.getElementById('analogClocks');
            container.innerHTML = '';
            
            if (worldClocks.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #666; padding: 20px; grid-column: 1 / -1;">時計を追加してください</div>';
                return;
            }
            
            worldClocks.forEach(clock => {
                const now = new Date();
                const clockTime = new Date(now.toLocaleString('en-US', { timeZone: clock.timezone }));
                
                const clockCard = document.createElement('div');
                clockCard.className = 'clock-card';
                clockCard.innerHTML = `
                    <button class="remove-btn" onclick="removeClock(${clock.id})">×</button>
                    <div class="clock-flag">${clock.flag}</div>
                    <div class="clock-city">${clock.displayName}</div>
                    <div class="analog-clock">
                        <div class="clock-face">
                            <div class="clock-numbers">
                                <div class="clock-number" style="top: 5px; left: 50%; transform: translateX(-50%)">12</div>
                                <div class="clock-number" style="top: 50%; right: 5px; transform: translateY(-50%)">3</div>
                                <div class="clock-number" style="bottom: 5px; left: 50%; transform: translateX(-50%)">6</div>
                                <div class="clock-number" style="top: 50%; left: 5px; transform: translateY(-50%)">9</div>
                            </div>
                            <div class="clock-hand hour-hand" style="transform: rotate(${getHourAngle(clockTime)}deg)"></div>
                            <div class="clock-hand minute-hand" style="transform: rotate(${getMinuteAngle(clockTime)}deg)"></div>
                            <div class="clock-hand second-hand" style="transform: rotate(${getSecondAngle(clockTime)}deg)"></div>
                            <div class="clock-center"></div>
                        </div>
                    </div>
                    <div class="clock-time">${clockTime.toLocaleTimeString('ja-JP', { hour12: false })}</div>
                    <div class="clock-date">${clockTime.toLocaleDateString('ja-JP', { month: 'short', day: 'numeric', weekday: 'short' })}</div>
                `;
                
                container.appendChild(clockCard);
            });
        }

        function updateComparisonView() {
            const container = document.getElementById('comparisonGrid');
            container.innerHTML = '';
            
            if (worldClocks.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #666; padding: 20px; grid-column: 1 / -1;">時計を追加してください</div>';
                return;
            }
            
            const referenceTime = new Date();
            const referenceTz = 'Asia/Tokyo';
            
            worldClocks.forEach(clock => {
                const clockTime = new Date(referenceTime.toLocaleString('en-US', { timeZone: clock.timezone }));
                const referenceClockTime = new Date(referenceTime.toLocaleString('en-US', { timeZone: referenceTz }));
                
                const timeDiff = (clockTime - referenceClockTime) / (1000 * 60 * 60);
                const diffText = timeDiff >= 0 ? `+${timeDiff}時間` : `${timeDiff}時間`;
                
                const comparisonItem = document.createElement('div');
                comparisonItem.className = 'comparison-item';
                comparisonItem.innerHTML = `
                    <div class="comparison-city">${clock.displayName}</div>
                    <div class="comparison-time">${clockTime.toLocaleTimeString('ja-JP', { hour12: false })}</div>
                    <div class="comparison-diff">東京時間${diffText}</div>
                `;
                
                container.appendChild(comparisonItem);
            });
        }

        function getTimezoneOffset(timezone) {
            const now = new Date();
            const localTime = now.getTime();
            const localOffset = now.getTimezoneOffset() * 60000;
            const utc = localTime + localOffset;
            const targetTime = new Date(utc + getTimezoneOffsetMs(timezone));
            const offset = -targetTime.getTimezoneOffset() / 60;
            const offsetString = offset >= 0 ? `+${offset}` : `${offset}`;
            return `UTC${offsetString}`;
        }

        function getTimezoneOffsetMs(timezone) {
            const now = new Date();
            const localTime = new Date(now.toLocaleString('en-US', { timeZone: timezone }));
            const utcTime = new Date(now.toLocaleString('en-US', { timeZone: 'UTC' }));
            return localTime.getTime() - utcTime.getTime();
        }

        function getHourAngle(date) {
            const hours = date.getHours() % 12;
            const minutes = date.getMinutes();
            return (hours * 30) + (minutes * 0.5);
        }

        function getMinuteAngle(date) {
            const minutes = date.getMinutes();
            return minutes * 6;
        }

        function getSecondAngle(date) {
            const seconds = date.getSeconds();
            return seconds * 6;
        }

        function saveClocks() {
            localStorage.setItem('worldClocks', JSON.stringify(worldClocks));
            showNotification('設定を保存しました');
        }

        function loadClocks() {
            const saved = localStorage.getItem('worldClocks');
            if (saved) {
                worldClocks = JSON.parse(saved);
                updateClocks();
            }
        }

        function exportClocks() {
            const exportData = {
                clocks: worldClocks,
                exportedAt: new Date().toISOString()
            };
            
            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `world_clocks_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            
            showNotification('データを出力しました');
        }

        function clearAllClocks() {
            if (confirm('すべての時計を削除しますか？')) {
                worldClocks = [];
                updateClocks();
                showNotification('すべての時計を削除しました');
            }
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            const notificationMessage = document.getElementById('notificationMessage');
            
            notificationMessage.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        function startRealTimeUpdates() {
            updateInterval = setInterval(updateClocks, 1000);
        }

        function stopRealTimeUpdates() {
            if (updateInterval) {
                clearInterval(updateInterval);
            }
        }

        // 初期化
        function init() {
            initTimezoneSelect();
            loadClocks();
            updateClocks();
            startRealTimeUpdates();
        }

        // ページ読み込み時の初期化
        document.addEventListener('DOMContentLoaded', init);
        
        // ページを離れる時にインターバルをクリア
        window.addEventListener('beforeunload', stopRealTimeUpdates);
    </script>
</body>
</html>
