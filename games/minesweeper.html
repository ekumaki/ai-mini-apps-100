<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マインスイーパー - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .minesweeper-game {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 800px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .game-controls {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .difficulty-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .difficulty-btn {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            color: #333;
            transition: all 0.3s ease;
        }

        .difficulty-btn:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .difficulty-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .game-info {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .info-item {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 10px 15px;
            text-align: center;
            min-width: 80px;
        }

        .info-value {
            font-weight: 700;
            color: #667eea;
            font-size: 1.2rem;
            margin-bottom: 2px;
        }

        .info-label {
            font-size: 0.8rem;
            color: #666;
        }

        .timer {
            color: #dc3545 !important;
        }

        .game-board {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        .board {
            display: inline-grid;
            gap: 2px;
            border: 3px solid #667eea;
            border-radius: 10px;
            padding: 10px;
            background: #667eea;
        }

        .cell {
            width: 30px;
            height: 30px;
            background: #e9ecef;
            border: 2px outset #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            user-select: none;
            transition: all 0.1s ease;
        }

        .cell:hover {
            background: #dee2e6;
        }

        .cell.revealed {
            border: 1px inset #ced4da;
            background: #f8f9fa;
            cursor: default;
        }

        .cell.revealed:hover {
            background: #f8f9fa;
        }

        .cell.flagged {
            background: #ffc107;
            color: #856404;
        }

        .cell.mine {
            background: #dc3545;
            color: white;
        }

        .cell.mine-exploded {
            background: #ff1744;
            color: white;
            animation: explode 0.5s ease;
        }

        .cell.number-1 { color: #007bff; }
        .cell.number-2 { color: #28a745; }
        .cell.number-3 { color: #dc3545; }
        .cell.number-4 { color: #6f42c1; }
        .cell.number-5 { color: #fd7e14; }
        .cell.number-6 { color: #20c997; }
        .cell.number-7 { color: #6c757d; }
        .cell.number-8 { color: #343a40; }

        @keyframes explode {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); background: #ff1744; }
            100% { transform: scale(1); }
        }

        .game-status {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-text {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .status-text.win {
            color: #28a745;
        }

        .status-text.lose {
            color: #dc3545;
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .action-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .action-btn.secondary {
            background: #6c757d;
        }

        .action-btn.secondary:hover {
            background: #5a6268;
        }

        .stats-section {
            background: #e1ecf4;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .stats-title {
            color: #0c5460;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
            text-align: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
        }

        .stat-item {
            background: white;
            border: 1px solid #b3d4fc;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-value {
            font-weight: 700;
            color: #0c5460;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #666;
        }

        .instructions {
            background: #fff3cd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .instructions-title {
            color: #856404;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
            text-align: center;
        }

        .instruction-list {
            color: #856404;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .instruction-list li {
            margin-bottom: 8px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            background: #dc3545;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .minesweeper-game {
                padding: 20px;
            }
            
            .game-controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .game-info {
                justify-content: center;
            }
            
            .cell {
                width: 25px;
                height: 25px;
                font-size: 0.8rem;
            }
            
            .board {
                padding: 5px;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .cell {
                width: 20px;
                height: 20px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="minesweeper-game">
        <div class="header">
            <h1>💣 マインスイーパー</h1>
            <p>地雷を避けて全てのセルを開けよう！</p>
        </div>

        <div class="game-controls">
            <div class="difficulty-buttons">
                <button class="difficulty-btn active" onclick="setDifficulty('easy')">初級 (9×9)</button>
                <button class="difficulty-btn" onclick="setDifficulty('medium')">中級 (16×16)</button>
                <button class="difficulty-btn" onclick="setDifficulty('hard')">上級 (16×30)</button>
                <button class="difficulty-btn" onclick="setDifficulty('custom')">カスタム</button>
            </div>
            
            <div class="game-info">
                <div class="info-item">
                    <div class="info-value" id="mineCount">10</div>
                    <div class="info-label">残り地雷</div>
                </div>
                <div class="info-item">
                    <div class="info-value timer" id="timer">000</div>
                    <div class="info-label">経過時間</div>
                </div>
                <div class="info-item">
                    <div class="info-value" id="cellsLeft">71</div>
                    <div class="info-label">残りセル</div>
                </div>
            </div>
        </div>

        <div class="game-board">
            <div class="board" id="gameBoard">
                <!-- ゲームボードがここに生成されます -->
            </div>
        </div>

        <div class="game-status" id="gameStatus">
            <div class="status-text">左クリックで開く、右クリックで旗を立てる</div>
        </div>

        <div class="actions">
            <button class="action-btn" onclick="newGame()">新しいゲーム</button>
            <button class="action-btn secondary" onclick="resetStats()">統計リセット</button>
            <button class="action-btn secondary" onclick="toggleHints()">ヒント表示</button>
        </div>

        <div class="stats-section">
            <div class="stats-title">📊 統計</div>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="gamesPlayed">0</div>
                    <div class="stat-label">総ゲーム数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="gamesWon">0</div>
                    <div class="stat-label">勝利数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="winRate">0</div>
                    <div class="stat-label">勝率(%)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="bestTime">---</div>
                    <div class="stat-label">最高記録</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="currentStreak">0</div>
                    <div class="stat-label">連勝</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="maxStreak">0</div>
                    <div class="stat-label">最長連勝</div>
                </div>
            </div>
        </div>

        <div class="instructions">
            <div class="instructions-title">🎯 遊び方</div>
            <ul class="instruction-list">
                <li><strong>左クリック:</strong> セルを開く</li>
                <li><strong>右クリック:</strong> 旗を立てる/外す</li>
                <li><strong>数字:</strong> 周囲8マスの地雷数を表示</li>
                <li><strong>目標:</strong> 地雷以外の全セルを開く</li>
                <li><strong>ゲームオーバー:</strong> 地雷を踏むと負け</li>
                <li><strong>ヒント:</strong> 数字の周りの未開セル数 = 数字なら全て地雷</li>
            </ul>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <div class="notification" id="notification">
        <div id="notificationMessage"></div>
    </div>

    <script>
        let gameBoard = [];
        let gameState = {
            rows: 9,
            cols: 9,
            mines: 10,
            gameStarted: false,
            gameEnded: false,
            firstClick: true,
            flagsPlaced: 0,
            cellsRevealed: 0,
            startTime: null,
            timerInterval: null
        };

        let gameStats = {
            gamesPlayed: 0,
            gamesWon: 0,
            currentStreak: 0,
            maxStreak: 0,
            bestTimes: {
                easy: null,
                medium: null,
                hard: null
            }
        };

        let currentDifficulty = 'easy';
        let hintsEnabled = false;

        const difficulties = {
            easy: { rows: 9, cols: 9, mines: 10 },
            medium: { rows: 16, cols: 16, mines: 40 },
            hard: { rows: 16, cols: 30, mines: 99 }
        };

        function loadStats() {
            const saved = localStorage.getItem('minesweeperStats');
            if (saved) {
                gameStats = { ...gameStats, ...JSON.parse(saved) };
                updateStatsDisplay();
            }
        }

        function saveStats() {
            localStorage.setItem('minesweeperStats', JSON.stringify(gameStats));
        }

        function setDifficulty(difficulty) {
            if (difficulty === 'custom') {
                const rows = parseInt(prompt('行数 (5-30):', '10')) || 10;
                const cols = parseInt(prompt('列数 (5-50):', '10')) || 10;
                const mines = parseInt(prompt('地雷数 (1-' + Math.floor(rows * cols * 0.8) + '):', '15')) || 15;
                
                if (rows < 5 || rows > 30 || cols < 5 || cols > 50 || mines < 1 || mines >= rows * cols) {
                    showNotification('無効な設定です', 'error');
                    return;
                }
                
                gameState.rows = rows;
                gameState.cols = cols;
                gameState.mines = mines;
                currentDifficulty = 'custom';
            } else {
                const config = difficulties[difficulty];
                gameState.rows = config.rows;
                gameState.cols = config.cols;
                gameState.mines = config.mines;
                currentDifficulty = difficulty;
            }

            // ボタンの状態更新
            document.querySelectorAll('.difficulty-btn').forEach(btn => btn.classList.remove('active'));
            if (difficulty !== 'custom') {
                event.target.classList.add('active');
            }

            newGame();
        }

        function newGame() {
            gameState.gameStarted = false;
            gameState.gameEnded = false;
            gameState.firstClick = true;
            gameState.flagsPlaced = 0;
            gameState.cellsRevealed = 0;
            gameState.startTime = null;
            
            if (gameState.timerInterval) {
                clearInterval(gameState.timerInterval);
                gameState.timerInterval = null;
            }

            initializeBoard();
            updateDisplay();
            updateGameStatus('左クリックで開く、右クリックで旗を立てる');
        }

        function initializeBoard() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';
            board.style.gridTemplateColumns = `repeat(${gameState.cols}, 1fr)`;

            gameBoard = [];
            for (let row = 0; row < gameState.rows; row++) {
                gameBoard[row] = [];
                for (let col = 0; col < gameState.cols; col++) {
                    const cell = {
                        isMine: false,
                        isRevealed: false,
                        isFlagged: false,
                        adjacentMines: 0
                    };
                    gameBoard[row][col] = cell;

                    const cellElement = document.createElement('div');
                    cellElement.className = 'cell';
                    cellElement.dataset.row = row;
                    cellElement.dataset.col = col;
                    
                    cellElement.addEventListener('click', (e) => handleCellClick(e, row, col));
                    cellElement.addEventListener('contextmenu', (e) => handleRightClick(e, row, col));
                    
                    board.appendChild(cellElement);
                }
            }
        }

        function placeMines(excludeRow, excludeCol) {
            let minesPlaced = 0;
            while (minesPlaced < gameState.mines) {
                const row = Math.floor(Math.random() * gameState.rows);
                const col = Math.floor(Math.random() * gameState.cols);
                
                // 最初のクリック位置とその周囲は避ける
                if (Math.abs(row - excludeRow) <= 1 && Math.abs(col - excludeCol) <= 1) {
                    continue;
                }
                
                if (!gameBoard[row][col].isMine) {
                    gameBoard[row][col].isMine = true;
                    minesPlaced++;
                }
            }

            // 隣接地雷数を計算
            for (let row = 0; row < gameState.rows; row++) {
                for (let col = 0; col < gameState.cols; col++) {
                    if (!gameBoard[row][col].isMine) {
                        gameBoard[row][col].adjacentMines = countAdjacentMines(row, col);
                    }
                }
            }
        }

        function countAdjacentMines(row, col) {
            let count = 0;
            for (let r = row - 1; r <= row + 1; r++) {
                for (let c = col - 1; c <= col + 1; c++) {
                    if (r >= 0 && r < gameState.rows && c >= 0 && c < gameState.cols) {
                        if (gameBoard[r][c].isMine) {
                            count++;
                        }
                    }
                }
            }
            return count;
        }

        function handleCellClick(e, row, col) {
            e.preventDefault();
            
            if (gameState.gameEnded || gameBoard[row][col].isRevealed || gameBoard[row][col].isFlagged) {
                return;
            }

            if (gameState.firstClick) {
                placeMines(row, col);
                startTimer();
                gameState.firstClick = false;
                gameState.gameStarted = true;
            }

            revealCell(row, col);
            updateDisplay();
            checkWinCondition();
        }

        function handleRightClick(e, row, col) {
            e.preventDefault();
            
            if (gameState.gameEnded || gameBoard[row][col].isRevealed) {
                return;
            }

            toggleFlag(row, col);
            updateDisplay();
        }

        function toggleFlag(row, col) {
            const cell = gameBoard[row][col];
            cell.isFlagged = !cell.isFlagged;
            
            if (cell.isFlagged) {
                gameState.flagsPlaced++;
            } else {
                gameState.flagsPlaced--;
            }
        }

        function revealCell(row, col) {
            const cell = gameBoard[row][col];
            
            if (cell.isRevealed || cell.isFlagged) {
                return;
            }

            cell.isRevealed = true;
            gameState.cellsRevealed++;

            if (cell.isMine) {
                gameOver(false);
                return;
            }

            // 隣接地雷がない場合は周囲も開く
            if (cell.adjacentMines === 0) {
                for (let r = row - 1; r <= row + 1; r++) {
                    for (let c = col - 1; c <= col + 1; c++) {
                        if (r >= 0 && r < gameState.rows && c >= 0 && c < gameState.cols) {
                            revealCell(r, c);
                        }
                    }
                }
            }
        }

        function checkWinCondition() {
            const totalCells = gameState.rows * gameState.cols;
            const cellsToReveal = totalCells - gameState.mines;
            
            if (gameState.cellsRevealed === cellsToReveal) {
                gameOver(true);
            }
        }

        function gameOver(won) {
            gameState.gameEnded = true;
            
            if (gameState.timerInterval) {
                clearInterval(gameState.timerInterval);
                gameState.timerInterval = null;
            }

            // 統計更新
            gameStats.gamesPlayed++;
            
            if (won) {
                gameStats.gamesWon++;
                gameStats.currentStreak++;
                gameStats.maxStreak = Math.max(gameStats.maxStreak, gameStats.currentStreak);
                
                const time = getElapsedTime();
                const bestKey = currentDifficulty === 'custom' ? null : currentDifficulty;
                
                if (bestKey && (!gameStats.bestTimes[bestKey] || time < gameStats.bestTimes[bestKey])) {
                    gameStats.bestTimes[bestKey] = time;
                    showNotification(`新記録！ ${time}秒`);
                }
                
                updateGameStatus('🎉 クリア！おめでとうございます！', 'win');
                
                // 全地雷に旗を立てる
                for (let row = 0; row < gameState.rows; row++) {
                    for (let col = 0; col < gameState.cols; col++) {
                        if (gameBoard[row][col].isMine && !gameBoard[row][col].isFlagged) {
                            gameBoard[row][col].isFlagged = true;
                            gameState.flagsPlaced++;
                        }
                    }
                }
            } else {
                gameStats.currentStreak = 0;
                updateGameStatus('💥 ゲームオーバー！地雷を踏みました', 'lose');
                
                // 全地雷を表示
                for (let row = 0; row < gameState.rows; row++) {
                    for (let col = 0; col < gameState.cols; col++) {
                        if (gameBoard[row][col].isMine) {
                            gameBoard[row][col].isRevealed = true;
                        }
                    }
                }
            }

            updateStatsDisplay();
            saveStats();
        }

        function startTimer() {
            gameState.startTime = Date.now();
            gameState.timerInterval = setInterval(updateTimer, 100);
        }

        function updateTimer() {
            const elapsed = getElapsedTime();
            document.getElementById('timer').textContent = elapsed.toString().padStart(3, '0');
        }

        function getElapsedTime() {
            return Math.floor((Date.now() - gameState.startTime) / 1000);
        }

        function updateDisplay() {
            const mineCount = document.getElementById('mineCount');
            const cellsLeft = document.getElementById('cellsLeft');
            
            mineCount.textContent = Math.max(0, gameState.mines - gameState.flagsPlaced);
            cellsLeft.textContent = (gameState.rows * gameState.cols) - gameState.mines - gameState.cellsRevealed;

            // ボードの更新
            for (let row = 0; row < gameState.rows; row++) {
                for (let col = 0; col < gameState.cols; col++) {
                    const cell = gameBoard[row][col];
                    const cellElement = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
                    
                    cellElement.className = 'cell';
                    cellElement.textContent = '';
                    
                    if (cell.isFlagged) {
                        cellElement.classList.add('flagged');
                        cellElement.textContent = '🚩';
                    } else if (cell.isRevealed) {
                        cellElement.classList.add('revealed');
                        
                        if (cell.isMine) {
                            cellElement.classList.add('mine');
                            cellElement.textContent = '💣';
                        } else if (cell.adjacentMines > 0) {
                            cellElement.classList.add(`number-${cell.adjacentMines}`);
                            cellElement.textContent = cell.adjacentMines;
                        }
                    }
                }
            }
        }

        function updateGameStatus(message, type = '') {
            const statusElement = document.getElementById('gameStatus');
            statusElement.innerHTML = `<div class="status-text ${type}">${message}</div>`;
        }

        function updateStatsDisplay() {
            document.getElementById('gamesPlayed').textContent = gameStats.gamesPlayed;
            document.getElementById('gamesWon').textContent = gameStats.gamesWon;
            document.getElementById('currentStreak').textContent = gameStats.currentStreak;
            document.getElementById('maxStreak').textContent = gameStats.maxStreak;
            
            const winRate = gameStats.gamesPlayed > 0 ? 
                Math.round((gameStats.gamesWon / gameStats.gamesPlayed) * 100) : 0;
            document.getElementById('winRate').textContent = winRate;
            
            const bestTime = gameStats.bestTimes[currentDifficulty];
            document.getElementById('bestTime').textContent = bestTime ? `${bestTime}秒` : '---';
        }

        function resetStats() {
            if (confirm('統計をリセットしますか？この操作は取り消せません。')) {
                gameStats = {
                    gamesPlayed: 0,
                    gamesWon: 0,
                    currentStreak: 0,
                    maxStreak: 0,
                    bestTimes: {
                        easy: null,
                        medium: null,
                        hard: null
                    }
                };
                updateStatsDisplay();
                localStorage.removeItem('minesweeperStats');
                showNotification('統計をリセットしました');
            }
        }

        function toggleHints() {
            hintsEnabled = !hintsEnabled;
            const btn = event.target;
            btn.textContent = hintsEnabled ? 'ヒント非表示' : 'ヒント表示';
            showNotification(hintsEnabled ? 'ヒント表示ON' : 'ヒント表示OFF');
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            const notificationMessage = document.getElementById('notificationMessage');
            
            notificationMessage.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // 初期化
        function init() {
            loadStats();
            newGame();
            updateStatsDisplay();
        }

        // ページ読み込み時の初期化
        document.addEventListener('DOMContentLoaded', init);
        
        // ページを離れる前に自動保存
        window.addEventListener('beforeunload', saveStats);
    </script>
</body>
</html>
