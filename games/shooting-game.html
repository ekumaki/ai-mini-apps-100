<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シューティングゲーム - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .shooting-game {
            background: #000;
            border-radius: 15px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            padding: 20px;
            max-width: 800px;
            width: 100%;
            border: 2px solid #00ff00;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            color: #00ff00;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ff00;
        }

        .header p {
            color: #ccc;
            font-size: 1rem;
        }

        .game-info {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .info-item {
            background: #1a1a1a;
            border: 1px solid #00ff00;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }

        .info-value {
            font-weight: 700;
            color: #00ff00;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .info-label {
            font-size: 0.8rem;
            color: #ccc;
        }

        .game-canvas {
            background: #000;
            border: 2px solid #00ff00;
            border-radius: 10px;
            display: block;
            margin: 0 auto 20px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .control-btn {
            background: linear-gradient(45deg, #1a1a1a, #333);
            color: #00ff00;
            border: 2px solid #00ff00;
            border-radius: 8px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
        }

        .control-btn:disabled {
            background: #333;
            color: #666;
            border-color: #666;
            cursor: not-allowed;
            box-shadow: none;
        }

        .game-status {
            background: #1a1a1a;
            color: #00ff00;
            border: 1px solid #00ff00;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .instructions {
            background: #1a1a1a;
            border: 1px solid #00ff00;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .instructions-title {
            color: #00ff00;
            font-size: 1.1rem;
            margin-bottom: 10px;
            font-weight: 600;
            text-align: center;
        }

        .instruction-list {
            color: #ccc;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .instruction-list li {
            margin-bottom: 5px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #00ff00;
            color: #000;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 255, 0, 0.3);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
            font-weight: 600;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.game-over {
            background: #ff0000;
            color: white;
        }

        .back-link {
            display: inline-block;
            color: #00ff00;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
            text-shadow: 0 0 5px #00ff00;
        }

        @media (max-width: 768px) {
            .shooting-game {
                padding: 15px;
            }
            
            .game-info {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .game-canvas {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="shooting-game">
        <div class="header">
            <h1>🚀 シューティングゲーム</h1>
            <p>宇宙船を操縦して敵を撃破しよう！</p>
        </div>

        <div class="game-info">
            <div class="info-item">
                <div class="info-value" id="score">0</div>
                <div class="info-label">スコア</div>
            </div>
            <div class="info-item">
                <div class="info-value" id="lives">3</div>
                <div class="info-label">残機</div>
            </div>
            <div class="info-item">
                <div class="info-value" id="level">1</div>
                <div class="info-label">レベル</div>
            </div>
            <div class="info-item">
                <div class="info-value" id="enemies">0</div>
                <div class="info-label">撃破数</div>
            </div>
        </div>

        <canvas id="gameCanvas" class="game-canvas" width="600" height="400"></canvas>

        <div class="game-status" id="gameStatus">
            矢印キーで移動、スペースキーで射撃
        </div>

        <div class="controls">
            <button class="control-btn" onclick="startGame()" id="startBtn">🎮 ゲーム開始</button>
            <button class="control-btn" onclick="pauseGame()" id="pauseBtn" disabled>⏸️ ポーズ</button>
            <button class="control-btn" onclick="resetGame()">🔄 リセット</button>
        </div>

        <div class="instructions">
            <div class="instructions-title">🎯 操作方法</div>
            <ul class="instruction-list">
                <li><strong>移動:</strong> 矢印キー（←→↑↓）</li>
                <li><strong>射撃:</strong> スペースキー</li>
                <li><strong>目標:</strong> 敵を撃破してスコアを稼ぐ</li>
                <li><strong>注意:</strong> 敵の弾や敵との接触でライフが減る</li>
                <li><strong>レベルアップ:</strong> 一定数撃破で難易度上昇</li>
            </ul>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <div class="notification" id="notification">
        <div id="notificationMessage"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = {
            player: {
                x: canvas.width / 2,
                y: canvas.height - 50,
                width: 30,
                height: 30,
                speed: 5
            },
            bullets: [],
            enemies: [],
            enemyBullets: [],
            particles: [],
            score: 0,
            lives: 3,
            level: 1,
            enemiesDestroyed: 0,
            gameRunning: false,
            gamePaused: false,
            gameLoop: null,
            keys: {},
            lastShot: 0,
            lastEnemySpawn: 0
        };

        function startGame() {
            if (gameState.gameRunning) return;
            
            gameState.gameRunning = true;
            gameState.gamePaused = false;
            gameState.score = 0;
            gameState.lives = 3;
            gameState.level = 1;
            gameState.enemiesDestroyed = 0;
            gameState.bullets = [];
            gameState.enemies = [];
            gameState.enemyBullets = [];
            gameState.particles = [];
            
            gameState.player.x = canvas.width / 2;
            gameState.player.y = canvas.height - 50;
            
            document.getElementById('startBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false;
            
            updateDisplay();
            updateGameStatus('ゲーム開始！敵を撃破しよう！');
            gameLoop();
            showNotification('ゲーム開始！');
        }

        function pauseGame() {
            if (!gameState.gameRunning) return;
            
            gameState.gamePaused = !gameState.gamePaused;
            const pauseBtn = document.getElementById('pauseBtn');
            
            if (gameState.gamePaused) {
                pauseBtn.textContent = '▶️ 再開';
                updateGameStatus('ゲーム一時停止中');
                showNotification('ゲームを一時停止しました');
            } else {
                pauseBtn.textContent = '⏸️ ポーズ';
                updateGameStatus('ゲーム中...');
                showNotification('ゲームを再開しました');
            }
        }

        function resetGame() {
            gameState.gameRunning = false;
            gameState.gamePaused = false;
            
            if (gameState.gameLoop) {
                cancelAnimationFrame(gameState.gameLoop);
            }
            
            document.getElementById('startBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
            document.getElementById('pauseBtn').textContent = '⏸️ ポーズ';
            
            gameState.score = 0;
            gameState.lives = 3;
            gameState.level = 1;
            gameState.enemiesDestroyed = 0;
            
            updateDisplay();
            updateGameStatus('ゲーム開始ボタンを押してスタート');
            
            // キャンバスをクリア
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawPlayer();
            
            showNotification('ゲームをリセットしました');
        }

        function gameLoop() {
            if (!gameState.gameRunning) return;
            
            if (!gameState.gamePaused) {
                update();
                draw();
            }
            
            gameState.gameLoop = requestAnimationFrame(gameLoop);
        }

        function update() {
            // プレイヤー移動
            movePlayer();
            
            // 弾の更新
            updateBullets();
            
            // 敵の更新
            updateEnemies();
            
            // 敵の弾の更新
            updateEnemyBullets();
            
            // パーティクルの更新
            updateParticles();
            
            // 衝突検出
            checkCollisions();
            
            // 敵の生成
            spawnEnemies();
            
            // レベルアップチェック
            checkLevelUp();
        }

        function movePlayer() {
            if (gameState.keys['ArrowLeft'] && gameState.player.x > 0) {
                gameState.player.x -= gameState.player.speed;
            }
            if (gameState.keys['ArrowRight'] && gameState.player.x < canvas.width - gameState.player.width) {
                gameState.player.x += gameState.player.speed;
            }
            if (gameState.keys['ArrowUp'] && gameState.player.y > 0) {
                gameState.player.y -= gameState.player.speed;
            }
            if (gameState.keys['ArrowDown'] && gameState.player.y < canvas.height - gameState.player.height) {
                gameState.player.y += gameState.player.speed;
            }
            
            // 射撃
            if (gameState.keys[' '] && Date.now() - gameState.lastShot > 200) {
                shoot();
                gameState.lastShot = Date.now();
            }
        }

        function shoot() {
            gameState.bullets.push({
                x: gameState.player.x + gameState.player.width / 2,
                y: gameState.player.y,
                width: 3,
                height: 10,
                speed: 8
            });
        }

        function updateBullets() {
            gameState.bullets = gameState.bullets.filter(bullet => {
                bullet.y -= bullet.speed;
                return bullet.y > -bullet.height;
            });
        }

        function updateEnemies() {
            gameState.enemies.forEach(enemy => {
                enemy.y += enemy.speed;
                
                // 敵の射撃
                if (Math.random() < 0.003) {
                    gameState.enemyBullets.push({
                        x: enemy.x + enemy.width / 2,
                        y: enemy.y + enemy.height,
                        width: 3,
                        height: 8,
                        speed: 3
                    });
                }
            });
            
            gameState.enemies = gameState.enemies.filter(enemy => enemy.y < canvas.height + enemy.height);
        }

        function updateEnemyBullets() {
            gameState.enemyBullets = gameState.enemyBullets.filter(bullet => {
                bullet.y += bullet.speed;
                return bullet.y < canvas.height + bullet.height;
            });
        }

        function updateParticles() {
            gameState.particles = gameState.particles.filter(particle => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.life--;
                return particle.life > 0;
            });
        }

        function spawnEnemies() {
            const now = Date.now();
            const spawnRate = Math.max(500 - gameState.level * 50, 200);
            
            if (now - gameState.lastEnemySpawn > spawnRate) {
                gameState.enemies.push({
                    x: Math.random() * (canvas.width - 30),
                    y: -30,
                    width: 30,
                    height: 30,
                    speed: 1 + gameState.level * 0.5
                });
                gameState.lastEnemySpawn = now;
            }
        }

        function checkCollisions() {
            // プレイヤーの弾と敵の衝突
            gameState.bullets.forEach((bullet, bulletIndex) => {
                gameState.enemies.forEach((enemy, enemyIndex) => {
                    if (isColliding(bullet, enemy)) {
                        // 爆発エフェクト
                        createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);
                        
                        gameState.bullets.splice(bulletIndex, 1);
                        gameState.enemies.splice(enemyIndex, 1);
                        gameState.score += 100;
                        gameState.enemiesDestroyed++;
                        updateDisplay();
                    }
                });
            });
            
            // プレイヤーと敵の衝突
            gameState.enemies.forEach((enemy, enemyIndex) => {
                if (isColliding(gameState.player, enemy)) {
                    gameState.enemies.splice(enemyIndex, 1);
                    takeDamage();
                }
            });
            
            // プレイヤーと敵の弾の衝突
            gameState.enemyBullets.forEach((bullet, bulletIndex) => {
                if (isColliding(gameState.player, bullet)) {
                    gameState.enemyBullets.splice(bulletIndex, 1);
                    takeDamage();
                }
            });
        }

        function isColliding(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function takeDamage() {
            gameState.lives--;
            updateDisplay();
            
            if (gameState.lives <= 0) {
                gameOver();
            } else {
                showNotification(`残機: ${gameState.lives}`, 'game-over');
            }
        }

        function createExplosion(x, y) {
            for (let i = 0; i < 8; i++) {
                gameState.particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 30,
                    color: `hsl(${Math.random() * 60 + 15}, 100%, 50%)`
                });
            }
        }

        function checkLevelUp() {
            const newLevel = Math.floor(gameState.enemiesDestroyed / 10) + 1;
            if (newLevel > gameState.level) {
                gameState.level = newLevel;
                updateDisplay();
                showNotification(`レベル ${gameState.level} にアップ！`);
            }
        }

        function gameOver() {
            gameState.gameRunning = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
            
            updateGameStatus(`ゲームオーバー！最終スコア: ${gameState.score}`);
            showNotification(`ゲームオーバー！スコア: ${gameState.score}`, 'game-over');
        }

        function draw() {
            // 背景をクリア
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 星を描画
            drawStars();
            
            // プレイヤーを描画
            drawPlayer();
            
            // 弾を描画
            drawBullets();
            
            // 敵を描画
            drawEnemies();
            
            // 敵の弾を描画
            drawEnemyBullets();
            
            // パーティクルを描画
            drawParticles();
        }

        function drawStars() {
            ctx.fillStyle = '#fff';
            for (let i = 0; i < 50; i++) {
                const x = (Date.now() * 0.01 + i * 123) % canvas.width;
                const y = (Date.now() * 0.02 + i * 456) % canvas.height;
                ctx.fillRect(x, y, 1, 1);
            }
        }

        function drawPlayer() {
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(gameState.player.x, gameState.player.y, gameState.player.width, gameState.player.height);
            
            // プレイヤーの詳細
            ctx.fillStyle = '#fff';
            ctx.fillRect(gameState.player.x + 5, gameState.player.y + 5, 20, 20);
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(gameState.player.x + 10, gameState.player.y + 10, 10, 10);
        }

        function drawBullets() {
            ctx.fillStyle = '#ffff00';
            gameState.bullets.forEach(bullet => {
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            });
        }

        function drawEnemies() {
            ctx.fillStyle = '#ff0000';
            gameState.enemies.forEach(enemy => {
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                
                // 敵の詳細
                ctx.fillStyle = '#fff';
                ctx.fillRect(enemy.x + 5, enemy.y + 5, 20, 20);
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(enemy.x + 10, enemy.y + 10, 10, 10);
            });
        }

        function drawEnemyBullets() {
            ctx.fillStyle = '#ff6600';
            gameState.enemyBullets.forEach(bullet => {
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            });
        }

        function drawParticles() {
            gameState.particles.forEach(particle => {
                const alpha = particle.life / 30;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = particle.color;
                ctx.fillRect(particle.x, particle.y, 3, 3);
            });
            ctx.globalAlpha = 1;
        }

        function updateDisplay() {
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('lives').textContent = gameState.lives;
            document.getElementById('level').textContent = gameState.level;
            document.getElementById('enemies').textContent = gameState.enemiesDestroyed;
        }

        function updateGameStatus(message) {
            document.getElementById('gameStatus').textContent = message;
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            const notificationMessage = document.getElementById('notificationMessage');
            
            notificationMessage.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // キーボード操作
        document.addEventListener('keydown', (e) => {
            gameState.keys[e.key] = true;
            e.preventDefault();
        });

        document.addEventListener('keyup', (e) => {
            gameState.keys[e.key] = false;
        });

        // 初期化
        function init() {
            updateDisplay();
            draw();
            updateGameStatus('ゲーム開始ボタンを押してスタート');
        }

        // ページ読み込み時の初期化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
