<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スロットマシン - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .slot-machine {
            background: linear-gradient(145deg, #2c3e50, #34495e);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            padding: 30px;
            max-width: 600px;
            width: 100%;
            border: 3px solid #f39c12;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: #f39c12;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .header p {
            color: #ecf0f1;
            font-size: 1.1rem;
        }

        .slot-display {
            background: linear-gradient(145deg, #1a1a1a, #2c2c2c);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border: 3px solid #f39c12;
            box-shadow: inset 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .reels-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .reel {
            width: 120px;
            height: 150px;
            background: #34495e;
            border: 2px solid #7f8c8d;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        .reel-symbols {
            position: absolute;
            width: 100%;
            transition: transform 0.1s ease;
        }

        .symbol {
            width: 100%;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            background: linear-gradient(145deg, #ecf0f1, #bdc3c7);
            border-bottom: 1px solid #95a5a6;
        }

        .paylines {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .payline {
            padding: 8px 12px;
            background: #e74c3c;
            color: white;
            border-radius: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .payline.active {
            background: #27ae60;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .game-info {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .info-card {
            background: linear-gradient(145deg, #3498db, #2980b9);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .info-value {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .info-label {
            font-size: 0.8rem;
            opacity: 0.9;
        }

        .credits { background: linear-gradient(145deg, #f39c12, #e67e22); }
        .bet { background: linear-gradient(145deg, #e74c3c, #c0392b); }
        .win { background: linear-gradient(145deg, #27ae60, #229954); }
        .jackpot { background: linear-gradient(145deg, #9b59b6, #8e44ad); }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .control-btn {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .spin-btn {
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            color: white;
            font-size: 1.3rem;
            padding: 20px 40px;
        }

        .spin-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(231, 76, 60, 0.4);
        }

        .spin-btn:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .bet-btn {
            background: linear-gradient(145deg, #f39c12, #e67e22);
            color: white;
        }

        .bet-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(243, 156, 18, 0.4);
        }

        .auto-btn {
            background: linear-gradient(145deg, #3498db, #2980b9);
            color: white;
        }

        .auto-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.4);
        }

        .auto-btn.active {
            background: linear-gradient(145deg, #27ae60, #229954);
        }

        .paytable {
            background: linear-gradient(145deg, #34495e, #2c3e50);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border: 2px solid #f39c12;
        }

        .paytable-title {
            color: #f39c12;
            font-size: 1.3rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 15px;
        }

        .paytable-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .paytable-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(52, 152, 219, 0.1);
            padding: 8px 12px;
            border-radius: 5px;
            color: #ecf0f1;
        }

        .win-animation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(45deg, #f39c12, #e67e22);
            color: white;
            padding: 30px;
            border-radius: 20px;
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            z-index: 1000;
            animation: winPop 2s ease;
            display: none;
        }

        @keyframes winPop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #27ae60;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.jackpot {
            background: #e74c3c;
            font-size: 1.2rem;
        }

        .back-link {
            display: inline-block;
            color: #f39c12;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .slot-machine {
                padding: 20px;
            }
            
            .reel {
                width: 90px;
                height: 120px;
            }
            
            .symbol {
                height: 120px;
                font-size: 3rem;
            }
            
            .game-info {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="slot-machine">
        <div class="header">
            <h1>🎰 スロットマシン</h1>
            <p>3つのリールを揃えて大当たりを狙おう！</p>
        </div>

        <div class="slot-display">
            <div class="reels-container">
                <div class="reel" id="reel1">
                    <div class="reel-symbols" id="symbols1"></div>
                </div>
                <div class="reel" id="reel2">
                    <div class="reel-symbols" id="symbols2"></div>
                </div>
                <div class="reel" id="reel3">
                    <div class="reel-symbols" id="symbols3"></div>
                </div>
            </div>

            <div class="paylines">
                <div class="payline" id="line1">ライン 1</div>
                <div class="payline" id="line2">ライン 2</div>
                <div class="payline" id="line3">ライン 3</div>
            </div>
        </div>

        <div class="game-info">
            <div class="info-card credits">
                <div class="info-value" id="credits">1000</div>
                <div class="info-label">クレジット</div>
            </div>
            <div class="info-card bet">
                <div class="info-value" id="betAmount">10</div>
                <div class="info-label">ベット額</div>
            </div>
            <div class="info-card win">
                <div class="info-value" id="lastWin">0</div>
                <div class="info-label">前回の当たり</div>
            </div>
            <div class="info-card jackpot">
                <div class="info-value" id="jackpotAmount">5000</div>
                <div class="info-label">ジャックポット</div>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn bet-btn" onclick="changeBet()">ベット変更</button>
            <button class="control-btn spin-btn" onclick="spin()" id="spinBtn">🎰 スピン！</button>
            <button class="control-btn auto-btn" onclick="toggleAutoSpin()" id="autoBtn">オートスピン</button>
        </div>

        <div class="paytable">
            <div class="paytable-title">💰 配当表</div>
            <div class="paytable-grid">
                <div class="paytable-row">
                    <span>🍒🍒🍒</span>
                    <span>×20</span>
                </div>
                <div class="paytable-row">
                    <span>🍋🍋🍋</span>
                    <span>×30</span>
                </div>
                <div class="paytable-row">
                    <span>🍊🍊🍊</span>
                    <span>×40</span>
                </div>
                <div class="paytable-row">
                    <span>🍇🍇🍇</span>
                    <span>×50</span>
                </div>
                <div class="paytable-row">
                    <span>🔔🔔🔔</span>
                    <span>×75</span>
                </div>
                <div class="paytable-row">
                    <span>💎💎💎</span>
                    <span>×100</span>
                </div>
                <div class="paytable-row">
                    <span>⭐⭐⭐</span>
                    <span>×150</span>
                </div>
                <div class="paytable-row">
                    <span>🎰🎰🎰</span>
                    <span>JACKPOT!</span>
                </div>
            </div>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <div class="win-animation" id="winAnimation">
        <div id="winText">🎉 BIG WIN! 🎉</div>
    </div>

    <div class="notification" id="notification">
        <div id="notificationMessage"></div>
    </div>

    <script>
        let gameState = {
            credits: 1000,
            betAmount: 10,
            lastWin: 0,
            jackpotAmount: 5000,
            isSpinning: false,
            autoSpin: false,
            autoSpinInterval: null,
            currentSymbols: [0, 0, 0]
        };

        const symbols = ['🍒', '🍋', '🍊', '🍇', '🔔', '💎', '⭐', '🎰'];
        const payouts = {
            '🍒🍒🍒': 20,
            '🍋🍋🍋': 30,
            '🍊🍊🍊': 40,
            '🍇🍇🍇': 50,
            '🔔🔔🔔': 75,
            '💎💎💎': 100,
            '⭐⭐⭐': 150,
            '🎰🎰🎰': 'JACKPOT'
        };

        const betAmounts = [5, 10, 25, 50, 100];
        let currentBetIndex = 1;

        function initializeReels() {
            for (let i = 1; i <= 3; i++) {
                const symbolsContainer = document.getElementById(`symbols${i}`);
                symbolsContainer.innerHTML = '';
                
                // 各リールに複数のシンボルを配置
                for (let j = 0; j < 20; j++) {
                    const symbolDiv = document.createElement('div');
                    symbolDiv.className = 'symbol';
                    symbolDiv.textContent = symbols[j % symbols.length];
                    symbolsContainer.appendChild(symbolDiv);
                }
            }
        }

        function updateDisplay() {
            document.getElementById('credits').textContent = gameState.credits;
            document.getElementById('betAmount').textContent = gameState.betAmount;
            document.getElementById('lastWin').textContent = gameState.lastWin;
            document.getElementById('jackpotAmount').textContent = gameState.jackpotAmount;
            
            // スピンボタンの状態
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = gameState.credits < gameState.betAmount || gameState.isSpinning;
        }

        function changeBet() {
            if (gameState.isSpinning) return;
            
            currentBetIndex = (currentBetIndex + 1) % betAmounts.length;
            gameState.betAmount = betAmounts[currentBetIndex];
            updateDisplay();
            showNotification(`ベット額を${gameState.betAmount}に変更しました`);
        }

        function spin() {
            if (gameState.credits < gameState.betAmount || gameState.isSpinning) {
                showNotification('クレジットが不足しています', 'error');
                return;
            }

            gameState.isSpinning = true;
            gameState.credits -= gameState.betAmount;
            gameState.jackpotAmount += Math.floor(gameState.betAmount * 0.1);
            updateDisplay();

            // リール回転アニメーション
            const spinDurations = [1000, 1500, 2000];
            const results = [];

            for (let i = 1; i <= 3; i++) {
                const symbolsContainer = document.getElementById(`symbols${i}`);
                const finalSymbolIndex = Math.floor(Math.random() * symbols.length);
                results.push(symbols[finalSymbolIndex]);
                
                // 回転アニメーション
                let rotations = 0;
                const maxRotations = 10 + i * 5;
                const interval = setInterval(() => {
                    const offset = -150 * (rotations % symbols.length);
                    symbolsContainer.style.transform = `translateY(${offset}px)`;
                    rotations++;
                    
                    if (rotations >= maxRotations) {
                        clearInterval(interval);
                        // 最終的な位置に設定
                        const finalOffset = -150 * finalSymbolIndex;
                        symbolsContainer.style.transform = `translateY(${finalOffset}px)`;
                        
                        // 全リールが止まったかチェック
                        if (i === 3) {
                            setTimeout(() => {
                                checkWin(results);
                                gameState.isSpinning = false;
                                updateDisplay();
                            }, 500);
                        }
                    }
                }, 100);
            }
        }

        function checkWin(results) {
            const combination = results.join('');
            gameState.lastWin = 0;

            // 完全一致のチェック
            if (payouts[combination]) {
                if (payouts[combination] === 'JACKPOT') {
                    gameState.lastWin = gameState.jackpotAmount;
                    gameState.credits += gameState.jackpotAmount;
                    gameState.jackpotAmount = 5000; // リセット
                    showWinAnimation(`🎰 JACKPOT! 🎰<br>${gameState.lastWin} クレジット獲得！`);
                    showNotification(`🎰 JACKPOT! ${gameState.lastWin}クレジット獲得！`, 'jackpot');
                } else {
                    gameState.lastWin = gameState.betAmount * payouts[combination];
                    gameState.credits += gameState.lastWin;
                    showWinAnimation(`🎉 WIN! 🎉<br>${gameState.lastWin} クレジット獲得！`);
                    showNotification(`${gameState.lastWin}クレジット獲得！`);
                }
                
                // ペイライン点灯
                activatePaylines();
            } else {
                // 2つ一致のチェック
                const uniqueSymbols = [...new Set(results)];
                if (uniqueSymbols.length === 2) {
                    gameState.lastWin = gameState.betAmount * 2;
                    gameState.credits += gameState.lastWin;
                    showNotification(`2つ揃い！${gameState.lastWin}クレジット獲得！`);
                }
            }

            updateDisplay();
        }

        function activatePaylines() {
            document.querySelectorAll('.payline').forEach(line => {
                line.classList.add('active');
            });
            
            setTimeout(() => {
                document.querySelectorAll('.payline').forEach(line => {
                    line.classList.remove('active');
                });
            }, 2000);
        }

        function showWinAnimation(text) {
            const winAnimation = document.getElementById('winAnimation');
            const winText = document.getElementById('winText');
            
            winText.innerHTML = text;
            winAnimation.style.display = 'block';
            
            setTimeout(() => {
                winAnimation.style.display = 'none';
            }, 2000);
        }

        function toggleAutoSpin() {
            const autoBtn = document.getElementById('autoBtn');
            
            if (gameState.autoSpin) {
                gameState.autoSpin = false;
                clearInterval(gameState.autoSpinInterval);
                autoBtn.textContent = 'オートスピン';
                autoBtn.classList.remove('active');
                showNotification('オートスピンを停止しました');
            } else {
                if (gameState.credits < gameState.betAmount) {
                    showNotification('クレジットが不足しています', 'error');
                    return;
                }
                
                gameState.autoSpin = true;
                autoBtn.textContent = '停止';
                autoBtn.classList.add('active');
                showNotification('オートスピンを開始しました');
                
                gameState.autoSpinInterval = setInterval(() => {
                    if (gameState.credits >= gameState.betAmount && !gameState.isSpinning) {
                        spin();
                    } else {
                        toggleAutoSpin();
                    }
                }, 3000);
            }
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            const notificationMessage = document.getElementById('notificationMessage');
            
            notificationMessage.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // キーボードショートカット
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !gameState.isSpinning) {
                e.preventDefault();
                spin();
            }
        });

        // 初期化
        function init() {
            initializeReels();
            updateDisplay();
            showNotification('スロットマシンへようこそ！');
        }

        // ページ読み込み時の初期化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
