            border-radius: 25px;
            font-size: 16px;
            outline: none;

            gap: 10px;

        }

            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 600;

            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
            font-weight: 600;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .app-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            border: 2px solid transparent;
            cursor: pointer;
        }

        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
        }

        .app-card.created {
            border-color: #28a745;
        }

        .app-card.not-created {
            opacity: 0.6;
            background: #f8f9fa;
        }

        .app-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .app-description {
            color: #666;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .app-status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;

            color: #155724;

            color: #721c24;

            text-align: center;

        // カテゴリ情報
        const categories = {
            "calculators": "計算ツール系",
            "text-tools": "文書・テキスト処理系",
            "datetime-tools": "日時・スケジュール系",
            "utility-tools": "便利ツール系",
            "games": "ゲーム・エンタメ系",
            "templates": "書類テンプレート系"
        };

        // グローバル変数
        let currentFilter = 'all';
        let currentSearch = '';

        // 初期化
        function init() {
            updateProgress();
            renderApps();
            setupEventListeners();
        }

        // 進捗更新
        function updateProgress() {
            const createdCount = apps.filter(app => app.created).length;
            const progress = (createdCount / apps.length) * 100;
            
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = `進捗: ${createdCount}/${apps.length} アプリ作成済み`;
        }

        // アプリリスト表示
        function renderApps() {
            const content = document.getElementById('content');
            const filteredApps = filterApps();
            
            // カテゴリごとにグループ化
            const groupedApps = {};
            filteredApps.forEach(app => {
                if (!groupedApps[app.category]) {
                    groupedApps[app.category] = [];
                }
                groupedApps[app.category].push(app);
            });

            let html = '';
            Object.keys(categories).forEach(categoryKey => {
                const categoryApps = groupedApps[categoryKey];
                if (!categoryApps || categoryApps.length === 0) return;

                html += `
                    <div class="category">
                        <h2 class="category-title">${categories[categoryKey]} (${categoryApps.length}個)</h2>
                        <div class="apps-grid">
                            ${categoryApps.map(app => createAppCard(app)).join('')}
                        </div>
                    </div>
                `;
            });

            if (html === '') {
                html = '<div style="text-align: center; padding: 50px; color: #666;">該当するアプリが見つかりません</div>';
            }

            content.innerHTML = html;
        }

        // アプリカード作成
        function createAppCard(app) {
            const statusClass = app.created ? 'created' : 'not-created';
            const statusLabel = app.created ? '作成済み' : '未作成';
            const statusLabelClass = app.created ? 'status-created' : 'status-not-created';

            return `
                <div class="app-card ${statusClass}" onclick="openApp('${app.file}', ${app.created})">
                    <div class="app-title">${app.title}</div>
                    <div class="app-description">${app.description}</div>
                    <div class="app-status ${statusLabelClass}">${statusLabel}</div>
                </div>
            `;
        }

        // アプリフィルタリング
        function filterApps() {
            return apps.filter(app => {
                // フィルター条件
                const matchesFilter = currentFilter === 'all' || 
                    (currentFilter === 'created' && app.created) ||
                    (currentFilter === 'not-created' && !app.created);

                // 検索条件
                const matchesSearch = currentSearch === '' || 
                    app.title.toLowerCase().includes(currentSearch.toLowerCase()) ||
                    app.description.toLowerCase().includes(currentSearch.toLowerCase());

                return matchesFilter && matchesSearch;
            });
        }

        // アプリを開く
        function openApp(file, created) {
            if (created) {
                window.open(file, '_blank');
            } else {
                alert('このアプリはまだ作成されていません。');
            }
        }

        // イベントリスナー設定
        function setupEventListeners() {
            // 検索ボックス
            document.getElementById('searchBox').addEventListener('input', (e) => {
                currentSearch = e.target.value;
                renderApps();
            });

            // フィルターボタン
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFilter = e.target.dataset.filter;
                    renderApps();
                });
            });
        }

        // 初期化実行
        document.addEventListener('DOMContentLoaded', init);
    </script>
