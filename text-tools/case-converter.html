<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大文字小文字変換 - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .converter {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 800px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .info {
            background: #e7f3ff;
            border: 1px solid #b3d7ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #0066cc;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .text-input {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            resize: vertical;
            transition: border-color 0.3s ease;
        }

        .text-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .text-input::placeholder {
            color: #adb5bd;
        }

        .conversion-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .conversion-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 15px 20px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            text-align: center;
        }

        .conversion-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .conversion-btn.special {
            background: #28a745;
        }

        .conversion-btn.special:hover {
            background: #218838;
        }

        .result-section {
            margin-bottom: 30px;
        }

        .result-tabs {
            display: flex;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 5px;
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .result-tab {
            flex: 1;
            min-width: 100px;
            padding: 10px 15px;
            background: transparent;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .result-tab.active {
            background: #667eea;
            color: white;
        }

        .result-tab:hover:not(.active) {
            background: #e9ecef;
        }

        .result-content {
            display: none;
        }

        .result-content.active {
            display: block;
        }

        .result-output {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            resize: vertical;
            cursor: text;
        }

        .result-output:focus {
            outline: none;
            border-color: #667eea;
        }

        .stats {
            background: #e8f5e8;
            border: 1px solid #c3e6cb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .stats-title {
            font-weight: 600;
            color: #155724;
            margin-bottom: 15px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-item {
            background: white;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #155724;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        .examples {
            background: #fff8e1;
            border: 1px solid #ffcc02;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .examples-title {
            font-weight: 600;
            color: #ff8f00;
            margin-bottom: 15px;
        }

        .example-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: white;
            border: 1px solid #ffcc02;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .example-item:last-child {
            margin-bottom: 0;
        }

        .example-text {
            font-family: monospace;
            font-size: 0.9rem;
            color: #333;
        }

        .example-btn {
            background: #ff8f00;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .example-btn:hover {
            background: #e68900;
        }

        .options {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .options-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .option-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }

        .option label {
            color: #333;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 0;
        }

        .export-section {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .export-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .export-btn {
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .export-btn:hover {
            background: #5a6268;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .conversion-buttons {
                grid-template-columns: 1fr;
            }
            
            .result-tabs {
                flex-direction: column;
                gap: 5px;
            }
            
            .result-tab {
                flex: none;
            }
        }
    </style>
</head>
<body>
    <div class="converter">
        <div class="header">
            <h1>大文字小文字変換</h1>
            <p>テキストの大文字小文字を様々な形式に変換</p>
        </div>

        <div class="info">
            英数字の大文字小文字を様々な形式に変換できます。プログラミングで使用される命名規則にも対応。
        </div>

        <div class="input-section">
            <div class="input-group">
                <label for="inputText">変換したいテキスト</label>
                <textarea 
                    id="inputText" 
                    class="text-input" 
                    placeholder="Here Is Some Sample Text To Convert"
                    oninput="convertAll()"
                ></textarea>
            </div>
        </div>

        <div class="conversion-buttons">
            <button class="conversion-btn" onclick="convertText('uppercase')">すべて大文字</button>
            <button class="conversion-btn" onclick="convertText('lowercase')">すべて小文字</button>
            <button class="conversion-btn" onclick="convertText('capitalize')">頭文字のみ大文字</button>
            <button class="conversion-btn" onclick="convertText('title')">タイトルケース</button>
            <button class="conversion-btn special" onclick="convertText('camelCase')">キャメルケース</button>
            <button class="conversion-btn special" onclick="convertText('pascalCase')">パスカルケース</button>
            <button class="conversion-btn special" onclick="convertText('snakeCase')">スネークケース</button>
            <button class="conversion-btn special" onclick="convertText('kebabCase')">ケバブケース</button>
            <button class="conversion-btn" onclick="convertText('toggle')">大文字小文字反転</button>
            <button class="conversion-btn" onclick="convertText('random')">ランダム</button>
        </div>

        <div class="options">
            <div class="options-title">変換オプション</div>
            <div class="option-group">
                <div class="option">
                    <input type="checkbox" id="preserveNumbers" checked>
                    <label for="preserveNumbers">数字を保持</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="preserveSpaces" checked>
                    <label for="preserveSpaces">スペースを保持</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="preserveSpecialChars" checked>
                    <label for="preserveSpecialChars">特殊文字を保持</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="removeExtraSpaces">
                    <label for="removeExtraSpaces">余分なスペースを削除</label>
                </div>
            </div>
        </div>

        <div class="result-section">
            <div class="result-tabs">
                <button class="result-tab active" onclick="switchTab('uppercase')">大文字</button>
                <button class="result-tab" onclick="switchTab('lowercase')">小文字</button>
                <button class="result-tab" onclick="switchTab('capitalize')">頭文字大文字</button>
                <button class="result-tab" onclick="switchTab('title')">タイトル</button>
                <button class="result-tab" onclick="switchTab('camelCase')">キャメル</button>
                <button class="result-tab" onclick="switchTab('pascalCase')">パスカル</button>
                <button class="result-tab" onclick="switchTab('snakeCase')">スネーク</button>
                <button class="result-tab" onclick="switchTab('kebabCase')">ケバブ</button>
            </div>

            <div class="result-content active" id="uppercase-content">
                <textarea class="result-output" id="uppercase-output" readonly></textarea>
            </div>
            <div class="result-content" id="lowercase-content">
                <textarea class="result-output" id="lowercase-output" readonly></textarea>
            </div>
            <div class="result-content" id="capitalize-content">
                <textarea class="result-output" id="capitalize-output" readonly></textarea>
            </div>
            <div class="result-content" id="title-content">
                <textarea class="result-output" id="title-output" readonly></textarea>
            </div>
            <div class="result-content" id="camelCase-content">
                <textarea class="result-output" id="camelCase-output" readonly></textarea>
            </div>
            <div class="result-content" id="pascalCase-content">
                <textarea class="result-output" id="pascalCase-output" readonly></textarea>
            </div>
            <div class="result-content" id="snakeCase-content">
                <textarea class="result-output" id="snakeCase-output" readonly></textarea>
            </div>
            <div class="result-content" id="kebabCase-content">
                <textarea class="result-output" id="kebabCase-output" readonly></textarea>
            </div>
        </div>

        <div class="stats">
            <div class="stats-title">変換統計</div>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="totalChars">0</div>
                    <div class="stat-label">総文字数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="uppercaseCount">0</div>
                    <div class="stat-label">大文字数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="lowercaseCount">0</div>
                    <div class="stat-label">小文字数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="numberCount">0</div>
                    <div class="stat-label">数字数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="spaceCount">0</div>
                    <div class="stat-label">スペース数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="specialCount">0</div>
                    <div class="stat-label">特殊文字数</div>
                </div>
            </div>
        </div>

        <div class="examples">
            <div class="examples-title">サンプルテキスト</div>
            <div class="example-item">
                <span class="example-text">Hello World Programming</span>
                <button class="example-btn" onclick="loadExample('Hello World Programming')">使用</button>
            </div>
            <div class="example-item">
                <span class="example-text">convert_this_text_to_various_formats</span>
                <button class="example-btn" onclick="loadExample('convert_this_text_to_various_formats')">使用</button>
            </div>
            <div class="example-item">
                <span class="example-text">ThisIsACamelCaseExample</span>
                <button class="example-btn" onclick="loadExample('ThisIsACamelCaseExample')">使用</button>
            </div>
            <div class="example-item">
                <span class="example-text">kebab-case-example-text</span>
                <button class="example-btn" onclick="loadExample('kebab-case-example-text')">使用</button>
            </div>
        </div>

        <div class="export-section">
            <div class="export-title">結果をエクスポート</div>
            <div class="export-buttons">
                <button class="export-btn" onclick="exportResults('text')">テキストファイル</button>
                <button class="export-btn" onclick="exportResults('json')">JSON形式</button>
                <button class="export-btn" onclick="copyCurrentResult()">現在の結果をコピー</button>
                <button class="export-btn" onclick="copyAllResults()">全ての結果をコピー</button>
            </div>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <script>
        let currentTab = 'uppercase';
        let conversionResults = {};

        function convertText(type) {
            const text = document.getElementById('inputText').value;
            const result = performConversion(text, type);
            
            // 結果を対応するタブに設定
            const outputElement = document.getElementById(`${type}-output`);
            if (outputElement) {
                outputElement.value = result;
            }
            
            // 該当するタブに切り替え
            switchTab(type);
        }

        function convertAll() {
            const text = document.getElementById('inputText').value;
            
            const conversions = [
                'uppercase', 'lowercase', 'capitalize', 'title',
                'camelCase', 'pascalCase', 'snakeCase', 'kebabCase'
            ];
            
            conversions.forEach(type => {
                const result = performConversion(text, type);
                conversionResults[type] = result;
                
                const outputElement = document.getElementById(`${type}-output`);
                if (outputElement) {
                    outputElement.value = result;
                }
            });
            
            updateStats(text);
        }

        function performConversion(text, type) {
            if (!text) return '';
            
            const preserveNumbers = document.getElementById('preserveNumbers').checked;
            const preserveSpaces = document.getElementById('preserveSpaces').checked;
            const preserveSpecialChars = document.getElementById('preserveSpecialChars').checked;
            const removeExtraSpaces = document.getElementById('removeExtraSpaces').checked;
            
            let result = text;
            
            // 余分なスペースを削除
            if (removeExtraSpaces) {
                result = result.replace(/\s+/g, ' ').trim();
            }
            
            switch (type) {
                case 'uppercase':
                    result = result.toUpperCase();
                    break;
                    
                case 'lowercase':
                    result = result.toLowerCase();
                    break;
                    
                case 'capitalize':
                    result = result.charAt(0).toUpperCase() + result.slice(1).toLowerCase();
                    break;
                    
                case 'title':
                    result = result.replace(/\w\S*/g, (txt) => {
                        return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
                    });
                    break;
                    
                case 'camelCase':
                    result = toCamelCase(result);
                    break;
                    
                case 'pascalCase':
                    result = toPascalCase(result);
                    break;
                    
                case 'snakeCase':
                    result = toSnakeCase(result);
                    break;
                    
                case 'kebabCase':
                    result = toKebabCase(result);
                    break;
                    
                case 'toggle':
                    result = toggleCase(result);
                    break;
                    
                case 'random':
                    result = randomCase(result);
                    break;
            }
            
            return result;
        }

        function toCamelCase(str) {
            return str.replace(/(?:^\w|[A-Z]|\b\w)/g, (word, index) => {
                return index === 0 ? word.toLowerCase() : word.toUpperCase();
            }).replace(/\s+/g, '');
        }

        function toPascalCase(str) {
            return str.replace(/(?:^\w|[A-Z]|\b\w)/g, (word) => {
                return word.toUpperCase();
            }).replace(/\s+/g, '');
        }

        function toSnakeCase(str) {
            return str.replace(/\W+/g, ' ')
                .split(/ |\B(?=[A-Z])/)
                .map(word => word.toLowerCase())
                .join('_');
        }

        function toKebabCase(str) {
            return str.replace(/\W+/g, ' ')
                .split(/ |\B(?=[A-Z])/)
                .map(word => word.toLowerCase())
                .join('-');
        }

        function toggleCase(str) {
            return str.replace(/[a-zA-Z]/g, (char) => {
                return char === char.toUpperCase() ? char.toLowerCase() : char.toUpperCase();
            });
        }

        function randomCase(str) {
            return str.replace(/[a-zA-Z]/g, (char) => {
                return Math.random() > 0.5 ? char.toUpperCase() : char.toLowerCase();
            });
        }

        function switchTab(tabName) {
            // タブボタンの状態を更新
            document.querySelectorAll('.result-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // タブコンテンツの表示を更新
            document.querySelectorAll('.result-content').forEach(content => {
                content.classList.remove('active');
            });
            
            // クリックされたタブを検索
            document.querySelectorAll('.result-tab').forEach(tab => {
                if (tab.textContent.includes(getTabLabel(tabName))) {
                    tab.classList.add('active');
                }
            });
            
            const content = document.getElementById(`${tabName}-content`);
            if (content) {
                content.classList.add('active');
            }
            
            currentTab = tabName;
        }

        function getTabLabel(tabName) {
            const labels = {
                'uppercase': '大文字',
                'lowercase': '小文字',
                'capitalize': '頭文字大文字',
                'title': 'タイトル',
                'camelCase': 'キャメル',
                'pascalCase': 'パスカル',
                'snakeCase': 'スネーク',
                'kebabCase': 'ケバブ'
            };
            return labels[tabName] || tabName;
        }

        function updateStats(text) {
            const totalChars = text.length;
            const uppercaseCount = (text.match(/[A-Z]/g) || []).length;
            const lowercaseCount = (text.match(/[a-z]/g) || []).length;
            const numberCount = (text.match(/[0-9]/g) || []).length;
            const spaceCount = (text.match(/\s/g) || []).length;
            const specialCount = text.length - uppercaseCount - lowercaseCount - numberCount - spaceCount;
            
            document.getElementById('totalChars').textContent = totalChars;
            document.getElementById('uppercaseCount').textContent = uppercaseCount;
            document.getElementById('lowercaseCount').textContent = lowercaseCount;
            document.getElementById('numberCount').textContent = numberCount;
            document.getElementById('spaceCount').textContent = spaceCount;
            document.getElementById('specialCount').textContent = specialCount;
        }

        function loadExample(text) {
            document.getElementById('inputText').value = text;
            convertAll();
        }

        function exportResults(format) {
            const inputText = document.getElementById('inputText').value;
            
            if (!inputText) {
                alert('エクスポートするテキストがありません');
                return;
            }
            
            let content = '';
            let filename = '';
            
            if (format === 'text') {
                content = `変換結果\n\n`;
                content += `元のテキスト: ${inputText}\n\n`;
                
                Object.entries(conversionResults).forEach(([type, result]) => {
                    content += `${getTabLabel(type)}: ${result}\n`;
                });
                
                filename = 'case_conversion_results.txt';
            } else if (format === 'json') {
                const data = {
                    originalText: inputText,
                    results: conversionResults,
                    timestamp: new Date().toISOString()
                };
                content = JSON.stringify(data, null, 2);
                filename = 'case_conversion_results.json';
            }
            
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function copyCurrentResult() {
            const currentOutput = document.getElementById(`${currentTab}-output`);
            if (currentOutput && currentOutput.value) {
                navigator.clipboard.writeText(currentOutput.value).then(() => {
                    alert('現在の結果がクリップボードにコピーされました！');
                });
            } else {
                alert('コピーする結果がありません');
            }
        }

        function copyAllResults() {
            const inputText = document.getElementById('inputText').value;
            
            if (!inputText) {
                alert('コピーする結果がありません');
                return;
            }
            
            let content = `変換結果\n\n元のテキスト: ${inputText}\n\n`;
            
            Object.entries(conversionResults).forEach(([type, result]) => {
                content += `${getTabLabel(type)}: ${result}\n`;
            });
            
            navigator.clipboard.writeText(content).then(() => {
                alert('全ての結果がクリップボードにコピーされました！');
            });
        }

        // 初期化
        document.getElementById('inputText').value = 'Hello World Programming';
        convertAll();
    </script>
</body>
</html>
