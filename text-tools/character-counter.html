<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字数カウント - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .counter {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 800px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .text-input {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            resize: vertical;
            transition: border-color 0.3s ease;
        }

        .text-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .text-input::placeholder {
            color: #adb5bd;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }

        .option label {
            color: #333;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 8px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .detailed-stats {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .detailed-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .detailed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .detailed-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .detailed-item-label {
            color: #666;
            font-size: 0.9rem;
        }

        .detailed-item-value {
            color: #333;
            font-weight: 600;
        }

        .frequency-analysis {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .frequency-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .frequency-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .frequency-tab {
            padding: 8px 16px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .frequency-tab.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .frequency-content {
            display: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .frequency-content.active {
            display: block;
        }

        .frequency-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #f8f9fa;
        }

        .frequency-item:last-child {
            border-bottom: none;
        }

        .frequency-char {
            font-family: monospace;
            font-weight: bold;
            color: #333;
        }

        .frequency-count {
            color: #667eea;
            font-weight: 600;
        }

        .export-section {
            background: #e8f5e8;
            border: 1px solid #c3e6cb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .export-title {
            font-weight: 600;
            color: #155724;
            margin-bottom: 15px;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .export-btn {
            background: white;
            border: 1px solid #c3e6cb;
            border-radius: 5px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .export-btn:hover {
            background: #d4edda;
            border-color: #155724;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .info {
            background: #e7f3ff;
            border: 1px solid #b3d7ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #0066cc;
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .options {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="counter">
        <div class="header">
            <h1>文字数カウント</h1>
            <p>テキストの文字数、単語数、行数を詳細に分析</p>
        </div>

        <div class="info">
            テキストを入力すると、リアルタイムで文字数や単語数が表示されます。<br>
            日本語・英語・数字・記号などの詳細な分析も可能です。
        </div>

        <div class="input-section">
            <div class="input-group">
                <label for="textInput">テキスト入力</label>
                <textarea 
                    id="textInput" 
                    class="text-input" 
                    placeholder="ここにテキストを入力してください...&#10;文字数や単語数がリアルタイムで表示されます。"
                    oninput="analyzeText()"
                ></textarea>
            </div>

            <div class="options">
                <div class="option">
                    <input type="checkbox" id="includeSpaces" checked onchange="analyzeText()">
                    <label for="includeSpaces">スペースを含む</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="includeNewlines" checked onchange="analyzeText()">
                    <label for="includeNewlines">改行を含む</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="includePunctuation" checked onchange="analyzeText()">
                    <label for="includePunctuation">句読点を含む</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="caseSensitive" onchange="analyzeText()">
                    <label for="caseSensitive">大文字小文字を区別</label>
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalChars">0</div>
                <div class="stat-label">総文字数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="charsNoSpaces">0</div>
                <div class="stat-label">文字数（スペース除く）</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="wordCount">0</div>
                <div class="stat-label">単語数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="lineCount">0</div>
                <div class="stat-label">行数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="paragraphCount">0</div>
                <div class="stat-label">段落数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="sentenceCount">0</div>
                <div class="stat-label">文の数</div>
            </div>
        </div>

        <div class="detailed-stats">
            <div class="detailed-title">詳細統計</div>
            <div class="detailed-grid">
                <div class="detailed-item">
                    <span class="detailed-item-label">ひらがな</span>
                    <span class="detailed-item-value" id="hiraganaCount">0</span>
                </div>
                <div class="detailed-item">
                    <span class="detailed-item-label">カタカナ</span>
                    <span class="detailed-item-value" id="katakanaCount">0</span>
                </div>
                <div class="detailed-item">
                    <span class="detailed-item-label">漢字</span>
                    <span class="detailed-item-value" id="kanjiCount">0</span>
                </div>
                <div class="detailed-item">
                    <span class="detailed-item-label">英字</span>
                    <span class="detailed-item-value" id="alphabetCount">0</span>
                </div>
                <div class="detailed-item">
                    <span class="detailed-item-label">数字</span>
                    <span class="detailed-item-value" id="numberCount">0</span>
                </div>
                <div class="detailed-item">
                    <span class="detailed-item-label">記号</span>
                    <span class="detailed-item-value" id="symbolCount">0</span>
                </div>
                <div class="detailed-item">
                    <span class="detailed-item-label">スペース</span>
                    <span class="detailed-item-value" id="spaceCount">0</span>
                </div>
                <div class="detailed-item">
                    <span class="detailed-item-label">改行</span>
                    <span class="detailed-item-value" id="newlineCount">0</span>
                </div>
                <div class="detailed-item">
                    <span class="detailed-item-label">平均文字数/行</span>
                    <span class="detailed-item-value" id="avgCharsPerLine">0</span>
                </div>
                <div class="detailed-item">
                    <span class="detailed-item-label">平均単語数/行</span>
                    <span class="detailed-item-value" id="avgWordsPerLine">0</span>
                </div>
                <div class="detailed-item">
                    <span class="detailed-item-label">平均文字数/文</span>
                    <span class="detailed-item-value" id="avgCharsPerSentence">0</span>
                </div>
                <div class="detailed-item">
                    <span class="detailed-item-label">最長行の文字数</span>
                    <span class="detailed-item-value" id="maxLineLength">0</span>
                </div>
            </div>
        </div>

        <div class="frequency-analysis">
            <div class="frequency-title">文字出現頻度</div>
            <div class="frequency-tabs">
                <div class="frequency-tab active" onclick="showFrequency('chars')">文字</div>
                <div class="frequency-tab" onclick="showFrequency('words')">単語</div>
                <div class="frequency-tab" onclick="showFrequency('lines')">行の長さ</div>
            </div>
            <div class="frequency-content active" id="charsFrequency"></div>
            <div class="frequency-content" id="wordsFrequency"></div>
            <div class="frequency-content" id="linesFrequency"></div>
        </div>

        <div class="export-section">
            <div class="export-title">結果をエクスポート</div>
            <div class="export-buttons">
                <button class="export-btn" onclick="exportResults('text')">テキストとして保存</button>
                <button class="export-btn" onclick="exportResults('json')">JSON形式で保存</button>
                <button class="export-btn" onclick="exportResults('csv')">CSV形式で保存</button>
                <button class="export-btn" onclick="copyResults()">クリップボードにコピー</button>
            </div>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <script>
        let analysisResults = {};

        function analyzeText() {
            const text = document.getElementById('textInput').value;
            const includeSpaces = document.getElementById('includeSpaces').checked;
            const includeNewlines = document.getElementById('includeNewlines').checked;
            const includePunctuation = document.getElementById('includePunctuation').checked;
            const caseSensitive = document.getElementById('caseSensitive').checked;

            // 基本統計
            const totalChars = text.length;
            const charsNoSpaces = text.replace(/\s/g, '').length;
            const words = text.trim() ? text.trim().split(/\s+/) : [];
            const wordCount = words.length;
            const lines = text.split('\n');
            const lineCount = lines.length;
            const paragraphs = text.split(/\n\s*\n/).filter(p => p.trim().length > 0);
            const paragraphCount = paragraphs.length;
            const sentences = text.split(/[。！？.!?]+/).filter(s => s.trim().length > 0);
            const sentenceCount = sentences.length;

            // 文字種別カウント
            const hiraganaCount = (text.match(/[\u3040-\u309f]/g) || []).length;
            const katakanaCount = (text.match(/[\u30a0-\u30ff]/g) || []).length;
            const kanjiCount = (text.match(/[\u4e00-\u9faf]/g) || []).length;
            const alphabetCount = (text.match(/[a-zA-Z]/g) || []).length;
            const numberCount = (text.match(/[0-9]/g) || []).length;
            const symbolCount = (text.match(/[^\w\s\u3040-\u309f\u30a0-\u30ff\u4e00-\u9faf]/g) || []).length;
            const spaceCount = (text.match(/[ \t]/g) || []).length;
            const newlineCount = (text.match(/\n/g) || []).length;

            // 平均値計算
            const avgCharsPerLine = lineCount > 0 ? (totalChars / lineCount).toFixed(1) : 0;
            const avgWordsPerLine = lineCount > 0 ? (wordCount / lineCount).toFixed(1) : 0;
            const avgCharsPerSentence = sentenceCount > 0 ? (totalChars / sentenceCount).toFixed(1) : 0;
            const maxLineLength = Math.max(...lines.map(line => line.length));

            // 結果を表示
            document.getElementById('totalChars').textContent = totalChars;
            document.getElementById('charsNoSpaces').textContent = charsNoSpaces;
            document.getElementById('wordCount').textContent = wordCount;
            document.getElementById('lineCount').textContent = lineCount;
            document.getElementById('paragraphCount').textContent = paragraphCount;
            document.getElementById('sentenceCount').textContent = sentenceCount;

            document.getElementById('hiraganaCount').textContent = hiraganaCount;
            document.getElementById('katakanaCount').textContent = katakanaCount;
            document.getElementById('kanjiCount').textContent = kanjiCount;
            document.getElementById('alphabetCount').textContent = alphabetCount;
            document.getElementById('numberCount').textContent = numberCount;
            document.getElementById('symbolCount').textContent = symbolCount;
            document.getElementById('spaceCount').textContent = spaceCount;
            document.getElementById('newlineCount').textContent = newlineCount;

            document.getElementById('avgCharsPerLine').textContent = avgCharsPerLine;
            document.getElementById('avgWordsPerLine').textContent = avgWordsPerLine;
            document.getElementById('avgCharsPerSentence').textContent = avgCharsPerSentence;
            document.getElementById('maxLineLength').textContent = maxLineLength;

            // 分析結果を保存
            analysisResults = {
                totalChars,
                charsNoSpaces,
                wordCount,
                lineCount,
                paragraphCount,
                sentenceCount,
                hiraganaCount,
                katakanaCount,
                kanjiCount,
                alphabetCount,
                numberCount,
                symbolCount,
                spaceCount,
                newlineCount,
                avgCharsPerLine,
                avgWordsPerLine,
                avgCharsPerSentence,
                maxLineLength,
                text
            };

            // 頻度分析を更新
            updateFrequencyAnalysis(text, words, lines, caseSensitive);
        }

        function updateFrequencyAnalysis(text, words, lines, caseSensitive) {
            // 文字頻度
            const charFreq = {};
            const processedText = caseSensitive ? text : text.toLowerCase();
            for (const char of processedText) {
                if (char.trim()) {
                    charFreq[char] = (charFreq[char] || 0) + 1;
                }
            }

            // 単語頻度
            const wordFreq = {};
            words.forEach(word => {
                const processedWord = caseSensitive ? word : word.toLowerCase();
                wordFreq[processedWord] = (wordFreq[processedWord] || 0) + 1;
            });

            // 行の長さ分布
            const lineFreq = {};
            lines.forEach(line => {
                const length = line.length;
                const range = Math.floor(length / 10) * 10;
                const key = `${range}-${range + 9}文字`;
                lineFreq[key] = (lineFreq[key] || 0) + 1;
            });

            displayFrequency('chars', charFreq);
            displayFrequency('words', wordFreq);
            displayFrequency('lines', lineFreq);
        }

        function displayFrequency(type, freq) {
            const container = document.getElementById(type + 'Frequency');
            container.innerHTML = '';

            const sorted = Object.entries(freq)
                .sort(([,a], [,b]) => b - a)
                .slice(0, 20);

            sorted.forEach(([item, count]) => {
                const div = document.createElement('div');
                div.className = 'frequency-item';
                div.innerHTML = `
                    <span class="frequency-char">${item}</span>
                    <span class="frequency-count">${count}</span>
                `;
                container.appendChild(div);
            });
        }

        function showFrequency(type) {
            // タブの切り替え
            document.querySelectorAll('.frequency-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.frequency-content').forEach(content => {
                content.classList.remove('active');
            });

            event.target.classList.add('active');
            document.getElementById(type + 'Frequency').classList.add('active');
        }

        function exportResults(format) {
            const results = analysisResults;
            let content = '';
            let filename = '';

            switch (format) {
                case 'text':
                    content = `文字数カウント結果\n\n` +
                        `総文字数: ${results.totalChars}\n` +
                        `文字数（スペース除く）: ${results.charsNoSpaces}\n` +
                        `単語数: ${results.wordCount}\n` +
                        `行数: ${results.lineCount}\n` +
                        `段落数: ${results.paragraphCount}\n` +
                        `文の数: ${results.sentenceCount}\n\n` +
                        `詳細統計:\n` +
                        `ひらがな: ${results.hiraganaCount}\n` +
                        `カタカナ: ${results.katakanaCount}\n` +
                        `漢字: ${results.kanjiCount}\n` +
                        `英字: ${results.alphabetCount}\n` +
                        `数字: ${results.numberCount}\n` +
                        `記号: ${results.symbolCount}\n` +
                        `スペース: ${results.spaceCount}\n` +
                        `改行: ${results.newlineCount}\n\n` +
                        `平均値:\n` +
                        `平均文字数/行: ${results.avgCharsPerLine}\n` +
                        `平均単語数/行: ${results.avgWordsPerLine}\n` +
                        `平均文字数/文: ${results.avgCharsPerSentence}\n` +
                        `最長行の文字数: ${results.maxLineLength}`;
                    filename = 'character_count_results.txt';
                    break;

                case 'json':
                    content = JSON.stringify(results, null, 2);
                    filename = 'character_count_results.json';
                    break;

                case 'csv':
                    content = '項目,値\n' +
                        `総文字数,${results.totalChars}\n` +
                        `文字数（スペース除く）,${results.charsNoSpaces}\n` +
                        `単語数,${results.wordCount}\n` +
                        `行数,${results.lineCount}\n` +
                        `段落数,${results.paragraphCount}\n` +
                        `文の数,${results.sentenceCount}\n` +
                        `ひらがな,${results.hiraganaCount}\n` +
                        `カタカナ,${results.katakanaCount}\n` +
                        `漢字,${results.kanjiCount}\n` +
                        `英字,${results.alphabetCount}\n` +
                        `数字,${results.numberCount}\n` +
                        `記号,${results.symbolCount}\n` +
                        `スペース,${results.spaceCount}\n` +
                        `改行,${results.newlineCount}\n` +
                        `平均文字数/行,${results.avgCharsPerLine}\n` +
                        `平均単語数/行,${results.avgWordsPerLine}\n` +
                        `平均文字数/文,${results.avgCharsPerSentence}\n` +
                        `最長行の文字数,${results.maxLineLength}`;
                    filename = 'character_count_results.csv';
                    break;
            }

            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function copyResults() {
            const results = analysisResults;
            const content = `文字数カウント結果\n\n` +
                `総文字数: ${results.totalChars}\n` +
                `文字数（スペース除く）: ${results.charsNoSpaces}\n` +
                `単語数: ${results.wordCount}\n` +
                `行数: ${results.lineCount}\n` +
                `段落数: ${results.paragraphCount}\n` +
                `文の数: ${results.sentenceCount}`;

            navigator.clipboard.writeText(content).then(() => {
                alert('結果がクリップボードにコピーされました！');
            });
        }

        // 初期化
        analyzeText();
    </script>
</body>
</html>
