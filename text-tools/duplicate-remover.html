<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重複行削除ツール - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .remover {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .info {
            background: #e7f3ff;
            border: 1px solid #b3d7ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #0066cc;
        }

        .options {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .options-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .option-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 15px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }

        .option input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }

        .option label {
            color: #333;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 0;
        }

        .input-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .text-input {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            transition: border-color 0.3s ease;
        }

        .text-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .text-input.readonly {
            background: #f8f9fa;
            cursor: not-allowed;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .control-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .control-btn.secondary {
            background: #28a745;
        }

        .control-btn.secondary:hover {
            background: #218838;
        }

        .control-btn.danger {
            background: #dc3545;
        }

        .control-btn.danger:hover {
            background: #c82333;
        }

        .stats {
            background: #e8f5e8;
            border: 1px solid #c3e6cb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .stats-title {
            font-weight: 600;
            color: #155724;
            margin-bottom: 15px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-item {
            background: white;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #155724;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        .duplicates-list {
            background: #fff8e1;
            border: 1px solid #ffcc02;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .duplicates-title {
            font-weight: 600;
            color: #ff8f00;
            margin-bottom: 15px;
        }

        .duplicate-item {
            background: white;
            border: 1px solid #ffcc02;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .duplicate-item:last-child {
            margin-bottom: 0;
        }

        .duplicate-text {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #333;
            flex: 1;
            margin-right: 10px;
            word-break: break-all;
        }

        .duplicate-count {
            background: #ff8f00;
            color: white;
            border-radius: 15px;
            padding: 5px 10px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .export-section {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .export-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .export-btn {
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .export-btn:hover {
            background: #5a6268;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .input-section {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="remover">
        <div class="header">
            <h1>重複行削除ツール</h1>
            <p>テキストから重複する行を検出・削除</p>
        </div>

        <div class="info">
            テキストから重複する行を検出し、削除できます。大文字小文字の区別や空白行の処理など、様々なオプションに対応。
        </div>

        <div class="options">
            <div class="options-title">処理オプション</div>
            <div class="option-group">
                <div class="option">
                    <input type="checkbox" id="caseSensitive">
                    <label for="caseSensitive">大文字小文字を区別</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="trimSpaces" checked>
                    <label for="trimSpaces">行の前後の空白を削除</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="removeEmptyLines" checked>
                    <label for="removeEmptyLines">空行を削除</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="preserveOrder" checked>
                    <label for="preserveOrder">元の順序を保持</label>
                </div>
            </div>
            
            <div class="option-group">
                <div class="option">
                    <input type="radio" name="duplicateMode" id="keepFirst" value="first" checked>
                    <label for="keepFirst">最初の出現を保持</label>
                </div>
                <div class="option">
                    <input type="radio" name="duplicateMode" id="keepLast" value="last">
                    <label for="keepLast">最後の出現を保持</label>
                </div>
                <div class="option">
                    <input type="radio" name="duplicateMode" id="removeAll" value="all">
                    <label for="removeAll">重複行を全て削除</label>
                </div>
            </div>
        </div>

        <div class="input-section">
            <div class="input-group">
                <label for="inputText">元のテキスト</label>
                <textarea 
                    id="inputText" 
                    class="text-input" 
                    placeholder="重複を削除したいテキストを入力してください...&#10;&#10;例:&#10;apple&#10;banana&#10;apple&#10;orange&#10;banana&#10;grape"
                    oninput="processText()"
                ></textarea>
            </div>
            <div class="input-group">
                <label for="outputText">処理後のテキスト</label>
                <textarea 
                    id="outputText" 
                    class="text-input readonly" 
                    placeholder="重複削除後のテキストがここに表示されます..."
                    readonly
                ></textarea>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn" onclick="processText()">重複を削除</button>
            <button class="control-btn secondary" onclick="loadSampleText()">サンプル読み込み</button>
            <button class="control-btn danger" onclick="clearText()">クリア</button>
        </div>

        <div class="stats">
            <div class="stats-title">処理統計</div>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="originalLines">0</div>
                    <div class="stat-label">元の行数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="resultLines">0</div>
                    <div class="stat-label">処理後の行数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="duplicateLines">0</div>
                    <div class="stat-label">重複行数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="uniqueLines">0</div>
                    <div class="stat-label">ユニーク行数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="removedLines">0</div>
                    <div class="stat-label">削除行数</div>
                </div>
            </div>
        </div>

        <div class="duplicates-list">
            <div class="duplicates-title">重複行一覧</div>
            <div id="duplicatesList">
                <p style="color: #666; font-style: italic;">重複行がここに表示されます</p>
            </div>
        </div>

        <div class="export-section">
            <div class="export-title">結果をエクスポート</div>
            <div class="export-buttons">
                <button class="export-btn" onclick="exportResult('text')">テキストファイル</button>
                <button class="export-btn" onclick="exportResult('json')">JSON形式</button>
                <button class="export-btn" onclick="exportResult('csv')">CSV形式</button>
                <button class="export-btn" onclick="copyResult()">クリップボードにコピー</button>
            </div>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <script>
        let processingResults = {};

        function processText() {
            const inputText = document.getElementById('inputText').value;
            const caseSensitive = document.getElementById('caseSensitive').checked;
            const trimSpaces = document.getElementById('trimSpaces').checked;
            const removeEmptyLines = document.getElementById('removeEmptyLines').checked;
            const preserveOrder = document.getElementById('preserveOrder').checked;
            
            const duplicateMode = document.querySelector('input[name="duplicateMode"]:checked').value;

            if (!inputText.trim()) {
                clearResults();
                return;
            }

            const lines = inputText.split('\n');
            const processedLines = [];
            const duplicates = {};
            const duplicatesList = [];

            // 行を処理
            lines.forEach((line, index) => {
                let processedLine = line;
                
                if (trimSpaces) {
                    processedLine = processedLine.trim();
                }
                
                if (removeEmptyLines && processedLine === '') {
                    return;
                }
                
                const key = caseSensitive ? processedLine : processedLine.toLowerCase();
                
                if (!duplicates[key]) {
                    duplicates[key] = [];
                }
                
                duplicates[key].push({
                    original: line,
                    processed: processedLine,
                    index: index
                });
            });

            // 重複を特定
            const uniqueLines = [];
            const duplicateEntries = [];

            Object.entries(duplicates).forEach(([key, entries]) => {
                if (entries.length > 1) {
                    duplicateEntries.push({
                        text: entries[0].processed,
                        count: entries.length
                    });
                    
                    if (duplicateMode === 'first') {
                        uniqueLines.push(entries[0]);
                    } else if (duplicateMode === 'last') {
                        uniqueLines.push(entries[entries.length - 1]);
                    }
                    // 'all' の場合は何も追加しない
                } else {
                    uniqueLines.push(entries[0]);
                }
            });

            // 結果をソート（元の順序を保持する場合）
            if (preserveOrder) {
                uniqueLines.sort((a, b) => a.index - b.index);
            }

            const resultText = uniqueLines.map(entry => entry.original).join('\n');
            document.getElementById('outputText').value = resultText;

            // 統計を更新
            updateStats(lines.length, uniqueLines.length, duplicateEntries.length, duplicateEntries);

            // 結果を保存
            processingResults = {
                originalLines: lines.length,
                resultLines: uniqueLines.length,
                duplicateLines: duplicateEntries.length,
                uniqueLines: uniqueLines.length,
                removedLines: lines.length - uniqueLines.length,
                duplicates: duplicateEntries,
                resultText: resultText
            };
        }

        function updateStats(originalLines, resultLines, duplicateTypes, duplicateEntries) {
            document.getElementById('originalLines').textContent = originalLines;
            document.getElementById('resultLines').textContent = resultLines;
            document.getElementById('duplicateLines').textContent = duplicateTypes;
            document.getElementById('uniqueLines').textContent = resultLines;
            document.getElementById('removedLines').textContent = originalLines - resultLines;

            // 重複行一覧を更新
            const duplicatesList = document.getElementById('duplicatesList');
            
            if (duplicateEntries.length === 0) {
                duplicatesList.innerHTML = '<p style="color: #666; font-style: italic;">重複行が見つかりませんでした</p>';
                return;
            }

            duplicatesList.innerHTML = '';
            duplicateEntries.forEach(item => {
                const duplicateItem = document.createElement('div');
                duplicateItem.className = 'duplicate-item';
                duplicateItem.innerHTML = `
                    <div class="duplicate-text">${item.text}</div>
                    <div class="duplicate-count">${item.count}回</div>
                `;
                duplicatesList.appendChild(duplicateItem);
            });
        }

        function clearResults() {
            document.getElementById('outputText').value = '';
            document.getElementById('originalLines').textContent = '0';
            document.getElementById('resultLines').textContent = '0';
            document.getElementById('duplicateLines').textContent = '0';
            document.getElementById('uniqueLines').textContent = '0';
            document.getElementById('removedLines').textContent = '0';
            document.getElementById('duplicatesList').innerHTML = '<p style="color: #666; font-style: italic;">重複行がここに表示されます</p>';
        }

        function loadSampleText() {
            const sampleText = `apple
banana
apple
orange
banana
grape
apple
kiwi
orange
mango
banana
grape
watermelon
apple
peach`;
            document.getElementById('inputText').value = sampleText;
            processText();
        }

        function clearText() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').value = '';
            clearResults();
        }

        function exportResult(format) {
            const resultText = document.getElementById('outputText').value;
            
            if (!resultText) {
                alert('エクスポートする結果がありません');
                return;
            }

            let content = '';
            let filename = '';
            let mimeType = '';

            switch (format) {
                case 'text':
                    content = resultText;
                    filename = 'deduplicated_text.txt';
                    mimeType = 'text/plain';
                    break;

                case 'json':
                    const data = {
                        originalText: document.getElementById('inputText').value,
                        resultText: resultText,
                        stats: processingResults,
                        timestamp: new Date().toISOString()
                    };
                    content = JSON.stringify(data, null, 2);
                    filename = 'duplicate_removal_results.json';
                    mimeType = 'application/json';
                    break;

                case 'csv':
                    const lines = resultText.split('\n');
                    content = 'Line Number,Content\n' + 
                             lines.map((line, index) => `${index + 1},"${line.replace(/"/g, '""')}"`).join('\n');
                    filename = 'deduplicated_lines.csv';
                    mimeType = 'text/csv';
                    break;
            }

            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function copyResult() {
            const resultText = document.getElementById('outputText').value;
            
            if (!resultText) {
                alert('コピーする結果がありません');
                return;
            }

            navigator.clipboard.writeText(resultText).then(() => {
                alert('結果がクリップボードにコピーされました！');
            });
        }

        // オプション変更時の自動処理
        document.querySelectorAll('input[type="checkbox"], input[type="radio"]').forEach(input => {
            input.addEventListener('change', () => {
                if (document.getElementById('inputText').value) {
                    processText();
                }
            });
        });
    </script>
</body>
</html>
