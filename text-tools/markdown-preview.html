<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マークダウンプレビュー - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .markdown-editor {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 1400px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .controls {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .view-mode {
            display: flex;
            gap: 10px;
        }

        .view-btn {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .view-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .view-btn:hover:not(.active) {
            background: #e9ecef;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: #5a6fd8;
        }

        .action-btn.secondary {
            background: #28a745;
        }

        .action-btn.secondary:hover {
            background: #218838;
        }

        .action-btn.danger {
            background: #dc3545;
        }

        .action-btn.danger:hover {
            background: #c82333;
        }

        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .editor-container.split {
            grid-template-columns: 1fr 1fr;
        }

        .editor-container.editor-only {
            grid-template-columns: 1fr;
        }

        .editor-container.preview-only {
            grid-template-columns: 1fr;
        }

        .editor-section {
            display: flex;
            flex-direction: column;
        }

        .editor-section.hidden {
            display: none;
        }

        .editor-section label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .markdown-input {
            width: 100%;
            min-height: 500px;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            line-height: 1.5;
        }

        .markdown-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .preview-section {
            display: flex;
            flex-direction: column;
        }

        .preview-section.hidden {
            display: none;
        }

        .preview-section label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .markdown-preview {
            width: 100%;
            min-height: 500px;
            padding: 20px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            background: white;
            overflow-y: auto;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
        }

        /* Markdown プレビュー スタイル */
        .markdown-preview h1 {
            color: #333;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .markdown-preview h2 {
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
            margin-top: 30px;
            margin-bottom: 15px;
        }

        .markdown-preview h3 {
            color: #333;
            margin-top: 25px;
            margin-bottom: 10px;
        }

        .markdown-preview h4, .markdown-preview h5, .markdown-preview h6 {
            color: #333;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .markdown-preview p {
            margin-bottom: 15px;
        }

        .markdown-preview ul, .markdown-preview ol {
            margin-left: 20px;
            margin-bottom: 15px;
        }

        .markdown-preview li {
            margin-bottom: 5px;
        }

        .markdown-preview blockquote {
            border-left: 4px solid #667eea;
            padding-left: 20px;
            margin: 15px 0;
            color: #666;
            font-style: italic;
        }

        .markdown-preview code {
            background: #f8f9fa;
            padding: 2px 4px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }

        .markdown-preview pre {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            margin: 15px 0;
        }

        .markdown-preview pre code {
            background: none;
            padding: 0;
        }

        .markdown-preview table {
            border-collapse: collapse;
            width: 100%;
            margin: 15px 0;
        }

        .markdown-preview th, .markdown-preview td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            text-align: left;
        }

        .markdown-preview th {
            background: #f8f9fa;
            font-weight: 600;
        }

        .markdown-preview a {
            color: #667eea;
            text-decoration: none;
        }

        .markdown-preview a:hover {
            text-decoration: underline;
        }

        .markdown-preview hr {
            border: none;
            border-top: 1px solid #eee;
            margin: 20px 0;
        }

        .markdown-preview img {
            max-width: 100%;
            height: auto;
            margin: 10px 0;
        }

        .toolbar {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .toolbar-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .toolbar-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .toolbar-btn {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .toolbar-btn:hover {
            background: #e9ecef;
        }

        .stats {
            background: #e8f5e8;
            border: 1px solid #c3e6cb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-item {
            background: white;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #155724;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .editor-container {
                grid-template-columns: 1fr;
            }
            
            .editor-container.split {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .view-mode {
                justify-content: center;
            }
            
            .action-buttons {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="markdown-editor">
        <div class="header">
            <h1>マークダウンプレビュー</h1>
            <p>リアルタイムでマークダウンをプレビュー</p>
        </div>

        <div class="controls">
            <div class="view-mode">
                <button class="view-btn active" onclick="setViewMode('split')">分割表示</button>
                <button class="view-btn" onclick="setViewMode('editor')">エディタのみ</button>
                <button class="view-btn" onclick="setViewMode('preview')">プレビューのみ</button>
            </div>
            <div class="action-buttons">
                <button class="action-btn secondary" onclick="exportHTML()">HTML出力</button>
                <button class="action-btn secondary" onclick="exportMarkdown()">MD出力</button>
                <button class="action-btn secondary" onclick="loadSample()">サンプル</button>
                <button class="action-btn danger" onclick="clearAll()">クリア</button>
            </div>
        </div>

        <div class="toolbar">
            <div class="toolbar-title">クイック挿入</div>
            <div class="toolbar-buttons">
                <button class="toolbar-btn" onclick="insertText('# ')">H1</button>
                <button class="toolbar-btn" onclick="insertText('## ')">H2</button>
                <button class="toolbar-btn" onclick="insertText('### ')">H3</button>
                <button class="toolbar-btn" onclick="insertText('**', '**')">太字</button>
                <button class="toolbar-btn" onclick="insertText('*', '*')">斜体</button>
                <button class="toolbar-btn" onclick="insertText('`', '`')">コード</button>
                <button class="toolbar-btn" onclick="insertText('[', '](url)')">リンク</button>
                <button class="toolbar-btn" onclick="insertText('![', '](url)')">画像</button>
                <button class="toolbar-btn" onclick="insertText('- ')">リスト</button>
                <button class="toolbar-btn" onclick="insertText('> ')">引用</button>
                <button class="toolbar-btn" onclick="insertText('---\\n')">区切り</button>
                <button class="toolbar-btn" onclick="insertTable()">テーブル</button>
            </div>
        </div>

        <div class="editor-container split" id="editorContainer">
            <div class="editor-section" id="editorSection">
                <label for="markdownInput">マークダウン入力</label>
                <textarea 
                    id="markdownInput" 
                    class="markdown-input" 
                    placeholder="マークダウンテキストを入力してください..."
                    oninput="updatePreview()"
                ></textarea>
            </div>
            <div class="preview-section" id="previewSection">
                <label for="previewOutput">プレビュー</label>
                <div id="previewOutput" class="markdown-preview">
                    プレビューがここに表示されます
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="charCount">0</div>
                    <div class="stat-label">文字数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="wordCount">0</div>
                    <div class="stat-label">単語数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="lineCount">0</div>
                    <div class="stat-label">行数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="readTime">0</div>
                    <div class="stat-label">読書時間(分)</div>
                </div>
            </div>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        let currentViewMode = 'split';

        function setViewMode(mode) {
            currentViewMode = mode;
            const container = document.getElementById('editorContainer');
            const editorSection = document.getElementById('editorSection');
            const previewSection = document.getElementById('previewSection');
            
            // ボタンの状態を更新
            document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // 表示モードを切り替え
            container.className = `editor-container ${mode}`;
            
            switch (mode) {
                case 'split':
                    editorSection.classList.remove('hidden');
                    previewSection.classList.remove('hidden');
                    break;
                case 'editor':
                    editorSection.classList.remove('hidden');
                    previewSection.classList.add('hidden');
                    break;
                case 'preview':
                    editorSection.classList.add('hidden');
                    previewSection.classList.remove('hidden');
                    break;
            }
        }

        function updatePreview() {
            const input = document.getElementById('markdownInput').value;
            const preview = document.getElementById('previewOutput');
            
            if (!input.trim()) {
                preview.innerHTML = 'プレビューがここに表示されます';
                updateStats('', 0, 0, 0);
                return;
            }
            
            try {
                const html = marked.parse(input);
                preview.innerHTML = html;
                
                // 統計情報を更新
                const charCount = input.length;
                const wordCount = input.trim().split(/\s+/).length;
                const lineCount = input.split('\n').length;
                const readTime = Math.ceil(wordCount / 200); // 1分間に200語読むと仮定
                
                updateStats(input, charCount, wordCount, lineCount, readTime);
            } catch (error) {
                preview.innerHTML = `<p style="color: red;">エラー: ${error.message}</p>`;
            }
        }

        function updateStats(input, charCount, wordCount, lineCount, readTime) {
            document.getElementById('charCount').textContent = charCount;
            document.getElementById('wordCount').textContent = wordCount;
            document.getElementById('lineCount').textContent = lineCount;
            document.getElementById('readTime').textContent = readTime;
        }

        function insertText(before, after = '') {
            const textarea = document.getElementById('markdownInput');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const selectedText = textarea.value.substring(start, end);
            
            const newText = before + selectedText + after;
            textarea.value = textarea.value.substring(0, start) + newText + textarea.value.substring(end);
            
            // カーソル位置を調整
            const newPosition = start + before.length + selectedText.length;
            textarea.setSelectionRange(newPosition, newPosition);
            textarea.focus();
            
            updatePreview();
        }

        function insertTable() {
            const table = `| ヘッダー1 | ヘッダー2 | ヘッダー3 |
|----------|----------|----------|
| セル1    | セル2    | セル3    |
| セル4    | セル5    | セル6    |

`;
            insertText(table);
        }

        function exportHTML() {
            const input = document.getElementById('markdownInput').value;
            if (!input.trim()) {
                alert('マークダウンテキストを入力してください');
                return;
            }
            
            try {
                const html = marked.parse(input);
                const fullHTML = `<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Export</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            color: #333;
        }
        h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
        h2 { border-bottom: 1px solid #eee; padding-bottom: 5px; }
        code { background: #f8f9fa; padding: 2px 4px; border-radius: 3px; }
        pre { background: #f8f9fa; padding: 15px; border-radius: 5px; overflow-x: auto; }
        blockquote { border-left: 4px solid #667eea; padding-left: 20px; color: #666; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
        th { background: #f8f9fa; }
        a { color: #667eea; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
${html}
</body>
</html>`;
                
                const blob = new Blob([fullHTML], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `markdown_export_${Date.now()}.html`;
                a.click();
                URL.revokeObjectURL(url);
            } catch (error) {
                alert('HTML出力に失敗しました: ' + error.message);
            }
        }

        function exportMarkdown() {
            const input = document.getElementById('markdownInput').value;
            if (!input.trim()) {
                alert('マークダウンテキストを入力してください');
                return;
            }
            
            const blob = new Blob([input], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `markdown_export_${Date.now()}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function loadSample() {
            const sampleMarkdown = `# マークダウンサンプル

## 見出し

### 小見出し

これは段落です。**太字**と*斜体*のテキストを含んでいます。

## リスト

### 順序なしリスト
- 項目1
- 項目2
  - サブ項目
  - サブ項目2

### 順序ありリスト
1. 最初の項目
2. 2番目の項目
3. 3番目の項目

## コード

インライン\`コード\`は\`バッククォート\`で囲みます。

\`\`\`javascript
// コードブロック
function hello() {
    console.log("Hello, World!");
}
\`\`\`

## 引用

> これは引用です。
> 複数行にわたって書くことができます。

## テーブル

| 名前 | 年齢 | 職業 |
|------|------|------|
| 田中 | 25 | エンジニア |
| 佐藤 | 30 | デザイナー |
| 鈴木 | 35 | マネージャー |

## リンク

[リンク](https://example.com)

## 区切り線

---

## 画像

![代替テキスト](https://via.placeholder.com/300x200)

これでマークダウンの基本的な記法を網羅しました。`;

            document.getElementById('markdownInput').value = sampleMarkdown;
            updatePreview();
        }

        function clearAll() {
            document.getElementById('markdownInput').value = '';
            document.getElementById('previewOutput').innerHTML = 'プレビューがここに表示されます';
            updateStats('', 0, 0, 0, 0);
        }

        // 初期設定
        loadSample();
    </script>
</body>
</html>
