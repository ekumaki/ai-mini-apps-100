<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード生成ツール - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .password-generator {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .settings {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .setting-group {
            margin-bottom: 20px;
        }

        .setting-group:last-child {
            margin-bottom: 0;
        }

        .setting-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .range-input {
            width: 100%;
            margin-bottom: 10px;
        }

        .range-value {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #667eea;
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 5px;
            padding: 5px;
            min-width: 60px;
            display: inline-block;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }

        .checkbox-item label {
            color: #333;
            font-size: 0.9rem;
            margin-bottom: 0;
            cursor: pointer;
        }

        .generate-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .generate-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .generate-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .result-section {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .result-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }

        .password-display {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            word-break: break-all;
            text-align: center;
            margin-bottom: 15px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .password-display.strong {
            border-color: #28a745;
            color: #28a745;
        }

        .password-display.medium {
            border-color: #ffc107;
            color: #856404;
        }

        .password-display.weak {
            border-color: #dc3545;
            color: #dc3545;
        }

        .password-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: #218838;
        }

        .action-btn.secondary {
            background: #6c757d;
        }

        .action-btn.secondary:hover {
            background: #5a6268;
        }

        .strength-indicator {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .strength-bar {
            width: 60px;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .strength-bar.active.weak {
            background: #dc3545;
        }

        .strength-bar.active.medium {
            background: #ffc107;
        }

        .strength-bar.active.strong {
            background: #28a745;
        }

        .strength-label {
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .history-section {
            background: #e8f5e8;
            border: 1px solid #c3e6cb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .history-title {
            font-weight: 600;
            color: #155724;
            margin-bottom: 15px;
        }

        .history-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            background: white;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }

        .history-item:last-child {
            margin-bottom: 0;
        }

        .history-password {
            word-break: break-all;
            flex: 1;
            margin-right: 10px;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .checkbox-group {
                grid-template-columns: 1fr;
            }
            
            .password-actions {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="password-generator">
        <div class="header">
            <h1>パスワード生成ツール</h1>
            <p>セキュアなランダムパスワードを生成</p>
        </div>

        <div class="settings">
            <div class="setting-group">
                <label for="lengthRange">パスワードの長さ</label>
                <input type="range" id="lengthRange" class="range-input" min="4" max="64" value="12" oninput="updateLengthValue()">
                <div class="range-value" id="lengthValue">12</div>
            </div>

            <div class="setting-group">
                <label>文字の種類</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="lowercase" checked>
                        <label for="lowercase">小文字 (a-z)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="uppercase" checked>
                        <label for="uppercase">大文字 (A-Z)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="numbers" checked>
                        <label for="numbers">数字 (0-9)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="symbols">
                        <label for="symbols">記号 (!@#$%^&*)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="excludeSimilar">
                        <label for="excludeSimilar">似た文字を除外 (0,O,l,I)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="excludeAmbiguous">
                        <label for="excludeAmbiguous">曖昧な文字を除外 ({}[]())</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="generate-section">
            <button class="generate-btn" onclick="generatePassword()">パスワード生成</button>
        </div>

        <div class="result-section">
            <div class="result-title">生成されたパスワード</div>
            <div class="strength-indicator">
                <div class="strength-bar" id="strengthBar1"></div>
                <div class="strength-bar" id="strengthBar2"></div>
                <div class="strength-bar" id="strengthBar3"></div>
                <div class="strength-bar" id="strengthBar4"></div>
            </div>
            <div class="strength-label" id="strengthLabel">パスワードを生成してください</div>
            <div class="password-display" id="passwordDisplay">
                ここに生成されたパスワードが表示されます
            </div>
            <div class="password-actions">
                <button class="action-btn" onclick="copyPassword()">コピー</button>
                <button class="action-btn secondary" onclick="generatePassword()">再生成</button>
                <button class="action-btn secondary" onclick="saveToHistory()">履歴に保存</button>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">パスワード履歴</div>
            <div class="history-list" id="historyList">
                <p style="color: #666; font-style: italic;">履歴はまだありません</p>
            </div>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <script>
        let currentPassword = '';
        let passwordHistory = [];

        const charSets = {
            lowercase: 'abcdefghijklmnopqrstuvwxyz',
            uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            numbers: '0123456789',
            symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
        };

        const similarChars = '0Ol1I';
        const ambiguousChars = '{}[]()';

        function updateLengthValue() {
            const lengthRange = document.getElementById('lengthRange');
            const lengthValue = document.getElementById('lengthValue');
            lengthValue.textContent = lengthRange.value;
        }

        function generatePassword() {
            const length = parseInt(document.getElementById('lengthRange').value);
            const lowercase = document.getElementById('lowercase').checked;
            const uppercase = document.getElementById('uppercase').checked;
            const numbers = document.getElementById('numbers').checked;
            const symbols = document.getElementById('symbols').checked;
            const excludeSimilar = document.getElementById('excludeSimilar').checked;
            const excludeAmbiguous = document.getElementById('excludeAmbiguous').checked;

            let charset = '';
            
            if (lowercase) charset += charSets.lowercase;
            if (uppercase) charset += charSets.uppercase;
            if (numbers) charset += charSets.numbers;
            if (symbols) charset += charSets.symbols;

            if (!charset) {
                alert('少なくとも1つの文字種類を選択してください');
                return;
            }

            if (excludeSimilar) {
                charset = charset.split('').filter(char => !similarChars.includes(char)).join('');
            }

            if (excludeAmbiguous) {
                charset = charset.split('').filter(char => !ambiguousChars.includes(char)).join('');
            }

            let password = '';
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * charset.length);
                password += charset[randomIndex];
            }

            currentPassword = password;
            displayPassword(password);
            updateStrengthIndicator(password);
        }

        function displayPassword(password) {
            const passwordDisplay = document.getElementById('passwordDisplay');
            passwordDisplay.textContent = password;
            
            const strength = calculateStrength(password);
            passwordDisplay.className = `password-display ${strength}`;
        }

        function calculateStrength(password) {
            let score = 0;
            
            // 長さによる得点
            if (password.length >= 8) score += 1;
            if (password.length >= 12) score += 1;
            if (password.length >= 16) score += 1;
            
            // 文字種類による得点
            if (/[a-z]/.test(password)) score += 1;
            if (/[A-Z]/.test(password)) score += 1;
            if (/[0-9]/.test(password)) score += 1;
            if (/[^a-zA-Z0-9]/.test(password)) score += 1;
            
            if (score <= 3) return 'weak';
            if (score <= 5) return 'medium';
            return 'strong';
        }

        function updateStrengthIndicator(password) {
            const strength = calculateStrength(password);
            const strengthBars = [
                document.getElementById('strengthBar1'),
                document.getElementById('strengthBar2'),
                document.getElementById('strengthBar3'),
                document.getElementById('strengthBar4')
            ];
            const strengthLabel = document.getElementById('strengthLabel');

            // リセット
            strengthBars.forEach(bar => {
                bar.classList.remove('active', 'weak', 'medium', 'strong');
            });

            let activeCount = 0;
            let strengthText = '';

            switch (strength) {
                case 'weak':
                    activeCount = 1;
                    strengthText = '弱い';
                    break;
                case 'medium':
                    activeCount = 2;
                    strengthText = '普通';
                    break;
                case 'strong':
                    activeCount = 4;
                    strengthText = '強い';
                    break;
            }

            for (let i = 0; i < activeCount; i++) {
                strengthBars[i].classList.add('active', strength);
            }

            strengthLabel.textContent = `パスワード強度: ${strengthText}`;
        }

        function copyPassword() {
            if (!currentPassword) {
                alert('パスワードがまだ生成されていません');
                return;
            }

            navigator.clipboard.writeText(currentPassword).then(() => {
                alert('パスワードがクリップボードにコピーされました！');
            }).catch(err => {
                console.error('コピーに失敗しました:', err);
                alert('コピーに失敗しました');
            });
        }

        function saveToHistory() {
            if (!currentPassword) {
                alert('パスワードがまだ生成されていません');
                return;
            }

            const timestamp = new Date().toLocaleString();
            passwordHistory.unshift({
                password: currentPassword,
                timestamp: timestamp
            });

            // 履歴を最大10件に制限
            if (passwordHistory.length > 10) {
                passwordHistory = passwordHistory.slice(0, 10);
            }

            updateHistoryDisplay();
        }

        function updateHistoryDisplay() {
            const historyList = document.getElementById('historyList');
            
            if (passwordHistory.length === 0) {
                historyList.innerHTML = '<p style="color: #666; font-style: italic;">履歴はまだありません</p>';
                return;
            }

            historyList.innerHTML = '';
            
            passwordHistory.forEach((item, index) => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                
                historyItem.innerHTML = `
                    <div class="history-password">${item.password}</div>
                    <button class="action-btn" onclick="copyHistoryPassword('${item.password}')">コピー</button>
                `;
                
                historyList.appendChild(historyItem);
            });
        }

        function copyHistoryPassword(password) {
            navigator.clipboard.writeText(password).then(() => {
                alert('パスワードがクリップボードにコピーされました！');
            }).catch(err => {
                console.error('コピーに失敗しました:', err);
                alert('コピーに失敗しました');
            });
        }

        // 初期パスワード生成
        generatePassword();
    </script>
</body>
</html>
