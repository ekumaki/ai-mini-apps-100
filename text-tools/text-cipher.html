<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テキスト暗号化ツール - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .cipher {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .warning {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            color: #856404;
        }

        .cipher-selector {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .cipher-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .cipher-btn {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .cipher-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .cipher-btn:hover:not(.active) {
            background: #e9ecef;
        }

        .key-section {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .key-input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .key-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .text-input {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            resize: vertical;
        }

        .text-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .text-input.readonly {
            background: #f8f9fa;
            cursor: not-allowed;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .control-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .control-btn.secondary {
            background: #28a745;
        }

        .control-btn.secondary:hover {
            background: #218838;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .input-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="cipher">
        <div class="header">
            <h1>テキスト暗号化ツール</h1>
            <p>テキストを簡単な暗号化アルゴリズムで暗号化・復号化</p>
        </div>

        <div class="warning">
            <strong>注意:</strong> これは教育目的の簡単な暗号化ツールです。実際のセキュリティが必要な場面では使用しないでください。
        </div>

        <div class="cipher-selector">
            <div class="cipher-buttons">
                <button class="cipher-btn active" onclick="selectCipher('caesar')">シーザー暗号</button>
                <button class="cipher-btn" onclick="selectCipher('rot13')">ROT13</button>
                <button class="cipher-btn" onclick="selectCipher('atbash')">アトバシュ暗号</button>
                <button class="cipher-btn" onclick="selectCipher('reverse')">逆順暗号</button>
            </div>
        </div>

        <div class="key-section" id="keySection">
            <label for="keyInput">暗号化キー (シーザー暗号の場合は数字を入力):</label>
            <input type="text" id="keyInput" class="key-input" placeholder="例: 3" value="3">
        </div>

        <div class="input-section">
            <div class="input-group">
                <label for="inputText">元のテキスト</label>
                <textarea 
                    id="inputText" 
                    class="text-input" 
                    placeholder="暗号化したいテキストを入力してください..."
                    oninput="processText()"
                ></textarea>
            </div>
            <div class="input-group">
                <label for="outputText">暗号化結果</label>
                <textarea 
                    id="outputText" 
                    class="text-input readonly" 
                    placeholder="暗号化結果がここに表示されます..."
                    readonly
                ></textarea>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn" onclick="encryptText()">暗号化</button>
            <button class="control-btn" onclick="decryptText()">復号化</button>
            <button class="control-btn secondary" onclick="loadSampleText()">サンプル読み込み</button>
            <button class="control-btn secondary" onclick="clearText()">クリア</button>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <script>
        let currentCipher = 'caesar';

        const cipherMethods = {
            caesar: {
                encrypt: (text, key) => {
                    const shift = parseInt(key) || 3;
                    return text.replace(/[a-zA-Z]/g, (char) => {
                        const start = char <= 'Z' ? 65 : 97;
                        return String.fromCharCode(((char.charCodeAt(0) - start + shift) % 26) + start);
                    });
                },
                decrypt: (text, key) => {
                    const shift = parseInt(key) || 3;
                    return text.replace(/[a-zA-Z]/g, (char) => {
                        const start = char <= 'Z' ? 65 : 97;
                        return String.fromCharCode(((char.charCodeAt(0) - start - shift + 26) % 26) + start);
                    });
                }
            },
            rot13: {
                encrypt: (text) => {
                    return text.replace(/[a-zA-Z]/g, (char) => {
                        const start = char <= 'Z' ? 65 : 97;
                        return String.fromCharCode(((char.charCodeAt(0) - start + 13) % 26) + start);
                    });
                },
                decrypt: (text) => {
                    return text.replace(/[a-zA-Z]/g, (char) => {
                        const start = char <= 'Z' ? 65 : 97;
                        return String.fromCharCode(((char.charCodeAt(0) - start + 13) % 26) + start);
                    });
                }
            },
            atbash: {
                encrypt: (text) => {
                    return text.replace(/[a-zA-Z]/g, (char) => {
                        if (char <= 'Z') {
                            return String.fromCharCode(90 - (char.charCodeAt(0) - 65));
                        } else {
                            return String.fromCharCode(122 - (char.charCodeAt(0) - 97));
                        }
                    });
                },
                decrypt: (text) => {
                    return text.replace(/[a-zA-Z]/g, (char) => {
                        if (char <= 'Z') {
                            return String.fromCharCode(90 - (char.charCodeAt(0) - 65));
                        } else {
                            return String.fromCharCode(122 - (char.charCodeAt(0) - 97));
                        }
                    });
                }
            },
            reverse: {
                encrypt: (text) => {
                    return text.split('').reverse().join('');
                },
                decrypt: (text) => {
                    return text.split('').reverse().join('');
                }
            }
        };

        function selectCipher(cipher) {
            currentCipher = cipher;
            document.querySelectorAll('.cipher-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            const keySection = document.getElementById('keySection');
            if (cipher === 'caesar') {
                keySection.style.display = 'block';
                document.getElementById('keyInput').placeholder = '例: 3';
            } else {
                keySection.style.display = 'none';
            }
            
            processText();
        }

        function processText() {
            const inputText = document.getElementById('inputText').value;
            if (inputText) {
                encryptText();
            }
        }

        function encryptText() {
            const inputText = document.getElementById('inputText').value;
            const key = document.getElementById('keyInput').value;
            
            if (!inputText) {
                alert('暗号化するテキストを入力してください');
                return;
            }

            const method = cipherMethods[currentCipher];
            const result = method.encrypt(inputText, key);
            document.getElementById('outputText').value = result;
        }

        function decryptText() {
            const inputText = document.getElementById('inputText').value;
            const key = document.getElementById('keyInput').value;
            
            if (!inputText) {
                alert('復号化するテキストを入力してください');
                return;
            }

            const method = cipherMethods[currentCipher];
            const result = method.decrypt(inputText, key);
            document.getElementById('outputText').value = result;
        }

        function loadSampleText() {
            document.getElementById('inputText').value = 'Hello World! This is a secret message.';
            encryptText();
        }

        function clearText() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').value = '';
        }

        // キー入力時の自動処理
        document.getElementById('keyInput').addEventListener('input', processText);
        
        // 初期設定
        selectCipher('caesar');
        loadSampleText();
    </script>
</body>
</html>
