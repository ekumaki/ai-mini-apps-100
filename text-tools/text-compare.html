<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テキスト比較ツール - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .text-compare {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .compare-options {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .options-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 15px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }

        .option-item label {
            color: #333;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .compare-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: block;
            margin: 0 auto;
        }

        .compare-btn:hover {
            background: #5a6fd8;
        }

        .input-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .text-input {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            line-height: 1.5;
        }

        .text-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .text-input.left {
            border-left: 4px solid #dc3545;
        }

        .text-input.right {
            border-left: 4px solid #28a745;
        }

        .results-section {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .results-title {
            font-weight: 600;
            color: #333;
        }

        .results-count {
            background: #667eea;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9rem;
        }

        .diff-display {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .diff-line {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            padding: 2px 5px;
            border-radius: 3px;
            margin-bottom: 2px;
            white-space: pre-wrap;
        }

        .diff-line.added {
            background: #d4edda;
            border-left: 4px solid #28a745;
        }

        .diff-line.removed {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
        }

        .diff-line.changed {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
        }

        .diff-line.unchanged {
            background: #f8f9fa;
            color: #666;
        }

        .line-number {
            display: inline-block;
            width: 50px;
            color: #666;
            font-size: 0.8rem;
            margin-right: 10px;
        }

        .stats-section {
            background: #e8f5e8;
            border: 1px solid #c3e6cb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-item {
            background: white;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #155724;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            border: 1px solid #ddd;
        }

        .legend-color.added {
            background: #d4edda;
            border-color: #28a745;
        }

        .legend-color.removed {
            background: #f8d7da;
            border-color: #dc3545;
        }

        .legend-color.changed {
            background: #fff3cd;
            border-color: #ffc107;
        }

        .legend-color.unchanged {
            background: #f8f9fa;
            border-color: #666;
        }

        .export-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .export-btn {
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            margin: 0 5px;
        }

        .export-btn:hover {
            background: #218838;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .input-section {
                grid-template-columns: 1fr;
            }
            
            .options-grid {
                flex-direction: column;
                align-items: center;
            }
            
            .legend {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="text-compare">
        <div class="header">
            <h1>テキスト比較ツール</h1>
            <p>2つのテキストの違いを詳細に比較・表示</p>
        </div>

        <div class="compare-options">
            <div class="options-grid">
                <div class="option-item">
                    <input type="checkbox" id="ignoreCase" checked>
                    <label for="ignoreCase">大文字小文字を無視</label>
                </div>
                <div class="option-item">
                    <input type="checkbox" id="ignoreWhitespace">
                    <label for="ignoreWhitespace">空白を無視</label>
                </div>
                <div class="option-item">
                    <input type="checkbox" id="ignoreEmptyLines">
                    <label for="ignoreEmptyLines">空行を無視</label>
                </div>
                <div class="option-item">
                    <input type="checkbox" id="showLineNumbers" checked>
                    <label for="showLineNumbers">行番号を表示</label>
                </div>
            </div>
            <button class="compare-btn" onclick="compareTexts()">比較実行</button>
        </div>

        <div class="input-section">
            <div class="input-group">
                <label for="text1">テキスト1 (左側)</label>
                <textarea 
                    id="text1" 
                    class="text-input left" 
                    placeholder="比較したいテキストを入力してください..."
                ></textarea>
            </div>
            <div class="input-group">
                <label for="text2">テキスト2 (右側)</label>
                <textarea 
                    id="text2" 
                    class="text-input right" 
                    placeholder="比較したいテキストを入力してください..."
                ></textarea>
            </div>
        </div>

        <div class="results-section">
            <div class="results-header">
                <div class="results-title">比較結果</div>
                <div class="results-count" id="diffCount">0箇所の違い</div>
            </div>
            
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color added"></div>
                    <span>追加された行</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color removed"></div>
                    <span>削除された行</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color changed"></div>
                    <span>変更された行</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color unchanged"></div>
                    <span>変更なし</span>
                </div>
            </div>
            
            <div class="diff-display" id="diffDisplay">
                <p style="color: #666; font-style: italic; text-align: center;">比較結果がここに表示されます</p>
            </div>
        </div>

        <div class="stats-section">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="addedLines">0</div>
                    <div class="stat-label">追加行数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="removedLines">0</div>
                    <div class="stat-label">削除行数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="changedLines">0</div>
                    <div class="stat-label">変更行数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="similarityScore">0%</div>
                    <div class="stat-label">類似度</div>
                </div>
            </div>
        </div>

        <div class="export-section">
            <button class="export-btn" onclick="exportDiff('html')">HTML出力</button>
            <button class="export-btn" onclick="exportDiff('txt')">テキスト出力</button>
            <button class="export-btn" onclick="loadSampleTexts()">サンプル読込</button>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <script>
        let currentDiff = [];

        function compareTexts() {
            const text1 = document.getElementById('text1').value;
            const text2 = document.getElementById('text2').value;
            
            if (!text1 && !text2) {
                alert('比較するテキストを入力してください');
                return;
            }
            
            const options = {
                ignoreCase: document.getElementById('ignoreCase').checked,
                ignoreWhitespace: document.getElementById('ignoreWhitespace').checked,
                ignoreEmptyLines: document.getElementById('ignoreEmptyLines').checked,
                showLineNumbers: document.getElementById('showLineNumbers').checked
            };
            
            const diff = generateDiff(text1, text2, options);
            displayDiff(diff, options);
            updateStats(diff);
            
            currentDiff = diff;
        }

        function generateDiff(text1, text2, options) {
            let lines1 = text1.split('\n');
            let lines2 = text2.split('\n');
            
            // オプションに応じて前処理
            if (options.ignoreEmptyLines) {
                lines1 = lines1.filter(line => line.trim() !== '');
                lines2 = lines2.filter(line => line.trim() !== '');
            }
            
            if (options.ignoreWhitespace) {
                lines1 = lines1.map(line => line.replace(/\s+/g, ' ').trim());
                lines2 = lines2.map(line => line.replace(/\s+/g, ' ').trim());
            }
            
            if (options.ignoreCase) {
                lines1 = lines1.map(line => line.toLowerCase());
                lines2 = lines2.map(line => line.toLowerCase());
            }
            
            // 簡単なLCS（最長共通部分列）ベースの差分アルゴリズム
            const diff = [];
            let i = 0, j = 0;
            const originalLines1 = text1.split('\n');
            const originalLines2 = text2.split('\n');
            
            while (i < lines1.length || j < lines2.length) {
                if (i >= lines1.length) {
                    // text2の残りの行は追加
                    diff.push({
                        type: 'added',
                        line1: null,
                        line2: originalLines2[j],
                        lineNumber1: null,
                        lineNumber2: j + 1
                    });
                    j++;
                } else if (j >= lines2.length) {
                    // text1の残りの行は削除
                    diff.push({
                        type: 'removed',
                        line1: originalLines1[i],
                        line2: null,
                        lineNumber1: i + 1,
                        lineNumber2: null
                    });
                    i++;
                } else if (lines1[i] === lines2[j]) {
                    // 同じ行
                    diff.push({
                        type: 'unchanged',
                        line1: originalLines1[i],
                        line2: originalLines2[j],
                        lineNumber1: i + 1,
                        lineNumber2: j + 1
                    });
                    i++;
                    j++;
                } else {
                    // 異なる行 - 次の一致を探す
                    let foundMatch = false;
                    for (let k = j + 1; k < Math.min(j + 5, lines2.length); k++) {
                        if (lines1[i] === lines2[k]) {
                            // text2で削除された行がある
                            for (let l = j; l < k; l++) {
                                diff.push({
                                    type: 'added',
                                    line1: null,
                                    line2: originalLines2[l],
                                    lineNumber1: null,
                                    lineNumber2: l + 1
                                });
                            }
                            diff.push({
                                type: 'unchanged',
                                line1: originalLines1[i],
                                line2: originalLines2[k],
                                lineNumber1: i + 1,
                                lineNumber2: k + 1
                            });
                            i++;
                            j = k + 1;
                            foundMatch = true;
                            break;
                        }
                    }
                    
                    if (!foundMatch) {
                        for (let k = i + 1; k < Math.min(i + 5, lines1.length); k++) {
                            if (lines1[k] === lines2[j]) {
                                // text1で削除された行がある
                                for (let l = i; l < k; l++) {
                                    diff.push({
                                        type: 'removed',
                                        line1: originalLines1[l],
                                        line2: null,
                                        lineNumber1: l + 1,
                                        lineNumber2: null
                                    });
                                }
                                diff.push({
                                    type: 'unchanged',
                                    line1: originalLines1[k],
                                    line2: originalLines2[j],
                                    lineNumber1: k + 1,
                                    lineNumber2: j + 1
                                });
                                i = k + 1;
                                j++;
                                foundMatch = true;
                                break;
                            }
                        }
                    }
                    
                    if (!foundMatch) {
                        // 変更された行
                        diff.push({
                            type: 'changed',
                            line1: originalLines1[i],
                            line2: originalLines2[j],
                            lineNumber1: i + 1,
                            lineNumber2: j + 1
                        });
                        i++;
                        j++;
                    }
                }
            }
            
            return diff;
        }

        function displayDiff(diff, options) {
            const diffDisplay = document.getElementById('diffDisplay');
            diffDisplay.innerHTML = '';
            
            if (diff.length === 0) {
                diffDisplay.innerHTML = '<p style="color: #666; font-style: italic; text-align: center;">比較するテキストがありません</p>';
                return;
            }
            
            diff.forEach(item => {
                const diffLine = document.createElement('div');
                diffLine.className = `diff-line ${item.type}`;
                
                let lineNumberText = '';
                if (options.showLineNumbers) {
                    const lineNum1 = item.lineNumber1 ? item.lineNumber1.toString().padStart(4, ' ') : '    ';
                    const lineNum2 = item.lineNumber2 ? item.lineNumber2.toString().padStart(4, ' ') : '    ';
                    lineNumberText = `<span class="line-number">${lineNum1}|${lineNum2}</span>`;
                }
                
                let prefix = '';
                let content = '';
                
                switch (item.type) {
                    case 'added':
                        prefix = '+ ';
                        content = item.line2 || '';
                        break;
                    case 'removed':
                        prefix = '- ';
                        content = item.line1 || '';
                        break;
                    case 'changed':
                        prefix = '~ ';
                        content = `${item.line1} → ${item.line2}`;
                        break;
                    case 'unchanged':
                        prefix = '  ';
                        content = item.line1 || '';
                        break;
                }
                
                diffLine.innerHTML = `${lineNumberText}${prefix}${content}`;
                diffDisplay.appendChild(diffLine);
            });
        }

        function updateStats(diff) {
            const addedLines = diff.filter(item => item.type === 'added').length;
            const removedLines = diff.filter(item => item.type === 'removed').length;
            const changedLines = diff.filter(item => item.type === 'changed').length;
            const unchangedLines = diff.filter(item => item.type === 'unchanged').length;
            
            const totalChanges = addedLines + removedLines + changedLines;
            const totalLines = Math.max(diff.length, 1);
            const similarity = Math.round((unchangedLines / totalLines) * 100);
            
            document.getElementById('addedLines').textContent = addedLines;
            document.getElementById('removedLines').textContent = removedLines;
            document.getElementById('changedLines').textContent = changedLines;
            document.getElementById('similarityScore').textContent = `${similarity}%`;
            document.getElementById('diffCount').textContent = `${totalChanges}箇所の違い`;
        }

        function exportDiff(format) {
            if (currentDiff.length === 0) {
                alert('比較結果がありません');
                return;
            }
            
            let content = '';
            const timestamp = new Date().toLocaleString();
            
            if (format === 'html') {
                content = `<!DOCTYPE html>
<html>
<head>
    <title>テキスト比較結果</title>
    <style>
        body { font-family: 'Courier New', monospace; }
        .added { background: #d4edda; border-left: 4px solid #28a745; }
        .removed { background: #f8d7da; border-left: 4px solid #dc3545; }
        .changed { background: #fff3cd; border-left: 4px solid #ffc107; }
        .unchanged { background: #f8f9fa; color: #666; }
        .diff-line { padding: 2px 5px; margin-bottom: 2px; }
    </style>
</head>
<body>
    <h1>テキスト比較結果</h1>
    <p>生成日時: ${timestamp}</p>
    <div>`;
                
                currentDiff.forEach(item => {
                    let prefix = '';
                    let content = '';
                    
                    switch (item.type) {
                        case 'added':
                            prefix = '+ ';
                            content = item.line2 || '';
                            break;
                        case 'removed':
                            prefix = '- ';
                            content = item.line1 || '';
                            break;
                        case 'changed':
                            prefix = '~ ';
                            content = `${item.line1} → ${item.line2}`;
                            break;
                        case 'unchanged':
                            prefix = '  ';
                            content = item.line1 || '';
                            break;
                    }
                    
                    content += `<div class="diff-line ${item.type}">${prefix}${content}</div>`;
                });
                
                content += '</div></body></html>';
            } else {
                content = `テキスト比較結果\n生成日時: ${timestamp}\n\n`;
                
                currentDiff.forEach(item => {
                    let prefix = '';
                    let lineContent = '';
                    
                    switch (item.type) {
                        case 'added':
                            prefix = '+ ';
                            lineContent = item.line2 || '';
                            break;
                        case 'removed':
                            prefix = '- ';
                            lineContent = item.line1 || '';
                            break;
                        case 'changed':
                            prefix = '~ ';
                            lineContent = `${item.line1} → ${item.line2}`;
                            break;
                        case 'unchanged':
                            prefix = '  ';
                            lineContent = item.line1 || '';
                            break;
                    }
                    
                    content += `${prefix}${lineContent}\n`;
                });
            }
            
            const blob = new Blob([content], { type: format === 'html' ? 'text/html' : 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `text_diff_${Date.now()}.${format}`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function loadSampleTexts() {
            const sampleText1 = `Hello World!
This is line 2
This is line 3
This line will be removed
Final line`;

            const sampleText2 = `Hello World!
This is line 2 (modified)
This is line 3
This is a new line
Final line`;

            document.getElementById('text1').value = sampleText1;
            document.getElementById('text2').value = sampleText2;
        }

        // 初期サンプル読み込み
        loadSampleTexts();
    </script>
</body>
</html>
