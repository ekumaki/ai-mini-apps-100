<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テキスト結合ツール - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .joiner {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .input-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .text-input {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            resize: vertical;
        }

        .text-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .text-input.readonly {
            background: #f8f9fa;
            cursor: not-allowed;
        }

        .controls {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .control-row {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
        }

        .control-row:last-child {
            margin-bottom: 0;
        }

        .control-label {
            font-weight: 600;
            color: #333;
            min-width: 100px;
        }

        .control-input {
            flex: 1;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
        }

        .control-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .join-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .join-btn:hover {
            background: #5a6fd8;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 15px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }

        .option label {
            color: #333;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 0;
        }

        .presets {
            background: #e8f5e8;
            border: 1px solid #c3e6cb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .presets-title {
            font-weight: 600;
            color: #155724;
            margin-bottom: 15px;
        }

        .preset-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .preset-btn {
            background: white;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .preset-btn:hover {
            background: #d4edda;
            border-color: #155724;
        }

        .stats {
            background: #fff8e1;
            border: 1px solid #ffcc02;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-item {
            background: white;
            border: 1px solid #ffcc02;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff8f00;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        .export-section {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .export-btn {
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .export-btn:hover {
            background: #5a6268;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .input-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="joiner">
        <div class="header">
            <h1>テキスト結合ツール</h1>
            <p>複数のテキストを指定した区切り文字で結合</p>
        </div>

        <div class="input-section">
            <div class="input-group">
                <label for="inputText">結合したいテキスト（1行1項目）</label>
                <textarea 
                    id="inputText" 
                    class="text-input" 
                    placeholder="apple&#10;banana&#10;orange&#10;grape&#10;kiwi"
                    oninput="updatePreview()"
                ></textarea>
            </div>
            <div class="input-group">
                <label for="outputText">結合結果</label>
                <textarea 
                    id="outputText" 
                    class="text-input readonly" 
                    placeholder="結合結果がここに表示されます..."
                    readonly
                ></textarea>
            </div>
        </div>

        <div class="controls">
            <div class="control-row">
                <label class="control-label">区切り文字:</label>
                <input type="text" id="delimiter" class="control-input" placeholder="例: ,  |  ;  タブ" value="," oninput="updatePreview()">
                <button class="join-btn" onclick="joinText()">結合実行</button>
            </div>
            
            <div class="options">
                <div class="option">
                    <input type="checkbox" id="removeEmpty" checked onchange="updatePreview()">
                    <label for="removeEmpty">空行を除外</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="trimSpaces" checked onchange="updatePreview()">
                    <label for="trimSpaces">前後の空白を削除</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="removeDuplicates" onchange="updatePreview()">
                    <label for="removeDuplicates">重複を除去</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="sortItems" onchange="updatePreview()">
                    <label for="sortItems">並び替え</label>
                </div>
            </div>
        </div>

        <div class="presets">
            <div class="presets-title">よく使う区切り文字</div>
            <div class="preset-buttons">
                <button class="preset-btn" onclick="setDelimiter(',')">カンマ (,)</button>
                <button class="preset-btn" onclick="setDelimiter(';')">セミコロン (;)</button>
                <button class="preset-btn" onclick="setDelimiter('|')">パイプ (|)</button>
                <button class="preset-btn" onclick="setDelimiter('\\t')">タブ</button>
                <button class="preset-btn" onclick="setDelimiter(' ')">スペース</button>
                <button class="preset-btn" onclick="setDelimiter('\\n')">改行</button>
                <button class="preset-btn" onclick="setDelimiter(' - ')">ハイフン ( - )</button>
                <button class="preset-btn" onclick="setDelimiter(' and ')">and</button>
            </div>
        </div>

        <div class="stats">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="itemCount">0</div>
                    <div class="stat-label">項目数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalLength">0</div>
                    <div class="stat-label">総文字数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="avgLength">0</div>
                    <div class="stat-label">平均文字数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="uniqueItems">0</div>
                    <div class="stat-label">ユニーク項目数</div>
                </div>
            </div>
        </div>

        <div class="export-section">
            <div class="export-buttons">
                <button class="export-btn" onclick="exportResult('text')">テキストファイル</button>
                <button class="export-btn" onclick="exportResult('json')">JSON形式</button>
                <button class="export-btn" onclick="exportResult('csv')">CSV形式</button>
                <button class="export-btn" onclick="copyResult()">クリップボードにコピー</button>
            </div>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <script>
        let joinResults = {
            items: [],
            result: '',
            stats: {}
        };

        function joinText() {
            const text = document.getElementById('inputText').value;
            const delimiter = document.getElementById('delimiter').value;
            
            if (!text.trim()) {
                alert('結合するテキストを入力してください');
                return;
            }

            updatePreview();
        }

        function updatePreview() {
            const text = document.getElementById('inputText').value;
            const delimiter = document.getElementById('delimiter').value;
            const removeEmpty = document.getElementById('removeEmpty').checked;
            const trimSpaces = document.getElementById('trimSpaces').checked;
            const removeDuplicates = document.getElementById('removeDuplicates').checked;
            const sortItems = document.getElementById('sortItems').checked;

            if (!text.trim()) {
                document.getElementById('outputText').value = '';
                updateStats([], '');
                return;
            }

            // 行に分割
            let items = text.split('\n');

            // 処理オプション適用
            if (trimSpaces) {
                items = items.map(item => item.trim());
            }

            if (removeEmpty) {
                items = items.filter(item => item !== '');
            }

            if (removeDuplicates) {
                items = [...new Set(items)];
            }

            if (sortItems) {
                items.sort();
            }

            // 区切り文字の処理
            let actualDelimiter = delimiter;
            if (delimiter === '\\t') {
                actualDelimiter = '\t';
            } else if (delimiter === '\\n') {
                actualDelimiter = '\n';
            } else if (delimiter === '\\r') {
                actualDelimiter = '\r';
            }

            // 結合
            const result = items.join(actualDelimiter);
            document.getElementById('outputText').value = result;

            // 結果を保存
            joinResults = {
                items: items,
                result: result,
                delimiter: actualDelimiter,
                stats: calculateStats(items, result)
            };

            updateStats(items, result);
        }

        function calculateStats(items, result) {
            const itemCount = items.length;
            const totalLength = result.length;
            const avgLength = itemCount > 0 ? Math.round(items.reduce((sum, item) => sum + item.length, 0) / itemCount) : 0;
            const uniqueItems = new Set(items).size;

            return {
                itemCount,
                totalLength,
                avgLength,
                uniqueItems
            };
        }

        function updateStats(items, result) {
            const stats = calculateStats(items, result);
            
            document.getElementById('itemCount').textContent = stats.itemCount;
            document.getElementById('totalLength').textContent = stats.totalLength;
            document.getElementById('avgLength').textContent = stats.avgLength;
            document.getElementById('uniqueItems').textContent = stats.uniqueItems;
        }

        function setDelimiter(delimiter) {
            document.getElementById('delimiter').value = delimiter;
            updatePreview();
        }

        function exportResult(format) {
            const result = document.getElementById('outputText').value;
            
            if (!result) {
                alert('エクスポートする結果がありません');
                return;
            }

            let content = '';
            let filename = '';
            let mimeType = '';

            switch (format) {
                case 'text':
                    content = result;
                    filename = 'joined_text.txt';
                    mimeType = 'text/plain';
                    break;

                case 'json':
                    const data = {
                        originalText: document.getElementById('inputText').value,
                        delimiter: document.getElementById('delimiter').value,
                        items: joinResults.items,
                        result: result,
                        stats: joinResults.stats,
                        timestamp: new Date().toISOString()
                    };
                    content = JSON.stringify(data, null, 2);
                    filename = 'join_results.json';
                    mimeType = 'application/json';
                    break;

                case 'csv':
                    content = 'Item Number,Content,Length\n' + 
                             joinResults.items.map((item, index) => `${index + 1},"${item.replace(/"/g, '""')}",${item.length}`).join('\n');
                    filename = 'joined_items.csv';
                    mimeType = 'text/csv';
                    break;
            }

            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function copyResult() {
            const result = document.getElementById('outputText').value;
            
            if (!result) {
                alert('コピーする結果がありません');
                return;
            }

            navigator.clipboard.writeText(result).then(() => {
                alert('結果がクリップボードにコピーされました！');
            });
        }

        // 初期サンプル
        document.getElementById('inputText').value = 'apple\nbanana\norange\ngrape\nkiwi';
        updatePreview();
    </script>
</body>
</html>
