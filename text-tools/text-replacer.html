<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テキスト置換ツール - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .replacer {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .info {
            background: #e7f3ff;
            border: 1px solid #b3d7ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #0066cc;
        }

        .replace-mode {
            margin-bottom: 20px;
        }

        .mode-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .mode-btn {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .mode-btn:hover:not(.active) {
            background: #e9ecef;
            border-color: #dee2e6;
        }

        .input-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .text-input {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            resize: vertical;
            transition: border-color 0.3s ease;
        }

        .text-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .text-input.readonly {
            background: #f8f9fa;
            cursor: not-allowed;
        }

        .replace-controls {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .controls-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .replace-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .replace-input {
            display: flex;
            flex-direction: column;
        }

        .replace-input label {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .replace-input input {
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
        }

        .replace-input input:focus {
            outline: none;
            border-color: #667eea;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }

        .option label {
            color: #333;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 0;
            font-weight: normal;
        }

        .replace-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .replace-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .replace-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .replace-btn.secondary {
            background: #28a745;
        }

        .replace-btn.secondary:hover {
            background: #218838;
        }

        .replace-btn.danger {
            background: #dc3545;
        }

        .replace-btn.danger:hover {
            background: #c82333;
        }

        .batch-replace {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }

        .batch-replace.active {
            display: block;
        }

        .batch-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .batch-input {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 14px;
            font-family: monospace;
            resize: vertical;
            margin-bottom: 15px;
        }

        .batch-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .stats {
            background: #e8f5e8;
            border: 1px solid #c3e6cb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .stats-title {
            font-weight: 600;
            color: #155724;
            margin-bottom: 15px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-item {
            background: white;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #155724;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        .history {
            background: #fff8e1;
            border: 1px solid #ffcc02;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .history-title {
            font-weight: 600;
            color: #ff8f00;
            margin-bottom: 15px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: white;
            border: 1px solid #ffcc02;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .history-item:last-child {
            margin-bottom: 0;
        }

        .history-text {
            font-family: monospace;
            font-size: 0.9rem;
            color: #333;
        }

        .history-btn {
            background: #ff8f00;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .history-btn:hover {
            background: #e68900;
        }

        .export-section {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .export-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .export-btn {
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .export-btn:hover {
            background: #5a6268;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .error {
            color: #dc3545;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .input-section {
                grid-template-columns: 1fr;
            }
            
            .replace-inputs {
                grid-template-columns: 1fr;
            }
            
            .replace-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="replacer">
        <div class="header">
            <h1>テキスト置換ツール</h1>
            <p>テキスト内の文字列を一括置換</p>
        </div>

        <div class="info">
            テキスト内の文字列を検索・置換できます。正規表現、大文字小文字の区別、単語単位での置換に対応。
        </div>

        <div class="replace-mode">
            <div class="mode-buttons">
                <button class="mode-btn active" onclick="switchMode('single')">単一置換</button>
                <button class="mode-btn" onclick="switchMode('batch')">一括置換</button>
            </div>
        </div>

        <div class="input-section">
            <div class="input-group">
                <label for="originalText">元のテキスト</label>
                <textarea 
                    id="originalText" 
                    class="text-input" 
                    placeholder="置換したいテキストを入力してください..."
                    oninput="updateStats()"
                ></textarea>
            </div>
            <div class="input-group">
                <label for="resultText">置換後のテキスト</label>
                <textarea 
                    id="resultText" 
                    class="text-input readonly" 
                    placeholder="置換結果がここに表示されます..."
                    readonly
                ></textarea>
            </div>
        </div>

        <div class="replace-controls" id="singleReplace">
            <div class="controls-title">置換設定</div>
            <div class="replace-inputs">
                <div class="replace-input">
                    <label for="searchText">検索文字列</label>
                    <input type="text" id="searchText" placeholder="検索したい文字列">
                </div>
                <div class="replace-input">
                    <label for="replaceText">置換文字列</label>
                    <input type="text" id="replaceText" placeholder="置換後の文字列">
                </div>
            </div>

            <div class="options">
                <div class="option">
                    <input type="checkbox" id="caseSensitive">
                    <label for="caseSensitive">大文字小文字を区別</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="wholeWord">
                    <label for="wholeWord">単語単位で検索</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="useRegex">
                    <label for="useRegex">正規表現を使用</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="multiline">
                    <label for="multiline">複数行モード</label>
                </div>
            </div>

            <div class="replace-buttons">
                <button class="replace-btn" onclick="replaceText()">置換実行</button>
                <button class="replace-btn secondary" onclick="replaceAll()">全て置換</button>
                <button class="replace-btn danger" onclick="clearText()">クリア</button>
            </div>
        </div>

        <div class="batch-replace" id="batchReplace">
            <div class="batch-title">一括置換設定</div>
            <p style="color: #666; margin-bottom: 15px; font-size: 0.9rem;">
                1行に1つの置換ルールを記述してください。形式: 検索文字列 → 置換文字列
            </p>
            <textarea 
                id="batchRules" 
                class="batch-input" 
                placeholder="例:&#10;古い文字列 → 新しい文字列&#10;Hello → こんにちは&#10;World → 世界"
            ></textarea>
            <div class="replace-buttons">
                <button class="replace-btn" onclick="batchReplace()">一括置換実行</button>
                <button class="replace-btn secondary" onclick="loadSampleRules()">サンプルルール読み込み</button>
                <button class="replace-btn danger" onclick="clearBatch()">クリア</button>
            </div>
        </div>

        <div class="stats">
            <div class="stats-title">置換統計</div>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="originalLength">0</div>
                    <div class="stat-label">元の文字数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="resultLength">0</div>
                    <div class="stat-label">置換後文字数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="replaceCount">0</div>
                    <div class="stat-label">置換箇所数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="charDiff">0</div>
                    <div class="stat-label">文字数の差</div>
                </div>
            </div>
        </div>

        <div class="history">
            <div class="history-title">置換履歴</div>
            <div id="historyList">
                <p style="color: #666; font-style: italic;">置換履歴がここに表示されます</p>
            </div>
        </div>

        <div class="export-section">
            <div class="export-title">結果をエクスポート</div>
            <div class="export-buttons">
                <button class="export-btn" onclick="exportResult('text')">テキストファイル</button>
                <button class="export-btn" onclick="exportResult('json')">JSON形式</button>
                <button class="export-btn" onclick="copyResult()">クリップボードにコピー</button>
            </div>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <script>
        let currentMode = 'single';
        let replaceHistory = [];
        let lastReplaceStats = { count: 0, originalLength: 0, resultLength: 0 };

        function switchMode(mode) {
            currentMode = mode;
            
            // ボタンの状態を更新
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // コンテンツの表示を切り替え
            if (mode === 'single') {
                document.getElementById('singleReplace').style.display = 'block';
                document.getElementById('batchReplace').classList.remove('active');
            } else {
                document.getElementById('singleReplace').style.display = 'none';
                document.getElementById('batchReplace').classList.add('active');
            }
        }

        function replaceText() {
            const originalText = document.getElementById('originalText').value;
            const searchText = document.getElementById('searchText').value;
            const replaceText = document.getElementById('replaceText').value;

            if (!searchText) {
                alert('検索文字列を入力してください');
                return;
            }

            try {
                const result = performReplace(originalText, searchText, replaceText, false);
                document.getElementById('resultText').value = result.text;
                updateStats();
                addToHistory(searchText, replaceText, result.count);
            } catch (error) {
                alert('置換エラー: ' + error.message);
            }
        }

        function replaceAll() {
            const originalText = document.getElementById('originalText').value;
            const searchText = document.getElementById('searchText').value;
            const replaceText = document.getElementById('replaceText').value;

            if (!searchText) {
                alert('検索文字列を入力してください');
                return;
            }

            try {
                const result = performReplace(originalText, searchText, replaceText, true);
                document.getElementById('resultText').value = result.text;
                updateStats();
                addToHistory(searchText, replaceText, result.count);
            } catch (error) {
                alert('置換エラー: ' + error.message);
            }
        }

        function performReplace(text, search, replace, replaceAll) {
            const caseSensitive = document.getElementById('caseSensitive').checked;
            const wholeWord = document.getElementById('wholeWord').checked;
            const useRegex = document.getElementById('useRegex').checked;
            const multiline = document.getElementById('multiline').checked;

            let flags = '';
            if (!caseSensitive) flags += 'i';
            if (replaceAll) flags += 'g';
            if (multiline) flags += 'm';

            let pattern = search;
            if (useRegex) {
                // 正規表現として使用
                pattern = search;
            } else {
                // 文字列をエスケープ
                pattern = search.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }

            if (wholeWord) {
                pattern = '\\b' + pattern + '\\b';
            }

            const regex = new RegExp(pattern, flags);
            const matches = text.match(regex);
            const count = matches ? matches.length : 0;

            const resultText = text.replace(regex, replace);

            return {
                text: resultText,
                count: count
            };
        }

        function batchReplace() {
            const originalText = document.getElementById('originalText').value;
            const rules = document.getElementById('batchRules').value;

            if (!rules.trim()) {
                alert('置換ルールを入力してください');
                return;
            }

            try {
                let resultText = originalText;
                let totalCount = 0;

                const lines = rules.split('\n').filter(line => line.trim());
                
                lines.forEach(line => {
                    const parts = line.split('→').map(part => part.trim());
                    if (parts.length === 2) {
                        const [search, replace] = parts;
                        const result = performReplace(resultText, search, replace, true);
                        resultText = result.text;
                        totalCount += result.count;
                    }
                });

                document.getElementById('resultText').value = resultText;
                updateStats();
                addToHistory('一括置換', `${lines.length}ルール`, totalCount);
            } catch (error) {
                alert('一括置換エラー: ' + error.message);
            }
        }

        function loadSampleRules() {
            const sampleRules = `Hello → こんにちは
World → 世界
Good → 良い
Bad → 悪い
Yes → はい
No → いいえ
Thank you → ありがとう`;
            document.getElementById('batchRules').value = sampleRules;
        }

        function clearText() {
            document.getElementById('originalText').value = '';
            document.getElementById('resultText').value = '';
            updateStats();
        }

        function clearBatch() {
            document.getElementById('batchRules').value = '';
        }

        function updateStats() {
            const originalText = document.getElementById('originalText').value;
            const resultText = document.getElementById('resultText').value;
            
            const originalLength = originalText.length;
            const resultLength = resultText.length;
            const charDiff = resultLength - originalLength;

            document.getElementById('originalLength').textContent = originalLength;
            document.getElementById('resultLength').textContent = resultLength;
            document.getElementById('charDiff').textContent = charDiff >= 0 ? '+' + charDiff : charDiff;

            lastReplaceStats.originalLength = originalLength;
            lastReplaceStats.resultLength = resultLength;
        }

        function addToHistory(search, replace, count) {
            const historyItem = {
                search: search,
                replace: replace,
                count: count,
                timestamp: new Date().toLocaleString()
            };

            replaceHistory.unshift(historyItem);
            if (replaceHistory.length > 10) {
                replaceHistory = replaceHistory.slice(0, 10);
            }

            document.getElementById('replaceCount').textContent = count;
            updateHistoryDisplay();
        }

        function updateHistoryDisplay() {
            const historyList = document.getElementById('historyList');
            
            if (replaceHistory.length === 0) {
                historyList.innerHTML = '<p style="color: #666; font-style: italic;">置換履歴がここに表示されます</p>';
                return;
            }

            historyList.innerHTML = '';
            
            replaceHistory.forEach((item, index) => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.innerHTML = `
                    <div class="history-text">
                        "${item.search}" → "${item.replace}" (${item.count}箇所) 
                        <small style="color: #666;">${item.timestamp}</small>
                    </div>
                    <button class="history-btn" onclick="reapplyHistory(${index})">再適用</button>
                `;
                historyList.appendChild(historyItem);
            });
        }

        function reapplyHistory(index) {
            const item = replaceHistory[index];
            if (item.search === '一括置換') {
                alert('一括置換の履歴は再適用できません');
                return;
            }

            document.getElementById('searchText').value = item.search;
            document.getElementById('replaceText').value = item.replace;
            replaceAll();
        }

        function exportResult(format) {
            const resultText = document.getElementById('resultText').value;
            
            if (!resultText) {
                alert('エクスポートするテキストがありません');
                return;
            }

            let content = '';
            let filename = '';
            let mimeType = '';

            switch (format) {
                case 'text':
                    content = resultText;
                    filename = 'replaced_text.txt';
                    mimeType = 'text/plain';
                    break;

                case 'json':
                    const data = {
                        originalText: document.getElementById('originalText').value,
                        resultText: resultText,
                        stats: lastReplaceStats,
                        history: replaceHistory,
                        timestamp: new Date().toISOString()
                    };
                    content = JSON.stringify(data, null, 2);
                    filename = 'replace_results.json';
                    mimeType = 'application/json';
                    break;
            }

            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function copyResult() {
            const resultText = document.getElementById('resultText').value;
            
            if (!resultText) {
                alert('コピーするテキストがありません');
                return;
            }

            navigator.clipboard.writeText(resultText).then(() => {
                alert('結果がクリップボードにコピーされました！');
            });
        }

        // 初期化
        updateStats();
    </script>
</body>
</html>
