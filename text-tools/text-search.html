<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字列検索ツール - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .search-tool {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .search-section {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-options {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }

        .option label {
            color: #333;
            font-size: 14px;
            cursor: pointer;
        }

        .search-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            background: #5a6fd8;
        }

        .text-section {
            margin-bottom: 20px;
        }

        .text-input {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            line-height: 1.5;
        }

        .text-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .results-section {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .results-title {
            font-weight: 600;
            color: #333;
        }

        .results-count {
            background: #667eea;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9rem;
        }

        .result-item {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .result-position {
            font-weight: bold;
            color: #667eea;
        }

        .result-line {
            color: #666;
            font-size: 0.9rem;
        }

        .result-content {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #333;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            white-space: pre-wrap;
        }

        .highlight {
            background: #ffeb3b;
            padding: 2px 4px;
            border-radius: 3px;
        }

        .stats {
            background: #e8f5e8;
            border: 1px solid #c3e6cb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-item {
            background: white;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #155724;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .search-options {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="search-tool">
        <div class="header">
            <h1>文字列検索ツール</h1>
            <p>テキスト内の文字列を検索・ハイライト表示</p>
        </div>

        <div class="search-section">
            <input type="text" id="searchInput" class="search-input" placeholder="検索したい文字列を入力..." oninput="performSearch()">
            
            <div class="search-options">
                <div class="option">
                    <input type="checkbox" id="caseSensitive" onchange="performSearch()">
                    <label for="caseSensitive">大文字小文字を区別</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="wholeWord" onchange="performSearch()">
                    <label for="wholeWord">単語単位で検索</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="useRegex" onchange="performSearch()">
                    <label for="useRegex">正規表現を使用</label>
                </div>
            </div>
            
            <button class="search-btn" onclick="performSearch()">検索実行</button>
        </div>

        <div class="text-section">
            <label for="textInput" style="font-weight: 600; color: #333; margin-bottom: 8px; display: block;">検索対象のテキスト</label>
            <textarea 
                id="textInput" 
                class="text-input" 
                placeholder="検索対象のテキストを入力してください..."
                oninput="performSearch()"
            ></textarea>
        </div>

        <div class="results-section">
            <div class="results-header">
                <div class="results-title">検索結果</div>
                <div class="results-count" id="resultsCount">0件</div>
            </div>
            <div id="resultsList">
                <p style="color: #666; font-style: italic;">検索結果がここに表示されます</p>
            </div>
        </div>

        <div class="stats">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="matchCount">0</div>
                    <div class="stat-label">マッチ数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="lineCount">0</div>
                    <div class="stat-label">該当行数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="firstMatch">-</div>
                    <div class="stat-label">最初のマッチ</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="lastMatch">-</div>
                    <div class="stat-label">最後のマッチ</div>
                </div>
            </div>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <script>
        function performSearch() {
            const searchText = document.getElementById('searchInput').value;
            const targetText = document.getElementById('textInput').value;
            
            if (!searchText || !targetText) {
                clearResults();
                return;
            }

            const caseSensitive = document.getElementById('caseSensitive').checked;
            const wholeWord = document.getElementById('wholeWord').checked;
            const useRegex = document.getElementById('useRegex').checked;

            try {
                const results = findMatches(targetText, searchText, caseSensitive, wholeWord, useRegex);
                displayResults(results, targetText, searchText);
                updateStats(results);
            } catch (error) {
                alert('検索エラー: ' + error.message);
            }
        }

        function findMatches(text, search, caseSensitive, wholeWord, useRegex) {
            let pattern = search;
            let flags = caseSensitive ? 'g' : 'gi';

            if (useRegex) {
                pattern = search;
            } else {
                pattern = search.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }

            if (wholeWord) {
                pattern = '\\b' + pattern + '\\b';
            }

            const regex = new RegExp(pattern, flags);
            const matches = [];
            const lines = text.split('\n');
            let match;

            lines.forEach((line, lineIndex) => {
                regex.lastIndex = 0;
                while ((match = regex.exec(line)) !== null) {
                    matches.push({
                        text: match[0],
                        index: match.index,
                        line: lineIndex + 1,
                        lineText: line,
                        position: getPositionInText(text, lineIndex, match.index)
                    });
                }
            });

            return matches;
        }

        function getPositionInText(text, lineIndex, charIndex) {
            const lines = text.split('\n');
            let position = 0;
            
            for (let i = 0; i < lineIndex; i++) {
                position += lines[i].length + 1; // +1 for newline
            }
            
            position += charIndex;
            return position;
        }

        function displayResults(matches, targetText, searchText) {
            const resultsList = document.getElementById('resultsList');
            const resultsCount = document.getElementById('resultsCount');
            
            resultsCount.textContent = `${matches.length}件`;
            
            if (matches.length === 0) {
                resultsList.innerHTML = '<p style="color: #666; font-style: italic;">検索結果が見つかりませんでした</p>';
                return;
            }

            resultsList.innerHTML = '';
            
            matches.forEach((match, index) => {
                const resultItem = document.createElement('div');
                resultItem.className = 'result-item';
                
                const highlightedLine = highlightMatch(match.lineText, searchText, match.index);
                
                resultItem.innerHTML = `
                    <div class="result-header">
                        <span class="result-position">位置: ${match.position}</span>
                        <span class="result-line">行: ${match.line}</span>
                    </div>
                    <div class="result-content">${highlightedLine}</div>
                `;
                
                resultsList.appendChild(resultItem);
            });
        }

        function highlightMatch(lineText, searchText, matchIndex) {
            const before = lineText.substring(0, matchIndex);
            const matchText = lineText.substring(matchIndex, matchIndex + searchText.length);
            const after = lineText.substring(matchIndex + searchText.length);
            
            return `${before}<span class="highlight">${matchText}</span>${after}`;
        }

        function updateStats(matches) {
            const matchCount = matches.length;
            const lineCount = new Set(matches.map(m => m.line)).size;
            const firstMatch = matchCount > 0 ? matches[0].position : '-';
            const lastMatch = matchCount > 0 ? matches[matches.length - 1].position : '-';
            
            document.getElementById('matchCount').textContent = matchCount;
            document.getElementById('lineCount').textContent = lineCount;
            document.getElementById('firstMatch').textContent = firstMatch;
            document.getElementById('lastMatch').textContent = lastMatch;
        }

        function clearResults() {
            document.getElementById('resultsList').innerHTML = '<p style="color: #666; font-style: italic;">検索結果がここに表示されます</p>';
            document.getElementById('resultsCount').textContent = '0件';
            document.getElementById('matchCount').textContent = '0';
            document.getElementById('lineCount').textContent = '0';
            document.getElementById('firstMatch').textContent = '-';
            document.getElementById('lastMatch').textContent = '-';
        }

        // 初期サンプル
        document.getElementById('textInput').value = `Hello World!
This is a sample text for searching.
Hello again, world of programming.
Search functionality is very useful.
End of sample text.`;
        document.getElementById('searchInput').value = 'Hello';
        performSearch();
    </script>
</body>
</html>
