<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64エンコード - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .base64-encoder {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .conversion-modes {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .mode-btn {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .mode-btn:hover:not(.active) {
            background: #e9ecef;
        }

        .converter-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .section-title {
            color: #333;
            font-size: 1.3rem;
            margin-bottom: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-icon {
            font-size: 1.5rem;
        }

        .conversion-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            align-items: stretch;
        }

        .input-section {
            display: flex;
            flex-direction: column;
        }

        .input-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .input-area {
            flex: 1;
            min-height: 200px;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Courier New', monospace;
            resize: vertical;
            transition: border-color 0.3s ease;
        }

        .input-area:focus {
            outline: none;
            border-color: #667eea;
        }

        .arrow-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
        }

        .arrow {
            font-size: 2rem;
            color: #667eea;
        }

        .swap-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .swap-btn:hover {
            background: #5a6fd8;
            transform: rotate(180deg);
        }

        .file-section {
            background: #e1ecf4;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .file-title {
            color: #0c5460;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .file-upload {
            border: 3px dashed #b3d4fc;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-upload:hover {
            background: #f0f8ff;
            border-color: #0c5460;
        }

        .file-upload.dragover {
            background: #e8f4f8;
            border-color: #0c5460;
            transform: scale(1.02);
        }

        .file-icon {
            font-size: 3rem;
            color: #0c5460;
            margin-bottom: 15px;
        }

        .file-text {
            color: #0c5460;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .file-subtext {
            color: #666;
            font-size: 0.9rem;
        }

        .file-input {
            display: none;
        }

        .file-info {
            background: white;
            border: 1px solid #b3d4fc;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            display: none;
        }

        .file-info.show {
            display: block;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .info-item {
            text-align: center;
        }

        .info-value {
            font-weight: 600;
            color: #0c5460;
            margin-bottom: 3px;
        }

        .info-label {
            font-size: 0.8rem;
            color: #666;
        }

        .output-options {
            background: #fff3cd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .options-title {
            color: #856404;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .option-group {
            display: flex;
            flex-direction: column;
        }

        .option-group label {
            font-weight: 600;
            color: #856404;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .option-control {
            padding: 8px;
            border: 2px solid #ffeaa7;
            border-radius: 6px;
            font-size: 0.9rem;
            background: white;
        }

        .option-control:focus {
            outline: none;
            border-color: #856404;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .action-btn.secondary {
            background: #6c757d;
        }

        .action-btn.secondary:hover {
            background: #5a6268;
        }

        .action-btn.success {
            background: #28a745;
        }

        .action-btn.success:hover {
            background: #218838;
        }

        .stats-section {
            background: #d4edda;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .stats-title {
            color: #155724;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-item {
            background: white;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #155724;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            background: #dc3545;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .char-count {
            font-size: 0.8rem;
            color: #666;
            margin-top: 5px;
            text-align: right;
        }

        @media (max-width: 768px) {
            .base64-encoder {
                padding: 20px;
            }
            
            .conversion-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .arrow-container {
                flex-direction: row;
            }
            
            .arrow {
                transform: rotate(90deg);
            }
            
            .options-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="base64-encoder">
        <div class="header">
            <h1>Base64エンコード</h1>
            <p>テキストとBase64形式を相互変換</p>
        </div>

        <div class="conversion-modes">
            <button class="mode-btn active" onclick="setMode('text')">テキスト変換</button>
            <button class="mode-btn" onclick="setMode('file')">ファイル変換</button>
        </div>

        <div class="converter-section" id="textSection">
            <div class="section-title">
                <span class="section-icon">🔤</span>
                <span>テキスト ⇄ Base64</span>
            </div>
            <div class="conversion-grid">
                <div class="input-section">
                    <div class="input-label">テキスト入力</div>
                    <textarea id="textInput" class="input-area" placeholder="変換したいテキストを入力してください"></textarea>
                    <div class="char-count" id="textCharCount">0文字</div>
                </div>
                <div class="arrow-container">
                    <div class="arrow">⇄</div>
                    <button class="swap-btn" onclick="swapContent()" title="入力内容を入れ替え">⇄</button>
                </div>
                <div class="input-section">
                    <div class="input-label">Base64出力</div>
                    <textarea id="base64Output" class="input-area" placeholder="Base64エンコード結果"></textarea>
                    <div class="char-count" id="base64CharCount">0文字</div>
                </div>
            </div>
        </div>

        <div class="file-section" id="fileSection" style="display: none;">
            <div class="file-title">ファイル変換</div>
            <div class="file-upload" id="fileUpload" onclick="document.getElementById('fileInput').click()">
                <div class="file-icon">📁</div>
                <div class="file-text">ファイルをドロップまたはクリックして選択</div>
                <div class="file-subtext">任意のファイル形式をBase64に変換（最大5MB）</div>
                <input type="file" id="fileInput" class="file-input">
            </div>
            <div class="file-info" id="fileInfo">
                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-value" id="fileName">--</div>
                        <div class="info-label">ファイル名</div>
                    </div>
                    <div class="info-item">
                        <div class="info-value" id="fileSize">--</div>
                        <div class="info-label">サイズ</div>
                    </div>
                    <div class="info-item">
                        <div class="info-value" id="fileType">--</div>
                        <div class="info-label">タイプ</div>
                    </div>
                    <div class="info-item">
                        <div class="info-value" id="base64Size">--</div>
                        <div class="info-label">Base64サイズ</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="output-options">
            <div class="options-title">出力オプション</div>
            <div class="options-grid">
                <div class="option-group">
                    <label for="lineLength">行の長さ</label>
                    <select id="lineLength" class="option-control">
                        <option value="0">改行なし</option>
                        <option value="64">64文字</option>
                        <option value="76" selected>76文字（標準）</option>
                        <option value="128">128文字</option>
                    </select>
                </div>
                <div class="option-group">
                    <label for="outputFormat">出力形式</label>
                    <select id="outputFormat" class="option-control">
                        <option value="plain">プレーンテキスト</option>
                        <option value="datauri">Data URI</option>
                        <option value="css">CSS Background</option>
                        <option value="html">HTML Image</option>
                    </select>
                </div>
                <div class="option-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="urlSafe">
                        <label for="urlSafe">URL Safe</label>
                    </div>
                </div>
                <div class="option-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="removePadding">
                        <label for="removePadding">パディング削除</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="stats-section" id="statsSection" style="display: none;">
            <div class="stats-title">変換統計</div>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="originalBytes">0</div>
                    <div class="stat-label">元サイズ（バイト）</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="encodedBytes">0</div>
                    <div class="stat-label">エンコード後（バイト）</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="sizeIncrease">0%</div>
                    <div class="stat-label">サイズ増加率</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="encodingTime">0ms</div>
                    <div class="stat-label">処理時間</div>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="action-btn" onclick="encodeToBase64()">Base64にエンコード</button>
            <button class="action-btn" onclick="decodeFromBase64()">Base64からデコード</button>
            <button class="action-btn success" onclick="copyToClipboard()">結果をコピー</button>
            <button class="action-btn secondary" onclick="downloadResult()">結果をダウンロード</button>
            <button class="action-btn secondary" onclick="clearAll()">クリア</button>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <div class="notification" id="notification">
        <div id="notificationMessage"></div>
    </div>

    <script>
        let currentMode = 'text';
        let selectedFile = null;
        let lastOperation = null;

        function setMode(mode) {
            currentMode = mode;
            
            // ボタンの状態を更新
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // セクションの表示を切り替え
            document.getElementById('textSection').style.display = mode === 'text' ? 'block' : 'none';
            document.getElementById('fileSection').style.display = mode === 'file' ? 'block' : 'none';
        }

        function setupFileUpload() {
            const fileUpload = document.getElementById('fileUpload');
            const fileInput = document.getElementById('fileInput');
            
            // ドラッグ&ドロップ
            fileUpload.addEventListener('dragover', (e) => {
                e.preventDefault();
                fileUpload.classList.add('dragover');
            });
            
            fileUpload.addEventListener('dragleave', () => {
                fileUpload.classList.remove('dragover');
            });
            
            fileUpload.addEventListener('drop', (e) => {
                e.preventDefault();
                fileUpload.classList.remove('dragover');
                
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleFile(files[0]);
                }
            });
            
            // ファイル選択
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    handleFile(e.target.files[0]);
                }
            });
        }

        function setupTextInputs() {
            const textInput = document.getElementById('textInput');
            const base64Output = document.getElementById('base64Output');
            
            textInput.addEventListener('input', () => {
                updateCharCount('textCharCount', textInput.value.length);
                if (textInput.value.trim()) {
                    encodeToBase64();
                }
            });
            
            base64Output.addEventListener('input', () => {
                updateCharCount('base64CharCount', base64Output.value.length);
                if (base64Output.value.trim()) {
                    decodeFromBase64();
                }
            });
        }

        function updateCharCount(elementId, count) {
            document.getElementById(elementId).textContent = `${count.toLocaleString()}文字`;
        }

        function handleFile(file) {
            if (file.size > 5 * 1024 * 1024) {
                showNotification('ファイルサイズが大きすぎます（5MB以下）', 'error');
                return;
            }
            
            selectedFile = file;
            
            // ファイル情報を表示
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = formatFileSize(file.size);
            document.getElementById('fileType').textContent = file.type || '不明';
            document.getElementById('fileInfo').classList.add('show');
            
            // 自動でBase64に変換
            encodeFileToBase64();
        }

        function encodeFileToBase64() {
            if (!selectedFile) return;
            
            const startTime = performance.now();
            const reader = new FileReader();
            
            reader.onload = (e) => {
                const base64 = e.target.result.split(',')[1]; // データURLからBase64部分を抽出
                const processedBase64 = processBase64Output(base64);
                
                document.getElementById('base64Output').value = processedBase64;
                document.getElementById('base64Size').textContent = formatFileSize(base64.length);
                
                const endTime = performance.now();
                updateStats(selectedFile.size, base64.length, endTime - startTime);
                
                showNotification('ファイルをBase64に変換しました');
            };
            
            reader.onerror = () => {
                showNotification('ファイルの読み込みに失敗しました', 'error');
            };
            
            reader.readAsDataURL(selectedFile);
        }

        function encodeToBase64() {
            if (currentMode === 'file') {
                encodeFileToBase64();
                return;
            }
            
            const textInput = document.getElementById('textInput');
            const base64Output = document.getElementById('base64Output');
            const text = textInput.value;
            
            if (!text.trim()) {
                showNotification('テキストを入力してください', 'error');
                return;
            }
            
            const startTime = performance.now();
            
            try {
                const encoded = btoa(unescape(encodeURIComponent(text)));
                const processedBase64 = processBase64Output(encoded);
                
                base64Output.value = processedBase64;
                updateCharCount('base64CharCount', processedBase64.length);
                
                const endTime = performance.now();
                const originalBytes = new Blob([text], { type: 'text/plain' }).size;
                const encodedBytes = new Blob([processedBase64], { type: 'text/plain' }).size;
                
                updateStats(originalBytes, encodedBytes, endTime - startTime);
                lastOperation = 'encode';
                
                showNotification('テキストをBase64にエンコードしました');
            } catch (error) {
                showNotification('エンコードに失敗しました', 'error');
            }
        }

        function decodeFromBase64() {
            const textInput = document.getElementById('textInput');
            const base64Output = document.getElementById('base64Output');
            const base64Text = base64Output.value.trim();
            
            if (!base64Text) {
                showNotification('Base64テキストを入力してください', 'error');
                return;
            }
            
            const startTime = performance.now();
            
            try {
                // Base64文字列をクリーンアップ
                const cleanBase64 = base64Text.replace(/\s/g, '').replace(/data:.*?;base64,/, '');
                
                const decoded = decodeURIComponent(escape(atob(cleanBase64)));
                textInput.value = decoded;
                updateCharCount('textCharCount', decoded.length);
                
                const endTime = performance.now();
                const originalBytes = new Blob([cleanBase64], { type: 'text/plain' }).size;
                const decodedBytes = new Blob([decoded], { type: 'text/plain' }).size;
                
                updateStats(originalBytes, decodedBytes, endTime - startTime);
                lastOperation = 'decode';
                
                showNotification('Base64をデコードしました');
            } catch (error) {
                showNotification('無効なBase64形式です', 'error');
            }
        }

        function processBase64Output(base64) {
            const lineLength = parseInt(document.getElementById('lineLength').value);
            const outputFormat = document.getElementById('outputFormat').value;
            const urlSafe = document.getElementById('urlSafe').checked;
            const removePadding = document.getElementById('removePadding').checked;
            
            let processed = base64;
            
            // URL Safe変換
            if (urlSafe) {
                processed = processed.replace(/\+/g, '-').replace(/\//g, '_');
            }
            
            // パディング削除
            if (removePadding) {
                processed = processed.replace(/=+$/, '');
            }
            
            // 行長制限
            if (lineLength > 0) {
                const lines = [];
                for (let i = 0; i < processed.length; i += lineLength) {
                    lines.push(processed.substr(i, lineLength));
                }
                processed = lines.join('\n');
            }
            
            // 出力形式
            switch (outputFormat) {
                case 'datauri':
                    const mimeType = selectedFile ? selectedFile.type : 'text/plain';
                    processed = `data:${mimeType};base64,${processed}`;
                    break;
                case 'css':
                    processed = `background-image: url(data:image/png;base64,${processed});`;
                    break;
                case 'html':
                    processed = `<img src="data:image/png;base64,${processed}" alt="Base64 Image">`;
                    break;
            }
            
            return processed;
        }

        function updateStats(originalSize, encodedSize, processingTime) {
            document.getElementById('originalBytes').textContent = originalSize.toLocaleString();
            document.getElementById('encodedBytes').textContent = encodedSize.toLocaleString();
            
            const increase = ((encodedSize - originalSize) / originalSize * 100).toFixed(1);
            document.getElementById('sizeIncrease').textContent = `${increase}%`;
            document.getElementById('encodingTime').textContent = `${processingTime.toFixed(2)}ms`;
            
            document.getElementById('statsSection').style.display = 'block';
        }

        function swapContent() {
            const textInput = document.getElementById('textInput');
            const base64Output = document.getElementById('base64Output');
            
            const tempText = textInput.value;
            textInput.value = base64Output.value;
            base64Output.value = tempText;
            
            updateCharCount('textCharCount', textInput.value.length);
            updateCharCount('base64CharCount', base64Output.value.length);
            
            showNotification('入力内容を入れ替えました');
        }

        function copyToClipboard() {
            const base64Output = document.getElementById('base64Output');
            const text = base64Output.value;
            
            if (!text.trim()) {
                showNotification('コピーする内容がありません', 'error');
                return;
            }
            
            navigator.clipboard.writeText(text).then(() => {
                showNotification('Base64をクリップボードにコピーしました');
            }).catch(() => {
                showNotification('コピーに失敗しました', 'error');
            });
        }

        function downloadResult() {
            const base64Output = document.getElementById('base64Output');
            const text = base64Output.value;
            
            if (!text.trim()) {
                showNotification('ダウンロードする内容がありません', 'error');
                return;
            }
            
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `base64_${Date.now()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            
            showNotification('Base64ファイルをダウンロードしました');
        }

        function clearAll() {
            document.getElementById('textInput').value = '';
            document.getElementById('base64Output').value = '';
            document.getElementById('fileInput').value = '';
            document.getElementById('fileInfo').classList.remove('show');
            document.getElementById('statsSection').style.display = 'none';
            
            updateCharCount('textCharCount', 0);
            updateCharCount('base64CharCount', 0);
            
            selectedFile = null;
            lastOperation = null;
            
            showNotification('クリアしました');
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            const notificationMessage = document.getElementById('notificationMessage');
            
            notificationMessage.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // 初期化
        function init() {
            setupFileUpload();
            setupTextInputs();
            updateCharCount('textCharCount', 0);
            updateCharCount('base64CharCount', 0);
        }

        // ページ読み込み時の初期化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
