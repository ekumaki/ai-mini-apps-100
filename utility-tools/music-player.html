<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音楽プレイヤー - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .music-player {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 800px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .player-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            color: white;
        }

        .current-track {
            text-align: center;
            margin-bottom: 25px;
        }

        .track-artwork {
            width: 200px;
            height: 200px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.1);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .track-info {
            margin-bottom: 20px;
        }

        .track-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .track-artist {
            font-size: 1rem;
            opacity: 0.9;
        }

        .progress-section {
            margin-bottom: 25px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: white;
            width: 0%;
            transition: width 0.1s ease;
            border-radius: 4px;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            font-size: 1.5rem;
            backdrop-filter: blur(10px);
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .control-btn.play-pause {
            width: 80px;
            height: 80px;
            font-size: 2rem;
        }

        .volume-section {
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: center;
        }

        .volume-icon {
            font-size: 1.2rem;
        }

        .volume-slider {
            width: 150px;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
        }

        .upload-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
            text-align: center;
        }

        .upload-title {
            color: #333;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 30px;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .upload-area:hover {
            background: #f0f4ff;
            border-color: #5a6fd8;
        }

        .upload-area.dragover {
            background: #e8f2ff;
            border-color: #4a5fc7;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .upload-subtext {
            color: #666;
            font-size: 0.9rem;
        }

        .file-input {
            display: none;
        }

        .playlist-section {
            background: #e1ecf4;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .playlist-title {
            color: #0c5460;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .playlist {
            max-height: 300px;
            overflow-y: auto;
        }

        .playlist-item {
            background: white;
            border: 1px solid #b3d4fc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .playlist-item:hover {
            background: #f0f4ff;
            transform: translateY(-2px);
        }

        .playlist-item.active {
            background: #667eea;
            color: white;
            border-color: #5a6fd8;
        }

        .track-details {
            flex: 1;
        }

        .track-name {
            font-weight: 600;
            margin-bottom: 3px;
        }

        .track-duration {
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .track-actions {
            display: flex;
            gap: 10px;
        }

        .track-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            color: inherit;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .track-btn:hover {
            opacity: 1;
        }

        .settings-section {
            background: #fff3cd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .settings-title {
            color: #856404;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
        }

        .setting-group label {
            font-weight: 600;
            color: #856404;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .setting-control {
            padding: 8px 12px;
            border: 2px solid #ffeaa7;
            border-radius: 6px;
            font-size: 0.9rem;
            background: white;
        }

        .setting-control:focus {
            outline: none;
            border-color: #856404;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .action-btn.secondary {
            background: #6c757d;
        }

        .action-btn.secondary:hover {
            background: #5a6268;
        }

        .action-btn.danger {
            background: #dc3545;
        }

        .action-btn.danger:hover {
            background: #c82333;
        }

        .visualizer-section {
            background: #f3e5f5;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .visualizer-title {
            color: #6a1b9a;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .visualizer {
            height: 100px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            align-items: end;
            justify-content: center;
            gap: 2px;
            padding: 10px;
            overflow: hidden;
        }

        .visualizer-bar {
            width: 4px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 2px;
            transition: height 0.1s ease;
            min-height: 2px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            background: #dc3545;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .lyrics-section {
            background: #e8f5e8;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            display: none;
        }

        .lyrics-title {
            color: #155724;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .lyrics-content {
            background: white;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 20px;
            max-height: 200px;
            overflow-y: auto;
            line-height: 1.6;
            color: #333;
        }

        @media (max-width: 768px) {
            .music-player {
                padding: 20px;
            }
            
            .track-artwork {
                width: 150px;
                height: 150px;
                font-size: 3rem;
            }
            
            .controls {
                gap: 15px;
            }
            
            .control-btn {
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }
            
            .control-btn.play-pause {
                width: 70px;
                height: 70px;
                font-size: 1.8rem;
            }
            
            .volume-slider {
                width: 100px;
            }
            
            .settings-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="music-player">
        <div class="header">
            <h1>音楽プレイヤー</h1>
            <p>お気に入りの音楽を楽しもう</p>
        </div>

        <div class="player-section">
            <div class="current-track">
                <div class="track-artwork" id="trackArtwork">🎵</div>
                <div class="track-info">
                    <div class="track-title" id="trackTitle">楽曲を選択してください</div>
                    <div class="track-artist" id="trackArtist">アーティスト不明</div>
                </div>
            </div>

            <div class="progress-section">
                <div class="progress-bar" id="progressBar" onclick="seekTo(event)">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="control-btn" onclick="toggleShuffle()" id="shuffleBtn" title="シャッフル">🔀</button>
                <button class="control-btn" onclick="previousTrack()" title="前の曲">⏮️</button>
                <button class="control-btn play-pause" onclick="togglePlay()" id="playBtn" title="再生/一時停止">▶️</button>
                <button class="control-btn" onclick="nextTrack()" title="次の曲">⏭️</button>
                <button class="control-btn" onclick="toggleRepeat()" id="repeatBtn" title="リピート">🔁</button>
            </div>

            <div class="volume-section">
                <span class="volume-icon">🔊</span>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="50" oninput="setVolume(this.value)">
                <span id="volumeValue">50%</span>
            </div>
        </div>

        <div class="upload-section">
            <div class="upload-title">🎵 音楽ファイルをアップロード</div>
            <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">📁</div>
                <div class="upload-text">ファイルをドロップまたはクリックして選択</div>
                <div class="upload-subtext">MP3, WAV, OGG, M4A形式をサポート</div>
                <input type="file" id="fileInput" class="file-input" multiple accept="audio/*">
            </div>
        </div>

        <div class="playlist-section">
            <div class="playlist-title">🎶 プレイリスト</div>
            <div class="playlist" id="playlist">
                <div style="text-align: center; padding: 40px; color: #666;">
                    音楽ファイルをアップロードしてください
                </div>
            </div>
        </div>

        <div class="visualizer-section">
            <div class="visualizer-title">🎨 ビジュアライザー</div>
            <div class="visualizer" id="visualizer">
                <!-- ビジュアライザーバーがここに表示されます -->
            </div>
        </div>

        <div class="settings-section">
            <div class="settings-title">⚙️ プレイヤー設定</div>
            <div class="settings-grid">
                <div class="setting-group">
                    <label for="equalizer">イコライザー</label>
                    <select id="equalizer" class="setting-control">
                        <option value="flat">フラット</option>
                        <option value="rock">ロック</option>
                        <option value="pop">ポップ</option>
                        <option value="jazz">ジャズ</option>
                        <option value="classical">クラシック</option>
                        <option value="electronic">エレクトロニック</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label for="crossfade">クロスフェード</label>
                    <select id="crossfade" class="setting-control">
                        <option value="0">なし</option>
                        <option value="2">2秒</option>
                        <option value="5">5秒</option>
                        <option value="10">10秒</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label for="playbackSpeed">再生速度</label>
                    <select id="playbackSpeed" class="setting-control">
                        <option value="0.5">0.5x</option>
                        <option value="0.75">0.75x</option>
                        <option value="1" selected>1.0x</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2">2.0x</option>
                    </select>
                </div>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="autoPlay">
                <label for="autoPlay">自動再生</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="showLyrics">
                <label for="showLyrics">歌詞表示</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="fadeInOut" checked>
                <label for="fadeInOut">フェードイン/アウト</label>
            </div>
        </div>

        <div class="lyrics-section" id="lyricsSection">
            <div class="lyrics-title">📝 歌詞</div>
            <div class="lyrics-content" id="lyricsContent">
                歌詞データがありません
            </div>
        </div>

        <div class="actions">
            <button class="action-btn" onclick="exportPlaylist()">プレイリスト出力</button>
            <button class="action-btn secondary" onclick="importPlaylist()">プレイリスト読込</button>
            <button class="action-btn danger" onclick="clearPlaylist()">プレイリストクリア</button>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>

        <audio id="audioPlayer" preload="metadata"></audio>
    </div>

    <div class="notification" id="notification">
        <div id="notificationMessage"></div>
    </div>

    <script>
        let audioPlayer = document.getElementById('audioPlayer');
        let playlist = [];
        let currentTrackIndex = -1;
        let isPlaying = false;
        let isShuffled = false;
        let isRepeat = false;
        let audioContext = null;
        let analyser = null;
        let dataArray = null;
        let animationId = null;

        // 設定の読み込み
        const settings = JSON.parse(localStorage.getItem('musicPlayerSettings') || '{}');

        function initializePlayer() {
            // ビジュアライザーの初期化
            createVisualizerBars();
            
            // 設定の復元
            if (settings.volume !== undefined) {
                setVolume(settings.volume);
                document.getElementById('volumeSlider').value = settings.volume;
            }
            
            // イベントリスナーの設定
            setupEventListeners();
            
            // プレイリストの復元
            loadPlaylistFromStorage();
        }

        function setupEventListeners() {
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');
            
            // ドラッグ&ドロップ
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });
            
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('dragover');
            });
            
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                handleFiles(e.dataTransfer.files);
            });
            
            // ファイル選択
            fileInput.addEventListener('change', (e) => {
                handleFiles(e.target.files);
            });
            
            // オーディオイベント
            audioPlayer.addEventListener('loadedmetadata', updateTrackInfo);
            audioPlayer.addEventListener('timeupdate', updateProgress);
            audioPlayer.addEventListener('ended', onTrackEnded);
            audioPlayer.addEventListener('error', onAudioError);
            
            // 設定変更
            document.getElementById('playbackSpeed').addEventListener('change', updatePlaybackSpeed);
            document.getElementById('showLyrics').addEventListener('change', toggleLyrics);
            document.getElementById('equalizer').addEventListener('change', applyEqualizer);
            
            // キーボードショートカット
            document.addEventListener('keydown', handleKeyboard);
        }

        function handleFiles(files) {
            for (let file of files) {
                if (file.type.startsWith('audio/')) {
                    addToPlaylist(file);
                }
            }
            showNotification(`${files.length}個のファイルをプレイリストに追加しました`);
        }

        function addToPlaylist(file) {
            const url = URL.createObjectURL(file);
            const track = {
                id: Date.now() + Math.random(),
                title: file.name.replace(/\.[^/.]+$/, ""),
                artist: 'ローカルファイル',
                url: url,
                file: file,
                duration: 0
            };
            
            playlist.push(track);
            updatePlaylistDisplay();
            savePlaylistToStorage();
            
            // 最初の曲の場合は自動的に読み込む
            if (playlist.length === 1) {
                loadTrack(0);
            }
        }

        function updatePlaylistDisplay() {
            const playlistElement = document.getElementById('playlist');
            
            if (playlist.length === 0) {
                playlistElement.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #666;">
                        音楽ファイルをアップロードしてください
                    </div>
                `;
                return;
            }
            
            playlistElement.innerHTML = playlist.map((track, index) => `
                <div class="playlist-item ${index === currentTrackIndex ? 'active' : ''}" onclick="loadTrack(${index})">
                    <div class="track-details">
                        <div class="track-name">${track.title}</div>
                        <div class="track-duration">${track.artist} - ${formatTime(track.duration)}</div>
                    </div>
                    <div class="track-actions">
                        <button class="track-btn" onclick="event.stopPropagation(); removeFromPlaylist(${index})" title="削除">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        function loadTrack(index) {
            if (index < 0 || index >= playlist.length) return;
            
            currentTrackIndex = index;
            const track = playlist[index];
            
            audioPlayer.src = track.url;
            
            document.getElementById('trackTitle').textContent = track.title;
            document.getElementById('trackArtist').textContent = track.artist;
            
            updatePlaylistDisplay();
            
            if (document.getElementById('autoPlay').checked && !isPlaying) {
                setTimeout(() => togglePlay(), 500);
            }
        }

        function togglePlay() {
            if (currentTrackIndex === -1 && playlist.length > 0) {
                loadTrack(0);
                return;
            }
            
            if (currentTrackIndex === -1) {
                showNotification('再生する楽曲がありません', 'error');
                return;
            }
            
            if (isPlaying) {
                audioPlayer.pause();
                document.getElementById('playBtn').textContent = '▶️';
                stopVisualizer();
            } else {
                audioPlayer.play().then(() => {
                    document.getElementById('playBtn').textContent = '⏸️';
                    startVisualizer();
                }).catch(error => {
                    showNotification('再生に失敗しました', 'error');
                });
            }
            
            isPlaying = !isPlaying;
        }

        function previousTrack() {
            if (playlist.length === 0) return;
            
            let newIndex;
            if (isShuffled) {
                newIndex = Math.floor(Math.random() * playlist.length);
            } else {
                newIndex = currentTrackIndex - 1;
                if (newIndex < 0) {
                    newIndex = playlist.length - 1;
                }
            }
            
            loadTrack(newIndex);
            if (isPlaying) {
                setTimeout(() => togglePlay(), 500);
            }
        }

        function nextTrack() {
            if (playlist.length === 0) return;
            
            let newIndex;
            if (isShuffled) {
                newIndex = Math.floor(Math.random() * playlist.length);
            } else {
                newIndex = currentTrackIndex + 1;
                if (newIndex >= playlist.length) {
                    newIndex = 0;
                }
            }
            
            loadTrack(newIndex);
            if (isPlaying) {
                setTimeout(() => togglePlay(), 500);
            }
        }

        function toggleShuffle() {
            isShuffled = !isShuffled;
            const shuffleBtn = document.getElementById('shuffleBtn');
            shuffleBtn.style.backgroundColor = isShuffled ? 'rgba(255, 255, 255, 0.4)' : 'rgba(255, 255, 255, 0.2)';
            showNotification(isShuffled ? 'シャッフル ON' : 'シャッフル OFF');
        }

        function toggleRepeat() {
            isRepeat = !isRepeat;
            const repeatBtn = document.getElementById('repeatBtn');
            repeatBtn.style.backgroundColor = isRepeat ? 'rgba(255, 255, 255, 0.4)' : 'rgba(255, 255, 255, 0.2)';
            showNotification(isRepeat ? 'リピート ON' : 'リピート OFF');
        }

        function setVolume(value) {
            audioPlayer.volume = value / 100;
            document.getElementById('volumeValue').textContent = value + '%';
            
            // 設定を保存
            settings.volume = value;
            localStorage.setItem('musicPlayerSettings', JSON.stringify(settings));
        }

        function seekTo(event) {
            if (audioPlayer.duration) {
                const progressBar = document.getElementById('progressBar');
                const rect = progressBar.getBoundingClientRect();
                const percent = (event.clientX - rect.left) / rect.width;
                audioPlayer.currentTime = percent * audioPlayer.duration;
            }
        }

        function updateProgress() {
            if (audioPlayer.duration) {
                const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                document.getElementById('progressFill').style.width = percent + '%';
                document.getElementById('currentTime').textContent = formatTime(audioPlayer.currentTime);
            }
        }

        function updateTrackInfo() {
            const track = playlist[currentTrackIndex];
            if (track) {
                track.duration = audioPlayer.duration;
                document.getElementById('totalTime').textContent = formatTime(audioPlayer.duration);
                updatePlaylistDisplay();
            }
        }

        function onTrackEnded() {
            if (isRepeat) {
                audioPlayer.currentTime = 0;
                audioPlayer.play();
            } else {
                nextTrack();
            }
        }

        function onAudioError() {
            showNotification('音楽ファイルの再生に失敗しました', 'error');
            nextTrack();
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
        }

        function removeFromPlaylist(index) {
            if (index === currentTrackIndex) {
                audioPlayer.pause();
                isPlaying = false;
                document.getElementById('playBtn').textContent = '▶️';
            }
            
            playlist.splice(index, 1);
            
            if (index < currentTrackIndex) {
                currentTrackIndex--;
            } else if (index === currentTrackIndex) {
                currentTrackIndex = -1;
                document.getElementById('trackTitle').textContent = '楽曲を選択してください';
                document.getElementById('trackArtist').textContent = 'アーティスト不明';
            }
            
            updatePlaylistDisplay();
            savePlaylistToStorage();
            showNotification('プレイリストから削除しました');
        }

        function clearPlaylist() {
            if (confirm('プレイリストをクリアしますか？')) {
                audioPlayer.pause();
                isPlaying = false;
                document.getElementById('playBtn').textContent = '▶️';
                
                playlist.forEach(track => {
                    if (track.url.startsWith('blob:')) {
                        URL.revokeObjectURL(track.url);
                    }
                });
                
                playlist = [];
                currentTrackIndex = -1;
                
                document.getElementById('trackTitle').textContent = '楽曲を選択してください';
                document.getElementById('trackArtist').textContent = 'アーティスト不明';
                
                updatePlaylistDisplay();
                savePlaylistToStorage();
                showNotification('プレイリストをクリアしました');
            }
        }

        function updatePlaybackSpeed() {
            const speed = parseFloat(document.getElementById('playbackSpeed').value);
            audioPlayer.playbackRate = speed;
            showNotification(`再生速度: ${speed}x`);
        }

        function toggleLyrics() {
            const lyricsSection = document.getElementById('lyricsSection');
            const showLyrics = document.getElementById('showLyrics').checked;
            
            if (showLyrics) {
                lyricsSection.style.display = 'block';
                loadLyrics();
            } else {
                lyricsSection.style.display = 'none';
            }
        }

        function loadLyrics() {
            const lyricsContent = document.getElementById('lyricsContent');
            const track = playlist[currentTrackIndex];
            
            if (track) {
                // シンプルな歌詞表示（実際は外部APIや埋め込みデータから取得）
                lyricsContent.textContent = '歌詞データが見つかりません。\n\nこの機能は将来のアップデートで改善される予定です。';
            }
        }

        function applyEqualizer() {
            const preset = document.getElementById('equalizer').value;
            // イコライザーの実装（Web Audio APIを使用）
            showNotification(`イコライザー: ${preset}`);
        }

        function createVisualizerBars() {
            const visualizer = document.getElementById('visualizer');
            visualizer.innerHTML = '';
            
            for (let i = 0; i < 32; i++) {
                const bar = document.createElement('div');
                bar.className = 'visualizer-bar';
                bar.style.height = '2px';
                visualizer.appendChild(bar);
            }
        }

        function startVisualizer() {
            if (!audioContext) {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const source = audioContext.createMediaElementSource(audioPlayer);
                    analyser = audioContext.createAnalyser();
                    source.connect(analyser);
                    analyser.connect(audioContext.destination);
                    analyser.fftSize = 64;
                    dataArray = new Uint8Array(analyser.frequencyBinCount);
                } catch (error) {
                    console.warn('ビジュアライザーの初期化に失敗しました');
                    return;
                }
            }
            
            animateVisualizer();
        }

        function animateVisualizer() {
            if (!isPlaying || !analyser) return;
            
            analyser.getByteFrequencyData(dataArray);
            const bars = document.querySelectorAll('.visualizer-bar');
            
            for (let i = 0; i < bars.length; i++) {
                const height = (dataArray[i] / 255) * 80 + 2;
                bars[i].style.height = height + 'px';
            }
            
            animationId = requestAnimationFrame(animateVisualizer);
        }

        function stopVisualizer() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
        }

        function exportPlaylist() {
            if (playlist.length === 0) {
                showNotification('エクスポートするプレイリストがありません', 'error');
                return;
            }
            
            const exportData = {
                name: 'My Playlist',
                created: new Date().toISOString(),
                tracks: playlist.map(track => ({
                    title: track.title,
                    artist: track.artist,
                    duration: track.duration
                }))
            };
            
            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `playlist_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            
            showNotification('プレイリストを出力しました');
        }

        function importPlaylist() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const data = JSON.parse(e.target.result);
                            showNotification(`プレイリスト "${data.name}" を読み込みました`);
                        } catch (error) {
                            showNotification('プレイリストの読み込みに失敗しました', 'error');
                        }
                    };
                    reader.readAsText(file);
                }
            };
            input.click();
        }

        function savePlaylistToStorage() {
            const playlistData = playlist.map(track => ({
                title: track.title,
                artist: track.artist,
                duration: track.duration
            }));
            localStorage.setItem('musicPlayerPlaylist', JSON.stringify(playlistData));
        }

        function loadPlaylistFromStorage() {
            const saved = localStorage.getItem('musicPlayerPlaylist');
            if (saved) {
                try {
                    const playlistData = JSON.parse(saved);
                    // 注意: ローカルファイルのURLは復元できないため、タイトルのみ表示
                    showNotification('前回のプレイリスト情報を確認してください');
                } catch (error) {
                    console.warn('プレイリストの復元に失敗しました');
                }
            }
        }

        function handleKeyboard(e) {
            if (e.target.tagName === 'INPUT') return;
            
            switch(e.code) {
                case 'Space':
                    e.preventDefault();
                    togglePlay();
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    previousTrack();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    nextTrack();
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    const currentVolume = parseInt(document.getElementById('volumeSlider').value);
                    setVolume(Math.min(100, currentVolume + 5));
                    document.getElementById('volumeSlider').value = Math.min(100, currentVolume + 5);
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    const currentVolume2 = parseInt(document.getElementById('volumeSlider').value);
                    setVolume(Math.max(0, currentVolume2 - 5));
                    document.getElementById('volumeSlider').value = Math.max(0, currentVolume2 - 5);
                    break;
            }
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            const notificationMessage = document.getElementById('notificationMessage');
            
            notificationMessage.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // 初期化
        document.addEventListener('DOMContentLoaded', initializePlayer);
    </script>
</body>
</html>
