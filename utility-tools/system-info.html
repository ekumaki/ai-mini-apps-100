<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>システム情報 - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .system-info {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }

        .section-title {
            color: #333;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-icon {
            font-size: 1.3rem;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: #495057;
            flex: 1;
        }

        .info-value {
            color: #333;
            font-family: 'Courier New', monospace;
            text-align: right;
            flex: 2;
            word-break: break-all;
        }

        .browser-section {
            background: #e1ecf4;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .browser-title {
            color: #0c5460;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .network-section {
            background: #fff3cd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .network-title {
            color: #856404;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .performance-section {
            background: #d4edda;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .performance-title {
            color: #155724;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .memory-bar {
            background: #e9ecef;
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin: 10px 0;
            position: relative;
        }

        .memory-fill {
            height: 100%;
            background: linear-gradient(90deg, #28a745 0%, #ffc107 70%, #dc3545 90%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .capabilities-section {
            background: #f3e5f5;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .capabilities-title {
            color: #6a1b9a;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .capabilities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .capability-item {
            background: white;
            border: 1px solid #ce93d8;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .capability-name {
            font-weight: 600;
            color: #6a1b9a;
        }

        .capability-status {
            font-size: 1.2rem;
        }

        .status-supported {
            color: #28a745;
        }

        .status-not-supported {
            color: #dc3545;
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .action-btn.secondary {
            background: #6c757d;
        }

        .action-btn.secondary:hover {
            background: #5a6268;
        }

        .action-btn.success {
            background: #28a745;
        }

        .action-btn.success:hover {
            background: #218838;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            background: #dc3545;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .real-time-section {
            background: #e8f5e8;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .real-time-title {
            color: #155724;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .time-display {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            color: #155724;
            margin-bottom: 10px;
        }

        .uptime-display {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .system-info {
                padding: 20px;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }
            
            .info-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }
            
            .info-value {
                text-align: left;
            }
            
            .capabilities-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="system-info">
        <div class="header">
            <h1>システム情報</h1>
            <p>デバイスとブラウザの詳細情報を表示</p>
        </div>

        <div class="real-time-section">
            <div class="real-time-title">🕒 現在時刻・稼働時間</div>
            <div class="time-display" id="currentTime"></div>
            <div class="uptime-display" id="uptime"></div>
        </div>

        <div class="info-grid">
            <div class="browser-section">
                <div class="browser-title">🌐 ブラウザ情報</div>
                <div id="browserInfo"></div>
            </div>

            <div class="info-section">
                <div class="section-title">
                    <span class="section-icon">💻</span>
                    <span>システム情報</span>
                </div>
                <div id="systemInfo"></div>
            </div>

            <div class="info-section">
                <div class="section-title">
                    <span class="section-icon">📱</span>
                    <span>デバイス情報</span>
                </div>
                <div id="deviceInfo"></div>
            </div>
        </div>

        <div class="network-section">
            <div class="network-title">🌐 ネットワーク情報</div>
            <div id="networkInfo"></div>
        </div>

        <div class="performance-section">
            <div class="performance-title">⚡ パフォーマンス情報</div>
            <div id="performanceInfo"></div>
        </div>

        <div class="capabilities-section">
            <div class="capabilities-title">🔧 ブラウザ機能</div>
            <div class="capabilities-grid" id="capabilitiesGrid"></div>
        </div>

        <div class="actions">
            <button class="action-btn" onclick="refreshInfo()">情報更新</button>
            <button class="action-btn success" onclick="copyInfo()">情報コピー</button>
            <button class="action-btn secondary" onclick="exportInfo()">情報出力</button>
            <button class="action-btn secondary" onclick="runTests()">機能テスト</button>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <div class="notification" id="notification">
        <div id="notificationMessage"></div>
    </div>

    <script>
        let startTime = Date.now();
        let systemData = {};

        function getSystemInfo() {
            const nav = navigator;
            const screen = window.screen;
            
            systemData = {
                // ブラウザ情報
                browser: {
                    name: getBrowserName(),
                    version: getBrowserVersion(),
                    userAgent: nav.userAgent,
                    language: nav.language,
                    languages: nav.languages ? nav.languages.join(', ') : nav.language,
                    cookieEnabled: nav.cookieEnabled,
                    onLine: nav.onLine,
                    platform: nav.platform
                },
                
                // システム情報
                system: {
                    platform: nav.platform,
                    userAgent: nav.userAgent,
                    cores: nav.hardwareConcurrency || '不明',
                    deviceMemory: nav.deviceMemory ? nav.deviceMemory + ' GB' : '不明',
                    maxTouchPoints: nav.maxTouchPoints || 0,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    locale: Intl.DateTimeFormat().resolvedOptions().locale
                },
                
                // デバイス情報
                device: {
                    screenWidth: screen.width,
                    screenHeight: screen.height,
                    availWidth: screen.availWidth,
                    availHeight: screen.availHeight,
                    colorDepth: screen.colorDepth,
                    pixelDepth: screen.pixelDepth,
                    orientation: screen.orientation ? screen.orientation.type : '不明',
                    devicePixelRatio: window.devicePixelRatio,
                    viewportWidth: window.innerWidth,
                    viewportHeight: window.innerHeight
                },
                
                // ネットワーク情報
                network: {
                    onLine: nav.onLine,
                    connection: getConnectionInfo(),
                    doNotTrack: nav.doNotTrack || '未設定',
                    referrer: document.referrer || 'なし'
                },
                
                // パフォーマンス情報
                performance: {
                    memory: getMemoryInfo(),
                    timing: getTimingInfo(),
                    storage: getStorageInfo()
                }
            };
            
            return systemData;
        }

        function getBrowserName() {
            const userAgent = navigator.userAgent;
            if (userAgent.includes('Chrome')) return 'Chrome';
            if (userAgent.includes('Firefox')) return 'Firefox';
            if (userAgent.includes('Safari')) return 'Safari';
            if (userAgent.includes('Edge')) return 'Edge';
            if (userAgent.includes('Opera')) return 'Opera';
            return 'Unknown';
        }

        function getBrowserVersion() {
            const userAgent = navigator.userAgent;
            const match = userAgent.match(/(Chrome|Firefox|Safari|Edge|Opera)\/([0-9.]+)/);
            return match ? match[2] : 'Unknown';
        }

        function getConnectionInfo() {
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            if (!connection) return '情報なし';
            
            return {
                effectiveType: connection.effectiveType || '不明',
                downlink: connection.downlink ? connection.downlink + ' Mbps' : '不明',
                rtt: connection.rtt ? connection.rtt + ' ms' : '不明',
                saveData: connection.saveData ? 'オン' : 'オフ'
            };
        }

        function getMemoryInfo() {
            const memory = performance.memory;
            if (!memory) return '情報なし';
            
            return {
                used: Math.round(memory.usedJSHeapSize / 1024 / 1024),
                total: Math.round(memory.totalJSHeapSize / 1024 / 1024),
                limit: Math.round(memory.jsHeapSizeLimit / 1024 / 1024)
            };
        }

        function getTimingInfo() {
            const timing = performance.timing;
            if (!timing) return '情報なし';
            
            const loadTime = timing.loadEventEnd - timing.navigationStart;
            const domContentLoaded = timing.domContentLoadedEventEnd - timing.navigationStart;
            
            return {
                loadTime: loadTime ? loadTime + ' ms' : '計算中',
                domContentLoaded: domContentLoaded ? domContentLoaded + ' ms' : '計算中',
                navigationStart: new Date(timing.navigationStart).toLocaleString('ja-JP')
            };
        }

        function getStorageInfo() {
            const storage = {};
            
            try {
                storage.localStorage = localStorage ? 'サポート' : '未サポート';
                storage.sessionStorage = sessionStorage ? 'サポート' : '未サポート';
                storage.indexedDB = window.indexedDB ? 'サポート' : '未サポート';
                storage.webSQL = window.openDatabase ? 'サポート' : '未サポート';
            } catch (e) {
                storage.error = 'アクセス不可';
            }
            
            return storage;
        }

        function displaySystemInfo() {
            const info = getSystemInfo();
            
            // ブラウザ情報
            const browserInfo = document.getElementById('browserInfo');
            browserInfo.innerHTML = `
                <div class="info-item">
                    <span class="info-label">ブラウザ</span>
                    <span class="info-value">${info.browser.name} ${info.browser.version}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">言語</span>
                    <span class="info-value">${info.browser.language}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Cookie</span>
                    <span class="info-value">${info.browser.cookieEnabled ? '有効' : '無効'}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">オンライン状態</span>
                    <span class="info-value">${info.browser.onLine ? 'オンライン' : 'オフライン'}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">プラットフォーム</span>
                    <span class="info-value">${info.browser.platform}</span>
                </div>
            `;
            
            // システム情報
            const systemInfo = document.getElementById('systemInfo');
            systemInfo.innerHTML = `
                <div class="info-item">
                    <span class="info-label">CPUコア数</span>
                    <span class="info-value">${info.system.cores}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">デバイスメモリ</span>
                    <span class="info-value">${info.system.deviceMemory}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">タッチポイント</span>
                    <span class="info-value">${info.system.maxTouchPoints}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">タイムゾーン</span>
                    <span class="info-value">${info.system.timezone}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">ロケール</span>
                    <span class="info-value">${info.system.locale}</span>
                </div>
            `;
            
            // デバイス情報
            const deviceInfo = document.getElementById('deviceInfo');
            deviceInfo.innerHTML = `
                <div class="info-item">
                    <span class="info-label">画面解像度</span>
                    <span class="info-value">${info.device.screenWidth} × ${info.device.screenHeight}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">ビューポート</span>
                    <span class="info-value">${info.device.viewportWidth} × ${info.device.viewportHeight}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">ピクセル比</span>
                    <span class="info-value">${info.device.devicePixelRatio}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">色深度</span>
                    <span class="info-value">${info.device.colorDepth} bit</span>
                </div>
                <div class="info-item">
                    <span class="info-label">画面向き</span>
                    <span class="info-value">${info.device.orientation}</span>
                </div>
            `;
            
            // ネットワーク情報
            const networkInfo = document.getElementById('networkInfo');
            const connection = info.network.connection;
            networkInfo.innerHTML = `
                <div class="info-item">
                    <span class="info-label">接続状態</span>
                    <span class="info-value">${info.network.onLine ? 'オンライン' : 'オフライン'}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">接続タイプ</span>
                    <span class="info-value">${typeof connection === 'object' ? connection.effectiveType : connection}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">ダウンリンク</span>
                    <span class="info-value">${typeof connection === 'object' ? connection.downlink : '情報なし'}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Do Not Track</span>
                    <span class="info-value">${info.network.doNotTrack}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">リファラー</span>
                    <span class="info-value">${info.network.referrer}</span>
                </div>
            `;
            
            // パフォーマンス情報
            const performanceInfo = document.getElementById('performanceInfo');
            const memory = info.performance.memory;
            const timing = info.performance.timing;
            const storage = info.performance.storage;
            
            let memoryHTML = '';
            if (typeof memory === 'object') {
                const usagePercent = Math.round((memory.used / memory.total) * 100);
                memoryHTML = `
                    <div class="info-item">
                        <span class="info-label">使用メモリ</span>
                        <span class="info-value">${memory.used} MB / ${memory.total} MB</span>
                    </div>
                    <div class="memory-bar">
                        <div class="memory-fill" style="width: ${usagePercent}%">${usagePercent}%</div>
                    </div>
                    <div class="info-item">
                        <span class="info-label">メモリ上限</span>
                        <span class="info-value">${memory.limit} MB</span>
                    </div>
                `;
            }
            
            performanceInfo.innerHTML = `
                ${memoryHTML}
                <div class="info-item">
                    <span class="info-label">ページ読み込み時間</span>
                    <span class="info-value">${typeof timing === 'object' ? timing.loadTime : timing}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">DOM読み込み時間</span>
                    <span class="info-value">${typeof timing === 'object' ? timing.domContentLoaded : timing}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">localStorage</span>
                    <span class="info-value">${storage.localStorage || '情報なし'}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">IndexedDB</span>
                    <span class="info-value">${storage.indexedDB || '情報なし'}</span>
                </div>
            `;
        }

        function displayCapabilities() {
            const capabilities = [
                { name: 'Geolocation', supported: 'geolocation' in navigator },
                { name: 'Camera', supported: 'mediaDevices' in navigator },
                { name: 'Microphone', supported: 'mediaDevices' in navigator },
                { name: 'Notifications', supported: 'Notification' in window },
                { name: 'Service Worker', supported: 'serviceWorker' in navigator },
                { name: 'WebGL', supported: !!document.createElement('canvas').getContext('webgl') },
                { name: 'WebRTC', supported: 'RTCPeerConnection' in window },
                { name: 'WebSocket', supported: 'WebSocket' in window },
                { name: 'Local Storage', supported: 'localStorage' in window },
                { name: 'Session Storage', supported: 'sessionStorage' in window },
                { name: 'IndexedDB', supported: 'indexedDB' in window },
                { name: 'Web Workers', supported: 'Worker' in window },
                { name: 'Clipboard API', supported: 'clipboard' in navigator },
                { name: 'Web Share API', supported: 'share' in navigator },
                { name: 'Battery API', supported: 'getBattery' in navigator },
                { name: 'Vibration API', supported: 'vibrate' in navigator },
                { name: 'Fullscreen API', supported: 'requestFullscreen' in document.documentElement },
                { name: 'Payment Request', supported: 'PaymentRequest' in window },
                { name: 'Web Bluetooth', supported: 'bluetooth' in navigator },
                { name: 'Web USB', supported: 'usb' in navigator }
            ];
            
            const capabilitiesGrid = document.getElementById('capabilitiesGrid');
            capabilitiesGrid.innerHTML = capabilities.map(cap => `
                <div class="capability-item">
                    <span class="capability-name">${cap.name}</span>
                    <span class="capability-status ${cap.supported ? 'status-supported' : 'status-not-supported'}">
                        ${cap.supported ? '✓' : '✗'}
                    </span>
                </div>
            `).join('');
        }

        function updateRealTime() {
            const now = new Date();
            const uptime = Date.now() - startTime;
            
            document.getElementById('currentTime').textContent = now.toLocaleString('ja-JP');
            document.getElementById('uptime').textContent = `ページ稼働時間: ${formatUptime(uptime)}`;
        }

        function formatUptime(ms) {
            const seconds = Math.floor(ms / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            
            if (hours > 0) {
                return `${hours}時間 ${minutes % 60}分 ${seconds % 60}秒`;
            } else if (minutes > 0) {
                return `${minutes}分 ${seconds % 60}秒`;
            } else {
                return `${seconds}秒`;
            }
        }

        function refreshInfo() {
            displaySystemInfo();
            displayCapabilities();
            showNotification('システム情報を更新しました');
        }

        function copyInfo() {
            const info = getSystemInfo();
            let copyText = 'システム情報\n';
            copyText += `生成日時: ${new Date().toLocaleString('ja-JP')}\n\n`;
            
            copyText += `[ブラウザ情報]\n`;
            copyText += `ブラウザ: ${info.browser.name} ${info.browser.version}\n`;
            copyText += `プラットフォーム: ${info.browser.platform}\n`;
            copyText += `言語: ${info.browser.language}\n\n`;
            
            copyText += `[システム情報]\n`;
            copyText += `CPUコア数: ${info.system.cores}\n`;
            copyText += `デバイスメモリ: ${info.system.deviceMemory}\n`;
            copyText += `タイムゾーン: ${info.system.timezone}\n\n`;
            
            copyText += `[デバイス情報]\n`;
            copyText += `画面解像度: ${info.device.screenWidth} × ${info.device.screenHeight}\n`;
            copyText += `ビューポート: ${info.device.viewportWidth} × ${info.device.viewportHeight}\n`;
            copyText += `ピクセル比: ${info.device.devicePixelRatio}\n`;
            
            navigator.clipboard.writeText(copyText).then(() => {
                showNotification('システム情報をコピーしました');
            }).catch(() => {
                showNotification('コピーに失敗しました', 'error');
            });
        }

        function exportInfo() {
            const info = getSystemInfo();
            const exportData = {
                timestamp: new Date().toISOString(),
                browser: info.browser,
                system: info.system,
                device: info.device,
                network: info.network,
                performance: info.performance
            };
            
            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `system_info_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            
            showNotification('システム情報を出力しました');
        }

        function runTests() {
            let testResults = [];
            
            // 基本機能テスト
            testResults.push(`LocalStorage: ${testLocalStorage()}`);
            testResults.push(`SessionStorage: ${testSessionStorage()}`);
            testResults.push(`Canvas: ${testCanvas()}`);
            testResults.push(`WebGL: ${testWebGL()}`);
            testResults.push(`Audio: ${testAudio()}`);
            testResults.push(`Video: ${testVideo()}`);
            
            const results = testResults.join('\n');
            alert(`機能テスト結果:\n\n${results}`);
            showNotification('機能テストが完了しました');
        }

        function testLocalStorage() {
            try {
                localStorage.setItem('test', 'value');
                localStorage.removeItem('test');
                return '✓ 動作';
            } catch (e) {
                return '✗ エラー';
            }
        }

        function testSessionStorage() {
            try {
                sessionStorage.setItem('test', 'value');
                sessionStorage.removeItem('test');
                return '✓ 動作';
            } catch (e) {
                return '✗ エラー';
            }
        }

        function testCanvas() {
            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                return ctx ? '✓ 動作' : '✗ エラー';
            } catch (e) {
                return '✗ エラー';
            }
        }

        function testWebGL() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                return gl ? '✓ 動作' : '✗ エラー';
            } catch (e) {
                return '✗ エラー';
            }
        }

        function testAudio() {
            try {
                const audio = new Audio();
                return '✓ 動作';
            } catch (e) {
                return '✗ エラー';
            }
        }

        function testVideo() {
            try {
                const video = document.createElement('video');
                return '✓ 動作';
            } catch (e) {
                return '✗ エラー';
            }
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            const notificationMessage = document.getElementById('notificationMessage');
            
            notificationMessage.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // 初期化
        function init() {
            displaySystemInfo();
            displayCapabilities();
            updateRealTime();
            
            // リアルタイム更新
            setInterval(updateRealTime, 1000);
            
            // オンライン状態の監視
            window.addEventListener('online', () => {
                showNotification('オンラインになりました');
                refreshInfo();
            });
            
            window.addEventListener('offline', () => {
                showNotification('オフラインになりました', 'error');
                refreshInfo();
            });
            
            // ビューポート変更の監視
            window.addEventListener('resize', () => {
                setTimeout(refreshInfo, 100);
            });
        }

        // ページ読み込み時の初期化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
