<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タイピングテスト - AI Mini Apps</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .typing-test {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 1000px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .timer-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        .timer-display {
            font-size: 3rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 10px;
            font-family: 'Courier New', monospace;
        }

        .timer-label {
            color: #666;
            font-size: 1rem;
        }

        .settings-section {
            background: #e1ecf4;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .settings-title {
            color: #0c5460;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
        }

        .setting-group label {
            font-weight: 600;
            color: #0c5460;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .setting-control {
            padding: 8px 12px;
            border: 2px solid #b3d4fc;
            border-radius: 6px;
            font-size: 0.9rem;
            background: white;
        }

        .setting-control:focus {
            outline: none;
            border-color: #0c5460;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
        }

        .text-display-section {
            background: #fff3cd;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .text-display-title {
            color: #856404;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .text-display {
            background: white;
            border: 2px solid #ffeaa7;
            border-radius: 8px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            line-height: 1.6;
            min-height: 120px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }

        .char {
            position: relative;
            background: transparent;
            transition: all 0.1s ease;
        }

        .char.correct {
            background: #d4edda;
            color: #155724;
        }

        .char.incorrect {
            background: #f8d7da;
            color: #721c24;
        }

        .char.current {
            background: #cce5ff;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { background: #cce5ff; }
            51%, 100% { background: #007bff; color: white; }
        }

        .typing-input {
            width: 100%;
            padding: 15px;
            border: 3px solid #e9ecef;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            transition: border-color 0.3s ease;
        }

        .typing-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .typing-input:disabled {
            background: #f8f9fa;
            cursor: not-allowed;
        }

        .stats-section {
            background: #d4edda;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .stats-title {
            color: #155724;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
        }

        .stat-item {
            background: white;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-value {
            font-weight: 700;
            color: #155724;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #666;
        }

        .progress-section {
            background: #f3e5f5;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .progress-title {
            color: #6a1b9a;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        .progress-text {
            text-align: center;
            color: #6a1b9a;
            font-weight: 600;
        }

        .result-section {
            background: #e8f5e8;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            display: none;
        }

        .result-section.show {
            display: block;
            animation: resultFadeIn 0.5s ease;
        }

        @keyframes resultFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-title {
            color: #155724;
            font-size: 1.3rem;
            margin-bottom: 15px;
            font-weight: 600;
            text-align: center;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .result-item {
            background: white;
            border: 2px solid #c3e6cb;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .result-value {
            font-weight: 700;
            color: #155724;
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .result-label {
            font-size: 0.9rem;
            color: #666;
        }

        .ranking-display {
            background: white;
            border: 2px solid #c3e6cb;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            text-align: center;
        }

        .ranking-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: #155724;
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .action-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .action-btn.secondary {
            background: #6c757d;
        }

        .action-btn.secondary:hover {
            background: #5a6268;
        }

        .action-btn.success {
            background: #28a745;
        }

        .action-btn.success:hover {
            background: #218838;
        }

        .history-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .history-title {
            color: #333;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .history-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-stats {
            font-weight: 600;
            color: #333;
        }

        .history-time {
            font-size: 0.8rem;
            color: #999;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            background: #dc3545;
        }

        .back-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .typing-test {
                padding: 20px;
            }
            
            .timer-display {
                font-size: 2rem;
            }
            
            .settings-grid {
                grid-template-columns: 1fr;
            }
            
            .text-display {
                font-size: 1rem;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .result-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="typing-test">
        <div class="header">
            <h1>タイピングテスト</h1>
            <p>タイピング速度と正確性を測定しよう</p>
        </div>

        <div class="timer-section">
            <div class="timer-display" id="timerDisplay">60</div>
            <div class="timer-label">残り時間（秒）</div>
        </div>

        <div class="settings-section">
            <div class="settings-title">⚙️ テスト設定</div>
            <div class="settings-grid">
                <div class="setting-group">
                    <label for="timeLimit">制限時間</label>
                    <select id="timeLimit" class="setting-control">
                        <option value="30">30秒</option>
                        <option value="60" selected>60秒</option>
                        <option value="90">90秒</option>
                        <option value="120">2分</option>
                        <option value="300">5分</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label for="textType">テキスト種類</label>
                    <select id="textType" class="setting-control">
                        <option value="hiragana">ひらがな</option>
                        <option value="katakana">カタカナ</option>
                        <option value="mixed" selected>ひらがな・カタカナ</option>
                        <option value="english">英単語</option>
                        <option value="numbers">数字</option>
                        <option value="symbols">記号入り</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label for="difficulty">難易度</label>
                    <select id="difficulty" class="setting-control">
                        <option value="easy">簡単</option>
                        <option value="normal" selected>普通</option>
                        <option value="hard">難しい</option>
                        <option value="expert">上級者</option>
                    </select>
                </div>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="showMistakes" checked>
                <label for="showMistakes">間違いをハイライト</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="soundEffects">
                <label for="soundEffects">効果音を再生</label>
            </div>
        </div>

        <div class="text-display-section">
            <div class="text-display-title">📝 タイピング文章</div>
            <div class="text-display" id="textDisplay">
                <!-- テキストがここに表示されます -->
            </div>
            <input type="text" id="typingInput" class="typing-input" placeholder="ここに入力してください..." disabled>
        </div>

        <div class="progress-section">
            <div class="progress-title">📊 進行状況</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0 / 0 文字</div>
        </div>

        <div class="stats-section">
            <div class="stats-title">📈 リアルタイム統計</div>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="wpmStat">0</div>
                    <div class="stat-label">WPM</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="accuracyStat">100</div>
                    <div class="stat-label">正確率(%)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="typedStat">0</div>
                    <div class="stat-label">入力文字数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="mistakesStat">0</div>
                    <div class="stat-label">ミス回数</div>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="action-btn" onclick="startTest()" id="startBtn">テスト開始</button>
            <button class="action-btn secondary" onclick="resetTest()">リセット</button>
            <button class="action-btn secondary" onclick="generateNewText()">新しい文章</button>
        </div>

        <div class="result-section" id="resultSection">
            <div class="result-title">🎉 テスト結果</div>
            <div class="result-grid">
                <div class="result-item">
                    <div class="result-value" id="finalWpm">0</div>
                    <div class="result-label">WPM</div>
                </div>
                <div class="result-item">
                    <div class="result-value" id="finalAccuracy">0</div>
                    <div class="result-label">正確率(%)</div>
                </div>
                <div class="result-item">
                    <div class="result-value" id="finalTyped">0</div>
                    <div class="result-label">入力文字数</div>
                </div>
                <div class="result-item">
                    <div class="result-value" id="finalMistakes">0</div>
                    <div class="result-label">ミス回数</div>
                </div>
            </div>
            <div class="ranking-display" id="rankingDisplay">
                <!-- ランキング表示 -->
            </div>
            <div style="text-align: center; margin-top: 15px;">
                <button class="action-btn success" onclick="saveResult()">結果保存</button>
                <button class="action-btn secondary" onclick="shareResult()">結果シェア</button>
                <button class="action-btn" onclick="retryTest()">再チャレンジ</button>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📚 テスト履歴</div>
            <div class="history-list" id="historyList">
                <!-- 履歴がここに表示されます -->
            </div>
            <div style="text-align: center; margin-top: 15px;">
                <button class="action-btn secondary" onclick="clearHistory()">履歴クリア</button>
                <button class="action-btn secondary" onclick="exportHistory()">履歴出力</button>
            </div>
        </div>

        <a href="../index.html" class="back-link">← アプリ一覧に戻る</a>
    </div>

    <div class="notification" id="notification">
        <div id="notificationMessage"></div>
    </div>

    <script>
        let testActive = false;
        let timeLeft = 60;
        let timerInterval = null;
        let currentText = '';
        let currentPosition = 0;
        let startTime = null;
        let mistakes = 0;
        let totalTyped = 0;
        let testHistory = JSON.parse(localStorage.getItem('typingTestHistory') || '[]');

        const textSamples = {
            hiragana: [
                'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん',
                'きょうはいいてんきですねそらがあおくてきもちがいいですみんなでこうえんにいきましょう',
                'にほんごのべんきょうはとてもたのしいですひらがなやかたかなをおぼえることからはじめます'
            ],
            katakana: [
                'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン',
                'コンピュータープログラミングはとてもおもしろいです',
                'インターネットでじょうほうをけんさくしましょう'
            ],
            mixed: [
                'きょうはがっこうでコンピューターのじゅぎょうがありました',
                'インターネットでにほんごのべんきょうをしています',
                'スマートフォンでメールをそうしんしました'
            ],
            english: [
                'The quick brown fox jumps over the lazy dog',
                'Programming is a creative and logical activity',
                'Technology changes our daily lives significantly'
            ],
            numbers: [
                '1234567890 2468 1357 9876543210',
                '2023年4月15日は土曜日です',
                '値段は1,500円でした'
            ],
            symbols: [
                'こんにちは！今日は「プログラミング」を学びます。',
                'メール：example@test.com（サンプル）',
                '計算式：3 + 5 × 2 = 13'
            ]
        };

        const difficultyTexts = {
            easy: {
                hiragana: ['あいうえお', 'かきくけこ', 'さしすせそ'],
                mixed: ['こんにちは', 'ありがとう', 'おはよう']
            },
            expert: {
                mixed: [
                    'プロフェッショナルなプログラマーとして、効率的なアルゴリズムとデータ構造を理解することは必要不可欠です。',
                    '人工知能と機械学習の分野では、ニューラルネットワークとディープラーニングが重要な技術として注目されています。'
                ]
            }
        };

        function generateText() {
            const textType = document.getElementById('textType').value;
            const difficulty = document.getElementById('difficulty').value;
            
            let availableTexts = textSamples[textType] || textSamples.mixed;
            
            if (difficultyTexts[difficulty] && difficultyTexts[difficulty][textType]) {
                availableTexts = difficultyTexts[difficulty][textType];
            }
            
            const randomIndex = Math.floor(Math.random() * availableTexts.length);
            return availableTexts[randomIndex];
        }

        function displayText(text) {
            const textDisplay = document.getElementById('textDisplay');
            currentText = text;
            currentPosition = 0;
            
            textDisplay.innerHTML = text.split('').map((char, index) => 
                `<span class="char${index === 0 ? ' current' : ''}" data-index="${index}">${char}</span>`
            ).join('');
        }

        function updateDisplay() {
            const chars = document.querySelectorAll('.char');
            chars.forEach((char, index) => {
                char.className = 'char';
                if (index < currentPosition) {
                    // 既に入力済み
                    const typedChar = document.getElementById('typingInput').value[index];
                    if (typedChar === currentText[index]) {
                        char.classList.add('correct');
                    } else {
                        char.classList.add('incorrect');
                    }
                } else if (index === currentPosition) {
                    char.classList.add('current');
                }
            });
            
            updateProgress();
            updateStats();
        }

        function updateProgress() {
            const progress = (currentPosition / currentText.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = `${currentPosition} / ${currentText.length} 文字`;
        }

        function updateStats() {
            if (!startTime || !testActive) return;
            
            const timeElapsed = (Date.now() - startTime) / 1000 / 60; // 分
            const wpm = timeElapsed > 0 ? Math.round(totalTyped / timeElapsed) : 0;
            const accuracy = totalTyped > 0 ? Math.round(((totalTyped - mistakes) / totalTyped) * 100) : 100;
            
            document.getElementById('wpmStat').textContent = wpm;
            document.getElementById('accuracyStat').textContent = accuracy;
            document.getElementById('typedStat').textContent = totalTyped;
            document.getElementById('mistakesStat').textContent = mistakes;
        }

        function startTest() {
            if (testActive) return;
            
            testActive = true;
            startTime = Date.now();
            timeLeft = parseInt(document.getElementById('timeLimit').value);
            currentPosition = 0;
            mistakes = 0;
            totalTyped = 0;
            
            const typingInput = document.getElementById('typingInput');
            typingInput.disabled = false;
            typingInput.value = '';
            typingInput.focus();
            
            document.getElementById('startBtn').disabled = true;
            document.getElementById('resultSection').classList.remove('show');
            
            if (!currentText) {
                generateNewText();
            }
            
            startTimer();
            showNotification('タイピングテスト開始！');
        }

        function startTimer() {
            document.getElementById('timerDisplay').textContent = timeLeft;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timerDisplay').textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    endTest();
                }
            }, 1000);
        }

        function endTest() {
            testActive = false;
            clearInterval(timerInterval);
            
            const typingInput = document.getElementById('typingInput');
            typingInput.disabled = true;
            document.getElementById('startBtn').disabled = false;
            
            displayResults();
            showNotification('タイピングテスト終了！');
        }

        function displayResults() {
            const timeElapsed = (Date.now() - startTime) / 1000 / 60; // 分
            const wpm = timeElapsed > 0 ? Math.round(totalTyped / timeElapsed) : 0;
            const accuracy = totalTyped > 0 ? Math.round(((totalTyped - mistakes) / totalTyped) * 100) : 100;
            
            document.getElementById('finalWpm').textContent = wpm;
            document.getElementById('finalAccuracy').textContent = accuracy;
            document.getElementById('finalTyped').textContent = totalTyped;
            document.getElementById('finalMistakes').textContent = mistakes;
            
            // ランキング表示
            const ranking = getRanking(wpm, accuracy);
            document.getElementById('rankingDisplay').innerHTML = `
                <div class="ranking-text">ランク: ${ranking.rank}</div>
                <div style="margin-top: 5px; color: #666;">${ranking.comment}</div>
            `;
            
            document.getElementById('resultSection').classList.add('show');
        }

        function getRanking(wpm, accuracy) {
            if (wpm >= 80 && accuracy >= 95) {
                return { rank: 'S', comment: '神レベル！プロ級のタイピング速度です！' };
            } else if (wpm >= 60 && accuracy >= 90) {
                return { rank: 'A', comment: '素晴らしい！とても早いタイピングです！' };
            } else if (wpm >= 40 && accuracy >= 85) {
                return { rank: 'B', comment: '良好！平均以上のタイピング能力です。' };
            } else if (wpm >= 25 && accuracy >= 80) {
                return { rank: 'C', comment: '普通レベル。練習でさらに向上できます。' };
            } else {
                return { rank: 'D', comment: '練習あるのみ！継続すれば必ず上達します。' };
            }
        }

        function resetTest() {
            testActive = false;
            clearInterval(timerInterval);
            
            timeLeft = parseInt(document.getElementById('timeLimit').value);
            document.getElementById('timerDisplay').textContent = timeLeft;
            
            const typingInput = document.getElementById('typingInput');
            typingInput.disabled = true;
            typingInput.value = '';
            
            document.getElementById('startBtn').disabled = false;
            document.getElementById('resultSection').classList.remove('show');
            
            currentPosition = 0;
            mistakes = 0;
            totalTyped = 0;
            startTime = null;
            
            if (currentText) {
                displayText(currentText);
            }
            
            updateStats();
        }

        function generateNewText() {
            const newText = generateText();
            displayText(newText);
            showNotification('新しい文章を生成しました');
        }

        function retryTest() {
            resetTest();
            setTimeout(() => startTest(), 500);
        }

        function saveResult() {
            if (!startTime) {
                showNotification('保存する結果がありません', 'error');
                return;
            }
            
            const timeElapsed = (Date.now() - startTime) / 1000 / 60;
            const wpm = timeElapsed > 0 ? Math.round(totalTyped / timeElapsed) : 0;
            const accuracy = totalTyped > 0 ? Math.round(((totalTyped - mistakes) / totalTyped) * 100) : 100;
            
            const result = {
                id: Date.now(),
                wpm: wpm,
                accuracy: accuracy,
                typed: totalTyped,
                mistakes: mistakes,
                textType: document.getElementById('textType').value,
                difficulty: document.getElementById('difficulty').value,
                timeLimit: document.getElementById('timeLimit').value,
                timestamp: new Date().toLocaleString('ja-JP')
            };
            
            testHistory.unshift(result);
            
            // 履歴を50件に制限
            if (testHistory.length > 50) {
                testHistory = testHistory.slice(0, 50);
            }
            
            localStorage.setItem('typingTestHistory', JSON.stringify(testHistory));
            updateHistoryDisplay();
            showNotification('結果を保存しました');
        }

        function shareResult() {
            if (!startTime) {
                showNotification('シェアする結果がありません', 'error');
                return;
            }
            
            const timeElapsed = (Date.now() - startTime) / 1000 / 60;
            const wpm = timeElapsed > 0 ? Math.round(totalTyped / timeElapsed) : 0;
            const accuracy = totalTyped > 0 ? Math.round(((totalTyped - mistakes) / totalTyped) * 100) : 100;
            const ranking = getRanking(wpm, accuracy);
            
            const shareText = `タイピングテスト結果
WPM: ${wpm}
正確率: ${accuracy}%
ランク: ${ranking.rank}
入力文字数: ${totalTyped}`;
            
            if (navigator.share) {
                navigator.share({
                    title: 'タイピングテスト結果',
                    text: shareText
                });
            } else {
                navigator.clipboard.writeText(shareText).then(() => {
                    showNotification('結果をコピーしました');
                });
            }
        }

        function updateHistoryDisplay() {
            const historyList = document.getElementById('historyList');
            
            if (testHistory.length === 0) {
                historyList.innerHTML = '<p style="text-align: center; color: #666; padding: 20px;">履歴がありません</p>';
                return;
            }
            
            historyList.innerHTML = testHistory.slice(0, 10).map(item => `
                <div class="history-item">
                    <div>
                        <div class="history-stats">WPM: ${item.wpm}, 正確率: ${item.accuracy}%</div>
                        <div style="font-size: 0.8rem; color: #666; margin-top: 3px;">
                            ${item.textType} | ${item.difficulty} | ${item.timeLimit}秒
                        </div>
                    </div>
                    <div class="history-time">${item.timestamp}</div>
                </div>
            `).join('');
        }

        function clearHistory() {
            if (confirm('全ての履歴を削除しますか？')) {
                testHistory = [];
                localStorage.setItem('typingTestHistory', JSON.stringify(testHistory));
                updateHistoryDisplay();
                showNotification('履歴をクリアしました');
            }
        }

        function exportHistory() {
            if (testHistory.length === 0) {
                showNotification('エクスポートする履歴がありません', 'error');
                return;
            }
            
            const exportData = testHistory.map(item => ({
                'WPM': item.wpm,
                '正確率(%)': item.accuracy,
                '入力文字数': item.typed,
                'ミス回数': item.mistakes,
                'テキスト種類': item.textType,
                '難易度': item.difficulty,
                '制限時間': item.timeLimit + '秒',
                '日時': item.timestamp
            }));
            
            const csvContent = [
                Object.keys(exportData[0]).join(','),
                ...exportData.map(row => Object.values(row).map(v => `"${v}"`).join(','))
            ].join('\n');
            
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `typing_test_history_${Date.now()}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            
            showNotification('履歴を出力しました');
        }

        function playSound(type) {
            if (!document.getElementById('soundEffects').checked) return;
            
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            if (type === 'correct') {
                oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
            } else if (type === 'incorrect') {
                oscillator.frequency.setValueAtTime(300, audioContext.currentTime);
                gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
            }
            
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            const notificationMessage = document.getElementById('notificationMessage');
            
            notificationMessage.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // 初期化
        function init() {
            generateNewText();
            updateHistoryDisplay();
            
            // タイピング入力の処理
            const typingInput = document.getElementById('typingInput');
            typingInput.addEventListener('input', (e) => {
                if (!testActive) return;
                
                const inputValue = e.target.value;
                const inputLength = inputValue.length;
                
                if (inputLength > totalTyped) {
                    // 新しい文字が入力された
                    totalTyped = inputLength;
                    
                    if (inputLength <= currentText.length) {
                        const lastChar = inputValue[inputLength - 1];
                        const expectedChar = currentText[inputLength - 1];
                        
                        if (lastChar !== expectedChar) {
                            mistakes++;
                            playSound('incorrect');
                        } else {
                            playSound('correct');
                        }
                        
                        currentPosition = inputLength;
                        updateDisplay();
                        
                        // テキスト完了チェック
                        if (inputLength === currentText.length) {
                            endTest();
                        }
                    }
                }
            });
            
            // 設定変更の監視
            document.getElementById('timeLimit').addEventListener('change', () => {
                if (!testActive) {
                    timeLeft = parseInt(document.getElementById('timeLimit').value);
                    document.getElementById('timerDisplay').textContent = timeLeft;
                }
            });
            
            document.getElementById('textType').addEventListener('change', generateNewText);
            document.getElementById('difficulty').addEventListener('change', generateNewText);
        }

        // ページ読み込み時の初期化
        document.addEventListener('DOMContentLoaded', init);
        
        // キーボードショートカット
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                switch(e.key) {
                    case 'Enter':
                        e.preventDefault();
                        if (!testActive) startTest();
                        break;
                    case 'r':
                        e.preventDefault();
                        resetTest();
                        break;
                }
            }
        });
    </script>
</body>
</html>
